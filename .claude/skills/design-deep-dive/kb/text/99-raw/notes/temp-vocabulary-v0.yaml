# Временный словарь text-research v0 — оркестратор волн, 2026-09-24
#
# Зачем. Site не запущен (решение заказчика п. 17 в PLAN.md): vocabulary.yaml, crosswalk.tsv и blocks.yaml site в этой
# сессии не появятся. Чтобы агенты text (C, D, E, G, I, J) не завели разные id для одного и того же, до S0 site все
# пользуются этими id.
#
# Правила.
# - id латиницей в kebab-case. Новый id агент добавляет у себя (в своём YAML или таблице) с пометкой
#   «предложение к временному словарю» и строкой в отчёте; этот файл агенты не правят, сводит оркестратор.
# - slot_type — зона text: E закрепляет список в 04-copy-by-block/copy-slots.yaml (может переименовать или разбить тип —
#   с таблицей соответствия старый id → новый). J берёт slot_type из copy-slots.yaml.
# - page_type, section_role, awareness, traffic — зона site (vocabulary.yaml); здесь временные значения. Колонка site_id
#   пустая до S0; после S0 X и S сводят всё к словарю site.
# - Источники временного словаря: план text (жанры, copy-deck v0), план site (../site/PLAN.md, волны A, B, E),
#   ../ai-media/01-web-assets-landscape/01-asset-slots-by-page-type.md §2.1 (19 слотов ассетов), §3 (типы
#   страниц), ../kimi-research/07-brief-handoff/templates/brief.yaml и copy.md (site.sections[{id, job}]; заголовок,
#   лид, тело, подписи кнопок, микрокопи), ../ux/07-ux-writing/06-banned-words-and-patterns.md §7.2 (роли узлов).

