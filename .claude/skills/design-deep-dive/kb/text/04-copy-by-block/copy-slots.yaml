  formula_ids: [fact-scenario, three-questions-dry]
  rules:
  - "Только факт из facts.yaml; источник и дата — в той же строке или в слоте stat-source рядом (B2 §1.3; requires_nearby факта)."
  - "Одно доказательство на первый экран: product-aware и most-aware — рейтинг, счётчик, гарантия; problem-aware — механизм в подзаголовке, рейтинг ниже по странице (B1 §1.4, опыт B1/02)."
  - "Число, которое меняет решение, а не фактоид («450 работ»): срок, рейтинг с числом оценок, гарантия ([V:1UVkeqxuNRs 09:12, 24:49])."
