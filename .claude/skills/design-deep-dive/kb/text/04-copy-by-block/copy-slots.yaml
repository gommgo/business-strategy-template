# copy-slots.yaml — правила текста по типам слотов (text-research, 04-copy-by-block, агент E, волна 2, 2026-09-24).
# СОБИРАЕТСЯ СКРИПТОМ: python3 99-raw/experiments/E/02-copy-slots/build_copy_slots.py --lengths final
# Руками не править — правки в 99-raw/experiments/E/02-copy-slots/src-*.yaml и crosswalk.yaml, затем пересборка.
# Читают: J (copydeck.py validate: length.{ru,en}.{words,chars}.{min,max}, fact_required, section_roles, genre),
# I (промты по слотам), F (образцы строк по slot_type), G (мета и FAQ — ссылкой), creative (длины строк в макете).
# Длины — D thresholds.yaml v2 (03-corpus-measured/thresholds.yaml → genres.<жанр>.slots, 03-thresholds-by-genre.md §4; лидеры, выборка «marketing» = лендинги + страницы сайта; сообщение оркестратора 2026-09-24).

copy_slots_version: 1
date: '2026-09-24'
status: draft
owner: text-research · 04-copy-by-block · E (волна 2)
description: "Правила текста по типам слотов (slot_type): назначение, роли секций, длины RU и EN по замеру D, структура, формулы A, запреты, профиль линтера C, нужен ли факт B2, юридические правила H, примеры «плохо / хорошо» (ai-self, проверены claims_check.py и copy_lint.py). Ключ — slot_type; site_slot — id слота site после S1."
doc: "04-copy-by-block/01-hero-and-cta.md, 02-section-blocks.md, 03-page-types.md, 04-form-emails-notifications.md"
build: "python3 99-raw/experiments/E/02-copy-slots/build_copy_slots.py --lengths final"
lengths_source: "D thresholds.yaml v2 (03-corpus-measured/thresholds.yaml → genres.<жанр>.slots, 03-thresholds-by-genre.md §4; лидеры, выборка «marketing» = лендинги + страницы сайта; сообщение оркестратора 2026-09-24)"
length_rule: "min = floor(p10 лидеров), target = round(p50), max = ceil(p90); RU — в знаках (primary: chars), EN — в словах; hard_* — грубый выход D (error_low/high); provisional — n < 12 страниц лидеров или лидеры + средний рынок; длина — сигнал (warning/info), не ворота: вне диапазона на 10 страницах лидеров 52 % — ошибки разметки, 47 % — законные формы (опыт E/01)"
fact_required_values:
  always: "в слоте всегда факт (fact_ids) или [PLACEHOLDER]"
  if-claim: "факт нужен, если в тексте число, имя, дата, цитата, рейтинг, цена, гарантия, превосходная степень"
  never: "текст без утверждений (кнопка-навигация, пункт меню)"
examples_rule: "RU и EN, метка ai-self; факты — 02-strategy-messaging/examples/facts-*.yaml (otves, kvarts) и 99-raw/experiments/E/facts-demo-saas-okoshko.yaml (okoshko, ДЕМО); проверка — 99-raw/experiments/E/02-copy-slots/test_examples.py (claims_check.py → copy_lint.py)"
vocabulary: "99-raw/notes/temp-vocabulary-v0.yaml (63 slot_type) + предложения E (proposal: true)"
renames: {}
proposals: [promise, stat-source, price-old, spec-row, image-caption, announcement]
composites:
  hero-core:
    definition: "ядро первого экрана = headline + subheadline + cta-label + cta-note + hero-proof (по одному экземпляру первой секции; D §2.5)"
    max_words: 40
    rule: "не больше 40 слов: у лидеров RU — 100 % страниц (медиана 16–19,5), EN — 88–92 % (медиана 26); ai-self — медиана 36, p10 28 (D §2.5)"
    lengths:
      ru:
        words: {p10: 6.0, p50: 19.5, p90: 34.2}
        n_pages: 14
        source: D thresholds.yaml v2 · genres.landing.slots.hero-core
      en:
        words: {p10: 5.7, p50: 26.0, p90: 37.5}
        n_pages: 24
        source: D thresholds.yaml v2 · genres.landing.slots.hero-core
    check: "сумма слов слотов первой секции; превышение — warning (длинный подзаголовок сокращает остальное)"
slot_types:
- id: eyebrow
  site_slot: ''
  name: Надзаголовок (над H1 или H2)
  purpose: "Бирка над заголовком: категория, сегмент, место и дата события, имя бренда для product-aware — снимает подробности с основной строки заголовка."
  section_roles: [hero, benefits, how-it-works, case-studies, pricing, event-program, faq]
  genres: [landing, site-page]
  genre: landing
  ux_role: marketing
  kimi: micro
  length:
    ru:
      words: {min: 1, target: 3, max: 5}
      hard_words: [1, 8]
      ai_p50_words: 3.5
      chars: {min: 5, target: 18, max: 27}
      hard_chars: [2, 54]
      ai_p50_chars: 21.0
      primary: chars
      n_pages: 14
      source: D thresholds.yaml v2 · genres.landing.slots.eyebrow.ru
    en:
      words: {min: 1, target: 3, max: 6}
      hard_words: [1, 9]
      ai_p50_words: 3.0
      chars: {min: 4, target: 13, max: 34}
      hard_chars: [2, 50]
      ai_p50_chars: 17.0
      primary: words
      n_pages: 15
      source: D thresholds.yaml v2 · genres.landing.slots.eyebrow.en
    exceptions:
    - "Мероприятие: дата, город и формат в надзаголовке — до 8 слов («24 октября, Казань, офлайн»)."
  structure: "Именная группа без глагола: категория («Студия ремонта»), сегмент («Для барбершопов»), дата и место события, рубрика."
  formula_ids: []
  rules:
  - "Не чаще чем у каждой третьей секции страницы, первый экран считается (taste; у лидеров D медиана 0, p90 — 0,28 секции)."
  - "Несёт информацию, которой нет в заголовке: кто, для кого, где и когда; повтор заголовка или жанра секции — удалить."
  - "В copy deck — обычный регистр; капс, разрядка и моноширинный шрифт — CSS (creative)."
  - "Для product-aware — имя бренда или студии; для problem-aware — сегмент или ситуация, не бренд."
  bans:
  - "Нумерация секций («01 —», «002 · Capabilities») и цепочки через «·»."
  - "Ярлыки «Наши преимущества», «Почему мы», «Why choose us» (COPY-M-MKT-11)."
  - "Метки версии («BETA», «v2.0», «Early access») вне страницы запуска."
  fact_required: if-claim
  claim_classes: [company-details, award-press]
  legal_rules: [COPY-L-SUP-01, COPY-L-AWARD-01]
  lint_markers: [COPY-M-STR-10, COPY-M-MKT-11, COPY-M-MKT-08]
  voice: "Словарь бренда F: как компания называет свою категорию; табу голоса."
  examples:
    ru:
      facts: otves
      bad: ПОЧЕМУ ВЫБИРАЮТ НАС
      good: Студия ремонта «Отвес»
      fact_ids: []
      note: "product-aware: бирка говорит, кого нашёл посетитель; капс — ярлык без информации"
    en:
      facts: okoshko
      bad: WHY CHOOSE US
      good: Online booking for barbershops
      fact_ids: []
      note: категория словами клиента вместо ярлыка
  sources:
  - "06-anti-slop/01 §5, §11 (COPY-M-STR-10)"
  - 03-corpus-measured/02 §7
  - "[V:y0iIV5meaB4 30:50] бирка"
  - taste SKILL.md (EYEBROW RESTRAINT)
  date: '2026-09-24'
- id: headline
  site_slot: ''
  name: Заголовок первого экрана (H1)
  purpose: "Что это и чем ценно для этого посетителя; тип задаёт уровень осведомлённости (hero_approach B1): сделка, продукт с превосходством, решение против альтернатив, узнаваемая ситуация, идентичность."
  section_roles: [hero]
  genres: [landing, site-page]
  genre: landing
  ux_role: title
  kimi: h
  length:
    ru:
      words: {min: 2, target: 5, max: 10}
      hard_words: [1, 15]
      ai_p50_words: 7.0
      chars: {min: 19, target: 34, max: 73}
      hard_chars: [9, 109]
      ai_p50_chars: 48.5
      primary: chars
      n_pages: 22
      source: D thresholds.yaml v2 · genres.landing.slots.headline.ru
    en:
      words: {min: 2, target: 7, max: 15}
      hard_words: [1, 23]
      ai_p50_words: 5.0
      chars: {min: 14, target: 45, max: 91}
      hard_chars: [7, 157]
      ai_p50_chars: 28.0
      primary: words
      n_pages: 26
      source: D thresholds.yaml v2 · genres.landing.slots.headline.en
    exceptions:
    - "Манифест, письмо (Hallmark H5 Letter), кино-hero: до 25 слов EN и 20 RU — у Oatly 21 слово (опыт E/01); подзаголовка тогда нет."
    - "Название категории как hero для most-aware и страницы услуги: 1–2 слова («Поддерживающая уборка») — законно."
    - "Число-заголовок (Hallmark H4 Stat led): число + объект счёта, 2–5 слов, факт обязателен."
    viewport:
      desktop: "не больше 2 строк при 1440 px (kimi 04 T8); размер кегля — creative"
      mobile: не больше 4 строк при 390 px (kimi 04 T8)
  length_by_page_type:
    note: "люди (лидеры + средний рынок) D tables.md; p50 [p10–p90] слов, страниц"
    ru:
      landing-lead-services: "6 [2–9,2] 23"
      landing-saas: "4 [2,8–8,6] 9"
      landing-product+campaign: "3 [3–5] 3"
      home-multipage: "4 [2,8–10,4] 13"
    en:
      landing-lead-services: "6 [3,8–9] 13"
      landing-saas: "7 [4–13] 19"
      landing-product+campaign: "9 [2–18,8] 7"
      home-multipage: "4,5 [1–11] 4"
  structure: "direct-offer: «[услуга] — [цена или условие]»; product-benefit: «[имя или категория] + [превосходство с фактом]»; solution-vs-alternatives: «[категория словами клиента] + [чем лучше привычного способа]»; problem-story: «[узнаваемая ситуация] + [намёк на выход]»; identity: «[для кого]»."
  formula_ids: [category-statement, four-u, three-questions-dry, caples-headline-qualities, four-p]
  rules:
  - "Суть — в первых двух-трёх словах: у лидеров RU первые два слова укладываются в 11 знаков лишь в трети заголовков, поэтому ориентир — первые 2–3 слова, а не 11 знаков (D §2.5, A/02)."
  - "Глагол и результат в заголовке оффера допустимы («Сдаём ремонт по договору…»): правило ux 07/02 §4.1 написано для экранов приложения."
  - "Продолжает обещание источника трафика смыслом, не обязательно дословно (message match, B1 §1.6)."
  - "Каждое обещание заголовка находится на странице: заголовок не сильнее содержания и фактов ([V:y0iIV5meaB4 31:52], B2 §4.4)."
  - "Вопрос — только тот, который посетитель уже задаёт себе, и с «вы»; по умолчанию утверждение (Fang & Wheeler 2026, A/02 §7)."
  - "«X, который Y» — только с фактическим Y («Лампа, которая сама подбирает свет»); пустое Y («сервис, который понимает ваш бизнес») — переписать (D: у лидеров RU 1,5 % заголовков, 4 из 6 — фактические)."
  bans:
  - "Запрещённые первые фразы: «Откройте для себя», «Добро пожаловать в мир…», «нового поколения», Unleash, Where X meets Y (COPY-M-MKT-08 — error)."
  - "Превосходная степень без критерия и источника в самом тексте (COPY-L-SUP-01 — error, 135-ФЗ ст. 14.3 и вне рекламы)."
  - "Восклицательный знак, Title Case, капс, «→»; обещание чувства без свойства (COPY-M-MKT-13)."
  fact_required: if-claim
  claim_classes: [superlative, comparison, fact-number, price-discount, guarantee, health, income-finance]
  legal_rules: [COPY-L-SUP-01, COPY-L-UNIQ-01, COPY-L-CMP-01, COPY-L-FREE-01, COPY-L-GUAR-01, COPY-L-HEALTH-01, COPY-L-EDU-01]
  lint_markers: [COPY-M-MKT-08, COPY-M-MKT-09, COPY-M-MKT-04, COPY-M-MKT-13, COPY-M-MKT-10, COPY-M-PUN-09]
  voice: "Оси голоса F (формальность, серьёзность); табу; образцы строк F для headline."
  examples:
    ru:
      facts: otves
      bad: Откройте для себя ремонт нового поколения
      good: Ремонт квартир под ключ в Нижнем Новгороде с 2014 года
      fact_ids: [company-since-2014]
      note: "product-aware: категория, город и срок работы — всё проверяемо"
    en:
      facts: okoshko
