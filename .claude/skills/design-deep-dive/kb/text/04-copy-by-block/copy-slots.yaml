  legal_rules: [COPY-L-FREE-01, COPY-L-GUAR-02, COPY-L-CMP-01, COPY-L-PRICE-03]
  lint_markers: [COPY-M-MKT-01, COPY-M-MKT-05, COPY-M-MKT-09, COPY-M-LEX-05]
