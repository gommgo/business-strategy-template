      landing-lead-services: "13 [6–45] 17"
      landing-saas: "12 [9–29] 4"
      landing-product+campaign: "12 [6–23] 3"
      home-multipage: "10 [6,2–33,8] 7"
    en:
      landing-lead-services: "25 [10–32,8] 7"
      landing-saas: "16,5 [10–28] 16"
      landing-product+campaign: "15 [5–19] 4"
  structure: "1–2 предложения: механизм или результат + доказательство или снятие главного возражения («[утверждение], даже если [возражение]»)."
  formula_ids: [four-p, even-if-objection, category-statement, three-questions-dry, fact-scenario]
  rules:
  - "Отвечает на то, что заголовок оставил открытым: как работает, для кого, чем подтверждено (B1 §2.3: что, для кого, результат, отличие, шаг)."
  - "Числа и имена — только с fact_ids; нет факта — [PLACEHOLDER: что именно]."
  - "Первое слово не повторяет первое слово заголовка; первое предложение — не пересказ заголовка другими словами."
  - "Снимает главный блокер, если он снимается фактом: «…даже если [возражение]» (Wiebe; B1 §4.3)."
  bans:
  - "Самопохвала без числа: «команда профессионалов», «индивидуальный подход» (COPY-M-MKT-01)."
  - "Универсальная выгода «экономьте время и деньги» (COPY-M-MKT-05); тройки оценок (COPY-M-SYN-…)."
