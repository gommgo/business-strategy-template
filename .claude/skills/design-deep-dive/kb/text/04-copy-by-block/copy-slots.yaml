      text_slots: [card-title, card-body, image-alt, image-caption]
    - asset_slot: "«Как это работает», интеграции"
      text_slots: [step-title, step-body, section-lead, image-alt]
    - asset_slot: "Витрина, галерея работ"
      text_slots: [image-caption, case-title, image-alt]
    - asset_slot: Отзывы
      text_slots: [testimonial-quote, testimonial-attribution, stat-source, image-alt]
      note: "фото автора — только настоящее, с согласием"
    - asset_slot: "Кейсы, цифры"
      text_slots: [case-title, case-summary, case-result, stat-value, stat-label, stat-source]
    - asset_slot: Тарифы
      text_slots: [pricing-plan-name, pricing-plan-summary, pricing-price, price-old, pricing-price-note, pricing-feature, badge]
    - asset_slot: CTA-полоса
      text_slots: [section-title, cta-label, cta-note]
    - asset_slot: Подвал
      text_slots: [footer-tagline, footer-legal, nav-label]
    - asset_slot: "Фоны секций, текстуры"
      text_slots: []
      note: текста нет; alt декоративной картинки — пустой
    - asset_slot: OG и соцсети
      text_slots: [og-title, og-description, og-image-alt, in-image-text]
    - asset_slot: Фавиконы
      text_slots: []
      note: текста нет
    - asset_slot: "Команда, «о нас»"
      text_slots: [card-title, card-body, body, image-alt, image-caption]
    - asset_slot: Обложки блога
      text_slots: [article-title, image-alt, in-image-text]
    - asset_slot: Галерея товара (PDP)
      text_slots: [spec-row, image-alt, image-caption, pricing-price]
