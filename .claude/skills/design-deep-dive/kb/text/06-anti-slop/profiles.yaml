# Профили жанров линтера copy_lint.py: какие группы правил включены, потолки уровней, анализаторы и их пороги.
# Числа порогов — стартовые (provisional: true): источники — гайд заказчика §D (ритм), humanizer-ru scripts/lint.py
# (ритм, абзацы, списки), impeccable (тире ≥ 8 и ≥ 1 на 500 знаков), taste (надзаголовки ≤ 1 на 3 секции). Пороги
# жанров сайта по замеру корпуса — 03-corpus-measured/thresholds.yaml: copy_lint.py читает оттуда
# genres.<жанр>.analyzers и сливает поверх этих значений (формат — 02-linter-spec-and-profiles.md §6).
# Жанр interface — тексты продукта за входом (кабинет, приложение, бот, письма, СМС, push): строки с ролью ux 07/06
# §7.2 (реестр texts.md, ключ --role, поле role, роль части компонента); правила ux — с уровнями канона, из text —
# артефакты, данные и набор; длины по ролям — ux-07-06.yaml#role_lengths (ux 07/01 §12); межстрочные проверки
# ux 07/06 §7.3 — анализаторы ui_* над реестром.
date: 2026-09-24
version: 1
owner: text · 06-anti-slop
provisional: true
thresholds_ref: 03-corpus-measured/thresholds.yaml
vocabulary_ref: ../site/02-site-types/vocabulary.yaml   # id типов страниц (жанр) и слотов
slot_rules_ref: 04-copy-by-block/copy-slots.yaml          # роль ux и жанры типа слота, lint_as
lexicon_dir: 06-anti-slop/lexicon
# Внешние файлы правил (формат правила — как в lexicon/*.yaml). Отсутствующие пропускаются с заметкой.
# Правил права (08-russian-legal-typography/claims-rules.yaml) в списке нет: право формулировок проверяет одна утилита —
# claims_check.py (факты, отрасль и юрисдикция известны только ей), иначе одно нарушение даёт две находки разного уровня.
external_rules:
  - {path: 07-seo-geo-copy/meta-rules.yaml, note: "длины и шаблоны title/description/OG, проверки мета"}
  - {path: 07-seo-geo-copy/geo-rules.yaml, note: "текстовые проверки GEO-абзацев"}
  - {path: 08-russian-legal-typography/typography-rules.yaml, note: "набор: тире, неразрывные пробелы, кавычки, цены, диапазоны"}

defaults:
  groups:
    ART: {enabled: true}
    CNT: {enabled: true}
    UX:  {enabled: true}
    EXT: {enabled: true}
    LEX: {enabled: true}
    SYN: {enabled: true}
    PUN: {enabled: true}
    TON: {enabled: true}
    MKT: {enabled: true}
    STR: {enabled: true}
  # слоты с прозой: на них считаются ритм, абзацы, тире, конкретика и сверхкоррекция
  prose_slot_types: [body, section-lead, article-paragraph, article-lead, article-summary, geo-answer, definition, faq-a,
                     email-body, case-summary, guarantee-text, objection-answer, pricing-plan-summary]
  prose_roles: []           # роли строк с прозой (жанр interface): там, где у строки нет типа слота
  level_overrides: {}
  analyzers:
    # allow_error: false — плотность маркеров не выше warning: пороги корпуса сняты без морфологии, а линтер считает
    # маркеры с морфологией, и плотность живого текста выходит выше; error вернётся с порогами, снятыми тем же способом
    marker_density: {enabled: true, min_words: 40, min_count: 2, warn_per_100w: 1.5, error_per_100w: 4.0, allow_error: false, level: warning, provisional: true}
    rhythm: {enabled: true, min_sentences: 8, mean_diff_min: 4, min_mean_len: 9, target: 6, min_sentences_short: 10, level: info, provisional: true}
    paragraph_uniformity: {enabled: true, min_paragraphs: 5, cv_min: 0.25, level: info, provisional: true}
    dash_density: {enabled: true, min_count: 3, warn_per_100w: 1.5, level: info, provisional: true}
    concreteness: {enabled: true, min_words: 60, min_per_100w: 1.5, level: info, provisional: true}
    verb_repeat: {enabled: true, level: info}   # без pymorphy3 — только частые глаголы-дубли
    overcorrection: {enabled: true, min_sentences: 8, fragment_share_min: 0.3, connective_share_max: 0.25,
                     para_fragment_share_min: 0.8, informal_per_100w_min: 1.5, mean_diff_max: 12, min_signals: 3,
                     level: warning, provisional: true}
    not_x_but_y: {enabled: true, min_words: 60, min_count: 2, warn_per_100w: 0.5, level: info, provisional: true}
    questions: {enabled: true, min_words: 60, min_count: 3, warn_per_100w: 1.0, level: info, provisional: true}
    triads: {enabled: true, min_words: 60, min_count: 3, warn_per_100w: 1.0, level: info, provisional: true}
    exclamations: {enabled: true, min_words: 60, min_count: 2, warn_per_100w: 0.5, level: info, provisional: true}
    eyebrow_rate: {enabled: true, level: warning}
    lists_of_three: {enabled: true, min_lists: 2, level: info}
    numbers_without_fact: {enabled: true, level_known_empty: warning, level_unknown: info, check_quotes: false}
    cards_uniform: {enabled: true, min_cards: 3, cv_min: 0.25, level: info, provisional: true}   # COPY-C-18
    address_mix: {enabled: true, level: warning}          # «ты» и «вы» в одном тексте (ux 07/03 §1.1)
    # межстрочные проверки ux 07/06 §7.3 — жанр interface (реестр текстов, роль строки)
    ui_action_name: {enabled: false, level: warning, level_banned: error}
    ui_object_alias: {enabled: false, level: error}
    ui_group_form: {enabled: false, level: warning}
    ui_duplicate: {enabled: false, level: warning}
    ui_maxlen: {enabled: false, level: error}
    ui_role_length: {enabled: false, level: warning}
    ui_formats: {enabled: false, level: warning}
    ui_icu: {enabled: false, level: error}
    yo_mix: {enabled: false, level: warning}
    us_uk: {enabled: false, level: warning}
    reading_level: {enabled: false, level: info, min_words: 30, syllables_max: 2.5}

profiles:
  landing:
    genre: landing
    description: "Лендинг и его блоки: hero, CTA, фичи, доказательства, отзывы, тарифы, FAQ, гарантии, финальный CTA, тексты вокруг форм"
    groups:
      STR: {enabled: true, max_level: warning}
    level_overrides:
      # Правила микрокопи интерфейса (ux 07/06 §6.4, §3.1) на тексте страницы — сигнал, а не запрет: «Адрес: Казань» —
      # имя собственное после двоеточия, «собираем вручную» — описание ручной работы, «улица Лесная,» — не деепричастие.
      # Один набор на жанры текста страницы (landing, site-page, article, meta, geo, email-form); у interface —
      # уровни канона.
      <<: &ux_on_page {"ux-6-4-*": warning, ux-6-4-10: info, ux-3-1-03: warning}
      ru-syn-sales-question: info
    analyzers:
      lists_of_three: {enabled: false}          # три карточки фич — норма раскладки
      questions: {warn_per_100w: 1.5}
      paragraph_uniformity: {level: info}
  site-page:
    genre: site-page
    description: "Страницы многостраничника: главная, услуги, о компании, кейсы, тарифы, вакансии, контакты"
    groups:
      STR: {enabled: true, max_level: warning}
    level_overrides:
      <<: *ux_on_page
    analyzers:
      lists_of_three: {enabled: false}
      questions: {warn_per_100w: 1.5}
  article:
    genre: article
    description: "Статьи блога, справочные, категорийные и сервисные SEO-тексты"
    level_overrides:
      <<: *ux_on_page
      ru-syn-not-x-but-y: info
    analyzers:
      rhythm: {level: info}                    # 2 из 8 человеческих колонок получали warning
      paragraph_uniformity: {level: info}
      dash_density: {warn_per_100w: 1.2}
      concreteness: {min_per_100w: 2.0}
      marker_density: {warn_per_100w: 1.2, error_per_100w: 3.5}
  meta:
    genre: meta
    description: "title, description, og:title, og:description, og:image:alt — короткие тексты: анализаторы прозы выключены"
    level_overrides:
      <<: *ux_on_page
      "ru-lex-intro-cliche": error
      "en-lex-intro-cliche": error
      "ru-mkt-banned-openers": error
      "en-mkt-banned-openers": error
    analyzers:
      marker_density: {min_words: 8, warn_per_100w: 4.0, error_per_100w: 10.0}
      rhythm: {enabled: false}
      paragraph_uniformity: {enabled: false}
      dash_density: {enabled: false}
      concreteness: {enabled: false}
      overcorrection: {enabled: false}
      not_x_but_y: {enabled: false}
      questions: {enabled: false}
      triads: {enabled: false}
      exclamations: {enabled: false}
      lists_of_three: {enabled: false}
      eyebrow_rate: {enabled: false}
  geo:
    genre: geo
    description: "Тексты для ответов нейросетей: «коротко» в начале, вопрос — ответ, определения, факты с источником и датой"
    level_overrides:
      <<: *ux_on_page
      "ru-syn-rhetorical-cliche": error
      "en-syn-rhetorical-cliche": error
      "ru-lex-vague-attribution": error
      "en-lex-vague-attribution": error
    analyzers:
      questions: {enabled: false}               # вопрос — ответ законен
      rhythm: {level: info}                    # ответы-определения могут быть ровными
      concreteness: {min_per_100w: 3.0, level: warning}
      paragraph_uniformity: {enabled: false}
      lists_of_three: {level: info}
  email-form:
    genre: email-form
    description: "Письма и уведомления вокруг форм: подтверждение заявки, двойная подписка, выдача материала, напоминания"
    level_overrides:
      <<: *ux_on_page
      "ru-ton-sycophancy": warning
    analyzers:
      exclamations: {warn_per_100w: 1.0}
      rhythm: {level: info}
      paragraph_uniformity: {enabled: false}
      concreteness: {min_words: 40, min_per_100w: 1.0}
      lists_of_three: {enabled: false}
      eyebrow_rate: {enabled: false}
  interface:
    genre: interface
    description: "Тексты интерфейса: кабинет, приложение, бот, транзакционные письма, СМС, push — строки с ролью ux 07/06 §7.2; правила ux с уровнями канона без поправок сайта"
    groups:                                   # лексика, синтаксис, тон, маркетинг и структура сайта — не для строк продукта:
      LEX: {enabled: false}                   # их нормы у интерфейса — словарь ux 07/06 по ролям
      SYN: {enabled: false}
      TON: {enabled: false}
      MKT: {enabled: false}
      STR: {enabled: false}
    prose_roles: [body, help, email]          # проза интерфейса: тире, уровень чтения
    level_overrides:
      typo-double-space: error                # строки пробелов ux 07/06 §6.5 — правила набора text 08/02, в интерфейсе — запрет
      typo-space-before-punct: error
      typo-no-space-after-punct: error
      "COPY-L-*": "off"                       # право рекламы — claims_check.py; правила права, поданные --rules, здесь молчат
    analyzers:
      marker_density: {enabled: false}        # плотность маркеров — примета слоп-прозы сайта
      rhythm: {enabled: false}                # ux 07/06 §6.2: однотипные строки одной длины — достоинство интерфейса
      paragraph_uniformity: {enabled: false}
      concreteness: {enabled: false}          # числа в строке — из данных продукта (анализатор форматов)
      verb_repeat: {enabled: false}
      not_x_but_y: {enabled: false}
      questions: {enabled: false}             # вопрос — законная форма заголовка подтверждения
      triads: {enabled: false}
      exclamations: {enabled: false}
      eyebrow_rate: {enabled: false}
      lists_of_three: {enabled: false}
      numbers_without_fact: {enabled: false}
      cards_uniform: {enabled: false}
      ui_action_name: {enabled: true}
      ui_object_alias: {enabled: true}
      ui_group_form: {enabled: true}
      ui_duplicate: {enabled: true}
      ui_maxlen: {enabled: true}
      ui_role_length: {enabled: true}
      ui_formats: {enabled: true}
      ui_icu: {enabled: true}
      yo_mix: {enabled: true}
      us_uk: {enabled: true}
      reading_level: {enabled: true}
