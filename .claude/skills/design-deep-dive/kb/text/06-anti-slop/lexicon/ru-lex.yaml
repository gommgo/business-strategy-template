# Русская лексика (группа LEX): маркеры нейрослопа в маркетинговых жанрах.
# Основа: гайд заказчика Б1 и §E п.2–7, 11–13; humanizer-ru references/patterns.md п.1, 3, 5, 6, 7, 9, 10, 22, 24, 25, 36
# (MIT, коммит ff990df); ВП:Признаки сгенерированности текста (oldid 154096264); ux 07/06 §1–§2 (словари интерфейса —
# унаследованы отдельно, файл ux-07-06.yaml; здесь — правила для роли marketing и прозы). Макросы: %B% и %E% — границы
# слова с кириллицей, %W% — продолжение основы. Уровни — по умолчанию; профиль жанра может понизить (profiles.yaml).
date: 2026-09-24
version: 1
owner: C (волна 1)
defaults:
  group: LEX
  lang: ru
  flags: i
  count_as_marker: true
  date: 2026-09-24
  genres: [landing, site-page, article, meta, geo, email-form]
rules:
  - id: ru-lex-copula
    marker_id: COPY-M-LEX-01
    level: warning
    pattern: '%B%(?:явля(?:ется|ются|лся|лась|лось|лись|ясь)|являющ%W%|представля%W%\s+(?:из\s+себя|собой)|представл(?:ял|яла|яли|яло)\s+собой|выступа%W%\s+в\s+(?:роли|качестве)|служ(?:ит|ат|ил|ила|или)\s+(?:основой|залогом|гарантией|примером|доказательством)|нос(?:ит|ят|ил|ила)\s+(?:[а-яё]+\s+)?характер|знаменует\s+собой|олицетвор%W%)%E%'
    message: "Связка вместо «это»/«есть» («является», «представляет собой», «выступает в роли»)."
    replacement: "тире по грамматике, глагол или ничего: «является лидером» → назвать факт, из-за которого вы лидер"
    examples: {bad: "Наша компания является лидером в сфере логистики.", good: "Мы возим грузы по Сибири с 2011 года."}
    source: "гайд Б1, §E п.2; humanizer-ru п.3; WP:AISIGNS «Avoidance of basic copulatives»; ux 07/06 §2.1"
    evidence: "[консенсус]; −10 % is/are в академ. текстах 2023 (Geng & Trotta через WP:AISIGNS) — для EN [исследование]"
  - id: ru-lex-empty-adj-strong
    marker_id: COPY-M-LEX-02
    level: warning
    pattern: '%B%(?:ключев%W%(?!\s+(?:слов|ставк|фраз|запрос|показател|кадр|клиент))|важнейш%W%|неотъемлем%W%|многогранн%W%|всесторонн%W%|инновационн%W%|передов%W%|революционн%W%|прорывн%W%|беспрецедентн%W%|первоклассн%W%|высококачественн%W%|непревзойд[её]нн%W%|безупречн%W%|впечатляющ%W%|поразительн%W%|колоссальн%W%|феноменальн%W%|амбициозн%W%|исключительн(?:ый|ая|ое|ые|ого|ой|ому|ым|ых|ую|ыми))%E%'
    message: "Оценочное прилагательное-пустышка: звучит весомо, факта не добавляет."
    replacement: "удалить или заменить характеристикой: «инновационный сервис» → что именно он делает и с каким числом"
    examples: {bad: "Мы предлагаем инновационные решения ключевых задач.", good: "Считаем зарплату 40 сотрудникам за 10 минут."}
    source: "гайд Б1, §E п.4; humanizer-ru п.6; ux 07/06 §1; ВП:ПРГЕН «Чрезмерный акцент на символизме и важности»"
    evidence: "[консенсус]"
  - id: ru-lex-empty-adj-context
    marker_id: COPY-M-LEX-02
    level: info
    min_count: 2
    unless: '\d'
    pattern: '%B%(?:эффективн%W%|качественн%W%|уникальн%W%|комплексн%W%|оптимальн%W%|грамотн%W%|значим%W%|решающ%W%|надёжн%W%|надежн%W%|профессиональн%W%|индивидуальн%W%|удобн%W%|выгодн%W%)%E%'
    message: "Оценка без характеристики (два и больше таких слова в блоке, рядом нет ни одного числа)."
    replacement: "оценку заменить характеристикой: «качественный ремонт» → «гарантия 3 года, приёмка по чек-листу из 40 пунктов»"
    examples: {bad: "Качественный и эффективный сервис с индивидуальным подходом.", good: "Сервис считает смету за 3 минуты."}
    source: "гайд §C («оценку меняйте на характеристику»); humanizer-ru п.9 (правило замены); PLAN.md поправка к ux 07/06 §1 («легко», «быстро» — только с фактом)"
    evidence: "[практика]"
  - id: ru-lex-empty-verbs
    marker_id: COPY-M-LEX-03
    level: warning
    levels: {article: info}
    pattern: '%B%(?:способству%W%|способствова%W%|содейству%W%|демонстриру%W%|продемонстрир%W%|свидетельству%W%|подч[её]ркива%W%|подчеркн%W%|знаменует|символизиру%W%)%E%'
    message: "Глагол-пустышка «поверхностного анализа»: действие приписано факту или вещи («офис подчёркивает статус»)."
    replacement: "назвать, кто и что делает: «способствует росту» → «после запуска выручка выросла на 18 %» (из facts.yaml) или удалить"
    examples: {bad: "Новый офис подчёркивает статус компании и способствует росту.", good: "В новом офисе принимаем 40 гостей в день."}
    source: "гайд Б1, §E п.5; ВП:ПРГЕН «Поверхностный анализ» («факт не может подчёркивать»); humanizer-ru п.6, 8; Kobak и др. 2025 (66 % избыточных слов — глаголы)"
    evidence: "[консенсус]"
  - id: ru-lex-enabler-verbs
    marker_id: COPY-M-LEX-03
    level: warning
    pattern: '%B%(?:позволя(?:ет|ют|ло|ли|ть|я)|позвол(?:ит|ят|ило|или))\s+(?:(?:вам|нам|им|клиентам|пользователям|компании|компаниям|бизнесу|командам?)\s+)?[а-яё]+(?:ть|ться)%E%|%B%(?:да[её]т|дают|давать)\s+возможность|%B%(?:име(?:ет|ют)|имеется)\s+возможность|%B%обеспечива%W%\s+(?:[а-яё]+\s+)?(?:высок|надёжн|надежн|стабильн|максимальн|безопасн|эффективн|качеств|комфорт|контрол|удобств|повышенн|улучшенн|бесперебойн|непрерывн|полн|должн|необходим)%W%'
    message: "«Позволяет сделать», «даёт возможность», «обеспечивает высокое…» вместо прямого глагола."
    replacement: "«позволяет автоматизировать заявки» → «разбирает заявки сам»"
    examples: {bad: "Платформа позволяет автоматизировать заявки и даёт возможность экономить.", good: "Платформа сама разбирает заявки."}
    source: "ux 07/06 §2.1 («позволяет сохранить» → «сохраняет»); гайд Б1; humanizer-ru п.33 (частые дубли: позволяет, обеспечивает)"
    evidence: "[практика]"
  - id: ru-lex-nominal-constructions
    marker_id: COPY-M-LEX-04
    level: warning
    pattern: '%B%(?:осуществля|осуществи|осуществл|произв[оеё]д|произвед|провод|провед|оказыва|оказа|принима|приня|соверша|соверш)%W%\s+(?:[а-яё]+\s+)?(?:работ|помощ|участи|контрол|оценк|анализ|сбор|монтаж|ремонт|обслуживан|консультаци|поддержк|внедрени|разработк|обучени|проверк|расч[её]т|осмотр|диагностик|мониторинг|борьб|продаж|поставк|доставк|оплат|выплат|подбор|настройк|отгрузк|при[её]м|оформлени|предоставлени|мероприяти|услуг|автоматизаци|оптимизаци|модернизаци|интеграци|цифровизаци|внедрени|сохранени|хранени|рассылк|запуск|выгрузк|обработк|передач|регистраци|публикаци|отправк|установк|подключени|согласовани|сопровождени|поиск)%W%'
    message: "Канцелярит: глагол-связка плюс отглагольное существительное («осуществляем доставку», «оказываем услуги»)."
    replacement: "развернуть в глагол: «осуществляем доставку» → «доставляем»; «оказываем услуги по монтажу» → «монтируем»"
    examples: {bad: "Мы осуществляем доставку и оказываем услуги по монтажу.", good: "Доставляем и монтируем за один день."}
    source: "гайд Б1 («проводить работу», «оказывать помощь», «принимать участие»), §C; Нора Галь «Слово живое и мёртвое», гл. «Берегись канцелярита!» (через гайд); humanizer-ru п.1"
    evidence: "[консенсус] русской редакторской школы"
  - id: ru-lex-verbal-nouns
    marker_id: COPY-M-LEX-04
    level: info
    min_count: 3
    pattern: '%B%(?:осуществлени|проведени|обеспечени|формировани|повышени|взаимодействи|использовани|применени|реализаци|предоставлени|оказани|выполнени|достижени|улучшени|оптимизаци|функционировани|увеличени|снижени|совершенствовани)%W%'
    message: "Цепь отглагольных существительных: три и больше в одном блоке."
    replacement: "существительное → глагол: «обеспечение повышения эффективности» → «работаем быстрее на 20 %» (с фактом) или удалить"
    examples: {bad: "Обеспечение повышения эффективности использования ресурсов.", good: "Тратим на 20 % меньше электричества."}
    source: "гайд Б1, §C («существительное разворачивайте в глагол»); humanizer-ru п.1–2"
    evidence: "[консенсус]"
  - id: ru-lex-dannyi
    marker_id: COPY-M-LEX-04
    level: warning
    pattern: '%B%данн(?:ый|ая|ое|ого|ой|ом|ую)%E%'
    message: "«Данный» как указательное местоимение."
    replacement: "«этот» или ничего: «данная услуга» → «услуга»"
    examples: {bad: "Данная услуга доступна в любом городе.", good: "Услуга доступна в 40 городах; по данным за август, спрос вырос."}
    source: "гайд §E п.3; ux 07/06 §2.2 (форма «данные/данных» — существительное, не ловится)"
    evidence: "[консенсус]"
  - id: ru-lex-kantselyarit-phrases
    marker_id: COPY-M-LEX-04
    level: info
    min_count: 2
    pattern: '%B%(?:в\s+случае\s+необходимости|с\s+целью|в\s+целях|в\s+связи\s+с\s+тем,?\s+что|ввиду\s+того,?\s+что|на\s+данный\s+момент|на\s+предмет|в\s+части\s+[а-яё]+|посредством|вышеуказанн%W%|нижеследующ%W%|вышеперечисленн%W%|в\s+рамках\s+(?:данн|реализаци|осуществлени)%W%)%E%'
    message: "Канцелярские обороты (два и больше в блоке)."
    replacement: "«в случае необходимости» → «если нужно»; «с целью» → «чтобы»; «посредством» → «через»"
    examples: {bad: "В случае необходимости в целях экономии свяжитесь с нами.", good: "Если нужно сэкономить, напишите нам."}
    source: "ux 07/06 §2.1 (для интерфейса — запрет); гайд Б1"
    evidence: "[консенсус]"
  - id: ru-lex-intro-cliche
    marker_id: COPY-M-LEX-05
    level: warning
    slot_levels: {headline: error, subheadline: error, meta-title: error, meta-description: error, og-title: error, og-description: error, article-lead: error, email-subject: error, email-preheader: error}
    pattern: '%B%(?:в\s+современном\s+(?:мире|обществе|бизнесе|ритме)|в\s+современных\s+(?:реалиях|условиях)|в\s+наше\s+время|в\s+наши\s+дни|на\s+сегодняшний\s+день|в\s+настоящее\s+время|в\s+эпоху\s+[а-яё]+|в\s+(?:современном\s+)?(?:быстро\s+|стремительно\s+|постоянно\s+)?(?:меняющемся|изменчивом|развивающемся)\s+(?:мире|рынке|бизнесе)|в\s+мире,\s+где|не\s+секрет,?\s+что|ни\s+для\s+кого\s+не\s+секрет|каждый\s+из\s+нас|как\s+известно|трудно\s+переоценить|невозможно\s+представить|сложно\s+представить\s+(?:себе\s+)?(?:современн|жизнь)%W%|(?:данная|эта)\s+тема\s+(?:очень\s+)?актуальна|в\s+условиях\s+(?:жёсткой|жесткой|растущей|высокой)\s+конкуренции)%E%'
    message: "Штамп вступления: разгон вместо первой фразы по делу."
    replacement: "начать с конкретной ситуации, числа или наблюдения из брифа; в заголовке и мета — ошибка"
    examples: {bad: "В современном мире каждый бизнес ищет рост.", good: "За 2025 год в Казани открылось 214 кофеен."}
    source: "гайд Б1, §D «Вступление», §E п.7; humanizer-ru п.22; ux 07/06 §6.4; Hallmark copy.md «In today's digital landscape»"
    evidence: "[консенсус]"
  - id: ru-lex-significance
    marker_id: COPY-M-LEX-06
    level: warning
    pattern: '%B%(?:игра(?:ет|ют|л|ла|ли|ть)\s+(?:важную|ключевую|значительную|решающую|огромную|немаловажную|центральную|большую|важнейшую)\s+роль|неотъемлем%W%\s+част%W%|име(?:ет|ют)\s+(?:огромное|большое|важное|решающее|ключевое|первостепенное)\s+значение|трудно\s+переоценить|оказ(?:ывает|ывают|ал|ала|али|ать|ывать)\s+(?:значительное|огромное|существенное|большое|серь[её]зное|положительное|заметное|решающее)\s+влияние|краеугольн%W%\s+камн%W%|залог(?:ом)?\s+(?:успеха|качества|победы)|основа\s+основ|знаков%W%\s+(?:момент|событи)%W%|поворотн%W%\s+(?:момент|пункт|этап|точк)%W%|неизгладим%W%\s+след%W%|нов(?:ая|ую|ой)\s+эр%W%\s+(?:в|для)%E%)'
    message: "Раздувание значимости: предмет «играет ключевую роль», «является неотъемлемой частью»."
    replacement: "сказать, что будет без этого, с фактом: «логистика играет ключевую роль» → «опоздание на день останавливает линию»"
    examples: {bad: "Логистика играет ключевую роль и является неотъемлемой частью бизнеса.", good: "Если груз опоздает на день, линия встанет."}
    source: "гайд Б1, §E п.11; WP:AISIGNS «Undue emphasis on significance»; ВП:ПРГЕН; humanizer-ru п.7"
    evidence: "[консенсус]"
  - id: ru-lex-vague-attribution
    marker_id: COPY-M-LEX-07
    level: warning
    unless: '\d'
    pattern: '%B%(?:по\s+мнению\s+(?:экспертов|специалистов|аналитиков|учёных|ученых|многих)|(?:эксперты|специалисты|аналитики|учёные|ученые|исследователи|врачи|психологи|маркетологи)\s+(?:отмечают|считают|сходятся|уверены|утверждают|рекомендуют|единодушны|доказали|советуют)|исследования\s+(?:показывают|доказывают|подтверждают)|как\s+показывают\s+(?:исследования|практика)|многие\s+(?:эксперты|специалисты|авторы|исследователи|компании)\s+[а-яё]+т|принято\s+считать|как\s+показывает\s+практика|по\s+статистике|статистика\s+(?:говорит|показывает))%E%'
    message: "Размытая атрибуция: мнение приписано «экспертам» или «исследованиям» без имени, даты и числа."
    replacement: "назвать источник, год и число из facts.yaml — или убрать утверждение"
    examples: {bad: "По мнению экспертов, спрос на доставку растёт.", good: "По данным Росстата за 2025 год, спрос на доставку вырос на 18 %."}
    source: "гайд Б1, §E п.12; WP:AISIGNS «Vague attributions»; ВП:ИИОФ; humanizer-ru п.10"
    evidence: "[консенсус]"
  - id: ru-lex-intensifiers
    marker_id: COPY-M-LEX-08
    level: info
    min_count: 2
    pattern: '%B%(?:очень|крайне|действительно|безусловно|абсолютно|по-настоящему|невероятно|поистине|чрезвычайно|максимально|воистину|несомненно|бесспорно)%E%'
    message: "Усилители (два и больше в блоке): громкость вместо содержания."
    replacement: "удалить, проверив смысл; если смысл пропал — его и не было"
    examples: {bad: "Это действительно очень удобно и абсолютно безопасно.", good: "Карта работает без интернета."}
    source: "гайд Б1, §E п.13; humanizer-ru п.22"
    evidence: "[практика]; WP:AISIGNS: хеджи и усилители чаще у людей — поэтому info и только кластер"
  - id: ru-lex-pseudo-depth
    marker_id: COPY-M-LEX-09
    level: warning
    pattern: '%B%(?:по\s+сути(?:\s+дела)?|в\s+корне|суть\s+в\s+том|если\s+копнуть\s+(?:глубже|поглубже)|настоящий\s+вопрос\s+в\s+том|главный\s+вопрос\s+в\s+том|глубинн%W%\s+(?:проблем|причин|смысл|суть)%W%|вот\s+что\s+(?:все|многие|большинство)\s+упускают|(?:главная|частая|типичная)\s+ошибка\s+большинства|никто\s+не\s+(?:расскажет|скажет|говорит)|чего\s+вам\s+не\s+(?:расскажут|скажут)|о\s+ч[её]м\s+(?:все\s+)?молчат)%E%'
    message: "Псевдоглубина и «инсайт-подводка»: торжественность перед обычной мыслью."
    replacement: "убрать подводку — утверждение должно стоять само"
    examples: {bad: "По сути, главная ошибка большинства — в спешке.", good: "Чаще всего ошибаются при выборе подрядчика: не проверяют лицензию."}
    source: "гайд Б1; humanizer-ru п.25 (faux-insight сетапы)"
    evidence: "[практика]"
  - id: ru-lex-pseudo-depth-soft
    marker_id: COPY-M-LEX-09
    level: info
    min_count: 2
    pattern: '%B%(?:на\s+самом\s+деле|в\s+конечном\s+(?:сч[её]те|итоге)|по\s+большому\s+сч[её]ту|в\s+сущности)%E%'
    message: "Смягчённая псевдоглубина (два и больше оборота в блоке)."
    replacement: "удалить обороты; одно «на самом деле» в живой речи — норма"
    examples: {bad: "На самом деле, в конечном счёте всё решает сервис.", good: "Решает сервис: 70 % клиентов возвращаются."}
    source: "гайд Б1 («Псевдоглубина»); humanizer-ru п.25"
    evidence: "[практика]"
  - id: ru-lex-calques
    marker_id: COPY-M-LEX-10
    level: warning
