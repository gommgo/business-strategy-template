# Русский синтаксис (группа SYN). Основа: гайд заказчика Б2, §C, §E п.8, 14–19; humanizer-ru п.2, 4, 8, 13–16, 27, 28,
# 33, 35 (MIT, ff990df; регулярки п.13 и п.27 — по scripts/lint.py с доработкой под тире и «мы»); ВП:ИИПАРАЛЛЕЛЬ,
# ВП:ЛОЖДИА, ВП:ИИТАВТ; WP:AISIGNS «Negative parallelisms», «Rule of three». Регулярные приближения морфологии
# (деепричастия, родительные, пассив) — уровень не выше warning; точнее — анализатор с pymorphy3 (venv-C).
date: 2026-09-24
version: 1
owner: C (волна 1)
defaults:
  group: SYN
  lang: ru
  flags: i
  count_as_marker: true
  date: 2026-09-24
  genres: [landing, site-page, article, meta, geo, email-form]
rules:
  - id: ru-syn-not-only-but-also
    marker_id: COPY-M-SYN-01
    level: warning
    slot_levels: {headline: error, subheadline: error, meta-title: error, meta-description: error, og-title: error, og-description: error}
    pattern: '%B%не\s+только%E%[^.!?\n]{1,80}?(?:,\s*|\s+|\s*[—–-]\s*)(?:но|а)\s+(?:и\s+)?[а-яёa-z0-9«"]'
    message: "«Не только X, но и Y» — самая узнаваемая фигура сгенерированного текста."
    replacement: "два простых предложения или одно без противопоставления; «как X, так и Y» — та же фигура"
    examples: {bad: "Сервис не только экономит время, но и снижает затраты.", good: "Отчёт включает не только штатных сотрудников."}
    source: "гайд Б2, §C, §E п.8; humanizer-ru п.13 (жёсткий запрет) и lint.py; WP:AISIGNS «Not only… but»; ux 07/06 §6.4"
    evidence: "[консенсус]"
  - id: ru-syn-kak-tak-i
    marker_id: COPY-M-SYN-01
    level: info
    pattern: '%B%как\s+[^.,!?\n]{1,40},\s+так\s+и%E%'
    message: "«Как X, так и Y» — заменитель «не только…, но и» с тем же контрастом."
    replacement: "одно предложение без противопоставления: «Подходит кофейням и сетям»"
    examples: {bad: "Подходит как малому бизнесу, так и корпорациям.", good: "Подходит кофейням на 20 мест."}
    source: "гайд §C («замена на „как X, так и Y“ не помогает»); humanizer-ru SKILL.md «Запрещённые замены»"
    evidence: "[практика]"
  - id: ru-syn-not-just
    marker_id: COPY-M-SYN-02
    level: warning
    slot_levels: {headline: error, subheadline: error, meta-description: error, og-description: error}
    pattern: '%B%не\s+просто%E%(?!\s+так%E%)[^.!?\n]{1,80}?(?:,\s*(?:а|но)\s+\S|\s*(?:,|—|–|-{1,2})\s*(?:это|мы|а|он|она|оно|они)\s+\S)|%B%не\s+просто%E%(?!\s+так%E%)[^.!?\n]{1,40}[.!?]\s+(?:Это|Мы)\s+\S|%B%речь\s+ид[её]т\s+не\s+только|%B%нет\s+[^,.!?\n]{1,40},\s+нет%E%'
    message: "«Это не просто X, это Y», «Мы не просто…, мы…», «Нет X, нет Y — только Z»."
    replacement: "убрать отрицание и сказать, чем продукт является, с фактом; «больше, чем курс» — та же фигура"
    examples: {bad: "Это не просто курс, а целая философия.", good: "Он пришёл сюда не просто так."}
    source: "гайд Б2, §E п.8; humanizer-ru п.13 и lint.py (полная фигура обязательна: «не просто так» — идиома); WP:AISIGNS «It is not just…, it's»"
    evidence: "[консенсус]"
  - id: ru-syn-not-x-but-y
    marker_id: COPY-M-SYN-03
    level: info
    pattern: '%B%не\s+(?!только%E%|просто%E%|раз%E%|менее%E%|более%E%|то%E%|так%E%|без%E%|лишн)[^.,;:!?\n]{1,40},\s+а%E%'
    message: "«Не X, а Y»: законно, когда контраст — суть позиционирования; как тик — слоп. Считается в плотности."
    replacement: "оставить одно на страницу, где противопоставление несёт смысл; остальные — прямым утверждением"
    examples: {bad: "Мы не продаём курсы, а меняем мышление.", good: "Мы продаём курсы по бухгалтерии."}
    source: "гайд Б2 («не X, а Y»); PLAN.md «Жанры» (переносится с порогом по жанру); Gesso not-x-but-y-cadence (FLAG)"
    evidence: "[спорно]: порог по жанру — D"
    threshold_ref: "03-corpus-measured/thresholds.yaml#genres.<жанр>.analyzers.not_x_but_y"
  - id: ru-syn-triad-evaluative
    marker_id: COPY-M-SYN-04
    level: warning
    pattern: '%B%(?:качеств|над[её]жн|эффективн|профессионал|ответствен|индивидуальн|скорост|быстр|удобн|выгодн|комфорт|безопасн|доступн|прозрачн|гибк|инновац|креатив|клиентоориент|оперативн|стабильн|прост|честн|открыт|внимани|забот|экспертн|точн|пунктуальн|вкусн|свеж|стильн|современн|уют|масштабируем|производительн|функциональн|удобств|долговечн|экологичн|натуральн|эксперт|практик|лидер|профессионал|специалист|мастер|новатор|энтузиаст)%W%(?:\s+[а-яё]+)?,\s+(?:качеств|над[её]жн|эффективн|профессионал|ответствен|индивидуальн|скорост|быстр|удобн|выгодн|комфорт|безопасн|доступн|прозрачн|гибк|инновац|креатив|клиентоориент|оперативн|стабильн|прост|честн|открыт|внимани|забот|экспертн|точн|пунктуальн|вкусн|свеж|стильн|современн|уют|масштабируем|производительн|функциональн|удобств|долговечн|экологичн|натуральн|эксперт|практик|лидер|профессионал|специалист|мастер|новатор|энтузиаст)%W%(?:\s+[а-яё]+)?,?\s+(?:и|а\s+также)\s+(?:качеств|над[её]жн|эффективн|профессионал|ответствен|индивидуальн|скорост|быстр|удобн|выгодн|комфорт|безопасн|доступн|прозрачн|гибк|инновац|креатив|клиентоориент|оперативн|стабильн|прост|честн|открыт|внимани|забот|экспертн|точн|пунктуальн|вкусн|свеж|стильн|современн|уют|масштабируем|производительн|функциональн|удобств|долговечн|экологичн|натуральн|эксперт|практик|лидер|профессионал|специалист|мастер|новатор|энтузиаст)%W%'
    message: "Тройка оценочных слов («качество, надёжность и профессионализм»)."
    replacement: "одно точное слово с фактом или ни одного; новая тройка из других слов — тот же слоп"
    examples: {bad: "Мы гарантируем качество, надёжность и профессионализм.", good: "Мы гарантируем ремонт за 3 дня."}
    source: "гайд Б2, §C («тройку сокращайте до одного точного слова»), §E п.14; humanizer-ru п.14; WP:AISIGNS «Rule of three»"
    evidence: "[консенсус]"
  - id: ru-syn-false-range
    marker_id: COPY-M-SYN-05
    level: info
    flags: ''
    unless: '\d'
    pattern: '%B%[Оо]т\s+(?!\d)[а-яё][а-яё-]{2,}(?:\s+[а-яё][а-яё-]{1,}){0,2}\s+до\s+(?!\d)[а-яё][а-яё-]{2,}(?:\s+[а-яё][а-яё-]{1,}){0,2}%E%'
    message: "«От X до Y» без шкалы (меризм): крайности не лежат на одной оси."
    replacement: "перечислить, что входит: «от идеи до реализации» → «проектируем, согласуем, строим»; законно для шагов процесса и чисел"
    examples: {bad: "Поможем во всём — от идеи до реализации.", good: "Доставка занимает от 2 до 5 дней."}
    source: "гайд Б2 («ложные диапазоны»); humanizer-ru п.16; ВП:ЛОЖДИА («Крайности»)"
    evidence: "[практика]"
  - id: ru-syn-false-range-chain
    marker_id: COPY-M-SYN-05
    level: warning
    flags: ''
    pattern: '%B%[Оо]т\s+[а-яё][^.!?\n]{2,40}?\s+до\s+[а-яё][^.!?\n]{2,40}?,\s+от\s+[а-яё][^.!?\n]{2,40}?\s+до\s+[а-яё]'
    message: "Цепочка ложных диапазонов «от X до Y, от A до B»."
    replacement: "перечислить услуги списком или прозой без «от… до»"
    examples: {bad: "От анализа данных до стратегии, от маркетинга до продаж — мы рядом.", good: "Работаем с аналитикой, маркетингом и продажами."}
    source: "humanizer-ru п.16 (пример «до»); ВП:ЛОЖДИА"
    evidence: "[практика]"
  - id: ru-syn-chopped
    marker_id: COPY-M-SYN-06
    level: warning
    flags: m
    pattern: '(?:^|(?<=[.!?…]\s))(?:[А-ЯЁA-Z][а-яёa-z0-9-]+(?:\s+[а-яёa-z0-9-]+){0,2}[.!]\s+){2,}[А-ЯЁA-Z][а-яёa-z0-9-]+(?:\s+[а-яёa-z0-9-]+){0,2}[.!]|(?:Без|Ноль|Никаких)\s[^.!?\n]{1,35}[.!]\s+(?:Без|Ноль|Никаких)\s'
    message: "Рубленый драматизм: три и больше фразы по 1–3 слова подряд («Быстро. Просто. Надёжно.», «Без X. Без Y.»)."
    replacement: "одна фраза с фактом: «Подключим за день, без выезда специалиста»; одно короткое предложение для акцента — норма"
    examples: {bad: "Быстро. Просто. Надёжно.", good: "Подключим за день, без выезда."}
    source: "гайд Б2; humanizer-ru п.27 (жёсткий запрет) и lint.py; impeccable aphoristic-cadence («X. No Y.»)"
    evidence: "[консенсус]; в заголовке — [спорно]: креативный приём по голосу бренда"
  - id: ru-syn-tail-negation
    marker_id: COPY-M-SYN-06
    level: warning
    min_count: 2
    pattern: '(?:,|—|–|-)\s+без\s+[а-яё]+(?:\s+и\s+[а-яё]+(?:\s+[а-яё]+)?){0,2}[.!]'
    message: "Хвостовые отрицания-тики («…, без воды», «…, без догадок»): два и больше в блоке."
    replacement: "смысл хвоста передать утверждением или удалить; не заменять новыми хвостами («без шелухи»)"
    examples: {bad: "Просто цифры, без воды. Только факты, без догадок.", good: "Отчёт на 40 страниц: конкуренты, цены, каналы."}
    source: "humanizer-ru eval 17 tail-negations (PR #1), п.27"
    evidence: "[практика]"
  - id: ru-syn-rhetorical-cliche
    marker_id: COPY-M-SYN-07
    level: warning
    pattern: '%B%(?:каковы\s+же\s+результаты|что\s+это\s+значит(?:\s+для\s+(?:вас|бизнеса|нас))?|почему\s+это\s+важно|звучит\s+знакомо|знакомая\s+ситуация|так\s+в\s+ч[её]м\s+(?:же\s+)?секрет|в\s+ч[её]м\s+(?:же\s+)?секрет|как\s+этого\s+добиться|в\s+ч[её]м\s+подвох|что\s+же\s+делать|а\s+что,?\s+если\s+[^?\n]{1,60}|и\s+что\s+в\s+итоге)\?'
    message: "Риторический вопрос-подводка вместо утверждения."
    replacement: "убрать вопрос и сразу дать ответ"
    examples: {bad: "Каковы же результаты? Время обработки упало на 23 %.", good: "Время обработки заявки упало на 23 %."}
    source: "гайд Б2; humanizer-ru (жёсткий запрет в эссе); humanizer-ru eval 8 («Каковы же результаты?»)"
    evidence: "[практика]"
  - id: ru-syn-sales-question
    marker_id: COPY-M-SYN-07
    level: info
    exclude_slot_types: [faq-q]
    pattern: '%B%(?:хотите|мечтаете|устали|надоело|тоже\s+хотите|ищете|нужен|нужна|нужно)\s+[^?\n]{1,60}\?'
    message: "Продающий вопрос-крючок («Хотите…?», «Устали от…?»): законен в заголовке по голосу клиента, как привычка — штамп."
    replacement: "если вопрос взят из голоса клиента — оставить один; иначе утверждение с выгодой"
    examples: {bad: "Хотите увеличить продажи? Устали от рутины?", good: "Продажи растут, когда заявки не теряются."}
    source: "гайд Б2 («риторические вопросы»); ux 07/06 §6.2 (вопрос как форма законен)"
    evidence: "[спорно]: для лендинга — по голосу клиента (B2), порог — D"
  - id: ru-syn-gerund-tail
    marker_id: COPY-M-SYN-08
    level: warning
    pattern: ',\s+(?:подч[её]ркивая|обеспечивая|отражая|способствуя|демонстрируя|символизируя|формируя|позволяя|создавая|открывая|помогая|делая|превращая|сочетая|объединяя|предлагая|давая|оставаясь|становясь|укрепляя|повышая|гарантируя|вдохновляя|раскрывая|усиливая|подтверждая)%E%[^.!?\n]{0,100}[.!?]'
    message: "Деепричастный хвост «поверхностного анализа» в конце предложения («…, подчёркивая статус»)."
    replacement: "отрезать хвост или развернуть в отдельное предложение с явным субъектом и фактом"
    examples: {bad: "Мы открыли новый офис, подчёркивая статус компании.", good: "Мы открыли новый офис на 40 мест."}
    source: "гайд Б2, §C, §E п.15; humanizer-ru п.8; WP:AISIGNS «Superficial analyses» (Reinhart и др., PNAS 2025: причастные обороты у моделей в 2–5 раз чаще — для EN)"
    evidence: "[консенсус]; для RU — [практика]"
  - id: ru-syn-dangling-gerund
    marker_id: COPY-M-SYN-09
    level: warning
    flags: m
    pattern: '(?:^|(?<=[.!?…]\s))[А-ЯЁ][а-яё]+(?:ая|яя|уя|юя|ив|ав|ыв|ев|ув|вши|вшись|ясь|аясь)(?:\s+[^,.!?\n]{1,60})?,\s+[^.!?\n]{0,40}?%B%(?:становится|станет|стало|удаётся|удается|удастся|удалось|получается|получилось|видно|ясно|понятно|результат%W%|эффективность|показател%W%|качество|процесс%W%|время|срок%W%|стоимость|расход%W%|затрат%W%|продаж%W%|выручк%W%)%E%'
    message: "Висячее деепричастие: действие деепричастия и главный глагол у разных субъектов («используя метод, результаты улучшаются»). Безличное с инфинитивом («Уезжая, нужно выключить свет») — норма."
    replacement: "развернуть в предложение с субъектом: «Когда команда применила метод, срок сократился на 30 %»"
    examples: {bad: "Используя этот метод, результаты улучшаются.", good: "Когда команда применила метод, срок сдачи сократился."}
    source: "гайд Б2, §E п.16; humanizer-ru п.35; ВП:ПРГЕН «Бесконечные деепричастные обороты» («подъезжая к станции, с меня слетела шляпа»)"
    evidence: "[консенсус] как ошибка; регулярка — приближение [проверено на примерах selftest]"
  - id: ru-syn-genitive-chain
    marker_id: COPY-M-SYN-10
    level: info
    pattern: '%B%[а-яё]{5,}(?:\s+[а-яё]{3,}(?:ния|ции|ости|ства|ов|ей|а|я|и|ы)){3,}%E%'
    message: "Цепочка существительных в родительном падеже подряд (без морфологии — регулярное приближение, с pymorphy3 — три и больше родительных после вершины)."
    replacement: "разбить: «процесс формирования навыка сбора анамнеза» → «врач учится расспрашивать»"
    examples: {bad: "Процесс формирования навыка сбора анамнеза пациента.", good: "Врач учится расспрашивать пациента."}
    source: "гайд Б2, §E п.17; ux 07/06 §2.4 (регулярка по окончаниям — предупреждение); humanizer-ru п.2"
    evidence: "[консенсус] как примета; регулярка шумит — info; точнее — pymorphy3 (опыт 03)"
  - id: ru-syn-passive-agent
    marker_id: COPY-M-SYN-11
    level: warning
    pattern: '%B%нами\s+(?:был[аои]?\s+|будет\s+|будут\s+)?[а-яё]+(?:ано|ено|ено|ыто|ито|ано|ана|ена|аны|ены|ан|ен)%E%'
    message: "Пассив с «нами»: «нами было реализовано»."
    replacement: "актив: «мы сделали 340 проектов»"
    examples: {bad: "Нами было реализовано более 340 проектов.", good: "Мы сделали 340 проектов."}
    source: "гайд Б2, §C («Пассив → актив»); humanizer-ru п.4; humanizer-ru eval 2"
    evidence: "[консенсус]"
  - id: ru-syn-passive
    marker_id: COPY-M-SYN-11
    level: info
    pattern: '%B%(?:был[аои]?|будет|будут)\s+(?:[а-яё]+\s+)?(?:проведен|осуществлен|реализован|выполнен|произведен|создан|разработан|внедр[её]н|достигнут|принят|получен|обеспечен|сформирован|оказан|предоставлен|подготовлен|организован)%W%|%B%(?:осуществля|производи|проводи|реализу|обеспечива|предоставля|оказыва|формиру)(?:ется|ются)%E%'
    message: "Пассив без действующего лица: неясно, кто делает."
    replacement: "назвать деятеля: «монтаж будет выполнен» → «смонтируем за день»; безличное «Заказ отправлен» в уведомлении — норма"
    examples: {bad: "Монтаж будет выполнен специалистами.", good: "Смонтируем за день."}
    source: "гайд Б2; ux 07/06 §2.3 (граница: безличное в коротких статусах законно); humanizer-ru п.4"
    evidence: "[практика]"
  - id: ru-syn-product-synonyms
    marker_id: COPY-M-SYN-13
    level: info
    min_count: 4
    pattern: '%B%(?:сервис|платформ|решени|инструмент|систем|продукт|приложени|экосистем)%W%'
    message: "Продукт назван разными родовыми словами (четыре и больше в блоке): синонимы-циклы."
    replacement: "одно название продукта на всю страницу (по брифу), родовое слово — один раз как категория"
    examples: {bad: "Сервис удобен. Платформа быстрая. Решение надёжное. Инструмент простой.", good: "Сервис считает зарплату."}
    source: "гайд Б2 («синонимы-циклы»), §E п.19; humanizer-ru п.15; ВП:ИИТАВТ; ux 01 §10.1 «одно понятие — одно слово»"
    evidence: "[консенсус]; WP:AISIGNS: для новых моделей — историческая примета"
  - id: ru-syn-aphorism
