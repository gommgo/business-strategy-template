# Структура (STR), тон (TON) и содержание (CNT) — русский. Основа: гайд заказчика Б4, Б5, §D, §E п.6, 9–10, 22–23,
# §F; humanizer-ru п.11, 12, 17, 19, 20, 25, 26, 29, 31, 32, 34, 37, 38 (MIT, ff990df); WP:AISIGNS (Outline-like
# conclusions, Didactic disclaimers, Section summaries); ВП:ПРГЕН. Позиционные приметы (ритм, абзацы под копирку,
# списки по три, надзаголовки) — анализаторы (analyzers.yaml). Outline-тест для статьи и инвертированный outline-тест
# лендинга — только человек или судья (02-linter-spec-and-profiles.md, раздел «Чего линтер не ловит»).
date: 2026-09-24
version: 1
owner: C (волна 1)
defaults:
  lang: ru
  flags: i
  count_as_marker: true
  date: 2026-09-24
  genres: [landing, site-page, article, meta, geo, email-form]
rules:
  # --- структура
  - id: ru-str-transitions-stack
    marker_id: COPY-M-STR-02
    group: STR
    level: warning
    flags: ''
    scope: doc
    min_count: 2
    pattern: '(?:^|(?<=[.!?…]\s))(?:Кроме\s+того|Более\s+того|Помимо\s+этого|Помимо\s+прочего|Также|Ещё\s+одн(?:им|ой|а|о)\s+(?:важн[а-яё]*\s+)?(?:аспект|плюс|момент|преимуществ|особенност|фактор)[а-яё]*|Немаловажно(?:\s+и\s+то)?|Стоит\s+также\s+(?:отметить|упомянуть))%E%'
    message: "Стопка абзацев на склейках («Кроме того…», «Также…», «Ещё один аспект…»): два и больше на текст."
    replacement: "связать абзацы смыслом: отсылка, подхват мысли, «но», «поэтому», контраст; простое удаление склейки не лечит"
    examples: {bad: "Кроме того, сервис считает налоги. Более того, он формирует отчёты.", good: "Сервис считает налоги и сам формирует отчёты."}
    source: "гайд Б4, §D «Связность»; humanizer-ru п.34 (четыре хода связки) и lint.py"
    evidence: "[практика]; humanizer-ru: слепой тест Tangem 2026 — [кейс]"
  - id: ru-str-firstly
    marker_id: COPY-M-STR-02
    group: STR
    level: warning
    pattern: '%B%во-(?:первых|вторых|третьих)%E%'
    message: "«Во-первых / во-вторых / в-третьих» в прозе."
    replacement: "органичный переход или список, если это действительно перечень"
    examples: {bad: "Во-первых, это удобно. Во-вторых, выгодно.", good: "Удобно: заказ за минуту. Выгодно: доставка бесплатно от 1 000 ₽."}
    source: "гайд Б4, §E п.10"
    evidence: "[практика]"
  - id: ru-str-summary
    marker_id: COPY-M-STR-03
    group: STR
    level: warning
    flags: ''
    pattern: '(?:^|(?<=[.!?…]\s))(?:В\s+заключение|Подводя\s+(?:итог|итоги)|Таким\s+образом|Резюмируя|В\s+целом|Итак|Вкратце|Как\s+видите|Как\s+мы\s+видим|Как\s+видно)%E%'
    message: "Резюмирующая концовка («Подводя итог», «Таким образом», «В целом»): пересказ вместо нового."
    replacement: "закончить на последнем конкретном факте, следующем шаге или оговорке"
    examples: {bad: "Подводя итог, можно сказать, что сервис удобен.", good: "Сервис экономит 40 минут в день; подключение — за день."}
    source: "гайд Б4, §D «Заключение», §E п.9; humanizer-ru п.31; WP:AISIGNS «Section summaries» (историческая для новых моделей)"
    evidence: "[консенсус]"
  - id: ru-str-summary-heading
    marker_id: COPY-M-STR-03
    group: STR
    level: warning
    slot_types: [section-title, article-heading, card-title]
    pattern: '^\s*(?:заключение|вывод|выводы|итоги|итог|резюме|подведём\s+итоги|подведем\s+итоги)\s*[.!]?\s*$'
    message: "Раздел «Заключение» / «Итоги», пересказывающий текст."
    replacement: "убрать раздел или дать в нём новое: решение, чек-лист, следующий шаг"
    examples: {bad: "Заключение", good: "Что сделать до подачи заявки"}
    source: "гайд Б4; WP:AISIGNS «Section summaries»; ВП:Заключение"
    evidence: "[практика]"
  - id: ru-str-challenges
    marker_id: COPY-M-STR-04
    group: STR
    level: warning
    pattern: '%B%несмотря\s+на\s+[^.!?\n]{1,60}?,\s+[^.!?\n]{0,40}?сталкива[а-яё]*\s+с\s+(?:рядом\s+|многими\s+|определ[её]нными\s+)?(?:вызов|проблем|трудност|сложност)[а-яё]*|%B%несмотря\s+на\s+(?:эти|все|данные)\s+(?:вызовы|проблемы|трудности|сложности)|%B%вызовы\s+и\s+перспективы|%B%перспективы\s+(?:развития|на\s+будущее)%E%'
    message: "Шаблон «вызовы и перспективы»: «Несмотря на…, сталкивается с рядом вызовов» и радужный прогноз."
    replacement: "конкретная проблема с датой и конкретное действие; прогноз — только из фактов"
    examples: {bad: "Несмотря на рост, компания сталкивается с рядом вызовов.", good: "В 2025 году выросли пробки на М4: мы открыли второй склад в Подольске."}
    source: "гайд Б4; humanizer-ru п.12; WP:AISIGNS «Outline-like conclusions about challenges and future prospects»; ВП:ПРГЕН"
    evidence: "[консенсус]"
  - id: ru-str-positive-finale
    marker_id: COPY-M-STR-05
    group: STR
    level: warning
    pattern: '%B%(?:будущее\s+(?:выглядит|видится)\s+(?:ярким|светлым|многообещающим|радужным)|впереди\s+(?:захватывающие|большие|новые)\s+(?:времена|перспективы|свершения|горизонты)|путь\s+к\s+(?:совершенству|успеху|мечте)|(?:важный|большой)\s+шаг\s+в\s+правильном\s+направлении|продолжа[а-яё]*\s+процветать|открыва[а-яё]*\s+(?:перед\s+[а-яё]+\s+)?(?:новые\s+)?горизонты|покорить\s+новые\s+вершины|вместе\s+мы\s+(?:сможем|добь[её]мся|изменим|сделаем)|ваш\s+успех\s+[—–-]\s+наш[а-яё]*)'
    message: "Позитивный финал-рефлексия без конкретики («будущее выглядит ярким», «вместе мы добьёмся»)."
    replacement: "финал — следующий шаг с условием или последний факт: «Откроем два офиса в 2027 году»"
    examples: {bad: "Будущее выглядит ярким: вместе мы добьёмся большего!", good: "В следующем году откроем два офиса — в Казани и Уфе."}
    source: "гайд Б4 («финал-рефлексия»), Б5; humanizer-ru п.20; WP:AISIGNS"
    evidence: "[консенсус]"
  - id: ru-str-closing-hope
    marker_id: COPY-M-STR-05
    group: STR
    level: warning
    pattern: '%B%надеемся,?\s+(?:что\s+)?(?:наш\s+опыт|эта\s+статья|эта\s+информация|данная\s+информация|материал|подборка|наши\s+советы|статья)\s+(?:будет|окажется|был[аио]?|станет)\s+полезн[а-яё]*'
    message: "Концовка-пожелание «Надеемся, наш опыт окажется полезным»: рамка вместо последнего факта."
    replacement: "закончить на факте или следующем шаге: «Если внедряете CRM, начните с обучения — у нас оно заняло 2 недели»"
    examples: {bad: "Надеемся, что наш опыт окажется полезным для тех, кто только начинает.", good: "Если внедряете CRM, начните с обучения: у нас оно заняло две недели."}
    source: "humanizer-ru eval 8 (рамочные конструкции), п.18, п.31; гайд Б4 (финал-рефлексия)"
    evidence: "[практика]"
  - id: ru-str-inline-header-list
    marker_id: COPY-M-STR-12
    group: STR
    level: info
    lang: any
    flags: ''
    mask_quotes: false
    pattern: '^\s*\*\*[^*\n]{1,40}:\*\*|^\s*\*\*[^*\n]{1,40}\*\*\s*:'
    message: "Пункт в формате «**Заголовок:** текст» — шаблонная разметка чат-бота. Слоп — когда текст пересказывает заголовок («**Скорость:** Скорость…»); жирная подводка у людей тоже бывает (опыт C/02)."
    replacement: "пункт — одной фразой с фактом: «Сдаём за 3 дня»"
    examples: {bad: "**Скорость:** Скорость выполнения превосходит ожидания.", good: "Сдаём за 3 дня."}
    source: "WP:AISIGNS «Inline-header vertical lists»; humanizer-ru п.21; Russell и др. 2025 (гайд экспертов: bold header + colon)"
    evidence: "[консенсус]"
  # --- тон
  - id: ru-ton-fake-candor
    marker_id: COPY-M-TON-02
    group: TON
    level: warning
    pattern: '%B%(?:честно\?|скажу\s+(?:прямо|честно)|давайте\s+начистоту|вот\s+в\s+ч[её]м\s+штука|если\s+по-честному|буду\s+откровен[а-яё]*|признаемся\s+честно|не\s+будем\s+лукавить|положа\s+руку\s+на\s+сердце)'
    message: "Фальшивая доверительность: театральная пауза перед обычной мыслью."
    replacement: "убрать подводку; честность видна по фактам"
    examples: {bad: "Стоит ли оно того? Честно? Зависит от задач.", good: "Окупится ли — зависит от объёма заказов."}
    source: "гайд Б5; humanizer-ru п.29"
    evidence: "[практика]"
  - id: ru-ton-pseudo-therapy
    marker_id: COPY-M-TON-03
    group: TON
    level: warning
    pattern: '%B%(?:и\s+это\s+(?:нормально|окей|ок)|вы\s+не\s+одиноки|позвольте\s+себе|это\s+абсолютно\s+(?:нормально|естественно)|мы\s+понимаем,?\s+как\s+(?:вам\s+)?(?:тяжело|сложно|непросто|важно)|ваши\s+чувства\s+(?:важны|валидны)|давайте\s+признаем)%E%'
    message: "Псевдотерапевтический регистр («и это нормально», «вы не одиноки»): приписывание читателю состояния."
    replacement: "говорить о задаче и фактах, а не о чувствах читателя; в медицине и психологии — по голосу и праву (H)"
    examples: {bad: "Не все успевают следить за рынком. И это нормально.", good: "За рынком не успевает никто: за неделю выходит 40 новинок."}
    source: "гайд Б5; humanizer-ru п.37; ux 07/03 §8.4 (приписывание состояния)"
    evidence: "[практика]"
  - id: ru-ton-hedge-cascade
    marker_id: COPY-M-TON-04
    group: TON
    level: warning
    pattern: '%B%(?:возможно|вероятно|по-видимому|как\s+правило|в\s+некоторых\s+случаях|скорее\s+всего|при\s+определ[её]нных\s+условиях|в\s+определ[её]нной\s+степени|до\s+некоторой\s+степени|потенциально|отчасти|в\s+какой-то\s+мере)%E%[^.!?\n]*?%B%(?:возможно|вероятно|по-видимому|как\s+правило|в\s+некоторых\s+случаях|скорее\s+всего|при\s+определ[её]нных\s+условиях|в\s+определ[её]нной\s+степени|до\s+некоторой\s+степени|потенциально|отчасти|в\s+какой-то\s+мере|может\s+(?:оказать|повлиять|привести))%E%[^.!?\n]*?%B%(?:возможно|вероятно|по-видимому|как\s+правило|в\s+некоторых\s+случаях|скорее\s+всего|при\s+определ[её]нных\s+условиях|в\s+определ[её]нной\s+степени|до\s+некоторой\s+степени|потенциально|отчасти|в\s+какой-то\s+мере|может\s+(?:оказать|повлиять|привести))%E%'
    message: "Каскад смягчений: три и больше в одном предложении."
    replacement: "оставить одно смягчение или дать прямое утверждение с фактом; одно-два «возможно» — норма живой речи"
    examples: {bad: "Возможно, в некоторых случаях это, скорее всего, сработает.", good: "Возможно, это сработает."}
    source: "гайд Б5 («каскад хеджирования, 3+ смягчения»); humanizer-ru п.19 и lint.py SOFTENERS"
    evidence: "[практика]"
  - id: ru-ton-didactic
    marker_id: COPY-M-TON-05
    group: TON
    level: warning
    pattern: '%B%(?:важно\s+(?:отметить|понимать|помнить|учитывать|подчеркнуть)|стоит\s+(?:отметить|подчеркнуть|учесть|помнить|обратить\s+внимание)|следует\s+(?:отметить|подчеркнуть|учитывать|помнить)|необходимо\s+(?:учитывать|отметить|понимать|помнить)|нельзя\s+не\s+(?:упомянуть|отметить|сказать)|особо\s+следует\s+выделить|хотелось\s+бы\s+(?:отметить|подчеркнуть|сказать)|немаловажно|нужно\s+понимать,\s+что)%E%'
    message: "Дидактическая оговорка («важно отметить», «стоит подчеркнуть»): анонс важности вместо самой мысли."
    replacement: "удалить оборот; если мысль важна, её докажет содержание"
    examples: {bad: "Важно отметить, что интеграция занимает 3 дня.", good: "Интеграция занимает 3 дня."}
    source: "гайд Б5, §E п.6; humanizer-ru п.11; WP:AISIGNS «Didactic disclaimers» (историческая для новых моделей EN)"
    evidence: "[консенсус]"
  - id: ru-ton-announce
    marker_id: COPY-M-TON-06
    group: TON
    level: warning
    pattern: '%B%(?:давайте\s+(?:разберёмся|разберемся|посмотрим|поговорим|рассмотрим)|погрузимся\s+в|в\s+(?:этой|данной)\s+(?:статье|заметке|публикации)\s+(?:мы\s+)?(?:рассмотрим|расскажем|разберём|разберем|поговорим|хотели\s+бы)|вот\s+что\s+нужно\s+знать|итак,?\s+начн[её]м|теперь\s+рассмотрим|без\s+лишних\s+слов|перейд[её]м\s+к\s+(?:главному|делу)|рассмотрим\s+подробнее|в\s+данной\s+статье)%E%'
    message: "Анонс вместо дела («давайте разберёмся», «в этой статье мы рассмотрим»)."
    replacement: "сразу сказать суть: первая фраза статьи — ответ или факт"
    examples: {bad: "Давайте разберёмся, как работает кэширование.", good: "Кэш хранит готовые ответы, чтобы не считать одно и то же дважды."}
    source: "гайд Б5; humanizer-ru п.26; AINL-Eval 2025 (промт запрещал начинать с «В данной статье»: модели так начинают по умолчанию)"
    evidence: "[консенсус]"
  - id: ru-ton-sycophancy
    marker_id: COPY-M-TON-07
    group: TON
    level: warning
    pattern: '%B%(?:отличный\s+(?:вопрос|выбор)|вы\s+(?:совершенно|абсолютно)\s+правы|прекрасная\s+(?:мысль|идея)|замечательн[а-яё]*\s+(?:вопрос|наблюдени)[а-яё]*|спасибо\s+за\s+(?:отличный|прекрасный)\s+вопрос)'
    message: "Подобострастие: похвала читателю вместо дела."
    replacement: "убрать; в письме после заказа — сказать, что будет дальше"
    examples: {bad: "Отличный выбор! Вы совершенно правы, что обратились к нам.", good: "Заказ принят: привезём завтра до 12:00."}
    source: "гайд Б5; humanizer-ru п.17; WP:AISIGNS «Collaborative communication»"
    evidence: "[консенсус]"
  - id: ru-ton-meta-commentary
    marker_id: COPY-M-TON-09
    group: TON
    level: warning
    pattern: '%B%(?:без\s+(?:громких\s+слов|лишнего\s+пафоса|пафоса|маркетинговой\s+шелухи|маркетинга)|не\s+будем\s+(?:обещать|хвалить|рассказывать|говорить,\s+что|лукавить)|обещать\s+золотые\s+горы\s+не\s+(?:будем|станем)|как\s+пишут\s+все\s+(?:агентства|компании|конкуренты)|хвалить\s+себя\s+не\s+(?:будем|станем)|никакого\s+маркетинга|просто\s+и\s+честно)'
    message: "Демонстративный отказ от клише («без громких слов», «не будем обещать золотые горы») — тоже клише и примета правки «под человека»."
    replacement: "убрать ремарку и дать факт, ради которого она написана"
    examples: {bad: "Без громких слов: мы просто делаем свою работу.", good: "Мы сделали 214 сайтов для стоматологий."}
    source: "humanizer-ru eval 5 и 10 (meta-commentary-trap: «демонстративный отказ от клише тоже клише»)"
    evidence: "[практика]"
  # --- содержание
  - id: ru-cnt-speculative
    marker_id: COPY-M-CNT-04
    group: CNT
    level: info
    pattern: '%B%(?:информаци[а-яё]*\s+(?:об\s+этом\s+)?(?:ограничена|скудна)|широко\s+не\s+(?:задокументирован|освещ)[а-яё]*|не\s+(?:раскрывается|разглашается|афишируется)\s+(?:публично|в\s+открытых\s+источниках)|предположительно|судя\s+по\s+всему|по\s+всей\s+видимости|предпочитает\s+не\s+афишировать|вероятно,?\s+(?:[а-яё]+\s+){0,2}(?:вырос|выросла|родил|начал|получил|учил|жил|работал|переехал)[а-яё]*)'
    message: "Спекулятивное заполнение пробела: «данных мало, но, вероятно…»."
    replacement: "сказать, чего не знаете, или убрать; догадка, одетая как факт, хуже пробела"
    examples: {bad: "Подробности широко не задокументированы, предположительно компания основана в 2010-х.", good: "Компания основана в 2012 году (ЕГРЮЛ)."}
    source: "humanizer-ru п.32; WP:AISIGNS «Knowledge-cutoff disclaimers and speculation about gaps in sources»; humanizer-ru eval 4"
    evidence: "[консенсус]"
  - id: ru-cnt-perfect-numbers
    marker_id: COPY-M-CNT-03
    group: CNT
    level: warning
    requires_no_fact: true
    pattern: '%B%(?:99[,.]9+\s?%|100\s?%\s+(?:гаранти|результат|качеств|довольн|клиент)[а-яё]*|№\s?1%E%|номер\s+один|в\s+(?:10|100)\s+раз%E%|[xх]\s?10%E%|10[xх]%E%|тысяч[иа]?\s+(?:довольных|счастливых)\s+(?:клиентов|покупателей)|миллион(?:ы|ов)\s+(?:пользователей|клиентов|людей)|сотни\s+(?:довольных|счастливых)\s+клиентов)'
    message: "«Идеальное» или круглое число без источника (99,9 %, 10x, «тысячи довольных клиентов») — выглядит выдуманным."
    replacement: "точное число из facts.yaml с датой; нет факта — [PLACEHOLDER] или убрать"
    examples: {bad: "Тысячи довольных клиентов и 99,9 % аптайма.", good: "214 клиентов на 1 сентября 2026 года."}
