# Маркетинговые шаблоны (группа MKT) — русский. Состав: «ваш надёжный партнёр», «мы не просто…», «больше, чем…»,
# заголовок «X, который Y», универсальные выгоды, шаблонный FAQ, слабые CTA, запрещённые первые фразы Hallmark
# (copy.md «Banned opening lines», MIT) в русской версии. Превосходная степень и «№ 1» — сигнал для права (text 08/01, 38-ФЗ
# ст. 5); механика срочности и дефицита — ux 06/04 и site; здесь — только текст.
date: 2026-09-24
version: 1
owner: text · 06-anti-slop
defaults:
  group: MKT
  lang: ru
  flags: i
  count_as_marker: true
  date: 2026-09-24
  genres: [landing, site-page, article, meta, geo, email-form]
rules:
  - id: ru-mkt-self-praise
    marker_id: COPY-M-MKT-01
    level: warning
    unless: '\d'
    pattern: '%B%(?:ваш\s+(?:надёжн|надежн|верн|лучш)[а-яё]*\s+(?:партн[её]р|помощник|друг|проводник)[а-яё]*|команд[а-яё]*\s+(?:настоящих\s+|опытных\s+|высококлассных\s+)?(?:профессионалов|экспертов|специалистов)|индивидуальн[а-яё]*\s+подход[а-яё]*|широк[а-яё]*\s+(?:спектр|ассортимент|выбор)[а-яё]*\s+(?:услуг|товаров|продукции|решений)|высок[а-яё]*\s+качеств[а-яё]*\s+(?:услуг|работ|продукции|обслуживания)|клиентоориентированн[а-яё]*|многолетн[а-яё]*\s+опыт[а-яё]*|опытн[а-яё]*\s+(?:специалист|мастер|сотрудник)[а-яё]*|квалифицированн[а-яё]*\s+(?:специалист|персонал|сотрудник)[а-яё]*|современн[а-яё]*\s+оборудовани[а-яё]*|работаем\s+на\s+результат|гаранти[а-яё]*\s+качества|одн(?:а|у|ой)\s+из\s+ведущих\s+компаний|динамично\s+развивающ[а-яё]*\s+компани[а-яё]*|по\s+праву\s+счита[а-яё]*|зарекомендовал[а-яё]*\s+себя|над[её]жность\s+и\s+профессионализм|профессионализм\s+и\s+над[её]жность|преданн[а-яё]*\s+своему\s+делу|настоящ[а-яё]*\s+эксперт[а-яё]*\s+своего\s+дела|мы\s+ценим\s+(?:каждого|наших)\s+клиент[а-яё]*|признанн[а-яё]*\s+(?:лидер|эксперт|специалист|мастер|авторитет)[а-яё]*|ведущ[а-яё]*\s+эксперт[а-яё]*|сообществ[а-яё]*\s+(?:профессионалов|единомышленников|экспертов|лидеров))'
    message: "Самопохвала без факта («команда профессионалов», «индивидуальный подход», «ваш надёжный партнёр»): так пишут все."
    replacement: "факт, который отличает: «12 инженеров, у каждого от 5 лет в ремонте квартир» (из facts.yaml); нет факта — удалить"
    examples: {bad: "Команда профессионалов с индивидуальным подходом — ваш надёжный партнёр.", good: "Ремонтируем квартиры в Твери с 2014 года."}
    source: "humanizer-ru eval 2, 10 (О компании, О нас агентства); ux 07/06 §1 («ваш надёжный помощник»); гайд Б1 (пустышки)"
    evidence: "[практика]"
  - id: ru-mkt-more-than
    marker_id: COPY-M-MKT-03
    level: warning
    unless: '\d'
    # фигура позиционирования («Больше, чем кофейня», «Это больше, чем просто сервис»), а не сравнение («больше, чем
    # у конкурентов», «не больше чем у каждой третьей секции», «сделали больше, чем обещали»)
    pattern: '%B%(?:больше,?\s+чем\s+просто\s+[а-яё]+|нечто\s+большее,?\s+чем|(?:(?<=^)|(?<=[.!?]\s)|(?<=это\s)|(?<=—\s))(?:гораздо\s+|намного\s+)?больше,?\s+чем\s+(?!(?:у|в|во|на|за|по|с|со|до|от|при|для|раньше|обычно|кажется|нужно|надо)(?![а-яё]))[а-яё]+)'
    message: "«Больше, чем просто X» — вариант «это не просто X»."
    replacement: "сказать, что именно входит: «В кофейне 30 мест и зона для ноутбуков»"
    examples: {bad: "Это больше, чем просто кофейня.", good: "В кофейне 30 мест и зона для ноутбуков."}
    source: "humanizer-ru п.13; Russell и др. 2025 (Table 12: «it's not about ___ it's about ___»)"
    evidence: "[практика]"
  - id: ru-mkt-headline-which
    marker_id: COPY-M-MKT-04
    level: warning
    requires_no_fact: true               # «Лампа, которая сама подбирает свет» с fact_ids — фактическое придаточное
    slot_types: [headline, subheadline, section-title, card-title, meta-title, og-title, email-subject]
    pattern: '^[^,.!?\n]{2,40},\s+(?:котор[а-яё]*|что)\s+[а-яё]+'
    message: "Заголовок-шаблон «X, который Y» («Сервис, который понимает ваш бизнес»)."
    replacement: "назвать результат или категорию с фактом: «Бухгалтерия для кофеен: зарплата за 10 минут»"
    examples: {bad: "Сервис, который понимает ваш бизнес", good: "Бухгалтерия для кофеен: зарплата за 10 минут"}
    source: "Hallmark copy.md (distribution-default openers); ui 11/01 («Build the future of work»)"
    evidence: "[практика]"
  - id: ru-mkt-universal-benefits
    marker_id: COPY-M-MKT-05
    level: warning
    unless: '\d'
    pattern: '%B%(?:экономьте\s+(?:сво[её]\s+|ваше\s+)?время\s+и\s+(?:деньги|нервы|силы)|сэкономьте\s+(?:сво[её]\s+|ваше\s+)?время|повысьте\s+(?:свою\s+|вашу\s+)?эффективность|увеличьте\s+(?:ваши\s+|свои\s+)?продажи|выведите\s+(?:ваш\s+|свой\s+)?(?:бизнес|продажи|сервис)\s+на\s+новый\s+уровень|на\s+новый\s+уровень|достигайте\s+(?:своих\s+|ваших\s+)?целей|откройте\s+(?:для\s+себя\s+)?новые\s+возможности|оптимизируйте\s+(?:бизнес-)?процессы|масштабируйте\s+(?:свой\s+|ваш\s+)?бизнес|вс[её]\s+в\s+одном\s+месте|решение\s+(?:для\s+)?(?:всех\s+)?ваших\s+(?:задач|проблем)|вс[её],\s+что\s+(?:вам\s+)?нужно|все\s+ваши\s+потребности|инвестируйте\s+в\s+(?:себя|сво[её]\s+будущее|будущее|сво[её]\s+развитие)|вложитесь\s+в\s+себя)'
    message: "Универсальная выгода, подходящая любому продукту («экономьте время и деньги», «выведите бизнес на новый уровень»)."
    replacement: "выгода с числом и механизмом: «сократите приём заявки с 20 до 5 минут»"
    examples: {bad: "Экономьте время и деньги — выведите бизнес на новый уровень!", good: "Сократите приём заявки с 20 до 5 минут."}
    source: "Hallmark copy.md («promises a feeling without naming a feature»); ux 07/06 §1 («всё, что нужно»)"
    evidence: "[практика]"
  - id: ru-mkt-faq-template
    marker_id: COPY-M-MKT-06
    level: warning
    slot_types: [faq-q, section-title, card-title]
    pattern: '^\s*(?:почему\s+(?:стоит\s+)?(?:выбирают|выбрать)\s+(?:именно\s+)?(?:нас|нашу\s+компанию)|почему\s+мы|какие\s+(?:у\s+вас|ваши)\s+преимущества|чем\s+вы\s+отличаетесь\s+от\s+(?:конкурентов|других)|почему\s+(?:вам\s+)?стоит\s+(?:обратиться|работать)\s+(?:к\s+нам|с\s+нами))\s*\??\s*$'
    message: "Шаблонный вопрос FAQ, который задаёт компания, а не клиент."
    replacement: "вопросы — из голоса клиента (voc.yaml): цена, сроки, гарантия, что если не подойдёт"
    examples: {bad: "Почему стоит выбрать именно нас?", good: "Сколько стоит выезд замерщика?"}
    source: "text 02/04 (голос клиента); kb/common/owners.md § Общие правила тройки (FAQ как блок — решает site)"
    evidence: "[практика]"
  - id: ru-mkt-weak-cta
    marker_id: COPY-M-MKT-07
    level: warning
    slot_types: [cta-label, cta-secondary-label, email-cta-label]
    pattern: '^\s*(?:узнать\s+(?:больше|подробнее)|подробнее|отправить|нажмите\s+(?:здесь|сюда)|далее|перейти|кликните|жми(?:те)?|продолжить|читать\s+далее|смотреть)\s*[.!]?\s*$'
    message: "Кнопка без результата («Узнать больше», «Отправить», «Подробнее»)."
    replacement: "глагол + результат: «Получить расчёт за 15 минут», «Записаться на замер»"
    examples: {bad: "Узнать больше", good: "Получить расчёт за 15 минут"}
    source: "ux 07/06 §3.2, §4.1 (Подробнее, Submit, Learn more); Hallmark copy.md «Buttons»"
    evidence: "[консенсус]"
  - id: ru-mkt-generic-cta
    marker_id: COPY-M-MKT-07
    level: info
    slot_types: [cta-label, cta-secondary-label, email-cta-label]
    pattern: '^\s*(?:оставить\s+заявку|отправить\s+заявку|заказать\s+звонок|связаться\s+с\s+нами|записаться|заказать|купить|подать\s+заявку)\s*[.!]?\s*$'
    message: "Действие без результата («Оставить заявку»): законно, но слабее кнопки с результатом."
    replacement: "назвать, что человек получит: «Получить смету», «Записаться на бесплатный замер»"
    examples: {bad: "Оставить заявку", good: "Получить смету за 1 день"}
    source: "ux 07/02 (CTA-матрица); Hallmark copy.md «Specific verbs»; формулы CTA — text 04/01"
    evidence: "[практика]; норма — copy-slots.yaml (cta-label)"
  - id: ru-mkt-banned-openers
    marker_id: COPY-M-MKT-08
    level: warning
    slot_levels: {headline: error, subheadline: error, meta-title: error, meta-description: error, og-title: error, og-description: error, email-subject: error}
    pattern: '%B%(?:созда(?:н|на|но|ны)\s+для\s+современн[а-яё]*\s+(?:команд|бизнес|компани|людей)[а-яё]*|где\s+[а-яё]+\s+встречается\s+с\s+[а-яё]+|переосмысл(?:ите|ить|иваем)\s+(?:то,\s+как|способ|подход|привычн)[а-яё]*|прокачайте\s+(?:свой\s+|ваш\s+)?[а-яё]+|инновационн[а-яё]*\s+решени[а-яё]*|бесшовн[а-яё]*\s+интеграци[а-яё]*|в\s+современном\s+цифровом\s+мире|нового\s+поколения|добро\s+пожаловать\s+в\s+(?:мир|будущее|эпоху)|будущее\s+(?:[а-яё]+\s+)?уже\s+(?:здесь|наступило)|откройте\s+для\s+себя|погрузитесь\s+в\s+(?:мир|атмосферу)|почувствуйте\s+разницу|мы\s+делаем\s+(?:мир|жизнь)\s+лучше|ваш\s+(?:идеальный|надёжный|надежный)\s+[а-яё]+|революци[а-яё]*\s+в\s+(?:мире|сфере|индустрии)\s+[а-яё]+)'
    message: "Запрещённая первая фраза (русская версия списка Hallmark): «Добро пожаловать в мир…», «Инновационные решения», «нового поколения», «Откройте для себя»."
    replacement: "первая строка — конкретика: названное место, дата, вертикаль, число; нет материала — спросить у заказчика одно существительное или глагол"
    examples: {bad: "Добро пожаловать в мир инновационных решений нового поколения", good: "Бухгалтерия для кофеен: зарплата за 10 минут"}
    source: "Hallmark skills/hallmark/references/copy.md «Banned opening lines» (MIT; Built for the modern team, Unleash your [X], Where X meets Y, Empower your…, Reimagine the way you…, Supercharge your workflow, Innovative solutions, Seamless integration, In today's digital landscape, Next-generation) — русские эквиваленты [мнение]"
    evidence: "[практика]; русские эквиваленты [не проверено] частотой"
  - id: ru-mkt-benefit-speak
    marker_id: COPY-M-MKT-09
    level: warning
    pattern: '%B%(?:прокача(?:ть|йте|ем|ет)|трансформир(?:уйте|уем|ует|овать)|революционизир[а-яё]*|переосмысл(?:ите|ить)|(?:вывести|выведет|выводим)\s+на\s+новый\s+уровень|зарядит(?:есь|ься)\s+(?:энергией|мотивацией)|апгрейд(?:ните|ить)?|бустить|бустим|меня(?:ет|ют|ем)\s+правила\s+игры)%E%'
    message: "Глагол-обещание без механизма («прокачайте», «трансформируйте», «выведет на новый уровень»)."
    replacement: "конкретный глагол и объект: «подключите CRM и отвечайте на заявки за 5 минут»"
    examples: {bad: "Прокачайте продажи и трансформируйте бизнес.", good: "Подключите CRM и отвечайте на заявки за 5 минут."}
    source: "Gesso benefit-speak (elevate, supercharge, streamline, empower, unleash…); impeccable marketing-buzzword; русские эквиваленты [мнение]"
    evidence: "[практика]"
  - id: ru-mkt-superlatives
    marker_id: COPY-M-MKT-10
    level: warning
    requires_no_fact: true
    count_as_marker: false
    pattern: '%B%(?:лучш(?:ий|ая|ее|ие|его|ую|им|ей|их)(?!\s+(?:из|способ\s+проверить))|сам(?:ый|ая|ое|ые|ого|ую|ых)\s+(?:лучш|над[её]жн|быстр|выгодн|низк|качественн|популярн|крупн|известн|дешёв|дешев)[а-яё]*|№\s?1%E%|номер\s+один|лидер[а-яё]*\s+(?:рынка|отрасли|продаж)|непревзойд[её]нн[а-яё]*|не\s+имеющ[а-яё]*\s+аналогов|единственн[а-яё]*\s+(?:в|на)\s+(?:России|рынке|мире|стране)|перв(?:ые|ый|ая)\s+(?:в|на)\s+(?:России|рынке|мире|стране)|гарантир(?:уем|ованный)\s+(?:результат|успех|доход|100))'
    message: "Превосходная степень или «№ 1» без подтверждения — примета пустой рекламы; право — COPY-L-SUP-01 (claims-rules.yaml)."
    replacement: "критерий и источник из facts.yaml («№ 1 по числу отзывов на Яндекс Картах в Твери, сентябрь 2026») или убрать"
    examples: {bad: "Лучший сервис в городе и лидер рынка.", good: "Сервис с рейтингом 4,8 на Яндекс Картах."}
    source: "38-ФЗ ст. 5 (text 08/01); WP:AISIGNS (новые модели избегают «the best» — превосходная степень не примета ИИ, а риск права)"
    evidence: "[стандарт] для права — text 08/01; как примета слопа [спорно]"
  - id: ru-mkt-label-headings
    marker_id: COPY-M-MKT-11
    level: warning
    genres: [landing]
    slot_types: [section-title]
    pattern: '^\s*(?:наши\s+(?:преимущества|услуги|клиенты|партн[её]ры|работы|проекты|ценности|специалисты|сотрудники|возможности|кейсы)|почему\s+(?:выбирают\s+)?(?:нас|мы)|преимущества(?:\s+работы\s+с\s+нами)?|возможности|о\s+(?:нас|компании)|как\s+мы\s+работаем|отзывы(?:\s+(?:наших\s+)?клиентов)?|наша\s+команда|часто\s+задаваемые\s+вопросы|faq|портфолио)\s*[.!?]?\s*$'
    message: "Заголовок-ярлык секции лендинга («Наши преимущества», «Почему мы»): говорит, что в секции, но не что вы утверждаете. Сканер читает только заголовки — они должны складываться в сюжет."
    replacement: "заголовок-утверждение: «Сдаём объект за 30 дней — или платим неустойку»; в навигации многостраничника ярлык законен"
    note: "конвенции «Частые вопросы», «Вопросы и ответы», «Контакты» — вне шаблона (CONTRADICTIONS X24)"
    examples: {bad: "Наши преимущества", good: "Сдаём объект за 30 дней"}
    source: "06-anti-slop/01 §10 (outline-тест на лендинге инвертирован: заголовки складываются в сюжет); ux 07/06 §3.2 (гиперонимы); поправка к ux 07/06 §3.2 (в навигации — конвенция)"
    evidence: "[практика]"
  - id: ru-mkt-false-urgency
    marker_id: COPY-M-MKT-12
    level: warning
    requires_no_fact: true
    unless: '\d{1,2}\s+(?:январ|феврал|март|апрел|ма[йя]|июн|июл|август|сентябр|октябр|ноябр|декабр)|\d{1,2}\.\d{1,2}|до\s+\d'
    pattern: '%B%(?:успейте|спешите|торопитесь|не\s+упустите\s+(?:[а-яё]+\s+)?(?:шанс|возможность)|уникальн[а-яё]*\s+(?:возможност|шанс|предложени)[а-яё]*|только\s+сегодня|предложение\s+ограничено|последний\s+шанс|акция\s+(?:заканчивается|скоро\s+закончится)|осталось\s+(?:совсем\s+)?мало|пока\s+не\s+поздно)%E%'
    message: "Срочность словами без срока и данных («Успейте!», «Предложение ограничено»)."
    replacement: "реальная дата или число из facts.yaml: «Скидка 30 % до 30 сентября»; нет срока — убрать"
    examples: {bad: "Успейте! Предложение ограничено.", good: "Скидка 30 % действует до 30 сентября."}
    source: "ux 06/04 §8.1 (ложная срочность — канон); humanizer-ru eval 12 (пуш «Не упустите уникальную возможность»); механика — site"
    evidence: "[консенсус]"
  - id: ru-mkt-feeling-promise
    marker_id: COPY-M-MKT-13
    level: warning
    pattern: '%B%(?:почувствуйте\s+(?:разницу|свободу|магию|себя)|ощутите\s+(?:разницу|магию|вкус)|магия\s+[а-яё]+|вау-эффект|незабываем[а-яё]*\s+эмоци[а-яё]*|море\s+(?:эмоций|впечатлений|позитива)|влюбит(?:есь|ся)\s+с\s+первого|вы\s+(?:обязательно\s+)?полюбите|испытайте\s+(?:силу|мощь|магию))'
    message: "Обещание чувства без механизма («почувствуйте разницу», «вы полюбите»)."
    replacement: "назвать свойство, из которого чувство следует: «обжариваем по средам, продаём до субботы»"
    examples: {bad: "Почувствуйте разницу — вы обязательно полюбите наш кофе.", good: "Обжариваем зерно по средам, продаём до субботы."}
    source: "Hallmark copy.md («Marketing copy that promises a feeling without naming a feature»); Gesso benefit-speak"
    evidence: "[практика]"
  - id: ru-mkt-welcome
    marker_id: COPY-M-MKT-14
    level: warning
    genres: [landing, site-page, article, meta, geo]
