    entities: [company-grafa]
    source: {type: contract, who: "заказчик", where: "типовой договор, п. 4.2", date: "2026-01-20", document: "dogovor-grafa-2026.pdf, п. 4.2", quote: "Исполнитель отвечает на вопросы Заказчика в рабочие дни с 9:00 до 18:00 (мск) в течение 2 рабочих часов", derivation: direct}
    verification: {status: verified, by: "редактор (демо)", date: "2026-09-18"}
    permission: {status: not-required}
    use: {section_roles: [hero, benefits, faq], slot_types: [subheadline, card-body, faq-a, cta-note], requires_nearby: "«рабочих часов»"}
    translations:
      en: {canonical: "Grafa answers client questions within 2 business hours on business days, 9:00–18:00 Moscow time (contract, clause 4.2).", note: "адаптация"}
    lang: ru

