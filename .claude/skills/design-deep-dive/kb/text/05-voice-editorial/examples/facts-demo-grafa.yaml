      - "За 7 дней до срока — письмо с суммой"
    canonical: "За 7 календарных дней до срока уплаты налога или сдачи отчёта «Графа» присылает клиенту письмо с суммой и сроком (регламент обслуживания, п. 3.4)."
    values:
      - {value: 7, unit: days, what: "за сколько дней до срока приходит письмо", qualifier: "календарных"}
    entities: [company-grafa]
    source: {type: customer-document, who: "заказчик", where: "регламент обслуживания, п. 3.4", date: "2026-01-20", document: "reglament-2026.pdf", quote: "За 7 календарных дней (за неделю) до срока уплаты налога или сдачи отчёта Исполнитель направляет Заказчику письмо: что платить, сколько и до какой даты", derivation: direct}
    verification: {status: verified, by: "редактор (демо)", date: "2026-09-18"}
    permission: {status: not-required}
    use: {section_roles: [hero, benefits, how-it-works, faq], slot_types: [headline, subheadline, card-title, card-body, step-body, faq-a]}
    translations:
      en: {canonical: "Seven calendar days before every tax payment or filing deadline, Grafa emails the client the amount and the due date (service regulations, clause 3.4).", note: "адаптация"}
    lang: ru

