# facts-demo-grafa.yaml — ДЕМО-ФАКТЫ для примера голоса «сдержанный B2B» (05-voice-editorial/examples/voice-grafa-b2b.yaml)
# формат: ../../02-strategy-messaging/facts.schema.yaml (facts_version 1)
#
# ВЫМЫШЛЕННАЯ компания «Графа» (бухгалтерское сопровождение ООО и ИП, Екатеринбург, работа удалённо) и синтетические
# данные: числа, имена, документы и ссылки — для примера голоса, не для публикации. Совпадения с реальными компаниями
# случайны. Факты — по образцу ../../02-strategy-messaging/examples/facts-service-renovation.yaml; проверка —
# validate_voice.py и `claims_check.py lint-facts`.
# Зачем: у базы нет B2B-набора фактов («Отвес» и «Кварц» — услуга и предзаказ), а образцы строк голоса обязаны
# опираться на факты.

facts_version: 1
date: "2026-09-24"
site: grafa-buh-demo
lang: ru
jurisdiction: ru
status: draft
owner: {role: "директор (заказчик, вымышленный)"}
collected_by: "агент F по анкете proof-intake.md (демо)"
