# voice-grafa-b2b.yaml — пример 1 из 3: сдержанный B2B (бухгалтерия на аутсорсе для ООО и ИП; лидогенерация услуги)
# text-research · F · 2026-09-24 · формат: ../voice.schema.yaml (voice_version 1)
#
# Бренд «Графа» — ВЫМЫШЛЕННАЯ компания; ДЕМО-факты — ../../99-raw/experiments/F/04-voice-samples/facts-demo-grafa.yaml
# (написал агент F по формату B2: у базы не было B2B-набора). Образцы строк — ai-self, прошли claims_check.py и
# copy_lint.py: 99-raw/experiments/F/04-voice-samples/README.md.
# Что показывает пример: голос для предмета с высокой ценой ошибки (деньги, налоги) и незнакомого бренда — формальнее
# середины (Gretry 2017: неформальность снижает доверие к незнакомым брендам), без юмора и эмодзи; факт + условие вместо
# «надёжности»; ключевое слово «заранее» опирается на факт, а не на слова отзыва; английский — адаптация для иностранных
# владельцев российских ООО (пояснить УСН и 1С), а не перевод.

voice_version: 1
date: "2026-09-24"
status: draft
voice_id: grafa-b2b

brand:
  name: "Графа"
  site: grafa-buh-demo
  category: "бухгалтерия на аутсорсе для ООО и ИП"
  facts_ref: "../../99-raw/experiments/F/04-voice-samples/facts-demo-grafa.yaml"

scope:
  genres: [landing, site-page, email-form, article, meta]
  surfaces:
    - {surface: marketing-site, voice: brand}
    - {surface: blog, voice: brand, note: "статьи о налогах — функциональный текст (Сарычева): ответ первым, термин с пояснением"}
    - {surface: lead-emails, voice: brand}
    - {surface: transactional-emails, voice: product, note: "письма-напоминания о сроках — «робот»: сумма, срок, что сделать"}
    - {surface: product-ui, voice: product, note: "личный кабинет — голос продукта (ux 07/01 §6–8), тот же словарь терминов"}
    - {surface: legal, voice: neutral-legal}

derived_from:
  purpose: "Снять с владельца малого бизнеса бухгалтерию и отчётность так, чтобы о налогах и сроках он узнавал заранее, а не из блокировки счёта."
  audience: "Владельцы ООО и ИП на УСН без своего бухгалтера; боятся штрафов и блокировки счёта, в налоговых терминах разбираются частично. Решение про деньги и ответственность — цена ошибки высокая."
  subject_risk: high
  brand_familiarity: unknown
  category_norms: "«Команда профессионалов», «индивидуальный подход», «полный спектр бухгалтерских услуг», «надёжность и конфиденциальность»; цена «по запросу»."
  differs_from_competitors: "Называем срок, сумму и пункт договора; объясняем налоговые слова один раз и по-человечески; не пугаем штрафами."
  brief_adjectives: ["надёжные", "профессиональные", "современные"]
  basis:
    - {kind: brief, ref: "демо-бриф агента F: бухгалтерия для ООО и ИП на УСН, удалённо"}
    - {kind: voc, ref: "fact:review-dmitry-k — «Раньше про требования налоговой я узнавал от банка — когда счёт уже блокировали»"}
    - {kind: inferred, ref: "цена ошибки и незнакомость бренда → формальнее середины (ux 07/01 §7.2; Gretry 2017)"}
    - {kind: assumption, ref: "прилагательные брифа «надёжные, профессиональные, современные»", question_id: q-adjectives}

summary: >-
  «Графа» говорит как главный бухгалтер, которому доверили деньги: спокойно, точно и заранее. Сначала — что нужно сделать
  и к какому сроку, потом — почему. Называем пункт договора, сумму и дату вместо «надёжности» и «профессионализма».
  Налоговые слова объясняем один раз и простыми словами. Не пугаем штрафами и не шутим о деньгах клиента.

key_phrase:
  ru: "заранее"
  en: "ahead of time"
  rule: "в hero и финальном призыве; только рядом с фактом о напоминаниях за 7 дней (fact:deadline-reminders)"
  basis: {kind: voc, ref: "fact:review-dmitry-k — «Теперь узнаю за неделю»; держится на fact:deadline-reminders, а не на отзыве"}

principles:
  - id: facts-not-adjectives
    name: "Факты вместо оценок"
    why: "Категория говорит «надёжно и профессионально»; доверие в B2B держится на проверяемом (NN/g: доверие объясняет 52 % желания рекомендовать)."
    execution:
      - "В каждом блоке — хотя бы одно проверяемое: срок, сумма, пункт договора, число из facts.yaml"
      - "«Надёжный», «профессиональный», «качественный», «индивидуальный подход» не пишем: вместо них — условие договора"
      - "Условие стоит в той же строке, что обещание: «из-за ошибки нашего бухгалтера», «в рабочие дни»"
    is_not: "Не справка: голый факт («Пункт 6.3») без того, что он значит для клиента, — это выписка, а не довод."
    do: ["Штраф из-за ошибки нашего бухгалтера оплачиваем мы — пункт 6.3 договора."]
    dont: ["Гарантируем надёжность и высокое качество услуг."]
    checked_by: [claims_check, copy_lint, judge]
  - id: what-first-then-why
    name: "Сначала что и к какому сроку, потом почему"
    why: "Владелец бизнеса читает, чтобы решить и сделать (функциональный текст — Сарычева [V:XuQQwB7R-Os 10:28])."
    execution:
      - "Первое предложение блока — действие или результат со сроком или суммой"
      - "Предложения 8–20 слов; одно предложение — одна мысль; без парцелляции («Быстро. Чётко. В срок.»)"
      - "Вопрос в заголовке — только в FAQ, и ответ начинается с сути («Переход занимает 10 рабочих дней»)"
    is_not: "Не телеграф: рубленые фразы без связок — та же сухость, только модная (сверхкоррекция, C)."
    do: ["Переход занимает 10 рабочих дней: принимаем базу 1С и документы, сверяем остатки."]
    dont: ["Переход? Легко. Быстро. Без стресса."]
    checked_by: [copy_lint, judge]
  - id: calm-about-money
    name: "Спокойно о деньгах и налогах"
    why: "Страх — не довод: «штрафы до 100 000 ₽!» нормализует проблему и приписывает читателю беспомощность (Чалдини; Ильяхов «читатель в порядке»)."
    execution:
      - "Не пугаем суммами штрафов: пишем, что делаем, чтобы штрафа не было, и что будет, если ошибёмся мы"
      - "Неприятная ситуация — о постороннем или безлично («если налоговая пришлёт требование…»), не «вы нарушили» (Т—Ж 3.8)"
      - "Без восклицательных знаков, эмодзи и капса"
    is_not: "Не безразлично: сочувствие — действием и сроком, а не «понимаем, как вам тяжело»."
    do: ["Если налоговая пришлёт требование, ответим на него за вас — [PLACEHOLDER: срок ответа на требование]."]
    dont: ["Штрафы до 100 000 ₽ и блокировка счёта! Не рискуйте!"]
    checked_by: [copy_lint, judge]
  - id: terms-once
    name: "Термин — один раз и по-человечески"
    why: "Простой язык нужен и экспертам (NN/g 2017; GOV.UK: «people with higher levels of literacy prefer plain English»)."
    execution:
      - "Налоговый термин при первом упоминании поясняем: «УСН — упрощённая система налогообложения»"
      - "Без пояснения — только ИП, ООО, НДС и названия отчётов, которые владелец видит в письмах налоговой"
    is_not: "Не ликбез: не объясняем то, что знает любой владелец ООО («что такое налог»), — «читатель в порядке»."
    do: ["ИП на УСН (упрощённой системе налогообложения) без сотрудников — от 6 500 ₽ в месяц."]
    dont: ["Осуществляем ведение учёта по УСН, ОСНО, ЕНВД, ПСН, АУСН."]
    checked_by: [judge, human]

pairs:
  - {we_are: "по делу", we_are_not: "сухо, как справочник", why: "факт + что он значит для клиента"}
  - {we_are: "точно", we_are_not: "канцелярски («осуществляем ведение учёта»)", why: "точность — в числах и условиях, а не в оборотах"}
  - {we_are: "спокойно", we_are_not: "безразлично", why: "сочувствие — действием и сроком"}
  - {we_are: "уверенно — срок и пункт договора", we_are_not: "самоуверенно («с нами не будет проверок» — never_claim)", why: "никто не может обещать отсутствие проверок"}
  - {we_are: "вежливо, на «вы»", we_are_not: "подобострастно («Уважаемый клиент! Благодарим за выбор…»)", why: "уважение — смыслом, а не заглавной «Вы» (Контур)"}

axes:
  formality: {point: 2, note: "вежливо и нейтрально: «вы» со строчной, без разговорных слов и сокращений, но и без канцелярита"}
  humor: {point: 1, note: "юмора нет: деньги и ответственность"}
  respect: {point: 1, note: "уважительно к предмету и читателю"}
  enthusiasm: {point: 2, note: "по фактам; ни одного восклицания"}

tone_words:
  do: [professional, trustworthy, informative, frank]
  dont: [cheerful, playful, sarcastic, provocative]

address:
  ru_form: vy
  capital_vy: false
  self_reference: mixed
  en_form: you

vocabulary:
  use:
    - {term: "ведём бухгалтерию", instead_of: "осуществляем бухгалтерское сопровождение", why: "глагол вместо отглагольного существительного"}
    - {term: "сдаём отчётность, считаем налоги", why: "что именно делаем"}
    - {term: "требование налоговой", why: "так клиент называет письмо, которого боится (fact:review-dmitry-k)"}
    - {term: "заранее, за неделю", why: "ключевое слово бренда — только с fact:deadline-reminders"}
    - {term: "пункт договора", why: "обещание привязано к документу"}
  avoid:
    - {term: "команд* профессионалов", use_instead: "имя главного бухгалтера и стаж (fact:accountant-chernova)", reason: "медиана категории", level: warning}
    - {term: "индивидуальн* подход*", use_instead: "что именно настраиваем под компанию — фактом", reason: "пустой штамп", level: warning}
    - {term: "надёжн*", unless: "в отзыве клиента в кавычках", use_instead: "условие договора (п. 6.3) или страховка ответственности", reason: "оценка без факта", level: warning}
    - {term: "профессионализм*", use_instead: "стаж, число клиентов, пункт договора", reason: "оценка без факта", level: warning}
    - {term: "полн* спектр*", use_instead: "перечислить услуги", reason: "штамп категории", level: warning}
    - {term: "осуществля*", use_instead: "глагол действия: ведём, сдаём, считаем", reason: "канцелярит", level: warning}
    - {term: "уважаем* клиент*", use_instead: "обращение по имени в письме или без обращения", reason: "подобострастие (пара «вежливо / подобострастно»)", level: warning}
    - {term: "оптимизац* налог*", use_instead: "не обещаем экономию на налогах", reason: "never_claim:nc-tax-savings", level: error}
    - {term: "не будет проверок", use_instead: "что делаем, если придёт требование", reason: "never_claim:nc-no-audits", level: error}
    - {term: "спешите", use_instead: "срок из факта, если он есть", reason: "ложная срочность", level: warning}
  use_with_care:
    - {term: "аутсорсинг, аутсорс", condition: "в title, мета и заголовке SEO-страницы (слово запроса — G); в тексте — «ведём бухгалтерию»"}
    - {term: "сопровождение", condition: "только в названии тарифа; в тексте — глаголы"}
    - {term: "бесплатно", condition: "рядом — что именно бесплатно («расчёт стоимости») (H: COPY-L-FREE-01)"}
  spellings:
    - {preferred: "1С", variants: ["1C", "1-С", "1с"], lang: ru, note: "кириллическая «С»"}
    - {preferred: "УСН", variants: ["упрощёнка", "упрощенка"], lang: ru, note: "разговорное — только в цитате клиента"}
    - {preferred: "ИП", variants: ["И.П."], lang: ru}
  category_name: {ru: "бухгалтерия на аутсорсе для ООО и ИП", en: "outsourced bookkeeping for Russian LLCs and sole proprietors"}

punctuation:
  emoji: {policy: never}
  exclamation: {policy: never}
  rhetorical_questions: faq-only
  caps: never
  dash: grammar

humor:
  level: none
  forms: []
  allowed_in: []
  never_in: [hero, pricing, pricing-terms, guarantee, legal, form-consent, complaint-response, faq, objections, lead-email, reminder-email]
  note: "Юмора нет: предмет — деньги и ответственность перед налоговой; незнакомому бренду шутка стоит доверия (Eisend 2009; NN/g, страховка)."

tone_map:
  - {situation: hero, rules: ["что делаем + главное условие (напоминание за 7 дней); без эпитетов"]}
  - {situation: pricing-terms, rules: ["цена «от» + для кого (ИП на УСН без сотрудников) + что не входит; порядок оплаты — [PLACEHOLDER], пока нет факта"]}
  - {situation: guarantee, rules: ["обещание + условие + пункт договора в одной строке"]}
  - {situation: reminder-email, axes_delta: {formality: -1}, rules: ["тема письма: налог, сумма, срок; тело — что сделать и до какого числа; без приветствий до сути"]}
  - {situation: complaint-response, rules: ["признать, что случилось, назвать шаг и срок; ответственность — по п. 6.3, если ошибка наша"]}

taboos:
  - {id: fear-appeal, what: "страх как рычаг: «штрафы до…!», «заблокируют счёт!»", why: "нормализует проблему и приписывает читателю беспомощность"}
  - {id: tax-savings, what: "обещания сэкономить на налогах", why: "прогноз без основания", refs: ["never_claim:nc-tax-savings"]}
  - {id: no-audits, what: "обещание, что проверок и штрафов не будет", why: "не зависит от исполнителя", refs: ["never_claim:nc-no-audits"]}
  - {id: jokes-about-tax-office, what: "шутки о налоговой и о деньгах клиента", why: "humor.level: none"}

claims_boundaries_ref: "../../99-raw/experiments/F/04-voice-samples/facts-demo-grafa.yaml#never_claim"

