    „Графа“». Сначала что сделать и к какому сроку, потом почему. В каждом блоке — проверяемое из facts.yaml: срок, сумма,
    пункт договора; условие — в той же строке. Налоговый термин поясняем при первом упоминании. Нельзя: «надёжный»,
    «профессиональный», «индивидуальный подход», «полный спектр», страх штрафами, обещания экономии на налогах и
    «проверок не будет». Юмора, эмодзи, восклицаний и капса нет. Нет факта — [PLACEHOLDER].

