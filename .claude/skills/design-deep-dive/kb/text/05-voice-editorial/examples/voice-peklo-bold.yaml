style_sheet:
  yo: always
  numbers: digits
  currency: "₽"
  company_names: as-they-write
  product_names:
    - {name: "«Пекло № 3»", rule: "в кавычках, «№» с неразрывным пробелом; бренд без номера — «Пекло», склоняется («в „Пекле“»)"}
  terms:
    - {term: "SHU", definition: "единицы по шкале Сковилла — при первом упоминании на странице пояснить", not: ["градусы остроты"]}
    - {term: "шкала «Пекла»", definition: "своя шкала остроты бренда 1–5 на этикетке", not: ["рейтинг", "уровень опасности"]}

lint:
  base_profile: landing
  level_overrides:
    ru-pun-emoji-body: "off"
  address_rule: true

projections:
  tone_of_voice: "На «вы», коротко и дерзко: острота числом (SHU и своя шкала 1–5), ирония над категорией, не над читателем. Без медицины, мачизма и «!» в заголовках."
  brand_voice:
    tone: "повар, который сам варит соус: коротко, смешно, с цифрой в кармане"
    use: ["острота", "SHU", "по нашей шкале", "варка", "капля"]
    avoid: ["взрыв вкуса", "огненный", "незабываемый", "полезно", "не для слабаков", "настоящие мужчины"]
  prompt_brief: >-
    Голос «Пекла»: повар, который сам варит соус. На «вы», о себе — «мы». Коротко: заголовок и кнопка 2–9 слов, в прозе
    короткое чередуем с длинным. Острота — числом из facts.yaml (120 000 SHU по замеру лаборатории, 3 из 5 по нашей
    шкале), не эпитетом. Одна шутка на блок, над категорией или над собой, рядом — факт. Нельзя: польза и здоровье,
    «самый острый», «не для слабаков», «для настоящих мужчин», алкоголь, «осталось N». Эмодзи — только в прозе писем и
    подвала, не больше одного. «!» — не больше одного на страницу, не в заголовке и цене. Нет факта — [PLACEHOLDER].

