    entities: [brand-peklo, person-kim, city-krasnodar]
    source: {type: interview, who: "Артём Ким (основатель)", where: "интервью для страницы «О нас», запись (демо)", date: "2026-09-08", quote: "Первый соус Артём сварил в 2019 году для персонала своего ресторана, ещё без названия. С 2023 года соусы продаются на фермерских рынках Краснодара, по субботам", derivation: direct}
    verification: {status: stated, date: "2026-09-18", method: "со слов основателя; договор аренды места на рынке — по запросу"}
    permission: {status: not-required}
    use: {section_roles: [about, hero], slot_types: [body, card-body, email-body]}
    notes: "Факт-история (история основателя): каждое предложение истории — отдельная выдержка из интервью; отдельного вида «история» нет — решение F (03 §3)."
    lang: ru

missing:
