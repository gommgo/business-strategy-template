      - {value: 3, unit: days, what: "минимальный срок доставки", comparator: gte, qualifier: "зависит от города"}
    entities: [brand-peklo]
    source: {type: customer-document, who: "заказчик", where: "условия доставки", date: "2026-09-10", document: "delivery-terms-2026.pdf", quote: "Доставка по России — от 3 дней, срок зависит от города", derivation: direct}
    verification: {status: verified, by: "редактор (демо)", date: "2026-09-18"}
    permission: {status: not-required}
    use: {section_roles: [pricing, faq, final-cta], slot_types: [cta-note, pricing-price-note, faq-a], requires_nearby: "«срок зависит от города» или ссылка на условия доставки"}
    lang: ru

  - id: made-in-krasnodar
    kind: property
    claim_class: [origin]
    verbatim:
      - "Варим в Краснодаре"
      - "сварено в Краснодаре"
    canonical: "Соусы «Пекло» производят в Краснодаре (адрес производства — в декларации о соответствии)."
    entities: [brand-peklo, city-krasnodar]
    source: {type: registry, who: "реестр деклараций о соответствии (демо)", where: "декларация ЕАЭС N RU Д-RU.DEMO", date: "2026-09-01", document: "deklaraciya-demo.pdf", quote: "Адрес места осуществления деятельности по изготовлению продукции: г. Краснодар; варим в Краснодаре", derivation: direct}
    verification: {status: verified, by: "редактор (демо)", date: "2026-09-18"}
    permission: {status: not-required}
    use: {section_roles: [about, footer, hero, benefits], slot_types: [footer-tagline, body, card-body, eyebrow]}
    translations:
      en: {canonical: "Peklo sauces are made in Krasnodar, Russia.", note: "адаптация"}
