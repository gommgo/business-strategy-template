      - {value: 100, unit: ml, what: "объём бутылки"}
    entities: [product-peklo-3]
    source: {type: customer-document, who: "заказчик", where: "прайс запуска", date: "2026-09-10", document: "price-launch-2026.pdf", quote: "«Пекло № 3», 100 мл — 590 руб.", derivation: direct}
    verification: {status: verified, by: "редактор (демо)", date: "2026-09-18"}
    permission: {status: not-required}
    use: {section_roles: [hero, pricing, final-cta], slot_types: [subheadline, pricing-price, pricing-price-note, cta-note, cta-label, email-subject]}
    valid: {from: "2026-10-01", until: "2026-12-31", review_by: "2026-12-01"}
    translations:
      en: {canonical: "A 100 ml bottle of Peklo No. 3 costs ₽590 (launch price, autumn 2026).", note: "адаптация"}
    lang: ru

  - id: launch-date
    kind: date
    claim_class: [purchase-terms]
    verbatim:
