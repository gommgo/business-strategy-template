# facts-demo-peklo.yaml — ДЕМО-ФАКТЫ для примера голоса «дерзкий потребительский, кампания L2» (05-voice-editorial/examples/voice-peklo-bold.yaml)
# формат: ../../02-strategy-messaging/facts.schema.yaml (facts_version 1)
#
# ВЫМЫШЛЕННЫЙ бренд острых соусов «Пекло» (D2C, запуск линейки осенью 2026, Краснодар) и синтетические данные: числа,
# имена, документы — для примера голоса, не для публикации. Совпадения с реальными брендами случайны. Проверка —
# validate_voice.py и `claims_check.py lint-facts`.
# Зачем: дерзкий голос нужно показать на фактах — дерзость меняет подачу, а не числа (урок «Кварца»).
# Вымышленный бриф бренда (демо, заказчиком считается он): «дерзкие, смешные, честные про остроту; не для всех — и это
# нормально»; аудитория — 20–35 лет, любят острое, готовят дома; альтернатива — «острые» соусы из супермаркета.

facts_version: 1
date: "2026-09-24"
site: peklo-demo
lang: ru
jurisdiction: ru
status: draft
owner: {role: "основатель (заказчик, вымышленный)"}
collected_by: "агент F по анкете proof-intake.md (демо)"
never_claim_defaults: ru-default-1

entities:
  - {id: brand-peklo, type: company, names: ["«Пекло»", "Пекло", "Peklo"]}
  - {id: product-peklo-3, type: product, names: ["«Пекло № 3»", "Пекло № 3", "№ 3", "Peklo No. 3"]}
  - {id: city-krasnodar, type: place, names: ["Краснодар", "Краснодаре", "Krasnodar"]}
  - {id: person-kim, type: person, names: ["Артём Ким", "Артём", "Artyom Kim", "Artyom"], fact_id: founder-kim}
  - {id: scale-scoville, type: other, names: ["шкала Сковилла", "Сковилл", "Сковилла", "Сковиллу", "Scoville"], note: "название шкалы остроты (SHU), не компания"}

facts:
  - id: heat-shu-no3
    kind: metric
    claim_class: [fact-number]
    verbatim:
      - "120 000 SHU по замеру лаборатории"
      - "120 000 единиц по шкале Сковилла"
      - "Острота — 120 000 SHU"
    canonical: "Острота соуса «Пекло № 3» — 120 000 единиц по шкале Сковилла (SHU), по протоколу испытаний лаборатории от 5 сентября 2026 года."
    values:
      - {value: 120000, unit: SHU, what: "острота соуса № 3"}
    entities: [product-peklo-3]
    source: {type: research, who: "испытательная лаборатория (демо)", where: "протокол испытаний № 118-П", date: "2026-09-05", document: "protokol-118-p-demo.pdf", quote: "Острота образца «Пекло № 3» — 120 000 SHU (метод ВЭЖХ); 120 000 единиц по шкале Сковилла по замеру лаборатории", derivation: direct}
    verification: {status: verified, by: "редактор (демо)", date: "2026-09-18"}
    permission: {status: not-required}
    use: {section_roles: [hero, benefits, product-demo, specs, faq], slot_types: [subheadline, hero-proof, card-title, card-body, spec-row, faq-a, email-body]}
    translations:
      en: {canonical: "Peklo No. 3 measures 120,000 Scoville heat units (SHU), per a lab test report dated 5 September 2026.", note: "адаптация"}
    lang: ru

  - id: house-scale-no3
    kind: property
    claim_class: [fact-property, fact-number]
    verbatim:
      - "3 из 5 по нашей шкале остроты"
      - "острота 3 из 5 — по шкале «Пекла»"
    canonical: "На этикетке «Пекла № 3» острота обозначена как 3 из 5 по собственной шкале бренда."
    values:
      - {value: 3, unit: points, scale: 5, what: "острота по шкале бренда"}
    entities: [product-peklo-3, brand-peklo]
    source: {type: customer-document, who: "заказчик", where: "макет этикетки № 3", date: "2026-08-30", document: "label-no3-v4.pdf", quote: "Острота: 3 из 5 по нашей шкале остроты", derivation: direct}
    verification: {status: verified, by: "редактор (демо)", date: "2026-09-18"}
    permission: {status: not-required}
    use: {section_roles: [hero, benefits, product-demo, specs, faq], slot_types: [hero-proof, card-title, card-body, spec-row, faq-a, badge]}
    notes: "Своя шкала бренда — не рейтинг третьей стороны: рядом слова «по нашей шкале»."
    lang: ru

  - id: ingredients-no3
    kind: property
    claim_class: [fact-property]
    verbatim:
      - "Хабанеро, копчёная паприка, морковь, чеснок, яблочный уксус и соль"
      - "6 ингредиентов, без сахара"
      - "без сахара"
    canonical: "Состав «Пекла № 3»: перец хабанеро, копчёная паприка, морковь, чеснок, яблочный уксус, соль — 6 ингредиентов, сахара в составе нет."
    values:
      - {value: 6, unit: pcs, what: "ингредиенты в составе"}
    entities: [product-peklo-3]
    source: {type: customer-document, who: "заказчик", where: "технические условия и этикетка № 3", date: "2026-08-30", document: "tu-peklo-2026.pdf; label-no3-v4.pdf", quote: "Состав: перец хабанеро, копчёная паприка, морковь, чеснок, яблочный уксус, соль (6 ингредиентов, без сахара)", derivation: direct}
    verification: {status: verified, by: "редактор (демо)", date: "2026-09-18"}
    permission: {status: not-required}
    use: {section_roles: [hero, benefits, product-demo, specs, faq], slot_types: [subheadline, card-title, card-body, spec-row, faq-a, list-item]}
    translations:
      en: {canonical: "Peklo No. 3 has 6 ingredients: habanero, smoked paprika, carrot, garlic, apple cider vinegar and salt; no sugar.", note: "адаптация"}
    lang: ru

  - id: price-no3
    kind: price
    claim_class: [price-discount]
    verbatim:
