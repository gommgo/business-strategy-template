    entities: [product-peklo-3]
    source: {type: customer-message, who: "заказчик (основатель)", where: "план запуска", date: "2026-09-10", quote: "Продажи на сайте — с 1 октября 2026 года", derivation: direct}
    verification: {status: stated, date: "2026-09-18"}
    permission: {status: not-required}
    use: {section_roles: [hero, pricing, faq, final-cta, about], slot_types: [subheadline, cta-label, cta-note, pricing-price-note, faq-a, email-subject, email-body, form-success, body]}
    lang: ru

  - id: delivery-russia
    kind: offer-terms
    claim_class: [purchase-terms, fact-number]
    verbatim:
      - "Доставка по России — от 3 дней"
      - "от 3 дней по России"
    canonical: "«Пекло» доставляет заказы по России службой доставки; срок — от 3 дней в зависимости от города (условия доставки на сайте)."
