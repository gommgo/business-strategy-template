    verification: {status: stated, date: "2026-09-18", method: "со слов основателя; трудовая книжка — по запросу"}
    permission: {status: granted, subject: "Артём Ким", form: signed-consent, scope: [site], document: "согласие от 2026-09-08 (демо)", date: "2026-09-08", shows: [full-name, position, photo], pd_consent: true, image_consent: true}
    attribution: {name: "Артём Ким", display: full-name, role: "основатель и шеф", relation: other}
    use: {section_roles: [about, team, hero], slot_types: [body, card-title, card-body, email-body, footer-tagline]}
    lang: ru

  - id: origin-story-staff-sauce
    kind: company
    claim_class: [company-details, fact-number]
    verbatim:
      - "Первый соус Артём сварил в 2019 году для персонала своего ресторана"
      - "С 2023 года соусы продаются на фермерских рынках Краснодара"
    canonical: "Первый соус будущего «Пекла» Артём Ким сварил в 2019 году для персонала ресторана, где был шефом; с 2023 года соусы продаются на фермерских рынках Краснодара."
