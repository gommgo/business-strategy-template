    what: "реквизиты продавца для подвала и оферты: название, ОГРН или ОГРНИП, адрес"
    kind: company
    claim_class: [company-details]
    placeholder: "[PLACEHOLDER: реквизиты продавца]"
    who: "заказчик"
    needed_for: {section_roles: [footer, contacts], slot_types: [footer-legal]}
    blocking: true
    fallback: placeholder
    question: "Как называется продавец (ИП или ООО), ОГРН или ОГРНИП, адрес?"
  - id: shelf-life
    what: "срок хранения после вскрытия"
    kind: property
    claim_class: [fact-property]
    placeholder: "[PLACEHOLDER: срок хранения после вскрытия]"
    who: "заказчик (технолог)"
    needed_for: {section_roles: [faq, specs], slot_types: [faq-a, spec-row]}
    fallback: omit-block
    question: "Сколько соус хранится после вскрытия и где (холодильник)?"

never_claim:
  - id: nc-health
    text: "любые обещания пользы и здоровья: «полезно», «ускоряет метаболизм», «лечит простуду», «сжигает калории»"
    claim_class: [health]
    patterns: ["полезн\\w*", "метаболизм", "леч\\w*\\s+простуд", "сжига\\w*\\s+калори", "иммунитет"]
    lift: never
    reason: "пищевой продукт: лечебные свойства — запрет (38-ФЗ ст. 5 ч. 5 п. 6; ТР ТС — H)"
    source: {who: "редактор (демо)", date: "2026-09-18"}
  - id: nc-hottest
    text: "«самый острый соус в России», «острее всех» — нет сравнительного исследования"
    claim_class: [superlative, comparison]
    patterns: ["сам\\w*\\s+остр\\w*", "остре\\w*\\s+всех"]
    lift: with-fact
    reason: "Пленум ВАС № 58 п. 29"
    source: {who: "редактор (демо)", date: "2026-09-18"}
  - id: nc-scarcity
    text: "«осталось N бутылок», таймер обратного отсчёта"
    claim_class: [availability-scarcity, promo-deadline]
    patterns: ["осталось\\s+\\d", "остал\\w*\\s+(всего\\s+)?\\d+\\s+бутыл"]
    lift: never
    reason: "ложная срочность (ux 06/04 §8.1)"
    source: {who: "редактор (демо)", date: "2026-09-18"}
  - id: nc-danger-hype
    text: "«опасно для жизни», «не для слабаков», «только для настоящих мужчин» — страшилка и стыд вместо факта"
    claim_class: [health]
    patterns: ["опасн\\w*\\s+для\\s+жизни", "не\\s+для\\s+слабак", "настоящ\\w*\\s+мужчин"]
    lift: never
    reason: "голос бренда: не стыдим читателя; риск здоровья как приманка — запрет (voice: taboos)"
    source: {who: "редактор (демо)", date: "2026-09-18"}
