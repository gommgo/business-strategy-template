# thresholds.yaml — пороги линтера по жанрам и слотам из корпуса D (text-research, волна 1, агент D и продолжатель D2,
# 2026-09-24). Как выведены: 03-corpus-measured/03-thresholds-by-genre.md §1; числа и группы: 02-measurements.md;
# корпус: corpus.tsv; замер: measurements.tsv.
# Кто читает что:
#   copy_lint.py (C) — genres.<жанр>.analyzers (объединённая выборка ru + en): сливает поверх профиля
#     06-anti-slop/profiles.yaml (ключи и поля — как в defaults.analyzers); поверх —
#     genres.<жанр>.analyzers_by_lang.<ru|en> по языку входа (с 0.9.3, правка оркестратора 2026-09-24 10:50).
#   genres.<жанр>.analyzers_by_lang.<ru|en> — те же анализаторы по языку. Главное различие — тире: в EN пунктуационное
#     тире — примета ИИ, в RU норма пунктуации.
#   genres.<жанр>.slots.<slot_type>.<ru|en>.{words|chars}.{p10,p50,p90}, n (страниц), provisional — длины слотов для E
#     (copy-slots.yaml) и G (мета); линтер не читает.
#   rows — построчно: genre, slot_type («*» — весь текст страницы), lang, metric, warn_low, warn_high, error_low,
#     error_high, n (страниц в опорной группе), n_ai, basis (основание error), warn_ci (90 % бутстрэп-интервал warning),
#     ai_p50, source (corpus-D:lead — лидеры; corpus-D:human — лидеры + средний рынок; третье поле — жанр выборки:
#     marketing = лендинги + страницы сайта), date, provisional.
# Правила: warning — p90 лидеров («больше — хуже») или p10 лидеров («меньше — хуже»); error — нижний дециль ИИ при
# зазоре (basis gap-ai-p10), иначе крайний выброс людей max(p98 людей, 1,5 × warning) (basis human-p98).
# provisional: true — опорная группа < 8 страниц (взяты лидеры + средний рынок) или жанр-прокси (geo — по статьям,
# email-form — по лендингам и слотам форм); у provisional плотности маркеров allow_error: false — такой порог не ворота.
# Замер: copy_lint 0.9.2 / 0.9.3 (эквивалентны по метрикам) (системный python3, без морфологии: с pymorphy3 плотность маркеров RU выше ≈ на 0,3 на 100
# слов; словари C без внешних правил G/H — поле tools.rules), copy_metrics 0.3.2, copy_extract 0.3.0.
date: '2026-09-24'
version: 2
provisional: false
source: 03-corpus-measured/corpus.tsv, measurements.tsv; 99-raw/experiments/D/03-measure/
tools: {copy_lint: 0.9.2 / 0.9.3 (эквивалентны по метрикам), copy_lint_check: 0.9.3, copy_metrics: 0.3.2, copy_extract: 0.3.0,
  python: 3.13.5, morphology: false, rules: '336 правил из словарей C (139 маркерных); внешние G/H не подключались: с ними
    455, из них маркерное одно — meta-clickbait (G), на корпусе 0 срабатываний из 621 поля'}
rules: {upper: 'warning = p90 лидеров жанра; error = p10 ИИ, если он выше warning и ИИ-страниц ≥ 8 (зазор), иначе max(p98
    людей, 1,5×warning)', lower: 'warning = p10 лидеров; error = p90 ИИ при зазоре, иначе min(p2 людей, 0,5×warning)', sparse: 'редкие
    приёмы (тире в прозе, «не X, а Y», вопросы, тройки, восклицания): warning не ниже 200 / медиана слов страницы жанра
    — двух случаев на страницу медианной длины', slots: 'warning = p10/p90 лидеров (вес страницы 1: экземпляр = 1 / число
    экземпляров слота на странице); error = p2/p98 людей, не ближе 0,5×/1,5× к warning', fallback: 'меньше 8 страниц лидеров
    → лидеры + средний рынок, provisional: true', provisional_gate: 'provisional: true — не ворота; у provisional marker_density
    allow_error: false'}
