aggregation:
  total_score: false        # суммарный балл не считается: разные критерии не компенсируют друг друга
  profile: "по странице — таблица критерий × ключевой слот (hero, оффер, тарифы, CTA, мета)"
  key_slots: [headline, subheadline, cta-label, cta-note, pricing-price-note, meta-title, meta-description]

decision_rules:
  - id: DR-1
    when: "любой из COPY-R-01, 02, 03, 09 на ключевом слоте ≤ 2 (судья или человек)"
    then: "переписать слот по находкам (протокол правки, COPY-C-17) до показа человеку"
  - id: DR-2
    when: "COPY-R-03 ≤ 3 или судья пометил свойство без записи facts.yaml"
    then: "claims_check.py --strict по слоту и вопрос заказчику; выдумку — в [PLACEHOLDER]"
  - id: DR-3
    when: "критерии COPY-R-10, 11, 12"
    then: "оценивает только человек; ответы судьи по ним не собираются"
  - id: DR-4
    when: "выбор между вариантами слота"
    then: "слепой попарный выбор человеком (COPY-C-32); судья сортирует только после калибровки (COPY-C-22)"
  - id: DR-5
    when: "изменена формулировка вопроса или якоря"
    then: "новая version и пересчёт калибровки: эквивалентные шаблоны промта меняют итог судьи в 25 % случаев (arXiv 2606.13685 через ux 11/02 §4.3)"
  - id: DR-6
    when: "рубрика и A/B или тест людей расходятся"
    then: "верить людям и эксперименту; судья — фильтр до эксперимента, не его замена (Spotify 2026; arXiv 2608.07517)"

