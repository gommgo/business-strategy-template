# copy-rubric.yaml — рубрика оценки маркетинговых текстов
# Что это: 12 критериев COPY-R-… с якорями 0–5, вопросами для ИИ-судьи и правилом, кто оценивает (судья или человек).
# Где правила: ../09-ai-generation-evaluation/03-evaluation.md §3 (как применять), §4 (судья), §6 (люди).
# Порядок: рубрика идёт ПОСЛЕ ворот — claims_check.py (факты и право) и copy_lint.py (стиль); см. copy-checklist.yaml.
# Рубрика — сигнал, а не ворота: статус слота меняют только ворота COPY-C-01…08 и человек (COPY-C-3x).
# Проверка формулы judge_scoring: python3 ../../scripts/text/chain_inputs.py --selftest.
# Числа судей, на которых стоят решения, — [исследование] с датой; сама рубрика на генерации не проверена — [не проверено]
# (живой тест LT-04 в live-test-plan.md). Опыты: 10 русских лендингов корпуса и слепой набор (6 RU +
# 4 EN, повтор 5 текстов) — 03-evaluation.md §3.4.

rubric: copy-rubric
version: "1.2"
date: "2026-09-24"
owner: text/09-ai-generation-evaluation
status: draft-phase-1      # draft-phase-1 → calibrated (после LT-04) → stable
language: ru               # описания по-русски; вопросы судье — RU и EN

scale:
  range: [0, 5]
  meaning:
    0: "провал или вред: ложь, противоречие фактам, смысл не считывается"
    1: "слабо: признак почти отсутствует, текст держится на штампах"
    2: "ниже нормы: признак есть местами, главное — нет"
    3: "норма рынка: медианный, приемлемый текст без ошибок и без силы"
    4: "хорошо: признак выражен, мелкие огрехи"
    5: "образец: признак выражен в каждой фразе, можно показывать как пример"
  note: >-
    Шкала 0–5 — для диагностики и разговора с человеком. Судья отвечает на атомарные вопросы «да / нет / не уверен»
    (как DSG в ai-media 11/02 §2.1), балл выводится формулой judge_scoring. Выбор между вариантами — попарно человеком
    (COPY-C-32); абсолютные баллы моделей завышены (POLLUX: судьи 1,45–1,57 против 1,28 у экспертов по шкале 0–2).

judge_scoring:
  rule: >-
    share = yes_count / answered (unsure считается «нет»; n/a — нет входа: facts, meaning, иерархии — в answered не
    входит); score = min(max(1, round_half_up(5 × share)), наименьший cap_if_no среди вопросов с ответом «no»).
    cap_if_no привязывает ответ к якорю: например, у COPY-R-06 «ситуации клиента нет» (q2 = no) даёт не выше 3 —
    «выгода названа, ситуации нет». Ноль ставит только вопрос с cap_if_no: 0 (выдумка, COPY-R-03 q4) или человек
    (противоречие фактам и смыслу): «все ответы нет» — это якорь 1, а не 0.
  rounding: half-up
  min_answered: 2          # меньше двух ответов «да/нет» — балл не ставится (score: null), слот уходит человеку
  answers: ["yes", "no", "unsure", "n/a"]   # в YAML ответа судьи — строками в кавычках: "yes", "no" (иначе YAML 1.1 читает их как true/false)
  why_four_questions: "при трёх вопросах шкала прыгает 0 → 2 → 3 → 5; у каждого критерия судьи — четыре вопроса, а потолки cap_if_no связывают ответы с якорями"
  evidence_required: "каждый ответ «no» сопровождается дословной цитатой фрагмента (where); без цитаты — unsure"
  read_rules: "поле read у вопроса — как его понимать; передаётся судье вместе с вопросом и входит в версию промта"
  examples:
    - {yes_count: 4, answered: 4, caps: [], score: 5}
    - {yes_count: 3, answered: 4, caps: [4], score: 4}
    - {yes_count: 3, answered: 4, caps: [3], score: 3}
    - {yes_count: 2, answered: 3, caps: [4], score: 3}
    - {yes_count: 3, answered: 4, caps: [1], score: 1}
    - {yes_count: 0, answered: 3, caps: [2, 3], score: 1}
    - {yes_count: 3, answered: 4, caps: [0], score: 0}
    - {yes_count: 0, answered: 1, caps: [], score: null}

who:
  judge: "судья-модель отвечает на вопросы judge.questions; доверие — judge.trust"
  human: "человек (редактор, заказчик) ставит балл по якорям; критерии human-only судье не отдаются"
  trust_levels:
    none: "судья не используется (данные: согласие с людьми низкое)"
    pre-filter: "судья только отсеивает явный брак и отдаёт находки с цитатой человеку"
    sort: "судья сортирует варианты (best-of-N) — только после калибровки COPY-C-22"

calibration:
  source: "../ai-media/11-evaluation-qa/02-vlm-critic-and-rubrics.md §6"
  sort_threshold: {agreement: 0.8, wilson_lower: 0.65, n_min: 20}
  prefilter_threshold: {agreement: 0.7}
  recalibrate_when: [new-judge-model, rubric-version-change, unsure-share-over-0.2, disagreement-3-sessions]
  f1_min: 0.8             # NN/g «AI-era critique» через ux 11/02 §4.3 — порог полезности судьи по разметке людей
  retest_i03: {question_agreement: 0.90, criterion_score_equal: 0.74, mean_abs_diff: 0.37, questions: 125, note: "один оценщик-модель, 5 текстов дважды с разницей ≈ 50 минут, правила чтения уточнены между прогонами — нижняя оценка стабильности; судью проверять тем же способом (3 прогона, COPY-C-23)"}

inputs:                    # что нужно судье и человеку; без входа критерий не оценивается (score: null)
  facts: "facts.yaml — 02-strategy-messaging/facts.schema.yaml"
  meaning: "meaning.yaml (02-strategy-messaging/meaning.schema.yaml) — позиционирование, альтернативы, отличие"
  hierarchy: "message-hierarchy (02-strategy-messaging/message-hierarchy.schema.yaml) — core_message, first_screen, sections[].message, not_said"
  voice: "профиль по 05-voice-editorial/voice.schema.yaml, образцы — examples/voice-*.yaml; COPY-R-10 оценивает человек по профилю, судья по профилю — только после калибровки (новые строки без автора не проверялись)"
  slots: "04-copy-by-block/copy-slots.yaml (69 типов слотов): длины, роли секций, fact_required; длина — сигнал, не ворота"

criteria:

  - id: COPY-R-01
    key: clarity
    name: "Ясность: что это, для кого, что сделать"
    asks: "Поймёт ли человек из аудитории за 5 секунд, что предлагают, кому и какой следующий шаг?"
    scope: first-screen      # hero: eyebrow, headline, subheadline, hero-proof, cta-label, cta-note; также лид секции
    genres: [landing, site-page, email-form]
    slot_types: [headline, subheadline, hero-proof, cta-label, cta-note, section-lead, form-title, email-subject]
    checked_by: judge+human
    judge:
      trust: pre-filter
      questions:
        - {id: q1, cap_if_no: 1, ru: "Можно ли по этому тексту назвать, что именно предлагают (товар, услугу, результат)?", en: "Can you name what exactly is offered (product, service or outcome) from this text alone?"}
        - {id: q2, cap_if_no: 2, ru: "Можно ли назвать, для кого это предложение?", en: "Can you tell who the offer is for?", read: "«yes», если адресат назван (сегмент, роль) или однозначно выводится из местной услуги с городом; у B2B и SaaS сегмент должен быть назван"}
        - {id: q3, cap_if_no: 3, ru: "Понятно ли, какой шаг сделать дальше и что за ним последует?", en: "Is it clear what to do next and what happens after that step?", read: "только первый экран: кнопка и строка у неё; то, что объяснено ниже по странице, не засчитывается"}
        - {id: q4, cap_if_no: 4, ru: "Совпадает ли пересказ главного в одной фразе с core_message иерархии?", en: "Does a one-sentence summary match the hierarchy core_message?"}
    anchors:
      0: "не понять, что продают; или обещание противоречит факту"
      1: "понятна отрасль, но не предложение («Решения для вашего бизнеса»)"
      2: "понятно, что это, но не для кого и что делать"
      3: "что и для кого понятно; шаг — общий («Оставить заявку»)"
      4: "что, для кого и шаг понятны; отличие считывается со второго чтения"
      5: "что, для кого, шаг и отличие — с первого взгляда, словами клиента"
    examples:
      - lang: ru
        genre: landing
        slot_type: headline
        fact_ids: []
        bad: "Инновационные решения для вашего комфорта"
        good: "Ремонт квартиры, за которым не нужно следить самому"
        why: "в «плохо» нет предмета и адресата; «хорошо» называет услугу и ситуацию клиента (иерархия Отвеса, problem-aware)"
      - lang: en
        genre: landing
        slot_type: headline
        fact_ids: []
        bad: "Empowering your journey to a better home"
        good: "Apartment renovation you don't have to supervise"
        why: "the good line names the service and the reader's situation"
    markers: [COPY-M-MKT-08, COPY-M-LEX-02, COPY-M-TON-01]
    checks: [COPY-C-20, COPY-C-40]
    evidence: "[практика] + [исследование] (5-секундный тест — 01-foundations/02 §8; сканирование — 01-foundations/01)"
    sources: ["01-foundations/02-what-copy-changes-evidence.md §8", "02-strategy-messaging/02-awareness-hierarchy-objections.md §2", "[V:TUMjnmfsPeM 14:12]"]
    limits: "судья отвечает как «читатель», но совпадение с людьми не измерено (живой тест LT-04, строка A4)"

  - id: COPY-R-02
    key: specificity
    name: "Конкретика: представить, опровергнуть, не скажет конкурент"
    asks: "Каждая ключевая фраза вызывает образ, может оказаться ложной и не подходит конкуренту?"
    scope: slot
    genres: [landing, site-page, meta, email-form, article]
    slot_types: [headline, subheadline, card-title, card-body, section-title, section-lead, body, meta-title, meta-description]
    checked_by: judge+human
    judge:
      trust: pre-filter
      questions:
        - {id: q1, cap_if_no: 3, ru: "Можно ли представить то, о чём говорит фраза (предмет, действие, сцену)?", en: "Can you picture what the line describes (an object, action or scene)?"}
        - {id: q2, cap_if_no: 2, ru: "Может ли фраза оказаться ложной, то есть её можно проверить фактом?", en: "Could the line turn out to be false, i.e. can a fact check it?"}
        - {id: q3, cap_if_no: 3, ru: "Если подставить название конкурента из meaning.alternatives, фраза перестаёт быть правдой?", en: "If a competitor from meaning.alternatives is substituted, does the line stop being true?"}
        - {id: q4, cap_if_no: 4, ru: "Каждое оценочное слово («качественный», «надёжный», «удобный») стоит рядом с характеристикой или числом?", en: "Does every evaluative word (quality, reliable, easy) sit next to a characteristic or a number?", read: "строго: одно оценочное слово ключевого слота без характеристики рядом — «no»"}
    anchors:
      0: "набор оценок без предмета («качественно, быстро, надёжно»)"
      1: "одна характеристика среди эпитетов"
      2: "есть предмет, но его подпишет любой конкурент"
      3: "проверяемая характеристика, общая для рынка"
      4: "проверяемо и представимо; отличие слабое"
      5: "видно, проверяемо и принадлежит только этой компании"
    examples:
      - lang: ru
        genre: landing
        slot_type: card-body
        fact_ids: [foreman-lapin]
        bad: "Индивидуальный подход и контроль качества на каждом этапе"
        good: "Ваш прораб — Сергей Лапин, 11 лет в ремонте: он отвечает за мастеров и сроки этапов."
        why: "имя и стаж — из факта; «контроль качества» подпишет любая студия"
      - lang: en
        genre: landing
        slot_type: card-body
        fact_ids: [foreman-lapin]
        bad: "A personal approach and quality control at every stage"
        good: "Your foreman is Sergei Lapin, with 11 years in renovation: he runs the crew and the stage deadlines."
        why: "a named person with a checkable track record instead of an adjective"
    markers: [COPY-M-LEX-02, COPY-M-CNT-01, COPY-M-MKT-01, COPY-M-MKT-05, COPY-M-SYN-02]
    checks: [COPY-C-12, COPY-C-20]
    evidence: "[практика] Dry [V:TUMjnmfsPeM 01:00]; проверка «только мы» (text 02/01 §4.3); конкретика через проверяемость — [исследование] 01/02 §2.1"
    sources: ["01-foundations/02-what-copy-changes-evidence.md §2.2", "01-foundations/formulas.yaml three-questions-dry", "02-strategy-messaging/01-positioning-value-proposition.md §4.3"]
    limits: "«опровержимо» ≠ право выдумать: конкретика только из facts.yaml, иначе [PLACEHOLDER] (COPY-C-01)"

  - id: COPY-R-03
    key: fact-grounding
    name: "Опора на факты"
    asks: "На какой запись facts.yaml опирается каждое утверждение, включая свойства без чисел?"
    scope: slot
    genres: [landing, site-page, meta, geo, email-form, article]
    slot_types: ["*"]
    checked_by: judge+human
    judge:
      trust: pre-filter
      questions:
        - {id: q1, cap_if_no: 1, ru: "Каждое утверждение о компании, продукте, клиентах и результатах можно сопоставить с записью из приложенного facts.yaml?", en: "Can every claim about the company, product, customers and results be matched to an entry in the attached facts.yaml?"}
        - {id: q2, cap_if_no: 2, ru: "Утверждение не шире факта (нет «всегда», «каждый», «все клиенты», если в факте этого нет)?", en: "Is every claim no broader than its fact (no 'always', 'every', 'all clients' unless the fact says so)?"}
        - {id: q3, cap_if_no: 3, ru: "Условия и оговорки факта (use.requires_nearby) стоят рядом с утверждением?", en: "Are the fact's conditions (use.requires_nearby) placed next to the claim?"}
        - {id: q4, cap_if_no: 0, ru: "Пробелы помечены [PLACEHOLDER], а не заполнены правдоподобной выдумкой?", en: "Are gaps marked [PLACEHOLDER] rather than filled with plausible inventions?"}
    anchors:
      0: "есть выдуманный факт или нарушение never_claim"
      1: "свойство продукта или процесс без записи в facts.yaml («датчик», «сборка в Казани»)"
      2: "утверждение шире факта или без обязательной оговорки"
      3: "все утверждения опираются на факты, оговорки частично"
      4: "все утверждения с фактами и оговорками; есть лишние общие фразы"
      5: "каждое утверждение — факт с оговоркой; пробелы честно помечены"
    examples:
      - lang: ru
        genre: landing
        slot_type: cta-note
        fact_ids: [estimate-free]
        bad: "Бесплатный выезд замерщика в любой район и смета, которая никогда не меняется"
        good: "Смета и выезд замерщика — бесплатно в черте города."
        why: "«в любой район» шире факта, «никогда не меняется» — never_claim nc-no-extra-cost-promise; оговорка «в черте города» — use.requires_nearby"
      - lang: en
        genre: landing
        slot_type: cta-note
        fact_ids: [estimate-free]
        bad: "Free visit anywhere and an estimate that never changes"
        good: "The estimate and the measurer's visit are free within the city limits."
        why: "the claim stays inside the fact and keeps its condition"
    markers: [COPY-M-CNT-02, COPY-M-CNT-05, COPY-M-CNT-06, COPY-M-CNT-03]
    checks: [COPY-C-01, COPY-C-13, COPY-C-21, COPY-C-35]
    evidence: "[проверено: «Кварц» — 3 из 3 эталонных провалов пойманы сверкой]; «свойства без чисел» сверка ловит только --strict — отсюда вопрос судье"
    sources: ["02-strategy-messaging/03-proof-and-facts.md §7", "../../scripts/text/README.md раздел claims_check.py"]
    limits: "ворота — claims_check.py (COPY-C-01); судья лишь ищет «свойства без записи», его находка — повод для человека, не приговор"

  - id: COPY-R-04
    key: position
    name: "Позиция и отличие"
    asks: "Есть ли в тексте утверждение, с которым можно спорить, и совпадает ли оно с позиционированием?"
    scope: page
    genres: [landing, site-page, article]
    slot_types: [headline, subheadline, section-title, section-lead, body, article-lead]
    checked_by: judge+human
    judge:
      trust: pre-filter
      questions:
        - {id: q1, cap_if_no: 1, ru: "Есть ли хотя бы одно утверждение, с которым конкурент или покупатель мог бы не согласиться?", en: "Is there at least one claim a competitor or buyer could disagree with?", read: "позиция — утверждение против распространённой практики или отсекающее часть клиентов («Да, придётся пахать»); обещание рынка («монтаж за 1 день») позицией не считается; манифест «не X, а Y» без факта или механизма — «unsure»"}
        - {id: q2, cap_if_no: 2, ru: "Совпадает ли главное отличие в тексте с meaning.positioning (уникальные свойства и ценность)?", en: "Does the main differentiator in the text match meaning.positioning?"}
        - {id: q3, cap_if_no: 3, ru: "Названа ли альтернатива, от которой уводит текст (статус-кво, «сделать самому», другой подход)?", en: "Is the alternative the text argues against named (status quo, DIY, another approach)?"}
        - {id: q4, cap_if_no: 4, ru: "Отличие подкреплено фактом или механизмом («как именно»), а не только заявлено?", en: "Is the differentiator backed by a fact or a mechanism (how exactly), not only stated?"}
    anchors:
      0: "текст противоречит позиционированию"
      1: "медианный текст: ни одного утверждения, с которым можно спорить"
      2: "позиция есть, но утонула в общих выгодах"
      3: "позиция названа, альтернатива — нет"
      4: "позиция и альтернатива названы, отличие доказано частично"
      5: "позиция, альтернатива и доказанное отличие — в первом экране"
    examples:
      - lang: ru
        genre: landing
        slot_type: section-lead
        fact_ids: [guarantee-3-years]
        bad: "Мы делаем ремонт качественно, в срок и по доступной цене."
        good: "Частную бригаду координируете вы. Здесь один прораб ведёт объект, а гарантия 3 года записана в договоре."
        why: "названа альтернатива (частная бригада) и отличие с фактом; первая версия — медианный текст (COPY-M-TON-08)"
      - lang: en
        genre: landing
        slot_type: section-lead
        fact_ids: [guarantee-3-years]
        bad: "We deliver quality renovation on time and on budget."
        good: "With a private crew, you coordinate everyone yourself. Here one foreman runs the job, and the 3-year warranty is in the contract."
        why: "the alternative is named and the difference is backed by a fact"
    markers: [COPY-M-TON-08, COPY-M-TON-01, COPY-M-MKT-01]
    checks: [COPY-C-20]
    evidence: "[практика] Dunford (text 02/01; [V:hdjlCLb9Hl8]); медианный текст линтер не ловит — text 06/02 §12"
    sources: ["02-strategy-messaging/01-positioning-value-proposition.md §2, §4.3", "06-anti-slop/02-linter-spec-and-profiles.md §12"]
    limits: "судья сравнивает с meaning.yaml, но не знает рынка; «спорность» оценивает человек из аудитории; в слепом наборе пышный манифест ИИ («not for speed») формально прошёл q1 и q3 и получил 5 — отсюда read у q1"

  - id: COPY-R-05
    key: awareness-fit
    name: "Уровень осведомлённости и иерархия"
    asks: "Соответствует ли тип hero, порядок доводов и глубина текста уровню осведомлённости страницы?"
    scope: page
    genres: [landing, site-page]
    slot_types: [headline, subheadline, hero-proof, section-title]
    checked_by: judge+human
    judge:
      trust: pre-filter
      questions:
        - {id: q1, cap_if_no: 1, ru: "Тип заголовка совпадает с core_message.hero_approach иерархии?", en: "Does the headline type match core_message.hero_approach in the hierarchy?"}
        - {id: q2, cap_if_no: 2, ru: "Первым идёт довод, который нужен этому уровню (для product-aware — доказательство, для problem-aware — ситуация)?", en: "Does the first argument fit the awareness level (proof for product-aware, situation for problem-aware)?"}
        - {id: q3, cap_if_no: 1, ru: "Ни одна фраза не нарушает not_said и must_not_say иерархии?", en: "Does no line break the hierarchy's not_said and must_not_say lists?"}
        - {id: q4, cap_if_no: 3, ru: "Длина и глубина аргумента соответствуют page.argument_depth иерархии?", en: "Do the length and depth of the argument match page.argument_depth in the hierarchy?"}
    anchors:
      0: "текст для другого уровня (объясняет проблему тем, кто пришёл за ценой)"
      1: "тип hero не совпадает с иерархией"
      2: "hero верный, порядок доводов — нет"
      3: "hero и порядок верны, глубина не по уровню"
      4: "всё по иерархии, одна секция выбивается"
      5: "каждая секция отвечает на вопрос своего уровня и переводит на следующий"
    examples:
      - lang: ru
        genre: landing
        slot_type: headline
        fact_ids: [company-since-2014]
        bad: "Почему ремонт затягивается и как этого избежать"
        good: "Ремонт квартир под ключ в Нижнем Новгороде с 2014 года"
        why: "для брендового трафика (product-aware) нужен заголовок о компании и доказательство, а не разбор проблемы (одна иерархия — один уровень)"
      - lang: en
        genre: landing
        slot_type: headline
        fact_ids: [company-since-2014]
        bad: "Why renovations run late and how to avoid it"
        good: "Turnkey apartment renovation in Nizhny Novgorod since 2014"
        why: "a visitor who searched for the brand needs confirmation and proof, not a problem essay"
    markers: []
    checks: [COPY-C-20]
    evidence: "[практика] Шварц по конспектам + [проверено: две иерархии одной услуги]"
    sources: ["02-strategy-messaging/02-awareness-hierarchy-objections.md §1.2, §1.4"]
    limits: "без page.awareness и иерархии критерий не оценивается (score: null) — поле в copy deck"

  - id: COPY-R-06
    key: value-scenario
    name: "Выгода в ситуации клиента"
    asks: "У каждого факта есть ответ на «и что с того?» — ситуация, последствие, сцена из голоса клиента?"
    scope: section
    genres: [landing, site-page, email-form, article]
    slot_types: [card-body, section-lead, body, step-body, case-summary, case-result]
    checked_by: judge+human
    judge:
      trust: pre-filter
      questions:
        - {id: q1, cap_if_no: 1, ru: "Сказано, что клиент получит или сможет сделать благодаря факту?", en: "Does the text say what the customer gets or can do because of the fact?"}
        - {id: q2, cap_if_no: 3, ru: "Описана конкретная ситуация клиента (когда, где, что происходит), в которой срабатывает выгода? Происхождение ситуации проверяет COPY-R-03", en: "Is a concrete customer situation described (when, where, what happens) in which the benefit works? Its origin is checked by COPY-R-03", read: "сцена клиента — два из трёх: когда, где, что происходит с клиентом («пользоваться комнатой уже вечером»); шаги процесса компании и размеры помещений сценой не считаются"}
        - {id: q3, cap_if_no: 2, ru: "Выгода конкретна (время, деньги, риск, усилие), а не «экономия времени и денег» вообще?", en: "Is the benefit specific (time, money, risk, effort) rather than generic 'save time and money'?"}
        - {id: q4, cap_if_no: 4, ru: "Выгода выведена из конкретного свойства продукта (механизм), а не приписана ему?", en: "Is the benefit derived from a specific product property (mechanism) rather than attached to it?"}
    anchors:
      0: "выгода придумана и противоречит фактам"
      1: "голый список функций или фактов"
      2: "универсальная выгода («экономьте время»)"
      3: "выгода названа, ситуации нет"
      4: "выгода в ситуации клиента, ситуация — общая"
      5: "факт → ситуация из голоса клиента → последствие; читатель узнаёт себя"
    examples:
      - lang: ru
        genre: landing
        slot_type: case-summary
        fact_ids: [case-two-room-47-days]
        bad: "Мы соблюдаем сроки и ценим ваше время."
        good: "Двушка 54 м² в Сормове: ремонт под ключ за 47 рабочих дней при сроке по договору 50. Хозяева заехали без переносов переезда."
        why: "факт и последствие для клиента; вторая фраза — [не проверено], в реальном тексте нужна запись голоса клиента или [PLACEHOLDER]"
      - lang: en
        genre: landing
        slot_type: case-summary
        fact_ids: [case-two-room-47-days]
        bad: "We respect deadlines and value your time."
        good: "A 54 m² two-room flat in Sormovo, turnkey in 47 working days against 50 in the contract."
        why: "a concrete result the reader can picture; the consequence line needs a customer-voice fact"
    markers: [COPY-M-MKT-05, COPY-M-CNT-01]
    checks: [COPY-C-20]
    evidence: "[практика] Ильяхов «факт → сценарий» [V:_jwKQ6ZCeAI 22:30] и Dry «факт → история» [V:TUMjnmfsPeM 46:41]"
    sources: ["01-foundations/02-what-copy-changes-evidence.md §2.2", "[V:_jwKQ6ZCeAI]"]
    limits: "сценарий — надстройка над фактом; придуманная ситуация = выдумка (COPY-R-03)"

  - id: COPY-R-07
    key: headline-story
    name: "Сюжет заголовков"
    asks: "Заголовки секций, прочитанные подряд, пересказывают страницу и ведут к действию?"
    scope: page
    genres: [landing, site-page]
    slot_types: [headline, section-title]
    checked_by: judge+human
    judge:
      trust: pre-filter
      questions:
        - {id: q1, cap_if_no: 3, ru: "По одним заголовкам секций можно пересказать предложение и доводы?", en: "Can you retell the offer and its arguments from the section titles alone?"}
        - {id: q2, cap_if_no: 2, ru: "Не меньше трёх четвертей заголовков — утверждения или вопросы клиента, а не ярлыки («Наши преимущества», «Почему мы»)?", en: "Are at least three quarters of the titles claims or customer questions, not labels ('Our advantages', 'Why us')?", read: "конвенции навигации и якорей — не ярлыки: заголовки «Частые вопросы» (или «Вопросы и ответы») и «Контакты» в счёт не входят, их секции из доли исключаются; ярлыки — «Наши преимущества», «Почему мы», «Почему выбирают нас», «Отзывы клиентов», «Наши услуги», «Возможности» (CONTRADICTIONS X24)"}
        - {id: q3, cap_if_no: 4, ru: "Порядок заголовков совпадает с sections[].question иерархии?", en: "Does the order of titles follow sections[].question in the hierarchy?"}
        - {id: q4, cap_if_no: 4, ru: "Заголовок последней секции перед формой называет следующий шаг или его результат?", en: "Does the last section title before the form name the next step or its result?"}
    anchors:
      0: "заголовки противоречат друг другу или предложению"
      1: "одни ярлыки"
      2: "половина — ярлыки"
      3: "утверждения, но сюжет рвётся"
      4: "сюжет читается, один провал"
      5: "заголовки подряд — полноценный питч до призыва"
    examples:
      - lang: ru
        genre: landing
        slot_type: section-title
        fact_ids: []
        bad: "Наши преимущества · Как мы работаем · Отзывы · Контакты"
        good: "Почему ремонты затягиваются и дорожают · Один прораб на весь ремонт · Что говорят те, кто уже сделал ремонт · Начните с замера: смета ни к чему не обязывает"
        why: "ярлыки ничего не сообщают сканирующему читателю; утверждения складываются в сюжет (инвертированный outline-тест)"
      - lang: en
        genre: landing
        slot_type: section-title
        fact_ids: []
        bad: "Our advantages · How we work · Testimonials · Contacts"
        good: "Why renovations run late · One foreman for the whole job · What past clients say · Start with a measurement visit"
        why: "the titles alone tell the story"
    markers: [COPY-M-STR-09, COPY-M-MKT-11, COPY-M-STR-10]
    checks: [COPY-C-20]
    evidence: "[практика] инвертированный outline-тест (text 06/01 §5 STR-09); сканирование — 01-foundations/01"
    sources: ["06-anti-slop/01-text-slop-markers-by-genre.md §5"]
    limits: "линтер ловит ярлыки (MKT-11), но не сюжет — text 06/02 §12"

  - id: COPY-R-08
    key: objections-risk
    name: "Возражения и снятие риска"
    asks: "Сняты ли блокеры покупки до главного призыва и чем подкреплено снятие риска?"
    scope: page
    genres: [landing, site-page]
    slot_types: [objection-answer, guarantee-text, cta-note, faq-a, pricing-price-note]
    checked_by: judge+human
    judge:
      trust: pre-filter
      questions:
        - {id: q1, cap_if_no: 2, ru: "Каждое возражение-блокер из иерархии (objection_ids) получило ответ до главного призыва?", en: "Is every blocker objection from the hierarchy answered before the main call to action?"}
        - {id: q2, cap_if_no: 2, ru: "Гарантия, возврат, бесплатный шаг названы с условиями (срок, объём, ограничения)? Опору на facts.yaml проверяет COPY-R-03", en: "Are guarantees, refunds and free steps stated with their conditions (term, scope, limits)? Grounding in facts.yaml is checked by COPY-R-03", read: "нет на странице ни гарантии, ни возврата, ни бесплатного шага — «no»: риск первого шага не снят"}
        - {id: q3, cap_if_no: 4, ru: "Ответы на возражения написаны словами клиента, а не «Почему стоит выбрать именно нас?»?", en: "Are objections phrased in customer words rather than 'Why choose us?'"}
        - {id: q4, cap_if_no: 4, ru: "Рядом с главным призывом стоит строка, снимающая риск первого шага (бесплатно, без обязательств, срок ответа)?", en: "Is there a line next to the main call to action that removes the risk of the first step (free, no obligation, response time)?", read: "главный призыв — основное целевое действие страницы (форма, заявка, покупка), не кнопка навигации; «бесплатно» в тексте кнопки засчитывается"}
    anchors:
      0: "обещание снятия риска без факта («гарантируем результат»)"
      1: "возражения не упомянуты"
      2: "возражения в FAQ внизу, блокеры до призыва не сняты"
      3: "блокеры названы, ответы общие"
      4: "блокеры сняты фактами до призыва"
      5: "блокеры сняты фактами, у кнопки — строка про риск первого шага"
    examples:
      - lang: ru
        genre: landing
        slot_type: guarantee-text
        fact_ids: [guarantee-3-years]
        bad: "Гарантируем качество на долгие годы!"
        good: "Гарантия 3 года на работы — пункт 7.2 договора."
        why: "условие и документ вместо обещания (38-ФЗ, claims-rules.yaml: гарантия результата — флаг права)"
      - lang: en
        genre: landing
        slot_type: guarantee-text
        fact_ids: [guarantee-3-years]
        bad: "Quality guaranteed for years to come!"
        good: "A 3-year warranty on the work, clause 7.2 of the contract."
        why: "a checkable term instead of a promise"
    markers: [COPY-M-MKT-06, COPY-M-CNT-06]
    checks: [COPY-C-01, COPY-C-02, COPY-C-20]
    evidence: "[практика] text 02/02 §3–4 (блокеры до призыва, Moesta); гарантии — [исследование] по аннотациям"
    sources: ["02-strategy-messaging/02-awareness-hierarchy-objections.md §3, §4", "08-russian-legal-typography/claims-rules.yaml"]
    limits: "право гарантий — claims-rules.yaml, не рубрика"

  - id: COPY-R-09
    key: action
    name: "Призыв и следующий шаг"
    asks: "Кнопка называет результат шага, а строка у кнопки снимает тревогу этого шага?"
    scope: slot
    genres: [landing, site-page, email-form]
    slot_types: [cta-label, cta-secondary-label, cta-note, form-next-steps, email-cta-label]
    checked_by: judge+human
    judge:
      trust: pre-filter
      questions:
        - {id: q1, cap_if_no: 1, ru: "Текст кнопки называет, что человек получит или сделает, а не «Отправить», «Подробнее»?", en: "Does the button name what the person gets or does, not 'Submit' or 'Learn more'?"}
        - {id: q2, cap_if_no: 3, ru: "Понятно, что произойдёт после нажатия (звонок, письмо, замер)?", en: "Is it clear what happens after clicking (a call, an email, a visit)?", read: "по главному призыву (как в COPY-R-08 q4); объяснение где угодно на странице засчитывается, если оно про этот шаг"}
        - {id: q3, cap_if_no: 4, ru: "Кнопка и строка у неё согласованы с формулировкой оффера в заголовке?", en: "Do the button and its note match the offer wording in the headline?"}
        - {id: q4, cap_if_no: 4, ru: "Главное действие названо одинаково по всей странице (одно имя действия на поток)?", en: "Is the main action named the same way across the page (one action name per flow)?"}
    anchors:
      0: "кнопка обещает не то, что произойдёт"
      1: "«Отправить», «Подробнее», «Submit»"
      2: "общий глагол («Оставить заявку») без результата"
      3: "результат назван, следствие шага — нет"
      4: "результат и следствие названы"
      5: "результат, следствие и снятый риск; то же слово, что в оффере"
    examples:
      - lang: ru
        genre: landing
        slot_type: cta-label
        fact_ids: []
        bad: "Отправить"
        good: "Вызвать замерщика"
        why: "кнопка называет действие-результат; строка у кнопки «Смета и выезд замерщика — бесплатно в черте города» снимает риск (факт estimate-free)"
      - lang: en
        genre: landing
        slot_type: cta-label
        fact_ids: []
        bad: "Submit"
        good: "Book a measurement visit"
        why: "the button says what the click gets you"
    markers: [COPY-M-MKT-07, COPY-M-PUN-07]
    checks: [COPY-C-05, COPY-C-20]
    evidence: "[консенсус] ux 07/02 §1.1–1.4 и 07/06 §3.2, §4.1; Wiebe [V:F_urkVueszI 07:07–24:38] — [кейс]"
    sources: ["../ux/07-ux-writing/02-microcopy-by-component.md §1.1–1.4", "../ux/07-ux-writing/06-banned-words-and-patterns.md §3.2, §4.1", "[V:F_urkVueszI]"]
    limits: "форма глагола (инфинитив по-русски, «Show me…» в EN) — 04-copy-by-block и ux; рубрика проверяет смысл"

  - id: COPY-R-10
    key: voice
    name: "Голос бренда"
    asks: "Текст звучит как этот бренд по его профилю голоса, одним регистром на странице?"
    scope: page
    genres: [landing, site-page, email-form, article]
    slot_types: ["*"]
    checked_by: human
    judge:
      trust: none
      questions: []
      why_not: "судьи слабо согласуются с людьми по тону и регистру (POLLUX: «Original tone» 0,03–0,46, «Compliance with functional style» 0,13–0,28); схема профиля голоса готова, но узнаваемость голоса по профилю не проверена на новых строках (признаки-слова 15/15 на строках автора, 7/15 на новых)"
    anchors:
      0: "голос противоречит профилю (шутки у юристов, панибратство там, где «вы» и сдержанность)"
      1: "безликий голос шаблона, бренд не узнать"
      2: "голос есть местами, регистр скачет между секциями"
      3: "ровный нейтральный голос, совместимый с профилем"
      4: "голос узнаётся по принципам профиля (is / is_not)"
      5: "голос узнаётся без логотипа; принципы видны в исполнении каждого слота"
    examples:
      - lang: ru
        genre: landing
        slot_type: subheadline
        fact_ids: []
        bad: "Мы — ваш надёжный партнёр в мире ремонта!"
        good: "Спокойно и по делу: срок и смета — в договоре, ход работ — у прораба."
        why: "черновой голос «спокойно и по делу, на «вы»» из copy deck примера; «надёжный партнёр» — голос шаблона (COPY-M-MKT-01)"
    markers: [COPY-M-MKT-01, COPY-M-PUN-05, COPY-M-PUN-10]
    checks: [COPY-C-30]
    evidence: "[практика] Ross [V:cqnZtGXGwsw 11:11–17:22] (принципы с исполнением); ux 07/01 §6 (оси тона NN/g)"
    sources: ["05-voice-editorial/01-brand-voice.md", "05-voice-editorial/voice.schema.yaml", "[V:cqnZtGXGwsw]"]
    limits: "оценка — по профилю голоса проекта (is / is_not, словарь, обращение); вопросы судье по полям профиля не заведены, доверие — после калибровки (LT-04, W1-7)"

  - id: COPY-R-11
    key: natural-language
    name: "Естественный язык"
    asks: "Читается ли текст как написанный носителем: без кальки, канцелярита, висячих оборотов и нарочитой рваности?"
    scope: slot
    genres: [landing, site-page, article, email-form, geo]
    slot_types: ["*"]
    checked_by: human
    judge:
      trust: none
      questions: []
      why_not: "POLLUX (эксперты, RU): Спирмен судей с экспертами по «Naturalness / non-synthetic speech» 0,028–0,168, «Literacy» 0,04–0,32, «Language norms» −0,004…0,22; маркеры (калька, канцелярит, деепричастия) ловит copy_lint.py — это его зона, не судьи"
    anchors:
      0: "грамматические ошибки или машинный перевод"
      1: "калька с английского и канцелярит в каждом абзаце"
      2: "гладко, но узнаётся «нейросетевой» ритм и словарь"
      3: "правильно и нейтрально, местами книжно"
      4: "естественно; единичные неловкости"
      5: "так сказал бы опытный редактор; ни одна фраза не выдаёт перевод или шаблон"
    examples:
      - lang: ru
        genre: landing
        slot_type: body
        fact_ids: []
        bad: "Используя наш сервис, ваш ремонт станет предсказуемым, обеспечивая прозрачность на каждом этапе."
        good: "Ход работ вы видите, не приезжая на объект: прораб отвечает за мастеров и сроки этапов."
        why: "висячее деепричастие и хвост «обеспечивая…» (COPY-M-SYN-09, SYN-08) против прямого предложения"
    markers: [COPY-M-LEX-10, COPY-M-LEX-04, COPY-M-SYN-08, COPY-M-SYN-09, COPY-M-TON-10]
    checks: [COPY-C-05, COPY-C-06, COPY-C-31]
    evidence: "[исследование] POLLUX 2025 (Спирмен по критериям) + [проверено: висячие деепричастия ≤ 0,8 и у морфологии]"
    sources: ["arXiv 2505.24616 табл. 1", "06-anti-slop/02-linter-spec-and-profiles.md §10, §12"]
    limits: "для EN — носитель; перевод EN → RU вместо параллельного письма — типовой сбой"

  - id: COPY-R-12
    key: interest
    name: "Интересно написано"
    asks: "Хочется ли дочитать: есть ли деталь, сцена, неожиданный, но честный ход?"
    scope: section
    genres: [landing, site-page, article, email-form]
    slot_types: [headline, section-lead, body, case-summary, article-lead, article-paragraph, email-body]
    checked_by: human
    judge:
      trust: none
      questions: []
