# facts-demo-saas-okoshko.yaml — ДЕМО-ФАКТЫ агента E для примеров SaaS (copy-slots.yaml, 04-copy-by-block, copy deck v0)
# text-research · волна 2 · агент E · 2026-09-24 · формат: 02-strategy-messaging/facts.schema.yaml (facts_version 1)
#
# ДЕМО. Сервис «Окошко» (онлайн-запись и напоминания для барбершопов и салонов) выдуман агентом E; все числа, цены, имена,
# даты и документы — синтетика для проверки правил текста (claims_check.py, copy_lint.py). Не публиковать и не выдавать за
# реальную компанию. Совпадение названия с настоящими сервисами случайно. Ссылки — шаблоны <…>.
# Зачем: у базы нет фактов SaaS (B2 дал «Отвес» — услуга и «Кварц» — предзаказ), а приоритет 2 заказчика — лендинг SaaS.
# Что показывает: цену за мастера и тарифы (цена «от», скидка при оплате за год с условием), пробный период без карты,
# платное SMS как условие «бесплатных напоминаний», кейс с типичным результатом рядом (B2 §5.4), отзыв с разрешением,
# рейтинг площадки со снимком, счётчик клиентов с датой, отмена и возврат (10 дней — H), реквизиты в missing (ворота).

