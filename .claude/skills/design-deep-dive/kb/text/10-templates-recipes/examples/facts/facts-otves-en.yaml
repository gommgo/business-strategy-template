never_claim:
- id: nc-best-in-city
  text: “best renovation in the city”, “No. 1 in Nizhny Novgorod”, “lowest prices” — no independent rating or price study
  claim_class:
  - superlative
  patterns:
  - best\s+(renovation|studio|in\s+(the\s+)?city)
  - no\.?\s*1\s+in
  - lowest\s+prices?
  lift: with-fact
  reason: 135-ФЗ ст. 14.3; 38-ФЗ ст. 5 ч. 3 п. 1
  source:
    who: демо-набор (RU), EN — адаптация
    date: '2026-09-24'
- id: nc-no-extra-cost-promise
  text: “the estimate never changes” as a promise to every client — the contract has no such clause
  claim_class:
  - guarantee
  - price-discount
  patterns:
  - estimate\w*\s+(never|won.t|will\s+not|does\s+not)\s+(change|grow|go\s+up|increase)
  lift: with-fact
  reason: 'пробел estimate-change-policy'
  source:
    who: демо-набор (RU), EN — адаптация
    date: '2026-09-24'
