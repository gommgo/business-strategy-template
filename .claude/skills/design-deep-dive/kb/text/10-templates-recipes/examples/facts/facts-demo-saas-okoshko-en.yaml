    claim_class: [price-discount]
    verbatim: ["990 ₽ a month for one stylist", "Master plan — 990 ₽ a month"]
    canonical: "The Master plan of Okoshko costs 990 ₽ a month for one stylist (price list, September 2026)."
    values: [{value: 990, unit: RUB, what: "Master plan per month", qualifier: "one stylist"}]
    entities: [product-okoshko]
    source: {type: customer-document, who: "demo customer", where: "price list 2026", date: "2026-09-01", document: "price-2026-09.pdf (demo)", quote: "Master — 990 RUB per month, 1 stylist", derivation: direct}
    verification: {status: stated, date: "2026-09-24", method: "demo"}
    permission: {status: not-required}
    use: {section_roles: [pricing, hero, faq, final-cta]}
    lang: en

