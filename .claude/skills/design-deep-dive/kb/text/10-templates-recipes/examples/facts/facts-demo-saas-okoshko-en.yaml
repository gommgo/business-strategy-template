# Источник правды — файл E; при его правке пересобрать копию: 99-raw/experiments/J/08-examples/make_ru_from_e3.py --copy-facts.
# facts-demo-saas-okoshko-en.yaml — ДЕМО-ФАКТЫ агента E: английская адаптация набора «Окошко» для EN-примеров и EN copy deck
# text-research · волна 2 · агент E · 2026-09-24 · формат: 02-strategy-messaging/facts.schema.yaml (facts_version 1)
#
# ДЕМО. Сервис выдуман агентом E; все числа, цены, имена, даты и документы — синтетика (см. facts-demo-saas-okoshko.yaml).
# Не публиковать. Совпадение названия с настоящими сервисами случайно.
# Зачем отдельный файл: claims_check.py сравнивает числа по values.what и цитаты по verbatim на языке факта; английский текст
# против русских фактов даёт ложные COPY-F-NUM-MISMATCH (объект счёта по-русски), «1,380» читается как 1,38, перевод цитаты
# из translations.en не находится (опыт E/03). Второй язык — отдельный copy deck (PLAN, copy-deck v0: source_lang) и свой
# facts.yaml с теми же id. Цены — в рублях: сайт российской компании (38-ФЗ ст. 5 ч. 7.1, H).

facts_version: 1
date: "2026-09-24"
site: okoshko-demo-en
lang: en
jurisdiction: ru
status: draft
example: true
owner: {role: "founder (demo customer)"}
collected_by: "агент E (демо-набор, английская адаптация, 2026-09-24)"
never_claim_defaults: ru-default-1

entities:
  - {id: product-okoshko, type: product, names: ["Okoshko"]}
  - {id: platform-rustore, type: platform, names: ["RuStore"]}
  - {id: city-kazan, type: place, names: ["Kazan"]}
  - {id: person-ruslan, type: person, names: ["Ruslan"], fact_id: review-ruslan}

facts:
  - id: price-master
