missing:
  - id: legal-details
    what: "legal details: full company name, OGRN, INN, address (seller information)"
    kind: company
    claim_class: [company-details]
    placeholder: "[PLACEHOLDER: company legal details]"
    who: "demo customer (accountant)"
    needed_for: {section_roles: [footer, pricing], slot_types: [footer-legal]}
    blocking: true
    fallback: placeholder
    question: "Send the full legal name, OGRN, INN and registered address as in the state register."
  - id: client-logos
    what: "client salon logos with written consent"
    kind: client
    claim_class: [client-logo]
    placeholder: "[PLACEHOLDER: client logos with written consent]"
    who: "demo customer"
    needed_for: {section_roles: [proof-logos], slot_types: [logos-caption]}
    fallback: omit-block
    question: "Which salons agreed to show their logo? We need consent letters and files from the clients."

never_claim:
  - id: nc-revenue-growth
    text: "“we'll double your salon revenue”, “pays for itself in a month” — income promise without research"
    claim_class: [income-finance, forecast]
    patterns: ["doubl\\w*\\s+(your\\s+)?(\\w+\\s+)?revenue", "increas\\w*\\s+(your\\s+)?(\\w+\\s+)?revenue", "pays?\\s+for\\s+itself"]
    lift: never
    reason: "38-FZ art. 5 part 3 item 2; forecast without basis (B2, H)"
    source: {who: "агент E (демо)", date: "2026-09-24"}
  - id: nc-zero-noshow
    text: "“no more no-shows”, “zero no-shows” — absolute result promise"
    claim_class: [guarantee, forecast]
    patterns: ["no\\s+more\\s+no-?shows", "zero\\s+no-?shows"]
    lift: never
    reason: "result guarantee (H COPY-L-GUAR-01); the case shows 6%, not zero"
    source: {who: "агент E (демо)", date: "2026-09-24"}
