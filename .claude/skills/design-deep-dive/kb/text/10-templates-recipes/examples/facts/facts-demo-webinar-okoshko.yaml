- id: nc-revenue-growth
  text: «увеличим выручку салона на N %», «окупится за месяц» — обещание дохода без исследования
  claim_class:
  - income-finance
  - forecast
  patterns:
  - увелич\w*\s+выручк
  - удво\w*\s+выручк
  - окуп\w*\s+за
  - doubl\w*\s+(your\s+)?(\w+\s+)?revenue
  - increas\w*\s+(your\s+)?(\w+\s+)?revenue
  lift: never
  reason: 38-ФЗ ст. 5 ч. 3 п. 2; forecast без basis (B2, H)
  source:
    who: агент E (демо)
    date: '2026-09-24'
