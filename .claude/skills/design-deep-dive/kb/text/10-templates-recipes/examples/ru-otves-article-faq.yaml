        - {id: b, text: 'Цена ремонта под ключ в Нижнем Новгороде: что входит в метр', status: draft, source: ai-self}
      test_plan: 'Вебмастер и Search Console: 4 недели на варианте a, затем 4 недели на b; метрика — CTR по запросу main_query (G 07/02 §4.3).'
      review_by: '2027-01-15'
      notes: 'Шаблон G article-page: title «{ответ или вопрос читателя} — {уточнение: где, год-если-данные}»; description «{вывод}. {источник данных, дата}».'
