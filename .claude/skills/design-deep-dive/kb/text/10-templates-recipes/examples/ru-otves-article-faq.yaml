  - page_id: article-turnkey-price
    page_type: article-page
    status: draft
    awareness: solution-aware
    primary_action: Вызвать замерщика
    cta_primary: article-turnkey-price/final/cta
    article:
      intent: 'информационный с коммерческим хвостом: сколько стоит ремонт под ключ и из чего складывается цена'
      main_query: 'сколько стоит ремонт квартиры под ключ нижний новгород'
      unique_angle:
        text: 'что входит в цену «от» за м² и что нет — на прайсе студии и одном кейсе со сроком по договору'
        fact_ids: [price-from-per-m2, case-two-room-47-days]
      author: foreman-lapin
      update_policy: 'пересмотр при смене прайса (valid.until факта цены — 2026-12-31) и не реже раза в год'
      published: '2026-09-24'
    meta:
      title: 'Сколько стоит ремонт квартиры под ключ — Нижний Новгород, 2026'
      description: 'Работы под ключ — от 9 800 ₽ за м² без материалов, замер и смета бесплатно в черте города. Цены — по прайсу студии «Отвес» на 2026 год.'
