  authors: ['J3 (ai-self, 2026-09-24)']
  notes: >-
    Статья отвечает на вопрос сделки фактами (G 07/02): цена «от» с условием рядом, смета, срок на примере одного кейса с
    рамкой, гарантия. Блок «коротко» — первым после лида (40–80 слов, G 07/03 §3.1), FAQ — ответ первой фразой
    (COPY-GEO-14). Подпись автора — только после того, как Сергей Лапин прочитал и одобрил текст (ИИ-текст не
    подписывается чужим именем — H, F); до этого страница — draft. article.serp_scan не заполнен: живой выдачи в опыте
    нет (сеть не использовалась) — перед публикацией 3–5 материалов {url, note, date} (G «осмотрись»).
