# ru-otves-article-faq.yaml — пример copy deck v1.1 (10-templates-recipes, J3, 2026-09-24): статья с блоком «коротко» и FAQ
# (article-page). Тексты — ai-self J3. Факты — ../../02-strategy-messaging/examples/facts-service-renovation.yaml (вымышленная
# студия B2, не публиковать). Мета — по шаблону G article-page, два варианта title с планом теста; бриф статьи — page.article (G 07/02 §1.1).
copy_deck:
  version: 1
  date: '2026-09-24'
  site: otves-remont-nn
  product_name: Отвес
  lang: ru
  voice_ref: ../../05-voice-editorial/examples/voice-otves-warm.yaml
  facts_ref: ../../02-strategy-messaging/examples/facts-service-renovation.yaml
  copy_slots_ref: ../../04-copy-by-block/copy-slots.yaml
