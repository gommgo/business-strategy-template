# ru-otves-case.yaml — пример copy deck v1.1 (10-templates-recipes): страница кейса (case-page) «Отвеса».
# Тексты — ai-self. Факты — ../../02-strategy-messaging/examples/facts-service-renovation.yaml (вымышленная студия,
# синтетические данные: не публиковать). Эта страница проходит весь путь: check --update --promote → approve →
# validate --final (демо-факты примера — error: публикация только на фактах заказчика) → export --stage mockup (вход
# холста: copy.md и facts.md).
copy_deck:
  version: 1
  date: '2026-09-24'
  site: otves-remont-nn
  product_name: Отвес
  lang: ru
  voice_ref: ../../05-voice-editorial/examples/voice-otves-warm.yaml
  facts_ref: ../../02-strategy-messaging/examples/facts-service-renovation.yaml
  copy_slots_ref: ../../04-copy-by-block/copy-slots.yaml
  meaning_ref: ../../02-strategy-messaging/examples/meaning-otves.yaml
  jurisdiction: ru
  legal_category: [general]
  authors: ['агент (ai-self, 2026-09-24)']
  notes: >-
    Кейс по text 04/03 §4.4: ситуация → результат числом с базой и сроком → слова клиента с рамкой типичности → гарантия и цена →
    действие. Имя клиента — только в отзыве (у факта кейса permission.shows — город). Прораб к объекту не привязан: в
    фактах нет, кто вёл этот ремонт (пробел foreman-per-object — rewrite-without). Подвал с реквизитами — общий для сайта
    (пробел legal-details); на странице кейса нет оплаты и брони, блок продавца (COPY-L-DIST-01) здесь не обязателен.
  pages:
  - page_id: case-sormovo-54
    page_type: case-page
    status: draft
    awareness: product-aware
    primary_action: Вызвать замерщика
    cta_primary: case-sormovo-54/final/cta
    promise:
      from: case-sormovo-54/case/title
      basis: 'факт case-two-room-47-days — главное доказательство страницы (опора иерархии «срок по договору»)'
    meta:
      title: 'Двушка 54 м² в Сормове за 47 рабочих дней — кейс студии «Отвес»'
      description: 'Ремонт двушки 54 м² в Сормовском районе под ключ: 47 рабочих дней при сроке по договору 50, акт подписан 30 мая 2026 года. Гарантия на работы — 3 года.'
      og_title: 'Двушка 54 м² в Сормове за 47 рабочих дней'
      og_description: 'Как прошёл ремонт двушки под ключ: 47 рабочих дней при сроке по договору 50.'
      fact_ids: [case-two-room-47-days, guarantee-3-years]
      review_by: '2027-09-24'
      notes: 'Шаблон case-page (meta-rules.yaml): «{задача клиента}: {результат числом} — кейс {бренд}»; description — ситуация, что сделали, результат с датой.'
    sections:
    - section_id: case
      section_role: case-studies
      message: 'Двушка 54 м²: 47 рабочих дней при 50 по договору'
      question: 'Уложатся ли в срок на квартире вроде моей?'
      slots:
      - slot_id: title
        slot_type: case-title
        variants:
        - {id: a, text: 'Двушка 54 м² в Сормове за 47 рабочих дней', status: assumed, source: ai-self}
        chosen: a
        fact_ids: [case-two-room-47-days]
        claim_flags: [fact-number]
      - slot_id: summary
        slot_type: case-summary
        variants:
        - id: a
          text: 'Двухкомнатная квартира 54 м² в Сормовском районе, ремонт под ключ. По договору на работы было 50 рабочих дней, сдали за 47 — акт подписан 30 мая 2026 года. Ниже — слова хозяйки и что входит в цену такого ремонта.'
          status: assumed
          source: ai-self
        chosen: a
        fact_ids: [case-two-room-47-days]
        claim_flags: [fact-number]
      - slot_id: result
        slot_type: case-result
        variants:
        - {id: a, text: '47 рабочих дней вместо 50 по договору', status: assumed, source: fact}
        chosen: a
        fact_ids: [case-two-room-47-days]
        claim_flags: [fact-number]
      - slot_id: cta
        slot_type: cta-label
        variants:
        - {id: a, text: 'Вызвать замерщика', status: assumed, source: ai-self}
        chosen: a
        fact_ids: []
        claim_flags: []
    - section_id: review
      section_role: testimonials
      message: 'Срок и смета — словами клиента, с рамкой: это опыт одной квартиры'
      slots:
      - slot_id: title
        slot_type: section-title
        variants:
        - {id: a, text: 'Что написала хозяйка после сдачи', status: assumed, source: ai-self}
        chosen: a
        fact_ids: []
        claim_flags: []
      - slot_id: quote
        slot_type: testimonial-quote
        group: review-1
        variants:
        - {id: a, text: '«Сдали двушку за 47 рабочих дней — на три дня раньше, чем в договоре. Прораб каждый вечер присылал фото… Смета не выросла ни на рубль»', status: assumed, source: voc}
        chosen: a
        fact_ids: [review-anna-k]
        claim_flags: [testimonial-quote]
        notes: 'Цитата дословно (verbatim факта), правка отзывов — только пунктуация (ГК ст. 1266).'
      - slot_id: author
        slot_type: testimonial-attribution
        group: review-1
        variants:
        - {id: a, text: 'Анна К., Нижний Новгород', status: assumed, source: fact}
        chosen: a
        fact_ids: [review-anna-k]
        claim_flags: []
      - slot_id: frame
        slot_type: body
        variants:
        - {id: a, text: 'Это одна квартира и слова одной хозяйки. Смета и срок другого ремонта зависят от площади, объёма работ и материалов.', status: assumed, source: ai-self}
        chosen: a
        fact_ids: []
        claim_flags: []
        notes: 'Рамка типичности рядом с цитатой о смете (text 02/03 §5.4; COPY-F-TYPICALITY — напоминание, а не ошибка).'
    - section_id: guarantee
      section_role: guarantee
      message: 'Гарантия 3 года на работы — пункт 7.2 договора'
      slots:
      - slot_id: title
        slot_type: section-title
        variants:
        - {id: a, text: 'Гарантия 3 года на работы — по договору', status: assumed, source: ai-self}
        chosen: a
        fact_ids: [guarantee-3-years]
        claim_flags: [guarantee]
      - slot_id: text
        slot_type: guarantee-text
        variants:
        - {id: a, text: 'Гарантия на работы — 3 года, это пункт 7.2 договора подряда. Такой пункт есть в каждом договоре студии, не только в договоре этой двушки.', status: assumed, source: ai-self}
        chosen: a
        fact_ids: [guarantee-3-years]
        claim_flags: [guarantee]
    - section_id: price
      section_role: pricing
      message: 'От 9 800 ₽ за м² без материалов; точная сумма — в смете'
      slots:
      - slot_id: title
        slot_type: section-title
        variants:
        - {id: a, text: 'Сколько стоит ремонт под ключ', status: assumed, source: ai-self}
        chosen: a
        fact_ids: []
        claim_flags: []
      - slot_id: price
        slot_type: pricing-price
        variants:
        - {id: a, text: 'от 9 800 ₽ за м²', status: assumed, source: fact}
        chosen: a
        fact_ids: [price-from-per-m2]
        claim_flags: [price-discount]
      - slot_id: note
        slot_type: pricing-price-note
        variants:
        - {id: a, text: 'Работы под ключ, без материалов. Сумму для вашей квартиры покажет смета.', status: assumed, source: ai-self}
        chosen: a
        fact_ids: [price-from-per-m2]
        claim_flags: [price-discount]
    - section_id: final
      section_role: final-cta
      message: 'Вызвать замерщика; смета бесплатно в черте города'
      slots:
      - slot_id: title
        slot_type: section-title
        variants:
        - {id: a, text: 'Начните с замера и сметы', status: assumed, source: ai-self}
        chosen: a
        fact_ids: []
        claim_flags: []
      - slot_id: cta
        slot_type: cta-label
        variants:
        - {id: a, text: 'Вызвать замерщика', status: assumed, source: ai-self}
        chosen: a
        fact_ids: []
        claim_flags: []
      - slot_id: cta-note
        slot_type: cta-note
        variants:
        - {id: a, text: 'Смета и выезд замерщика — бесплатно в черте города', status: assumed, source: fact}
        chosen: a
        fact_ids: [estimate-free]
        claim_flags: [price-discount]
