# en-otves-case.yaml — пример copy deck v1.1 (10-templates-recipes): английская АДАПТАЦИЯ страницы кейса
# ru-otves-case.yaml (не перевод). Тексты — ai-self. Факты — facts/facts-otves-en.yaml (английская
# адаптация набора «Отвес» с теми же id; студия вымышленная, не публиковать). id страницы, секций и слотов — как в исходнике.
copy_deck:
  version: 1
  date: '2026-09-24'
  site: otves-remont-nn
  product_name: Otves
  lang: en
  source_lang: ru
  source_ref: ru-otves-case.yaml
  adaptation:
    mode: adaptation
    audience_note: 'English-speaking residents of Nizhny Novgorod (relocants, specialists on local contracts) who hire a renovation contractor here for the first time'
    voice_line: 'Address the reader as “you”, warm and neighbourly, with numbers: working days, contract clauses, the site manager’s name. No emoji, clichés or jokes about money'
  voice_ref: ../../05-voice-editorial/examples/voice-otves-warm.yaml
  facts_ref: facts/facts-otves-en.yaml
  copy_slots_ref: ../../04-copy-by-block/copy-slots.yaml
  jurisdiction: ru
  legal_category: [general]
  authors: ['агент (ai-self, 2026-09-24)']
  notes: >-
    Адаптация: район объяснён одной вставкой («Sormovo, a district of Nizhny Novgorod»), «замерщик» — site visit, цена —
    в рублях (компания в РФ: 38-ФЗ ст. 5 ч. 7.1), перевод цитаты помечен рядом (text 02/03 §5.1), без «dear customer» и
    восклицаний. Длины — EN-колонки copy-slots.yaml (основная единица — слова).
  pages:
  - page_id: case-sormovo-54
    page_type: case-page
    status: draft
    awareness: product-aware
    primary_action: Book a site visit
    cta_primary: case-sormovo-54/final/cta
    promise:
      from: case-sormovo-54/case/title
      basis: 'fact case-two-room-47-days (the main proof of the page)'
    meta:
      title: '54 m² apartment in Sormovo done in 47 working days | Otves'
      description: 'Turnkey renovation of a 54 m² two-room apartment in Nizhny Novgorod: 47 working days against 50 in the contract. 3-year warranty on the work.'
      og_title: 'A 54 m² apartment in Sormovo, done in 47 working days'
      og_description: 'How a turnkey renovation went: 47 working days against 50 in the contract.'
      fact_ids: [case-two-room-47-days, guarantee-3-years]
      review_by: '2027-09-24'
    sections:
    - section_id: case
      section_role: case-studies
      message: 'A 54 m² apartment: 47 working days against 50 in the contract'
      question: 'Will they keep to the timeline on a flat like mine?'
      slots:
      - slot_id: title
        slot_type: case-title
        variants:
        - {id: a, text: 'A 54 m² apartment in Sormovo, done in 47 working days', status: assumed, source: ai-self}
        chosen: a
        fact_ids: [case-two-room-47-days]
        claim_flags: [fact-number]
      - slot_id: summary
        slot_type: case-summary
        variants:
        - id: a
          text: 'A turnkey renovation of a two-room apartment in Sormovo, a district of Nizhny Novgorod. It took 47 working days against the 50 set in the contract; the handover certificate was signed on 30 May 2026. Below: what the owner wrote afterwards and what the price covers.'
          status: assumed
          source: ai-self
        chosen: a
        fact_ids: [case-two-room-47-days]
        claim_flags: [fact-number]
      - slot_id: result
        slot_type: case-result
        variants:
        - {id: a, text: '47 working days instead of the 50 in the contract', status: assumed, source: fact}
        chosen: a
        fact_ids: [case-two-room-47-days]
        claim_flags: [fact-number]
      - slot_id: cta
        slot_type: cta-label
        variants:
        - {id: a, text: 'Book a site visit', status: assumed, source: ai-self}
        chosen: a
        fact_ids: []
        claim_flags: []
    - section_id: review
      section_role: testimonials
      message: 'Timing and the estimate in the client’s words, framed as one apartment'
      slots:
      - slot_id: title
        slot_type: section-title
        variants:
        - {id: a, text: 'What the owner wrote after the handover', status: assumed, source: ai-self}
        chosen: a
        fact_ids: []
        claim_flags: []
      - slot_id: quote
        slot_type: testimonial-quote
        group: review-1
        variants:
        - {id: a, text: '“We got the two-room flat back in 47 working days, three days ahead of the contract. The site manager sent photos every evening… The estimate didn''t grow by a single rouble”', status: assumed, source: voc}
        chosen: a
        fact_ids: [review-anna-k]
        claim_flags: [testimonial-quote]
      - slot_id: author
        slot_type: testimonial-attribution
        group: review-1
        variants:
        - {id: a, text: 'Anna K., Nizhny Novgorod (translated from Russian)', status: assumed, source: fact}
        chosen: a
        fact_ids: [review-anna-k]
        claim_flags: []
      - slot_id: frame
        slot_type: body
        variants:
        - {id: a, text: 'This is one apartment and one owner''s words. The estimate and timing of another renovation depend on the area, the scope of work and the materials.', status: assumed, source: ai-self}
        chosen: a
        fact_ids: []
        claim_flags: []
    - section_id: guarantee
      section_role: guarantee
      message: 'A 3-year warranty on the work — clause 7.2 of the contract'
      slots:
      - slot_id: title
        slot_type: section-title
        variants:
        - {id: a, text: 'A 3-year warranty on the work, in the contract', status: assumed, source: ai-self}
        chosen: a
        fact_ids: [guarantee-3-years]
        claim_flags: [guarantee]
      - slot_id: text
        slot_type: guarantee-text
        variants:
        - {id: a, text: 'Our work comes with a 3-year warranty, written into clause 7.2 of the contract. The same clause is in every Otves contract, not only in this one.', status: assumed, source: ai-self}
        chosen: a
        fact_ids: [guarantee-3-years]
        claim_flags: [guarantee]
    - section_id: price
      section_role: pricing
      message: 'From ₽9800 per m², materials not included; the total comes with the estimate'
      slots:
      - slot_id: title
        slot_type: section-title
        variants:
        - {id: a, text: 'What turnkey renovation costs', status: assumed, source: ai-self}
        chosen: a
        fact_ids: []
        claim_flags: []
      - slot_id: price
        slot_type: pricing-price
        variants:
        - {id: a, text: 'from ₽9800 per m²', status: assumed, source: fact}
        chosen: a
        fact_ids: [price-from-per-m2]
        claim_flags: [price-discount]
      - slot_id: note
        slot_type: pricing-price-note
        variants:
        - {id: a, text: 'Labour only, materials not included.', status: assumed, source: ai-self}
        chosen: a
        fact_ids: [price-from-per-m2]
        claim_flags: [price-discount]
    - section_id: final
      section_role: final-cta
      message: 'Book a site visit; the estimate is free within city limits'
      slots:
      - slot_id: title
        slot_type: section-title
        variants:
        - {id: a, text: 'Start with a site visit and an estimate', status: assumed, source: ai-self}
        chosen: a
        fact_ids: []
        claim_flags: []
      - slot_id: cta
        slot_type: cta-label
        variants:
        - {id: a, text: 'Book a site visit', status: assumed, source: ai-self}
        chosen: a
        fact_ids: []
        claim_flags: []
      - slot_id: cta-note
        slot_type: cta-note
        variants:
        - {id: a, text: 'The visit and the estimate are free within city limits', status: assumed, source: fact}
        chosen: a
        fact_ids: [estimate-free]
        claim_flags: [price-discount]
