    cta_primary: okoshko-solution-aware/hero/cta
    promise:
      variants:
      - {id: a, text: 'Online booking with Telegram reminders for barbershops and salons', status: assumed, source: ai-self}
      chosen: a
      fact_ids: [reminders, self-booking-link]
      claim_flags: [fact-property]
      basis: 'как в исходнике: механизм для solution-aware (text 04/03 §3.2)'
    meta:
      title: 'Booking with Telegram reminders for barbershops — Okoshko'
      description: 'Clients book through your link and get a Telegram reminder 24 hours and 2 hours before the visit. Free for 14 days, no card required.'
      og_title: 'Telegram reminders instead of evening calls'
      og_description: 'Clients book themselves and get a reminder 24 hours and 2 hours before the visit.'
      fact_ids: [self-booking-link, reminders, trial-14-days]
      review_by: '2027-09-24'
