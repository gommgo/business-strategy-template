# en-okoshko-saas.yaml — пример copy deck v1.1 (10-templates-recipes): английская АДАПТАЦИЯ лендинга SaaS
# ru-okoshko-saas.yaml. Тексты — ai-self. Факты — facts/facts-demo-saas-okoshko-en.yaml (ДЕМО-факты
# на английском, те же id; не публиковать). Адаптация сокращает страницу: тариф «Сеть», SMS, годовая скидка и FAQ сняты.
copy_deck:
  version: 1
  date: '2026-09-24'
  site: okoshko-demo
  product_name: Okoshko
  lang: en
  source_lang: ru
  source_ref: ru-okoshko-saas.yaml
  adaptation:
    mode: adaptation
    audience_note: 'English-speaking owners and managers of barbershops and salons in Russian cities (relocants, franchisees of international brands) comparing booking tools'
    voice_line: 'Address the reader as “you”, calm and precise: a number, a price or a setting instead of “reliability”. Explain every term. No humour, emoji or exclamation marks'
  voice_ref: ../../05-voice-editorial/examples/voice-grafa-b2b.yaml
  facts_ref: facts/facts-demo-saas-okoshko-en.yaml
  copy_slots_ref: ../../04-copy-by-block/copy-slots.yaml
  jurisdiction: ru
  legal_category: [general]
  authors: ['агент (ai-self, 2026-09-24)']
  notes: >-
    Адаптация для англоязычных владельцев салонов в РФ: цены в рублях (компания в РФ), время поддержки — «Moscow time»,
    перевод цитаты помечен рядом (text 02/03 §5.1); порядок секций исходника сохранён, лишние для этой аудитории слоты сняты.
    voice_ref — профиль «Графа» (сдержанный B2B, en_form: you) как ближайший: своего профиля у «Окошка» нет.
