# claims-rules.yaml — правовые правила формулировок: правовой модуль claims_check.py (ворота) и сигналы copy_lint.py.
# text-research · волна 2 · агент H · 2026-09-24. НЕ ЮРИДИЧЕСКОЕ ЗАКЛЮЧЕНИЕ: правило показывает, где формулировка
# рискованна и что нужно рядом или в facts.yaml; решение по спорному тексту — юрист заказчика.
#
# Кто читает файл:
#   claims_check.py (B2 + H) — подхватывает сам: `python3 ../../scripts/text/claims_check.py page.md --facts facts.yaml
#     [--jurisdiction ru|eu|us] [--legal-category medical,…] [--legal-only]`. Уровни: error — блокер публикации,
#     warning — предупреждение (править или подтвердить фактом), info — сигнал. Читает поля права: claim_class, pattern,
#     unless, requires, jurisdiction, legal_category(_except), once, lang, law. Формат — `claims_check.py rules-schema`.
#   copy_lint.py (C) — через 06-anti-slop/profiles.yaml → external_rules: берёт pattern, unless, examples, group,
#     count_as_marker, priority, requires_no_fact; поля права отбрасывает. Уровни в линтере понижены блоком
#     `overrides` (в конце файла): право в линтере — сигнал, ворота права — claims_check.py. Отраслевые правила и
#     профили ЕС и США в линтере выключены (отрасль и юрисдикцию знает только claims_check).
# Регулярки пишутся так, чтобы работать в обеих утилитах: claims_check ищет по «мягкому» тексту (нижний регистр, ё→е,
#   любые тире → «-», неразрывные пробелы → пробел), copy_lint — по исходному тексту с флагом i. Поэтому: [её], [-–—−],
#   \s, макросы %B% %E% (границы слова для кириллицы, спецификация C §2.2).
# `unless` — исправленный текст в том же предложении (обе утилиты); `requires.nearby` — то же в секции или на странице
#   (только claims_check). Пример bad ловится правилом, good — нет: проверяют selftest обеих утилит.
# Нормы — первоисточники с редакцией на 2026-09-24 (consultant.ru, garant.ru, fas.gov.ru, br.fas.gov.ru, EUR-Lex через
#   web.archive.org, eCFR). Подробности, примеры и практика ФАС — 01-advertising-law-claims.md.
version: 1
date: "2026-09-29"
jurisdiction: ru
owner: "H (волна 2) · text-research/08-russian-legal-typography"
note: "Не юридическое заключение. id — COPY-L-<ТЕМА>-<NN>; классы — x-claim-classes (02-strategy-messaging/facts.schema.yaml)."
defaults:
  trigger: pattern          # только свои регулярки; маркеры класса B2 используются для отбора фактов
  jurisdiction: [ru]
  lang: any
  group: EXT                # copy_lint: внешняя группа, в плотность маркеров не входит
  count_as_marker: false
  flags: i
  priority: 60              # copy_lint: на том же месте правило права главнее стилевого (MKT-10 → сюда)
  date: "2026-09-24"
  evidence: "[стандарт]"

rules:

  # ── 1. Превосходная степень, исключительность, сравнение ────────────────────────────────────────────────────────
  - id: COPY-L-SUP-01
    title: "Превосходная степень без критерия: «лучший», «самый», «№ 1 в…», «лидер рынка», «первый в России»"
    level: error
    claim_class: [superlative]
    exclude_slot_types: [testimonial-quote]
    requires_no_fact: true
    pattern: '%B%(?:(?:сам(?:ый|ая|ое|ые|ого|ой|ом|ым|ых|ую)\s+)?(?:наи)?лучш(?:ий|ая|ее|ие|его|ей|ему|им|их|ую|ими)%E%(?!\s+(?:практик|пожелани|способ\s+(?:проверить|узнать|понять)|из\s+(?:вариантов|способов)|предложени\w*(?!\s+(?:на|в|среди)%E%)))|№\s?1%E%(?=\s+(?:в|на|среди|по)%E%)|номер\s+один%E%|перв(?:ый|ая|ое|ые|ой|ого|ым)\s+(?:в|на|среди)\s+(?:росси|мир|рынк|стран|город|регион|рунет|отрасл|сегмент|москв|петербург)\w*|сам(?:ый|ая|ое|ые|ого|ой|ом|ым|ых|ую)\s+(?!(?:частые|частых|популярные\s+вопрос|главн|важн|обычн|перв|последн|начал|конц|дел%E%|собой|себе|себя|разн|простые\s+вопрос))[а-яё]{3,}(?:ый|ий|ой|ая|яя|ое|ее|ые|ие|ого|его|ей|ую|юю|ым|им|ых|их)%E%|лидер(?:ом|а|ы|ов)?\s+(?:рынка|отрасли|продаж|по\s+[а-яё]+|среди|в\s+(?:росси|москв|регион|город|стран|сегмент)\w*)|непревзойд[её]нн\w*|не\s+имеющ\w*\s+(?:себе\s+)?равн\w*)'
    unless: 'по\s+(?:данным|версии|итогам|результатам|оценке|рейтингу|исследованию|замер\w*|подсч[её]т\w*|числу|количеству|объ[её]му|продажам)\s+(?!(?:наших|моих|своих|самих)?\s*(?:гост|клиент|покупател|посетител|пользовател|подписчик|друз|сотрудник))|согласно\s+(?!(?:нашим|моим|своим)\s)|в\s+рейтинге|(?:рейтинг|преми|конкурс|исследовани)\w*\s+[«"]'
    requires:
      nearby: ['по\s+(?:данным|версии|итогам|результатам|оценке|рейтингу|исследованию|замер\w*|подсч[её]т\w*)\s+(?!(?:наших|моих|своих)?\s*(?:гост|клиент|покупател|посетител|пользовател|подписчик))', 'согласно\s+(?!(?:нашим|моим|своим)\s)', 'в\s+рейтинге', '(?:рейтинг|преми|конкурс|исследовани)\w*\s+[«"]']
      fact_fields: [basis.criterion]
    message: "Превосходная степень без конкретного критерия с объективным подтверждением в самом тексте — недостоверная реклама; «по мнению наших гостей» — не критерий"
    replacement: "назвать критерий и источник рядом («самая низкая цена капучино в районе по данным мониторинга 12 кофеен, сентябрь 2026»), факт — с basis.criterion; нет данных — убрать степень и сказать свойство"
    source: "38-ФЗ ст. 5 ч. 3 п. 1, ч. 2 п. 1; Пленум ВАС № 58 п. 29; ФАС, приказ № 1079/23 (прил. 2 п. 3); 135-ФЗ ст. 14.3 п. 1; ФАС: решение № 08/22689/25 от 13.03.2025 («МТС Лучший домашний интернет Москвы»); Кировское УФАС, АР/2924/25 от 30.05.2025 («лучший бар на районе* по мнению наших гостей»)"
    evidence: "[стандарт] + [правоприменение]"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 5 ч. 2 п. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "Пленум ВАС РФ № 58 от 08.10.2012 п. 29", edition: "действует: 8-ФКЗ от 04.06.2014 ст. 3 ч. 1", checked: "2026-09-24"}
      - {ref: "ФАС, приказ № 1079/23 от 28.12.2023, прил. 2 разд. II п. 3", checked: "2026-09-24"}
      - {ref: "135-ФЗ ст. 14.3 п. 1", edition: "ред. от 08.03.2026, с изм. от 29.04.2026", checked: "2026-09-24", note: "и вне рекламы: сайт, письма"}
    examples:
      bad: "Лучшая кофейня на районе — по мнению наших гостей"
      good: "Самая низкая цена капучино в районе по данным мониторинга 12 кофеен, сентябрь 2026"

  - id: COPY-L-SUP-02
    title: "Превосходная степень на английском: «the best», «#1», «market leader», «world''s first»"
    level: error
    lang: en
    claim_class: [superlative]
    exclude_slot_types: [testimonial-quote]
    requires_no_fact: true
    pattern: '(?:\bthe\s+best%E%|\bbest[- ]in[- ]class|\bbest[- ]selling|(?<![\w#])#\s?1(?!\d)|\bno\.\s?1%E%|\bnumber\s+one%E%|\bworld''?s\s+(?:first|leading|best|largest|fastest)|\bmarket\s+leader|\bindustry[- ]leading|\bleading\s+provider|\bthe\s+(?:fastest|cheapest|lowest[- ]priced|hottest|finest|greatest|freshest|tastiest|strongest|safest|easiest|smartest|biggest|largest|healthiest|quickest|most\s+(?:popular|trusted|advanced|reliable|affordable|accurate|secure|powerful))|\b[a-z]+est\s+(?:[a-z]+\s+){1,2}you(?:''ll|\s+will|''ve|\s+have)\s+ever\b)'
    unless: 'according\s+to|based\s+on|as\s+of|source:|\bsurvey\b|ranked\s+by|rated\s+by|\bper\s+(?:g2|capterra|gartner|forrester|idc|statista)'
    requires:
      nearby: ['according\s+to', 'based\s+on', 'as\s+of', 'source:', '\bsurvey\b', 'ranked\s+by', 'rated\s+by']
      fact_fields: [basis.criterion]
    message: "Superlative without a stated, verifiable criterion: on a Russian site the same 38-FZ rule applies to English copy"
    replacement: "state the criterion and source («Rated 4.8 on G2, 312 reviews, September 2026») or drop the superlative"
    source: "38-ФЗ ст. 5 ч. 3 п. 1; Пленум ВАС № 58 п. 29 (текст на английском на сайте для РФ — та же норма)"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "Пленум ВАС РФ № 58 от 08.10.2012 п. 29", edition: "действует", checked: "2026-09-24"}
    examples:
      bad: "The best CRM for small teams"
      good: "Rated 4.8 on G2 based on 312 reviews, September 2026"
      bad_en: "The hottest sauce you'll ever taste"
      good_en: "A habanero sauce: 350 000 SHU by the pepper supplier's lab test, June 2026"

  - id: COPY-L-UNIQ-01
    title: "Исключительность: «единственный», «только у нас», «не имеет аналогов», «впервые в России»"
    level: error
    claim_class: [superlative]
    exclude_slot_types: [testimonial-quote]
    requires_no_fact: true
    pattern: '%B%(?:единствен(?:ный|ная|ное|ные|ного|ной|ную|ным|ных)%E%(?!\s+(?:способ|вариант|минус|недостат|вопрос|услови|что|чего|кто))|только\s+(?:у\s+нас%E%|мы%E%|в\s+наш\w+)|не\s+имеющ\w*\s+аналог\w*|без\s+аналогов|аналогов\s+(?:нет|не\s+существует)|впервые\s+в\s+(?:росси|мир|стран|город|регион)\w*)'
    unless: 'патент\w*|реестр\w*|по\s+данным\s+(?:роспатент|фипс)'
    requires:
      nearby: ['патент\w*', 'реестр\w*', 'по\s+данным\s+(?:роспатент|фипс)']
      fact_fields: [basis.criterion]
    message: "Исключительность («только мы», «единственный») — преимущество перед всеми товарами рынка: без доказательства отсутствия аналогов недостоверно; «мы сказали об этом первыми» — не исключительность"
    replacement: "сказать, что делаете, без сравнения со всем рынком («проверяем проводку тепловизором на каждом объекте»); исключительность — только с патентом или реестром в facts.yaml"
    source: "38-ФЗ ст. 5 ч. 3 п. 1; 135-ФЗ ст. 14.3 п. 1 («только», «единственный»); Карельское УФАС (2019, «единственный лицензированный поставщик») через ФАС; B1 01 (проверка «только мы»)"
    evidence: "[стандарт] + [правоприменение]"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "135-ФЗ ст. 14.3 п. 1", edition: "ред. от 08.03.2026, с изм. от 29.04.2026", checked: "2026-09-24"}
    examples:
      bad: "Только у нас проверяют проводку тепловизором"
      good: "Проверяем проводку тепловизором на каждом объекте"

  - id: COPY-L-UNIQ-02
    title: "«Уникальный», «эксклюзивный» без того, чем именно"
    level: warning
    claim_class: [superlative]
    exclude_slot_types: [testimonial-quote]
    requires_no_fact: true
    pattern: '%B%(?:уникальн\w*|эксклюзивн\w*)'
    unless: 'патент\w*|реестр\w*|сертификат\w*'
    requires:
      nearby: ['патент\w*', 'реестр\w*', 'сертификат\w*']
    message: "«Уникальный», «эксклюзивный» — заявленное преимущество: без свойства и подтверждения это недостоверная характеристика или пустой эпитет"
    replacement: "назвать свойство числом или фактом («3 урока в неделю по 20 минут с одним преподавателем»); эксклюзив поставщика — договор в facts.yaml"
    source: "38-ФЗ ст. 5 ч. 3 п. 1–2; ФАС, приказ № 1079/23 (прил. 2 п. 3: вывод о превосходстве без характеристик)"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Уникальная методика обучения для взрослых"
      good: "Методика: 3 урока в неделю по 20 минут с одним преподавателем"

  - id: COPY-L-UNIQ-03
    title: "Исключительность на английском: «the only», «unique», «unmatched»"
    level: warning
    lang: en
    claim_class: [superlative]
    exclude_slot_types: [testimonial-quote]
    requires_no_fact: true
    pattern: '\b(?:the\s+only%E%(?!\s+(?:way|thing|question|difference))|only\s+we%E%|unique%E%|unmatched|unrivall?ed|first[- ]ever|one[- ]of[- ]a[- ]kind|no\s+one\s+else)'
    unless: '\bpatent'
    requires:
      nearby: ['\bpatent']
    message: "Exclusivity claim without proof — same risk as «единственный» under 38-FZ"
    replacement: "say what you do («We check every electrical line with a thermal camera»)"
    source: "38-ФЗ ст. 5 ч. 3 п. 1; 135-ФЗ ст. 14.3 п. 1"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "The only studio that checks wiring with a thermal camera"
      good: "We check every electrical line with a thermal camera"

  - id: COPY-L-CMP-01
    title: "Сравнение с другими: «в 2 раза быстрее», «дешевле, чем у других», «в отличие от конкурентов»"
    level: error
    claim_class: [comparison]
    exclude_slot_types: [testimonial-quote]
    requires_no_fact: true
    pattern: '%B%(?:(?:быстрее|дешевле|выгоднее|над[её]жнее|точнее|мощнее|эффективнее|долговечнее|экономичнее|прочнее|тише|легче|лучше|дольше|удобнее|безопаснее|качественнее|вкуснее|ярче)\s*,?\s*(?:чем\s+(?:у\s+|в\s+)?(?:других|остальных|конкурент\w*|аналог\w*|обычн\w*|традиционн\w*|большинств\w*|по\s+рынку|в\s+среднем|[«"])|аналог\w*|конкурент\w*|других%E%|остальных%E%)|в\s+\d+(?:[.,]\d+)?\s+раз[а]?%E%\s+(?:быстрее|дешевле|больше|меньше|выше|ниже|дольше|эффективнее|лучше|точнее|выгоднее)|в\s+(?:два|три|четыре|пять|десять|несколько)\s+раза?%E%\s+(?:быстрее|дешевле|больше|меньше|выше|ниже|дольше|эффективнее|лучше)|на\s+\d+(?:[.,]\d+)?\s?%\s+(?:быстрее|дешевле|больше|меньше|выше|ниже|эффективнее|дольше|точнее|выгоднее)|в\s+отличие\s+от\s+(?:других|остальных|конкурент\w*|обычн\w*|многих|большинства)|(?:дешевле|выгоднее|быстрее|лучше|удобнее)\s*,?\s*(?:(?:и|,)\s*(?:быстрее|лучше|дешевле|удобнее)\s+)*(?:чем\s+)?(?:штатн\w*|наём\w*|найм\w*|фрилансер\w*|агентств\w*|собственн\w*\s+(?:сотрудник|отдел)\w*|(?:дизайнер|маркетолог|юрист|бухгалтер|программист)\w*\s+в\s+штате))'
    unless: 'по\s+(?:данным|результатам|итогам)\s+(?!(?:наших|своих)?\s*(?:гост|клиент))|согласно|(?:замер|тест|испытани|исследовани|сравнени)\w*\s+(?:от|за|в|по)\s|\(\s*(?:19|20)\d{2}'
    requires:
      nearby: ['по\s+(?:данным|результатам|итогам)\s', 'согласно', '(?:замер|тест|испытани|исследовани|сравнени)\w*\s+(?:от|за|в|по)\s', '\(\s*(?:19|20)\d{2}']
      fact_fields: [basis.criterion]
    message: "Сравнение с товарами других без сопоставимого критерия, метода и даты — некорректное сравнение и недостоверное преимущество; «в N раз» без базы сравнения — то же"
    replacement: "свой результат без сравнения («двушку 54 м² сдали за 47 рабочих дней при 50 по договору») или сравнение с методом, датой и документом рядом (basis: criterion, compared_with)"
    source: "38-ФЗ ст. 5 ч. 2 п. 1, ч. 3 п. 1; Пленум ВАС № 58 п. 9, 29; ФАС, приказ № 1079/23 (прил. 2 п. 3: несопоставимые характеристики); 135-ФЗ ст. 14.3 п. 2–3; Пензенское УФАС (2019, «Мы лучше чем ЛОМБАРД»); «дешевле штатного дизайнера» — [V:1UVkeqxuNRs 20:38] (дайджест W2)"
    evidence: "[стандарт] + [правоприменение]"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 2 п. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "Пленум ВАС РФ № 58 от 08.10.2012 п. 9", edition: "действует", checked: "2026-09-24"}
      - {ref: "135-ФЗ ст. 14.3 п. 2–3", edition: "ред. от 08.03.2026", checked: "2026-09-24"}
    examples:
      bad: "Ремонт в 2 раза быстрее, чем у других студий"
      good: "Двушку 54 м² сдали за 47 рабочих дней при 50 по договору"

  - id: COPY-L-CMP-02
    title: "Порочащие сведения о конкурентах: «другие студии завышают смету», «конкуренты обманывают»"
    level: warning
    claim_class: [comparison]
    pattern: '%B%(?:конкурент\w*|други[ех]\s+(?:компани|студи|бригад|магазин|сервис|агентств|клиник|школ|застройщик|банк|подрядчик|мастер)\w*|остальные\s+(?:компании|студии|игроки|подрядчики))\s+(?:[а-яё]+\s+){0,3}?(?:обманыва\w*|накручива\w*|завыша\w*|халтур\w*|экономят\s+на|скрыва\w*|навязыва\w*|вымогают|пропадают|кида\w*)'
    message: "Негатив о конкурентах без проверяемых фактов порочит деловую репутацию и даёт некорректное сравнение"
    replacement: "говорить о своём правиле («смету фиксируем в договоре до начала работ»); о рынке — только с данными и источником"
    source: "38-ФЗ ст. 5 ч. 2 п. 1–2; 135-ФЗ ст. 14.1, 14.3 п. 3"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 2 п. 2", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "135-ФЗ ст. 14.3 п. 3", edition: "ред. от 08.03.2026", checked: "2026-09-24"}
    examples:
      bad: "Другие студии завышают смету после начала работ"
      good: "Смету фиксируем в договоре до начала работ"

  - id: COPY-L-CMP-03
    title: "Сравнение на английском: «3x faster than other CRMs», «unlike other agencies»"
    level: error
    lang: en
    claim_class: [comparison]
    exclude_slot_types: [testimonial-quote]
    requires_no_fact: true
    pattern: '\b(?:(?:faster|cheaper|better|easier|safer|stronger|quicker)\s+than\s+(?:other|any\s+other|competitors?|the\s+competition|traditional|typical|average|["“])|\d+(?:\.\d+)?x\s+(?:faster|more|better|cheaper|higher|less)%E%|unlike\s+(?:other|most|traditional|competitors?))'
    unless: 'according\s+to|based\s+on|in\s+(?:our|independent)\s+tests?|benchmark|\(\s*(?:19|20)\d{2}'
    requires:
      nearby: ['according\s+to', 'based\s+on', 'in\s+(?:our|independent)\s+tests?', 'benchmark']
      fact_fields: [basis.criterion]
    message: "Comparison with competitors without a comparable criterion, method and date"
    replacement: "state your own result with method and date («Imports 10,000 contacts in under two minutes, our test, May 2026»)"
    source: "38-ФЗ ст. 5 ч. 2 п. 1; Пленум ВАС № 58 п. 9"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 2 п. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "3x faster than other CRMs"
      good: "Imports 10,000 contacts in under two minutes"

  # ── 2. Цены, «бесплатно», скидки, акции, валюта ──────────────────────────────────────────────────────────────────
  - id: COPY-L-FREE-01
    title: "«Бесплатно», «в подарок», «0 ₽» без условия рядом"
    level: warning
    claim_class: [price-discount]
    exclude_slot_types: [testimonial-quote]
    pattern: '%B%(?:бесплатн\w*|безвозмездн\w*|в\s+подарок|даром%E%|за\s+0\s?(?:₽|руб\w*)|подар(?:им|ок|ки)%E%)'
    unless: 'при\s+(?:заказе|покупке|оплате|условии|заключении|подписке|оформлении|сумме|записи)|от\s+\d|если\s|для\s+(?:новых|первых|всех|участников|держателей|владельцев|клиентов\s+с)|с\s+(?:покупкой|заказом|договором)|до\s+\d|в\s+пределах|в\s+черте\s+[а-яё]+|в\s+течение|первы[ейх]\s+\d+|\d+\s+перв\w+\s+[а-яё]+|без\s+(?:условий|обязательств|доплат|скрытых|ограничений)|входит\s+в\s+(?:стоимость|цену)|включ[её]н\w*\s+в\s+(?:стоимость|цену)|звон\w*|8[\s-]?800|горяч\w+\s+лини\w*'
    requires:
      nearby: ['при\s+(?:заказе|покупке|оплате|условии|заключении|подписке|оформлении|сумме|записи)', 'от\s+\d', 'если\s', 'в\s+пределах', 'в\s+черте\s+[а-яё]+', 'в\s+течение', 'без\s+(?:условий|обязательств|доплат|ограничений)', 'входит\s+в\s+(?:стоимость|цену)', '\d+\s+перв\w+\s+[а-яё]+']
      fact_conditions: true
    message: "«Бесплатно» при условиях без самих условий рядом — умолчание существенной информации; условие из facts.yaml (qualifier) обязано стоять рядом"
    replacement: "условие в том же предложении или строке у кнопки: «Замер и смета бесплатно в пределах города», «Доставка бесплатно при заказе от 3 000 ₽»; без условий — так и сказать"
    source: "38-ФЗ ст. 5 ч. 7, ч. 3 п. 4; Кемеровское УФАС, решение № ТМ/5692/25 от 03.06.2025 («Бесплатные платежи и снятие наличных в любых банкоматах» без лимитов); Пленум ВАС № 58 п. 28"
    evidence: "[стандарт] + [правоприменение]"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 7", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 4", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Бесплатная доставка по городу"
      good: "Доставка по городу бесплатно при заказе от 3 000 ₽"

  - id: COPY-L-FREE-02
    title: "«Free» на английском без условия"
    level: warning
    lang: en
    claim_class: [price-discount]
    exclude_slot_types: [testimonial-quote]
    pattern: '\b(?:free%E%(?![- ](?:of\s+charge\s+calls?|call))(?!\s+(?:slots?|spots?|seats?|places?|tables?|rooms?|time|days?|hours?|minutes?|dates?)%E%)|on\s+the\s+house|complimentary)'
    unless: '\bwith\b|\bwhen\b|\bif\b|\bwithin\b|\bon\s+orders?\b|\bover\s+[$€£]?\d|\bfor\s+(?:the\s+first|new|\d+)|\bno\s+(?:strings|conditions|credit\s+card)|\btrial\b|\buntil\b|\bup\s+to\b'
    requires:
      nearby: ['\bon\s+orders?\b', '\bover\s+[$€£]?\d', '\bfor\s+(?:the\s+first|new|\d+)', '\bno\s+(?:strings|conditions|credit\s+card)', '\btrial\b', '\bwhen\b', '\bif\b', '\bwithin\b']
      fact_conditions: true
    message: "«Free» with conditions not stated next to it — omission of material terms"
    replacement: "state the condition in the same line («Free shipping on orders over $50»)"
    source: "38-ФЗ ст. 5 ч. 7 (сайт для РФ); профиль ЕС/США — те же требования раскрытия условий"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 7", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Free shipping"
      good: "Free shipping on orders over $50"
      good_en: "Pick a free slot for the measurement visit"

  - id: COPY-L-TERMS-01
    title: "«Подробности уточняйте у менеджера» вместо условий"
    level: warning
    claim_class: [price-discount, purchase-terms]
    pattern: '%B%(?:подробност\w*|детал\w*|услови\w*|информаци\w*)\s+(?:акции\s+|предложения\s+)?(?:уточняйте|узнавайте|спрашивайте|смотрите|читайте)\s+(?:у\s+(?:менеджер|продавц|консультант|оператор|администратор|сотрудник)\w*|по\s+телефону|на\s+сайте|в\s+(?:офисе|магазине|салоне|приложении))'
    message: "Отсылка «подробности уточняйте…» не заменяет существенных условий: срок, кто участвует, исключения должны быть в самом тексте"
    replacement: "перенести условия в текст: срок, для кого, на что не действует («Скидка 50 % на летнюю обувь до 15 ноября; не действует на товары с жёлтыми ценниками»)"
    source: "38-ФЗ ст. 5 ч. 7; Алтайское краевое УФАС, решение № СС/2357/24 от 20.03.2024 по делу № 022/05/5-85/2024 («-50% НА ВСЁ! Подробности действующих акций уточняйте у продавцов-консультантов»); Пленум ВАС № 58 п. 24 (для финансовых услуг)"
    evidence: "[правоприменение]"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 7", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "Пленум ВАС РФ № 58 от 08.10.2012 п. 24", edition: "действует", checked: "2026-09-24"}
    examples:
      bad: "Скидка 50 % на всё! Подробности уточняйте у продавцов-консультантов"
      good: "Скидка 50 % на летнюю обувь до 15 ноября; не действует на товары с жёлтыми ценниками"

  - id: COPY-L-PRICE-01
    title: "Скидка «на всё», «на все товары», «на все поездки» при исключениях"
    level: warning
    claim_class: [price-discount]
    pattern: '%B%(?:[-–—−]\s?\d+\s?%|скидк\w*\s+(?:до\s+)?\d+\s?%|\d+\s?%\s+скидк\w*)\s+(?:[а-яё]+\s+){0,2}?на\s+(?:вс[её]%E%|все\s+[а-яё]+|весь\s+ассортимент|всю\s+продукци\w*|любой\s+[а-яё]+|любые\s+[а-яё]+)'
    unless: 'кроме|за\s+исключением|не\s+действует|не\s+распространяется|исключени\w*'
    requires:
      nearby: ['кроме', 'за\s+исключением', 'не\s+действует', 'не\s+распространяется', 'исключени\w*', 'без\s+исключений']
    message: "«Скидка на всё» читается буквально: если есть исключения, срок или условия участия — их отсутствие вводит в заблуждение"
    replacement: "«−50 % на всё, кроме товаров с жёлтыми ценниками, до 15 ноября» или «на всё без исключений» (если это так и есть факт)"
    source: "38-ФЗ ст. 5 ч. 7, ч. 3 п. 4; Алтайское краевое УФАС, СС/2357/24 от 20.03.2024 (ZENDEN, «-50% на всё»); Марийское УФАС, решение от 22.12.2025 по делу № 012/05/5-1030/2025 («Скидка 50% на все поездки с ВТБ»)"
    evidence: "[правоприменение]"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 7", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 4", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "−50 % на всё до конца недели"
      good: "−50 % на всё, кроме товаров с жёлтыми ценниками, до 15 ноября"

  - id: COPY-L-PRICE-02
    title: "«Скидка до N %», «кэшбэк до 100 %», «выгода до …» без того, на что максимум"
    level: warning
    claim_class: [price-discount]
    pattern: '%B%(?:скидк\w*|кэшб[эе]к\w*|кешб[эе]к\w*|выгод\w*|экономи\w*)\s+до\s+[-–—−]?\d+(?:[.,]\d+)?\s?(?:%|₽|руб\w*|тыс\w*)|%B%до\s+[-–—−]\d+\s?%'
    unless: 'на\s+(?:[а-яё]+\s+){0,3}?(?:категори|товар|модел|позици|тариф|коллекци)\w*|при\s|если\s|максимальн\w*|не\s+более|в\s+месяц|лимит\w*'
    requires:
      nearby: ['на\s+(?:[а-яё]+\s+){0,3}?(?:категори|товар|модел|позици|тариф|коллекци)\w*', 'при\s', 'если\s', 'максимальн\w*', 'не\s+более', 'лимит\w*']
    message: "«До N %» — максимум: без того, на что он действует и какие лимиты, реклама умалчивает существенные условия"
    replacement: "«Кэшбэк 5 % на все покупки, не более 5 000 ₽ в месяц»; «скидка до 40 % — на 12 моделей прошлой коллекции»"
    source: "38-ФЗ ст. 5 ч. 7, ч. 3 п. 4; Кемеровское УФАС, ТМ/5692/25 от 03.06.2025 («Суперкэшбэк до 100%» без лимита 5 000 ₽); Московское областное УФАС, решение от 04.07.2025 по делу № 050/05/5-1138/2025 («Скидки до 50% по карте…»)"
    evidence: "[правоприменение]"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 7", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Кэшбэк до 100 % за покупки"
      good: "Кэшбэк 5 % на все покупки, не более 5 000 ₽ в месяц"

  - id: COPY-L-PRICE-03
    title: "Цена «от» без единицы и того, что в неё входит"
    level: info
    claim_class: [price-discount]
    pattern: '%B%от\s+\d[\d\s]*(?:[.,]\d+)?\s?(?:₽|руб\w*|р\.)'
    unless: 'за\s+\S+|/\s?\S+|в\s+(?:месяц|час|день|сутки|год|мес)|при\s|включа\w*|входит|без\s+материал\w*|под\s+ключ|в\s+зависимости|зависит|комплектаци\w*|объ[её]м\w*|площад\w*'
    requires:
      nearby: ['за\s+(?:м²|м2|кв|час|единиц|шт|штук|месяц|год|день|сутки|человек|урок|заняти|услуг|объект|проект)\w*', '/\s?(?:мес|месяц|год|час|м²|м2|шт|чел|урок)', 'в\s+(?:месяц|час|день|сутки|год|мес)%E%', 'комнат\w*', 'санузл\w*', 'площад\w*', 'комплектаци\w*', 'без\s+материал\w*', '\d+\s?(?:м²|м2|кв\.?\s?м)']
      nearby_scope: section
    message: "Цена «от» — минимальная: без единицы и состава (за что, какой объём) читатель считает её ценой своего заказа"
    replacement: "«Ремонт под ключ — от 9 800 ₽ за м² без материалов»; минимальная цена — реальная, из facts.yaml"
    source: "38-ФЗ ст. 5 ч. 3 п. 4, ч. 7; ЗоЗПП ст. 10 п. 2 (цена и условия приобретения)"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 4", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "ЗоЗПП ст. 10 п. 2", edition: "ред. от 28.12.2025, с изм. от 17.02.2026", checked: "2026-09-24"}
    examples:
      bad: "Ремонт квартир от 5 000 ₽"
      good: "Ремонт под ключ — от 9 800 ₽ за м² без материалов"

  - id: COPY-L-PRICE-04
    title: "Старая, «зачёркнутая» цена: только реально действовавшая, с периодом в facts.yaml"
    level: warning
    claim_class: [price-discount]
    requires_no_fact: true
    pattern: '%B%(?:старая\s+цена|прежняя\s+цена|обычная\s+цена|было\s+\d|цена\s+без\s+скидки|вместо\s+\d[\d\s]*\s?(?:₽|руб\w*))'
    requires:
      fact_fields: [valid.from]
    message: "Прежняя цена — утверждение о цене и размере скидки: она должна реально действовать; у факта старой цены нужен период (valid.from)"
    replacement: "старая цена — отдельным фактом с периодом действия (слот price-old); нет периода — показывать только текущую цену"
    source: "38-ФЗ ст. 5 ч. 3 п. 4; B2 03 (price-old); профиль ЕС — Директива 98/6/EC ст. 6a"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 4", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Было 11 900 ₽, стало 8 900 ₽"
      good: "8 900 ₽ для первых 300 ламп"
      fact: {id: price-old-noperiod, kind: price, claim_class: [price-discount], verbatim: ["Было 11 900 ₽, стало 8 900 ₽"], canonical: "Было 11 900 ₽, стало 8 900 ₽."}

  - id: COPY-L-PRICE-05
    title: "«Цена по запросу», «стоимость уточняйте», «договорная» без объяснения"
    level: warning
    claim_class: [price-discount]
    genres: [landing, site-page, meta]
    pattern: '%B%(?:(?:цен\w*|стоимост\w*)\s+(?:по\s+запросу|уточняйте|договорн\w*|обсуждается|индивидуальн\w*|рассчитывается\s+индивидуальн\w*)|по\s+запросу\s+цен\w*)'
    unless: 'зависит\s+от|зависят\s+от|от\s+ч[её]го|после\s+(?:замера|осмотра|расч[её]та|сметы)|по\s+смете|курс\w*|от\s+\d'
    requires:
      nearby: ['зависит\s+от', 'зависят\s+от', 'после\s+(?:замера|осмотра|расч[её]та|сметы)', 'по\s+смете', 'от\s+\d[\d\s]*\s?(?:₽|руб)']
    message: "Потребителю цена нужна в информации о товаре и услуге (в рублях); «по запросу» допустимо, когда цену нельзя дать без искажения, — с объяснением, от чего она зависит, и ориентиром «от …»"
    replacement: "«от 9 800 ₽ за м²; итог — по смете после бесплатного замера: зависит от площади и материалов»"
    source: "ЗоЗПП ст. 10 п. 2 (цена в рублях и условия приобретения); 38-ФЗ ст. 5 ч. 7; Яндекс (Сливинский, 12.2025): цену не прятать, исключения — с объяснением [V:AbqU-GxAYs8 1:05:28] (дайджест W2)"
    law:
      - {ref: "ЗоЗПП ст. 10 п. 2", edition: "ред. от 28.12.2025, с изм. от 17.02.2026", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 5 ч. 7", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Дизайн-проект кухни, цена по запросу"
      good: "Дизайн-проект кухни: цена зависит от площади и материалов, ориентир — от 25 000 ₽"

  - id: COPY-L-CUR-01
    title: "Цена только в иностранной валюте"
    level: error
    lang: ru
    claim_class: [price-discount]
    pattern: '(?:[$€£]\s?\d[\d\s.,]*|\d[\d\s.,]*\s?(?:[$€£]|usd%E%|eur%E%|gbp%E%|долл\w*|евро%E%))'
    unless: '₽|руб\w*|%B%р\.'
    message: "Стоимостные показатели в рекламе — в рублях; иностранная валюта — только дополнительно"
    replacement: "«2 490 ₽ в месяц ($29)»"
    source: "38-ФЗ ст. 5 ч. 7.1"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 7.1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Тариф Про — $29 в месяц"
      good: "Тариф Про — 2 490 ₽ в месяц ($29)"

  - id: COPY-L-PROMO-01
    title: "Розыгрыш, конкурс с покупкой (стимулирующее мероприятие): сроки и источник правил"
    level: error
    claim_class: [promo-deadline]
    pattern: '%B%(?:розыгрыш\w*|разыгрыва\w*|разыграем|конкурс\w*|лотере\w*|выиграй(?:те)?%E%|призов\w*\s+фонд\w*|шанс\s+выиграть)'
    unless: 'правил\w*|организатор\w*|https?://|www\.|\.ru%E%|\.рф%E%'
    requires:
      nearby_all: ['(?:до|по)\s+\d{1,2}[.\s]|\d{1,2}\s+(?:январ|феврал|март|апрел|ма[яй]|июн|июл|август|сентябр|октябр|ноябр|декабр)', 'правил\w*|организатор\w*|https?://|www\.|\.ru%E%|\.рф%E%']
    message: "Реклама розыгрыша или конкурса с условием покупки — сроки проведения и источник информации об организаторе, правилах, призах (адрес сайта, телефон)"
    replacement: "«Розыгрыш кофемашины среди покупателей с 1 по 30 ноября; правила и организатор — на сайте …»"
    source: "38-ФЗ ст. 9; Пленум ВАС № 58 п. 27 (достаточно источника: сайт, телефон)"
    law:
      - {ref: "38-ФЗ ст. 9", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "Пленум ВАС РФ № 58 от 08.10.2012 п. 27", edition: "действует", checked: "2026-09-24"}
    examples:
      bad: "Покупайте кофе и участвуйте в розыгрыше кофемашины"
      good: "Розыгрыш кофемашины с 1 по 30 ноября, правила и организатор — на сайте kofe-primer.ru"

  - id: COPY-L-PROMO-02
    title: "Срочность без даты: «только сегодня», «успейте», «акция заканчивается»"
    level: warning
    claim_class: [promo-deadline]
    pattern: '%B%(?:только\s+сегодня|только\s+сейчас|успей(?:те)?%E%|осталось\s+\d+\s+(?:час|дн|минут)\w*|акция\s+(?:скоро\s+)?заканчива\w*|последний\s+день\s+акции|предложение\s+ограничено)'
    unless: '\d{1,2}[.:]\d{2}|\d{1,2}\s+(?:январ|феврал|март|апрел|ма[яй]|июн|июл|август|сентябр|октябр|ноябр|декабр)\w*|(?:до|по)\s+\d{1,2}[.\s]'
    requires:
      nearby: ['\d{1,2}[.:]\d{2}', '\d{1,2}\s+(?:январ|феврал|март|апрел|ма[яй]|июн|июл|август|сентябр|октябр|ноябр|декабр)\w*', '(?:до|по)\s+\d{1,2}[.\s]']
      fact_fields: [valid.until]
    message: "Ограничение по сроку — утверждение о возможности купить в течение срока: нужна реальная дата окончания (valid.until в facts.yaml)"
    replacement: "«Скидка 10 % действует до 31 октября 2026 года»; таймер — только до этой даты"
    source: "38-ФЗ ст. 5 ч. 3 п. 3; ux 06/04 §8.1 (ложная срочность); x-never-claim-defaults nc-deadline (B2); формулы 4U и PAS закладывают срочность — только реальная (01-foundations/formulas.yaml, 03 §2)"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 3", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Успейте записаться, мест мало"
      good: "Запись на курс открыта до 31 октября 2026 года"

  - id: COPY-L-SCAR-01
    title: "Дефицит: «осталось 3 места», «последние экземпляры» без живого остатка"
    level: warning
    claim_class: [availability-scarcity]
    requires_no_fact: true
    pattern: '%B%(?:остал(?:ось|ись|ась)\s+(?:всего\s+|только\s+)?\d+\s+(?:шт|мест|товар|билет|комплект|экземпляр|ламп|квартир|путёв|путев)\w*|последн(?:ие|яя|ий)\s+(?:\d+\s+)?(?:мест|штук|экземпляр|квартир|билет)\w*)'
    unless: 'обновлен\w*|на\s+\d{1,2}[.:]\d{2}|в\s+реальном\s+времени|по\s+данным\s+(?:склада|системы)'
    requires:
      nearby: ['обновлен\w*', 'на\s+\d{1,2}[.:]\d{2}', 'в\s+реальном\s+времени', 'по\s+данным\s+(?:склада|системы)']
      fact_fields: [valid.until]
    message: "Остаток — утверждение о возможности купить: статичное «осталось N» недостоверно, нужен живой источник и время снимка"
    replacement: "остаток из системы с отметкой времени («Мест на октябрь: 3, обновлено 24.09.2026 в 18:00») или убрать"
    source: "38-ФЗ ст. 5 ч. 3 п. 3; ux 06/04 §3.4, §8.1 (ложный дефицит); B2 nc-scarcity; 4U/PAS — дефицит только из данных (01-foundations/03 §2)"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 3", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Осталось 3 места на октябрь"
      good: "Мест на октябрь: 3, обновлено 24.09.2026 в 18:00"

  # ── 3. Гарантии, возврат, условия покупки ───────────────────────────────────────────────────────────────────────
  - id: COPY-L-GUAR-01
    title: "Гарантия результата, дохода, трудоустройства, позиций, выздоровления"
    level: error
    claim_class: [guarantee, forecast]
    exclude_slot_types: [testimonial-quote]
    forbid: true
    pattern: '(?<!не\s)(?<!без\s)%B%(?:(?:гарантир\w*|гаранти(?:я|и|ю|ей)%E%|100\s?%\s+гаранти\w*)\s+(?:[а-яё]+\s+){0,2}?(?:результат\w*|успех\w*|эффект\w*|выздоровлени\w*|излечени\w*|похудени\w*|трудоустройств\w*|работ[уы]\s+после|доход\w*|прибыл\w*|заработ\w*|окупаемост\w*|продаж\w*|заявк\w*|позици\w*|топ\w*|(?:1|перв\w*)\s+мест\w*|рост\w*)|(?:выведем|выводим|выведу|выйдете)\s+(?:ваш\w*\s+)?(?:сайт\w*\s+|бизнес\w*\s+)?в\s+топ\w*)'
    message: "Гарантия результата, который зависит не только от исполнителя, — недостоверное обещание; в медицине и финансах — прямой запрет"
    replacement: "обещать своё действие и условия: «вернём оплату за курс, если после 3 уроков решите не продолжать»; результат — фактом о типичных клиентах"
    source: "38-ФЗ ст. 5 ч. 3 п. 2, 6, ч. 7; ст. 24 ч. 1 п. 8, ч. 4 (лекарства, медизделия); ст. 28 ч. 2 п. 1 (финансы); x-never-claim-defaults nc-forecast, nc-income; SEO: «гарантируем топ» — Google, Search Off the Record [V:i4jDc58ofH4 11:10] (дайджест W2)"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 6", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 24 ч. 1 п. 8", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 28 ч. 2 п. 1", edition: "ред. от 04.08.2026 (ч. 2 — ред. 479-ФЗ от 26.12.2024)", checked: "2026-09-24"}
    examples:
      bad: "Гарантируем результат уже через месяц"
      good: "Вернём оплату за курс, если после 3 уроков решите не продолжать"

  - id: COPY-L-GUAR-02
    title: "Гарантийный срок без того, на что и по какому документу"
    level: warning
    claim_class: [guarantee]
    exclude_slot_types: [testimonial-quote]
    pattern: '%B%гаранти[яи]\s+(?:\d+|на\s+\d+|до\s+\d+|один|два|три|пять|десять)\s*(?:год|лет|мес|недел|дн)\w*|%B%\d+\s+(?:год\w*|лет|месяц\w*)\s+гарантии'
    unless: 'на\s+(?:работы|монтаж|материал\w*|оборудовани\w*|товар\w*|издели\w*|двигател\w*|корпус|все\s+работы|детали)|по\s+договору|в\s+договоре|договор\w*|услови\w*\s+гарантии|гарантийн\w*\s+талон'
    requires:
      nearby: ['на\s+(?:работы|монтаж|материал\w*|оборудовани\w*|товар\w*|издели\w*)', 'по\s+договору', 'договор\w*', 'услови\w*\s+гарантии', 'гарантийн\w*\s+талон']
      fact_fields: [source.document]
    message: "Гарантийные обязательства — утверждение о договоре: рядом — на что гарантия и где условия; у факта — документ"
    replacement: "«Гарантия 3 года на работы — по договору, пункт 7.2»"
    source: "38-ФЗ ст. 5 ч. 3 п. 6; ЗоЗПП ст. 10 п. 2 (гарантийный срок), ст. 19 п. 1"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 6", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "ЗоЗПП ст. 19 п. 1", edition: "ред. от 28.12.2025, с изм. от 17.02.2026", checked: "2026-09-24"}
    examples:
      bad: "Гарантия 3 года"
      good: "Гарантия 3 года на работы — по договору"

  - id: COPY-L-GUAR-03
    title: "«Вернём деньги», «деньги назад», «без риска» без срока и условий"
    level: warning
    claim_class: [guarantee]
    exclude_slot_types: [testimonial-quote]
    pattern: '(?<!не\s)%B%(?:верн[её]м\s+(?:деньги|оплату|стоимость|средства|100\s?%)|деньги\s+назад|возврат\s+(?:денег|средств|оплаты)%E%|без\s+риска%E%)'
    unless: 'если\s|в\s+течение\s+\d|\d+\s+(?:дн|недел|мес|рабоч)\w*|при\s+(?:условии|отказе|возврате)|до\s+(?:начала|старта|\d)|услови\w*'
    requires:
      nearby: ['если\s', 'в\s+течение\s+\d', '\d+\s+(?:дн|недел|мес|рабоч)\w*', 'при\s+(?:условии|отказе|возврате)', 'услови\w*']
      fact_fields: [source.document]
    message: "Обещание вернуть деньги — условие договора: срок, случай и порядок — рядом"
    replacement: "«Вернём оплату в течение 10 дней, если откажетесь до начала работ»"
    source: "38-ФЗ ст. 5 ч. 3 п. 4–6, ч. 7"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 7", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Не понравится — вернём деньги"
      good: "Вернём оплату в течение 10 дней, если откажетесь до начала работ"

  - id: COPY-L-GUAR-04
    title: "«Money-back guarantee», «risk-free» без срока и условий"
    level: warning
    lang: en
    claim_class: [guarantee]
    exclude_slot_types: [testimonial-quote]
    pattern: '\b(?:money[- ]back%E%|full\s+refund|risk[- ]free|no\s+questions\s+asked)'
    unless: 'within\s+\d+|\d+[- ]days?|\bif\s|\bwhen\s|terms|conditions'
    requires:
      nearby: ['within\s+\d+', '\d+[- ]days?', '\bif\s', 'terms', 'conditions']
    message: "Money-back promise without period and conditions next to it"
    replacement: "«Full refund within 30 days if you cancel before the first session»"
    source: "38-ФЗ ст. 5 ч. 7; профиль США — FTC (раскрытие условий)"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 7", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Try it risk-free"
      good: "Full refund within 30 days if you cancel before the first session"

  - id: COPY-L-GUAR-05
    title: "Общая «гарантия»: «100 % гарантия», «гарантия качества» без того, на что, срока и что будет при нарушении"
    level: info
    claim_class: [guarantee]
    exclude_slot_types: ['nav-*', 'footer-*', 'breadcrumb*', testimonial-quote]
    pattern: '%B%(?:100\s?%\s+гаранти\w*|гаранти[яи]\s+качеств\w*|гарантир\w+\s+(?:высок\w+\s+|отличн\w+\s+)?качеств\w*)'
    unless: '\d+\s+(?:год|лет|мес|недел|дн)\w*|переделаем|исправим|верн[её]м|договор\w*|гарантийн\w*\s+(?:срок|талон)'
    requires:
      nearby: ['\d+\s+(?:год|лет|мес|недел|дн)\w*', 'переделаем', 'исправим', 'верн[её]м', 'договор\w*', 'гарантийн\w*\s+(?:срок|талон)']
      nearby_scope: unit
    message: "«Гарантия» без предмета, срока и последствия — пустое обещание и сведения о гарантийных обязательствах без содержания: назвать, что гарантируется, на какой срок и что сделаем, если не выполним"
    replacement: "«Гарантия 2 года на монтаж по договору»; «Если после уборки что-то не так — приедем и переделаем бесплатно в течение 48 часов»"
    source: "38-ФЗ ст. 5 ч. 3 п. 6 (гарантийные обязательства), ч. 7 (умолчание); ЗоЗПП ст. 10 п. 2 (гарантийный срок); опыт H/01 (корпус D: «100% гарантия», «Гарантия качества»)"
    evidence: "[мнение]"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 6, ч. 7", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "100% гарантия на натяжные потолки"
      good: "Гарантия 10 лет на полотно и 2 года на монтаж по договору"

  - id: COPY-L-RET-01
    title: "Ограничение прав потребителя: «обмену и возврату не подлежит», «возврат невозможен»"
    level: warning
    claim_class: [purchase-terms]
    pattern: '%B%(?:обмену\s+и\s+возврату\s+не\s+подлеж\w*|возврат\w*\s+(?:не\s+(?:принима|производ|осуществля|предусмотрен)\w*|невозмож\w*)|деньги\s+не\s+возвраща\w*|претензии\s+не\s+принима\w*|возврат\w*\s+(?:только\s+)?при\s+наличии\s+(?:чека|упаковки|бирок))'
    message: "Условие, ограничивающее права потребителя сверх закона, недопустимо и ничтожно; отсутствие чека не лишает права на возврат"
    replacement: "писать правила по закону: «Вернуть заказ можно в течение 7 дней после получения; деньги — в течение 10 дней»; исключения — только установленные законом"
    source: "ЗоЗПП ст. 16 п. 1, п. 2 пп. 4, 10, 14; ст. 26.1 п. 4 (7 дней, 3 месяца без письменной информации, 10 дней на деньги; исключение — товар с индивидуально-определёнными свойствами); ст. 18–19"
    law:
      - {ref: "ЗоЗПП ст. 16 п. 2", edition: "ред. от 28.12.2025, с изм. от 17.02.2026", checked: "2026-09-24"}
      - {ref: "ЗоЗПП ст. 26.1 п. 4", edition: "ред. от 28.12.2025; п. 3–4 частично не соответствуют Конституции (Пост. КС РФ от 17.02.2026 № 7-П) — сверить с юристом", checked: "2026-09-24"}
    examples:
      bad: "Товар обмену и возврату не подлежит"
      good: "Вернуть заказ можно в течение 7 дней после получения; деньги — в течение 10 дней"

  - id: COPY-L-RET-02
    title: "Срок возврата денег при дистанционной продаже больше 10 дней"
    level: error
    claim_class: [purchase-terms]
    pattern: '%B%(?:верн[её]м|возвраща\w*|возврат\w*)\s+(?:(?:е[её]|его|деньги|денежн\w*\s+средств\w*|бронь|предоплат\w*|аванс\w*|оплат\w*|сумм\w*)\s+)?(?:[^.!?\n]{0,30}\s)?в\s+течение\s+(?:1[1-9]|[2-9]\d)\s+(?:календарн\w*\s+)?(?:дн|сут)\w*'
    unless: 'товар\w*\s+надлежащ|обмен\w*|верн(?:уть|ите)\s+товар|возврат\w*\s+товар|получени\w+\s+(?:товар|заказ)|гаранти\w*'
    message: "При дистанционной продаже деньги возвращают не позднее 10 дней с требования покупателя, а отказаться от товара до передачи можно в любое время: срок «в течение 14 дней» сверх закона (и факт, и оферту — поправить)"
    replacement: "«Вернём бронь в течение 10 дней после заявки»; «Отказаться от брони можно в любой момент до получения лампы»"
    source: "ЗоЗПП ст. 26.1 п. 4 (отказ до передачи — в любое время; деньги — не позднее 10 дней с требования); ст. 16 п. 1 (условия, ущемляющие права, недопустимы); опыт H/02 (факт «Кварца» deposit-refund — 14 дней)"
    law:
      - {ref: "ЗоЗПП ст. 26.1 п. 4", edition: "ред. от 28.12.2025; п. 3–4 частично не соответствуют Конституции (Пост. КС РФ от 17.02.2026 № 7-П) — сверить с юристом", checked: "2026-09-24"}
      - {ref: "ЗоЗПП ст. 16 п. 1", edition: "ред. от 28.12.2025, с изм. от 17.02.2026", checked: "2026-09-24"}
    examples:
      bad: "Бронь вернём в течение 14 дней по заявке"
      good: "Бронь вернём в течение 10 дней по заявке"

  - id: COPY-L-DIST-01
    title: "Продажа на сайте (дистанционно): сведения о продавце на странице"
    level: warning
    genres: [landing, site-page]
    once: page
    pattern: '%B%(?:в\s+корзину|оформить\s+заказ|купить\s+(?:онлайн|с\s+доставкой)|доставк\w*\s+по\s+(?:россии|москве|городу|всей)|закажите\s+(?:онлайн|на\s+сайте)|оплат\w*\s+(?:онлайн|картой)\s+на\s+сайте|забронир\w*\s+за\s+\d|предзаказ\w*|внести\s+(?:предоплат|аванс|бронь)\w*)'
    unless: 'огрн\w*|инн%E%|ооо\s*[«"]|%B%ип\s+[а-яё]+'
    requires:
      nearby: ['огрн\w*', 'инн%E%', 'ооо\s*[«"]', '%B%ип\s+[а-яё]+']
      nearby_scope: page
    message: "Реклама товара при дистанционной продаже — с наименованием, местом нахождения и ОГРН продавца (ИП — ФИО и ОГРНИП; самозанятый — ФИО и ИНН); на сайте — те же сведения по ЗоЗПП"
    replacement: "в подвал или у кнопки заказа: «Продавец ООО «…», ОГРН …, адрес …» (факт company-details)"
    source: "38-ФЗ ст. 8 (ред. 302-ФЗ от 10.07.2023); ЗоЗПП ст. 9, 26.1 п. 2; механика сведений о продавце — site"
    law:
      - {ref: "38-ФЗ ст. 8", edition: "ред. от 04.08.2026 (ст. 8 — ред. 302-ФЗ от 10.07.2023)", checked: "2026-09-24"}
      - {ref: "ЗоЗПП ст. 26.1 п. 2", edition: "ред. от 28.12.2025", checked: "2026-09-24"}
    examples:
      bad: "Закажите онлайн: доставка по России за 3 дня"
      good: "Закажите онлайн: продавец ООО «Пример», ОГРН [PLACEHOLDER: ОГРН], доставка по России"

  - id: COPY-L-OFFER-01
    title: "«Не является публичной офертой» — для товаров интернет-магазина не работает"
    level: info
    claim_class: [purchase-terms]
    page_types_except: [landing-lead-services, service-page, services-index-page, specialist-page, location-page]
    pattern: '%B%не\s+является\s+(?:публичной\s+)?офертой'
    message: "Для услуг оговорка согласуется с ГК ст. 437 п. 1; для товаров сведения о товаре в интернете — публичная оферта независимо от цены, кроме явного «не продаётся» (ГК ст. 494 п. 2): цена и условия на карточке должны быть верны"
    replacement: "не опираться на оговорку: держать цены и условия актуальными (факты с valid.until); товар не для продажи — так и написать"
    source: "ГК ст. 437 п. 1–2 (ред. 10.06.2026); ст. 494 п. 1–2 (ред. 34-ФЗ от 18.03.2019)"
    law:
      - {ref: "ГК РФ ст. 437 п. 1", edition: "ред. от 10.06.2026", checked: "2026-09-24"}
      - {ref: "ГК РФ ст. 494 п. 2", edition: "ред. от 24.06.2025, с изм. от 09.06.2026", checked: "2026-09-24"}
    examples:
      bad: "Информация на сайте не является публичной офертой"
      good: "Цены на сайте действуют до 31 октября 2026 года"

  # ── 4. Здоровье, медицина, БАД ──────────────────────────────────────────────────────────────────────────────────
  - id: COPY-L-HEALTH-01
    title: "Лечебные свойства у немедицинского товара или услуги"
    level: error
    claim_class: [health]
    legal_category_except: [medical]
    forbid: true
    pattern: '(?<!не\s)(?<!без\s)%B%(?:леч(?:ит|ат|им|ение|ения|ению|ебн\w*)%E%|вылеч\w*|излеч\w*|исцел\w*|избав(?:ит|ляет|им|ляем|ляют)\s+от\s+(?:болез|бол[иь]|заболеван|недуг|бессонниц|аллерги|простуд|гастрит|остеохондроз|артрит|диабет|давлени|гипертони)\w*|снима(?:ет|ют)\s+(?:бол\w*|воспалени\w*|от[её]к\w*|спазм\w*)|(?:помога|спаса)(?:ет|ют)\s+(?:при|от)\s+(?:болез|заболеван|бол[иь]|простуд|гастрит|артрит|аллерги|диабет|гипертони|остеохондроз)\w*|(?:укрепля|повыша|восстанавлива)(?:ет|ют)\s+иммунитет\w*|профилактик\w*\s+(?:заболеван|болезн|простуд|рака|инфаркт|инсульт)\w*)'
    message: "Указание на лечебные свойства (положительное влияние на течение болезни) допустимо только в рекламе лекарств, медицинских услуг и медизделий"
    replacement: "описать свойство без болезни («тёплый приглушённый свет для вечера»); если продукт медицинский — отрасль medical и оговорка о противопоказаниях"
    source: "38-ФЗ ст. 5 ч. 5 п. 6; для БАД — ст. 25 ч. 1 п. 1, Пленум ВАС № 58 п. 23; x-never-claim-defaults nc-health (B2)"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 5 п. 6", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 25 ч. 1 п. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Солевая лампа лечит бессонницу"
      good: "Солевая лампа даёт тёплый приглушённый свет для вечера"

  - id: COPY-L-HEALTH-02
    title: "Польза для здоровья без испытаний: «бережёт зрение», «безопасно для детей», «гипоаллергенно»"
    level: warning
    claim_class: [health]
    legal_category_except: [medical, dietary-supplements]
    requires_no_fact: true
    pattern: '%B%(?:(?:полезн\w*\s+для|улучша\w*|укрепля\w*|береж[её]т|сохраня\w*|защища\w*)\s+(?:здоровь\w*|зрени\w*|глаз\w*|сердц\w*|сосуд\w*|сустав\w*|нервн\w*|иммунитет\w*)|без\s+(?:усталости|вреда\s+для)\s+(?:глаз|зрени|здоровь)\w*|безопасн\w*\s+для\s+(?:здоровья|детей|глаз|кожи)|гипоаллерген\w*|(?:клинически|научно)\s+доказан\w*)'
    unless: 'по\s+(?:результатам|данным)\s+(?:испытани|исследовани|протокол)\w*|протокол\w*\s+испытани\w*|сертификат\w*|декларац\w*\s+о\s+соответствии'
    requires:
      nearby: ['по\s+(?:результатам|данным)\s+(?:испытани|исследовани|протокол)\w*', 'протокол\w*\s+испытани\w*', 'сертификат\w*', 'декларац\w*\s+о\s+соответствии']
      fact_fields: [source.document]
    message: "Польза для здоровья — потребительское свойство и результат испытаний: без документа недостоверно, а обещание про болезнь — запрет вне медицины"
    replacement: "измеримое свойство с документом («пульсация света ниже 1 % по протоколу испытаний») вместо обещания («бережёт зрение»)"
    source: "38-ФЗ ст. 5 ч. 3 п. 2, 11; ст. 5 ч. 5 п. 6; «Кварц» (B2 02: обещание про глаза)"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 2", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 11", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Лампа бережёт зрение при чтении"
      good: "Пульсация света ниже 1 % по протоколу испытаний"

  - id: COPY-L-MED-01
    title: "Медицинские услуги и изделия: предупреждение о противопоказаниях"
    level: error
    legal_category: [medical]
    once: page
    pattern: '%B%(?:лечени\w*|диагностик\w*|при[её]м\w*\s+(?:врача|специалиста|терапевта|стоматолога|гинеколога|педиатра)|консультаци\w*\s+(?:врача|специалиста|доктора)|операци\w*|имплант\w*|протезирован\w*|удалени\w*\s+(?:зуб|родинк|папиллом|новообразован)\w*|узи%E%|мрт%E%|реабилитаци\w*|вакцинаци\w*|медицинск\w*\s+(?:услуг|издели)\w*)'
    unless: 'противопоказан\w*'
    requires:
      nearby_all: ['противопоказан\w*', '(?:консультаци\w*|консультироваться|проконсультир\w*)\s+(?:со?\s+)?(?:специалист|врач)\w*|инструкци\w*']
      nearby_scope: page
    message: "Реклама медицинских услуг и изделий сопровождается предупреждением о противопоказаниях и необходимости ознакомиться с инструкцией или проконсультироваться со специалистом (не меньше 5 % площади рекламы)"
    replacement: "строка крупным кеглем в первом экране и у цен: «Имеются противопоказания. Необходима консультация специалиста»"
    source: "38-ФЗ ст. 24 ч. 7; Пленум ВАС № 58 п. 22; ФАС, приказ № 1079/23 (прил. 1 п. 15)"
    law:
      - {ref: "38-ФЗ ст. 24 ч. 7", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "Пленум ВАС РФ № 58 от 08.10.2012 п. 22", edition: "действует", checked: "2026-09-24"}
    examples:
      bad: "Лечение кариеса за один визит"
      good: "Лечение кариеса за один визит — имеются противопоказания, необходима консультация специалиста"
      legal_category: [medical]

  - id: COPY-L-MED-02
    title: "Медицина и БАД: случаи излечения и благодарности пациентов"
    level: error
    legal_category: [medical, dietary-supplements]
    pattern: '%B%(?:(?:благодар\w*|спасибо)\s+(?:[а-яё]+\s+){0,3}?(?:врач\w*|доктор\w*|клиник\w*|за\s+(?:лечени|излечени|помощь))|(?:вылечил\w*|излечил\w*|избавил\w*\s+от)|(?:истори|случа|пример)\w*\s+(?:излечени|выздоровлени)\w*)'
    message: "В рекламе лекарств, медицинских услуг и БАД нельзя ссылаться на случаи излечения и приводить благодарности людей"
    replacement: "убрать из рекламных блоков; отзывы — в отдельном разделе отзывов (ФАС не считает их рекламой), без выноса на первый экран"
    source: "38-ФЗ ст. 24 ч. 1 п. 2–3, ч. 3; ст. 25 ч. 1 п. 2–3; ФАС, приказ № 821/23 (разд. 9: отзывы в специальных разделах — не реклама)"
    law:
      - {ref: "38-ФЗ ст. 24 ч. 1 п. 2–3, ч. 3", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 25 ч. 1 п. 2–3", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "ФАС, приказ № 821/23 от 14.11.2023, разд. 9", checked: "2026-09-24"}
    examples:
      bad: "Спасибо доктору — вылечил спину за две недели"
      good: "Приём ведёт невролог с 12-летним стажем"
      legal_category: [medical]

  - id: COPY-L-MED-03
    title: "Медицина: гарантия эффекта и безопасности, «без боли», «без побочных»"
    level: warning
    legal_category: [medical]
    pattern: '%B%(?:без\s+(?:побочн\w*|осложнени\w*|боли|последстви\w*)%E%|безопасн\w*\s+(?:и\s+эффективн\w*\s+)?(?:метод|процедур|лечени|препарат)\w*|100\s?%\s+(?:результат|эффект|безопасн)\w*|безболезненн\w*|гарантир\w*[^.!?\n]{0,40}?(?:безопасност|эффективност|долговечност|результат|отсутстви\w*\s+(?:боли|осложнени))\w*|гаранти[яи]\s+(?:безопасност|эффективност|результат)\w*)'
    message: "Для лекарств и медизделий гарантия действия, безопасности и отсутствия побочных — запрет; для медицинских услуг — недостоверная характеристика без документа"
    replacement: "описать метод и условие («анестезия перед лечением, препарат — по согласованию с врачом»)"
    source: "38-ФЗ ст. 24 ч. 1 п. 8, ч. 4 (медизделия); ст. 5 ч. 3 п. 2 (услуги)"
    law:
      - {ref: "38-ФЗ ст. 24 ч. 1 п. 8, ч. 4", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Удаление зуба без боли и без последствий"
      good: "Перед удалением делаем местную анестезию"
      legal_category: [medical]

  - id: COPY-L-MED-04
    title: "Рекомендации врачей вне рекламы медицинских услуг"
    level: warning
    legal_category_except: [medical]
    claim_class: [health]
    pattern: '%B%(?:(?:врач\w*|стоматолог\w*|педиатр\w*|дерматолог\w*|косметолог\w*)\s+(?:рекоменд\w*|советуют|одобря\w*)|рекомендова\w*\s+(?:врач|стоматолог|педиатр|дерматолог)\w*)'
    message: "Образы медицинских работников — только в рекламе медицинских услуг и средств личной гигиены; рекомендация — сведения, требующие подтверждения"
    replacement: "убрать; если рекомендация реальна — документ и отрасль"
    source: "38-ФЗ ст. 5 ч. 5 п. 4; ч. 3 п. 10"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 5 п. 4", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 10", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Врачи рекомендуют наш матрас при болях в спине"
      good: "Матрас средней жёсткости, высота 22 см"

  - id: COPY-L-MED-05
    title: "Медицина: предположение о болезни у читателя («Кому нужно на приём? С болями в спине…»)"
    level: error
    legal_category: [medical]
    pattern: '%B%(?:(?:если\s+(?:у\s+вас|вас\s+беспоко\w*|вы\s+страда\w*)|вам\s+знаком\w*|беспоко(?:ят|ит)|страдаете|мучают|мучает)[^.!?\n]{0,60}?|кому\s+(?:нужно|показан\w*|стоит\s+(?:прийти|записаться))[^.!\n]{0,80}?)(?:бол[иеья]\w*|бессонниц\w*|давлени\w*|сколиоз\w*|аллерги\w*|тревог\w*|депресси\w*|заболевани\w*|симптом\w*|недомогани\w*|головокружени\w*|расстройств\w*|грыж\w*)'
    message: "Утверждение или предположение, что у читателя есть болезнь или расстройство, в рекламе медицинских услуг и лекарств запрещено; нагнетание проблемы (PAS) здесь — нарушение, а не приём"
    replacement: "назвать услугу и специалиста без диагноза читателю: «Приём ортопеда: осмотр стопы и подбор стелек»"
    source: "38-ФЗ ст. 24 ч. 1 п. 5, ч. 3; Коми УФАС, решение № ПК/1782/24 от 27.03.2024 по делу № 011/05/24-1083/2023 («Кому нужно на приём? Взрослым с болями в шее, позвоночнике…»); A 03 (PAS: нагнетание — не для медицины)"
    evidence: "[стандарт] + [правоприменение]"
    law:
      - {ref: "38-ФЗ ст. 24 ч. 1 п. 5, ч. 3", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Кому нужно на приём? Всем, у кого боли в спине и шее"
      good: "Приём ортопеда: осмотр стопы и подбор стелек"
      legal_category: [medical]

  - id: COPY-L-MED-06
    title: "Медицина: раскрытие метода лечения или диагностики в публичной рекламе"
    level: warning
    legal_category: [medical]
    pattern: '%B%(?:метод\w*|методик\w*|технологи\w*|способ\w*)\s+(?:[а-яё]+\s+){0,2}?(?:лечени|диагностик|профилактик|реабилитаци)\w*'
    message: "Реклама, раскрывающая содержание метода профилактики, диагностики, лечения или реабилитации, допустима только на медицинских выставках и в профессиональных изданиях; услугу по номенклатуре называть можно, метод раскрывать — нет"
    replacement: "назвать услугу («лечение кариеса», «УЗИ щитовидной железы») без описания, как работает метод, и с оговоркой о противопоказаниях"
    source: "38-ФЗ ст. 24 ч. 8; ФАС, приказ № 1079/23 (прил. 1 п. 17: «реклама, в которой раскрывается содержание того или иного метода… подпадает под запрет»); Пленум ВАС № 58 п. 22"
    law:
      - {ref: "38-ФЗ ст. 24 ч. 8", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "ФАС, приказ № 1079/23 от 28.12.2023, прил. 1 п. 17", checked: "2026-09-24"}
    examples:
      bad: "Авторская методика лечения грыжи без операции: воздействуем на диск ударной волной"
      good: "Приём невролога и УЗИ позвоночника — имеются противопоказания, необходима консультация специалиста"
      legal_category: [medical]

  - id: COPY-L-BAD-01
    title: "БАД: «не является лекарственным средством»"
    level: error
    legal_category: [dietary-supplements]
    once: page
    pattern: '%B%(?:бад%E%|биологически\s+активн\w*\s+добавк\w*|добавк\w*|капсул\w*|таблетк\w*|витамин\w*|коллаген\w*|омега|пробиотик\w*|магни[йя]%E%)'
    unless: 'не\s+является\s+лекарствен\w*\s+средств\w*'
    requires:
      nearby_all: ['не\s+является\s+лекарствен\w*\s+средств\w*']
      nearby_scope: page
    message: "Реклама БАД в каждом случае сопровождается предупреждением «не является лекарственным средством» (не меньше 10 % площади)"
    replacement: "строка крупным кеглем рядом с названием и ценой: «Не является лекарственным средством»"
    source: "38-ФЗ ст. 25 ч. 1.1; Московское УФАС, дела № 077/04/14.3-6043/2024, -7262/2024 (Яндекс.Директ, постановления 06–07.2024)"
    evidence: "[стандарт] + [правоприменение]"
    law:
      - {ref: "38-ФЗ ст. 25 ч. 1.1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Магний в капсулах, 60 штук"
      good: "Магний в капсулах, 60 штук — не является лекарственным средством"
      legal_category: [dietary-supplements]

  - id: COPY-L-BAD-02
    title: "БАД: впечатление лекарства — болезнь или симптом рядом с продуктом"
    level: error
    legal_category: [dietary-supplements]
    forbid: true
    pattern: '%B%(?:(?:снижа|нормализу|восстанавлива|укрепля|повыша|очища|вывод|спаса|избавля|подавля)\w*\s+(?:[а-яё]+\s+)?(?:давлени|сахар|холестерин|сустав|печен|почк|иммунитет|сосуд|сердц|кишечник|желуд|щитовидн|зрени|памят|потенци|паразит|шлак|токсин|рост\s+(?:бактери|грибк|вирус))\w*|(?:при|от)\s+(?:гастрит|артрит|артроз|диабет|гипертони|аллерги|простуд|грипп|цистит|простатит|остеохондроз|бессонниц|депресси|паразит)\w*)'
    message: "Название болезни или симптома рядом с БАД как средством — впечатление лекарства и лечебных свойств"
    replacement: "состав и дозировка без обещаний («Магний 300 мг в капсуле»)"
    source: "38-ФЗ ст. 25 ч. 1 п. 1; Пленум ВАС № 58 п. 23; Московское УФАС 2024 («Подавляет рост дрожжевых грибков и патогенных бактерий»)"
    law:
      - {ref: "38-ФЗ ст. 25 ч. 1 п. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "Пленум ВАС РФ № 58 от 08.10.2012 п. 23", edition: "действует", checked: "2026-09-24"}
    examples:
      bad: "Подавляет рост грибков и бактерий в кишечнике"
      good: "Инулин 2 г в порции, 30 порций в банке"
      legal_category: [dietary-supplements]

  # ── 5. Финансы, кредит, доход ────────────────────────────────────────────────────────────────────────────────────
  - id: COPY-L-FIN-01
    title: "Финансовые услуги: наименование лица, оказывающего услугу"
    level: error
    legal_category: [finance]
    once: page
    pattern: '%B%(?:кредит\w*|вклад\w*|депозит\w*|ипотек\w*|за[йё]м\w*|страхов\w*|инвестиц\w*|брокер\w*|лизинг\w*|кэшб[эе]к\w*|кешб[эе]к\w*|доходност\w*)'
    unless: '(?:ооо|ао|пао|нко|мфк|мкк)\s*[«"]|банк\w*\s+[«"]'
    requires:
      nearby: ['(?:ооо|ао|пао|нко|мфк|мкк)\s*[«"]', 'банк\w*\s+[«"]', '%B%ип\s+[а-яё]+\s+[а-яё]\.']
      nearby_scope: page
    message: "Реклама банковских, страховых и иных финансовых услуг содержит наименование (для ИП — ФИО) лица, оказывающего услугу"
    replacement: "«Вклад в АО «Банк …»» — полное наименование в тексте рекламы"
    source: "38-ФЗ ст. 28 ч. 1 (ред. 460-ФЗ от 29.12.2014); ч. 14 (без лицензии — нельзя)"
    law:
      - {ref: "38-ФЗ ст. 28 ч. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Вклад под 16 % годовых на полгода"
      good: "Вклад под 16 % годовых в АО «Банк Пример» на полгода"
      legal_category: [finance]

  - id: COPY-L-FIN-02
    title: "Потребительский кредит или заём с условием: обязательные предупреждения"
    level: error
    claim_class: [income-finance]
    pattern: '%B%(?:кредит\w*|за[йё]м\w*|микроза[йё]м\w*|ипотек\w*|автокредит\w*)[^.!?\n]{0,80}?(?:\d+(?:[.,]\d+)?\s?%|ставк\w*|без\s+(?:переплат|процентов|первоначальн\w*\s+взнос\w*)|одобрени\w*|до\s+\d[\d\s]*\s?(?:₽|руб\w*|тыс\w*|млн\w*)|на\s+\d+\s+(?:мес|лет|год))'
    unless: 'оценивайте\s+свои\s+финансовые\s+возможности'
    requires:
      nearby_all: ['оценивайте\s+свои\s+финансовые\s+возможности\s+и\s+риски']
      nearby: ['изучите\s+все\s+условия\s+(?:кредита|займа)', 'полн\w*\s+стоимост\w*']
      nearby_scope: page
    message: "Реклама потребительского кредита (займа), ипотеки физлиц с любым условием, влияющим на ПСК: предупреждение «Оценивайте свои финансовые возможности и риски» и «Изучите все условия кредита (займа)» со ссылкой на раздел сайта кредитора (или все условия); по 5 % площади"
    replacement: "добавить обе строки дословно; ставки — только вместе с диапазоном ПСК (COPY-L-FIN-03)"
    source: "38-ФЗ ст. 28 ч. 2.1, 3.1, 3.2 (введены 479-ФЗ от 26.12.2024; договоры привести в соответствие до 01.09.2025); Татарстанское УФАС, решение № РВ-08/516 от 23.01.2026"
    evidence: "[стандарт] + [правоприменение]"
    law:
      - {ref: "38-ФЗ ст. 28 ч. 2.1", edition: "ред. 479-ФЗ от 26.12.2024; ред. закона от 04.08.2026", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 28 ч. 3.1", edition: "ред. 479-ФЗ от 26.12.2024", checked: "2026-09-24"}
    examples:
      bad: "Автокредит без переплат — одобрение за 15 минут"
      good: "Автокредит, одобрение за 15 минут: изучите все условия кредита на сайте банка и оценивайте свои финансовые возможности и риски"

  - id: COPY-L-FIN-03
    title: "Ставка кредита без диапазона полной стоимости кредита"
    level: error
    claim_class: [income-finance]
    pattern: '%B%(?:кредит\w*|за[йё]м\w*|ипотек\w*)[^.!?\n]{0,60}?\d+(?:[.,]\d+)?\s?%|%B%\d+(?:[.,]\d+)?\s?%\s+(?:годовых|в\s+год)[^.!?\n]{0,40}?(?:кредит|за[йё]м|ипотек)\w*'
    unless: 'полн\w*\s+стоимост\w*\s+(?:потребительск\w*\s+)?(?:кредит|за[йё]м)\w*|%B%пск%E%'
    requires:
      nearby_all: ['полн\w*\s+стоимост\w*\s+(?:потребительск\w*\s+)?(?:кредит|за[йё]м)\w*|%B%пск%E%']
      nearby_scope: page
    message: "Если в рекламе кредита есть процентная ставка — диапазоны полной стоимости кредита (займа) словами «полная стоимость кредита (займа)» до ставки и шрифтом не меньше"
    replacement: "«Полная стоимость кредита — 18,9–29,4 % годовых. Ставка — от 16,9 %»"
    source: "38-ФЗ ст. 28 ч. 3 (ред. 479-ФЗ от 26.12.2024); Татарстанское УФАС, РВ-08/516 от 23.01.2026"
    evidence: "[стандарт] + [правоприменение]"
    law:
      - {ref: "38-ФЗ ст. 28 ч. 3", edition: "ред. 479-ФЗ от 26.12.2024", checked: "2026-09-24"}
    examples:
      bad: "Ипотека от 5,9 % на новостройки"
      good: "Полная стоимость кредита 6,1–7,4 % годовых, ипотека от 5,9 % на новостройки"

  - id: COPY-L-FIN-04
    title: "«Рассрочка 0 %», «без переплат»: банк или своя рассрочка продавца"
    level: warning
    claim_class: [price-discount, income-finance]
    pattern: '%B%(?:рассрочк\w*|сплит\w*|долями)[^.!?\n]{0,40}?(?:0\s?%|без\s+(?:переплат|процентов|банк\w*))|%B%без\s+переплат%E%'
    unless: 'без\s+участия\s+банк\w*|собственн\w*\s+рассрочк\w*|от\s+(?:магазина|продавца|производителя)|банк\w*\s+[«"]|(?:ооо|ао|пао)\s*[«"]'
    requires:
      nearby: ['без\s+участия\s+банк\w*', 'собственн\w*\s+рассрочк\w*', 'от\s+(?:магазина|продавца|производителя)', 'банк\w*\s+[«"]', '(?:ооо|ао|пао)\s*[«"]']
    message: "Рассрочку через банк реклама подаёт как кредит — со ст. 28 (наименование банка, ПСК, предупреждения); своя рассрочка продавца — коммерческий кредит (ст. 28 не применяется), но условия — рядом"
    replacement: "«Рассрочка от магазина на 12 месяцев без участия банка: 12 платежей по 2 490 ₽» или «Рассрочка от АО «Банк …» — ПСК …»"
    source: "38-ФЗ ст. 28 ч. 1, 2.1–3.1; Пленум ВАС № 58 п. 25 (товарный и коммерческий кредит — не ст. 28); ст. 5 ч. 7; Пензенское УФАС (2019, «Принимаем технику под 0%»)"
    law:
      - {ref: "38-ФЗ ст. 28 ч. 1, 2.1–3.1", edition: "ред. 479-ФЗ от 26.12.2024", checked: "2026-09-24"}
      - {ref: "Пленум ВАС РФ № 58 от 08.10.2012 п. 25", edition: "действует", checked: "2026-09-24"}
    examples:
      bad: "Рассрочка 0 % на 12 месяцев"
      good: "Рассрочка от магазина на 12 месяцев без участия банка: платёж 2 490 ₽ в месяц"

  - id: COPY-L-FIN-05
    title: "Гарантированный или «пассивный» доход, обещание приумножить деньги"
    level: error
    claim_class: [income-finance, forecast]
    legal_category: [finance]
    forbid: true
    pattern: '%B%(?:(?:гарантирован\w*|стабильн\w*|пассивн\w*|над[её]жн\w*)\s+(?:[а-яё]+\s+)?(?:доход\w*|доходност\w*|прибыл\w*)|доход\w*\s+(?:от|до)\s+\d+(?:[.,]\d+)?\s?%\s+в\s+(?:месяц|неделю|день)|(?:удво|утро|приумнож)\w*\s+(?:ваш\w*\s+)?(?:капитал|вложени|сбережени|деньги)\w*)'
    message: "Реклама финансовых услуг не должна гарантировать или обещать будущую доходность, если её нельзя определить при заключении договора (в том числе по прошлым показателям)"
    replacement: "фиксированная ставка вклада — «16 % годовых по вкладу на 6 месяцев» с наименованием банка; иначе — без обещаний"
    source: "38-ФЗ ст. 28 ч. 2 п. 1 (ред. 460-ФЗ); ч. 5 п. 3, 5 (доверительное управление)"
    law:
      - {ref: "38-ФЗ ст. 28 ч. 2 п. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 28 ч. 5 п. 3, 5", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Стабильный доход от 5 % в месяц без риска"
      good: "Вклад на 6 месяцев под 16 % годовых в АО «Банк Пример»"
      legal_category: [finance]

  - id: COPY-L-FIN-06
    title: "Доверительное управление: прошлые результаты"
    level: warning
    legal_category: [finance]
    pattern: '%B%(?:доходност\w*|прибыл\w*|рост\w*)\s+(?:[а-яё]+\s+){0,2}?(?:за\s+(?:прошл\w*|последн\w*|20\d{2})|в\s+20\d{2})'
    unless: 'в\s+прошлом\s+не\s+определя\w*|не\s+гарантиру\w*\s+(?:доход|доходност)\w*\s+в\s+будущем'
    requires:
      nearby: ['в\s+прошлом\s+не\s+определя\w*', 'не\s+гарантиру\w*\s+(?:доход|доходност)\w*\s+в\s+будущем']
    message: "Результаты управления активами — только по расчёту по нормативам Банка России и без заявлений о повторении в будущем; оговорку о прошлых результатах — рядом"
    replacement: "«Доходность фонда за 2025 год — 21 % (расчёт по методике Банка России); результаты в прошлом не определяют доходы в будущем»"
    source: "38-ФЗ ст. 28 ч. 5 п. 2, 5; текст оговорки — практика законодательства об инвестфондах [не проверено: норма о дословной фразе не открывалась]"
    evidence: "[стандарт]; дословная оговорка — [не проверено]"
    law:
      - {ref: "38-ФЗ ст. 28 ч. 5 п. 2, 5", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Доходность фонда за 2025 год — 21 %"
      good: "Доходность фонда за 2025 год — 21 %; результаты в прошлом не определяют доходы в будущем"
      legal_category: [finance]

  - id: COPY-L-FIN-07
    title: "Форекс: обязательное указание о высоком риске"
    level: error
    legal_category: [finance]
    once: page
    exclude_slot_types: ['nav-*', 'footer-*', 'breadcrumb*']
    pattern: '%B%(?:форекс\w*|forex%E%|валютн\w*\s+пар\w*|маржинальн\w*\s+торговл\w*|cfd%E%)'
    unless: 'высокорискованн\w*'
    requires:
      nearby_all: ['являются\s+высокорискованными\s+и\s+могут\s+привести\s+к\s+потере\s+внесенных\s+денежных\s+средств\s+в\s+полном\s+объеме']
      nearby_scope: page
    message: "Реклама сделок с форекс-дилерами содержит дословное указание о высоком риске потери внесённых средств и необходимости ознакомиться с рисками"
    replacement: "дословно: «Предлагаемые к заключению договоры или финансовые инструменты являются высокорискованными и могут привести к потере внесённых денежных средств в полном объёме. До совершения сделок следует ознакомиться с рисками, с которыми они связаны.»"
    source: "38-ФЗ ст. 28 ч. 5.1 (введена 460-ФЗ от 29.12.2014)"
    law:
      - {ref: "38-ФЗ ст. 28 ч. 5.1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Торгуйте валютными парами с плечом"
      good: "Торговля валютными парами: договоры являются высокорискованными и могут привести к потере внесённых денежных средств в полном объёме"
      legal_category: [finance]

  - id: COPY-L-FCST-01
    title: "Обещание роста дохода, выручки или продаж клиента без расчёта: «удвоит выручку», «увеличите продажи»"
    level: error
    claim_class: [forecast, income-finance]
    exclude_slot_types: [testimonial-quote]
    pattern: '%B%(?:удво|утро|учетвер|приумнож|увелич|повыс|нараст)\w*?(?:ит|ят|ите|ишь)%E%\s+(?:[а-яё]+\s+){0,2}?(?:выручк|продаж|прибыл|доход|оборот|заработ|конверси|средн\w+\s+чек|заказ|заявк)\w*|(?:\bwill|\byou(?:''ll|\s+will))\s+(?:double|triple|boost|increase|grow|multiply)\s+(?:your\s+)?(?:revenue|sales|profits?|income|conversions?|orders)\b'
    unless: 'по\s+(?:расч[её]ту|данным|итогам|результатам)|в\s+среднем\s+(?:у|на)|результат\w*\s+зависит|не\s+гарантиру|based\s+on|on\s+average|results?\s+(?:may\s+)?vary'
    requires:
      fact: true
      fact_fields: [basis.criterion, legal.disclaimer]
      nearby: ['по\s+(?:расч[её]ту|данным|итогам|результатам)', 'в\s+среднем\s+(?:у|на)', 'результат\w*\s+зависит', 'не\s+гарантиру\w*', 'based\s+on', 'on\s+average']
    message: "Обещание роста дохода, выручки или продаж клиента — прогноз результата: только с расчётом (basis.criterion) и оговоркой рядом; без числа и основания — недостоверное обещание"
    replacement: "свойство вместо обещания («показывает, какие заявки теряются») или факт с методикой и оговоркой рядом («у 40 клиентов в 2025 году — в среднем +12 % заявок по данным CRM; результат зависит от …»)"
    source: "38-ФЗ ст. 5 ч. 1, ч. 3 п. 2; классы forecast и income-finance — facts.schema.yaml x-claim-classes (legal: required); 01-advertising-law-claims.md §2, §6.2–6.3"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 2", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Сервис удвоит вашу выручку"
      good: "Сервис показывает, какие заявки теряются"
      bad_en: "Our CRM will double your revenue"
      good_en: "Our CRM shows which leads go unanswered"

  - id: COPY-L-EDU-01
    title: "Обещание дохода или работы после обучения: «зарплата от …», «трудоустройство»"
    level: warning
    claim_class: [income-finance, forecast]
    legal_category_except: [finance]
    exclude_slot_types: [testimonial-quote]
    requires_no_fact: true
    pattern: '%B%(?:трудоустро\w*|(?:найд[её]те|получите)\s+работу|зарплат\w*\s+(?:от|до)\s+\d|доход\w*\s+(?:от|до)\s+\d|заработ\w*\s+(?:от|до)\s+\d|(?:выйд[её]те|выход)\s+на\s+доход|окуп\w*\s+(?:обучени|курс)\w*|начн[её]те\s+зарабатывать)'
    unless: '\d+\s?%\s+(?:выпускник|студент|учеников)\w*|по\s+(?:данным|опросу|итогам)|медиан\w*|в\s+среднем\s+по\s+(?:выпускникам|рынку)'
    requires:
      nearby: ['\d+\s?%\s+(?:выпускник|студент|учеников)\w*', 'по\s+(?:данным|опросу|итогам)', 'медиан\w*']
      fact_fields: [basis.criterion]
    message: "Обещание работы или дохода после курса — утверждение о потребительских свойствах услуги: нужен факт (доля выпускников, выборка, период, источник) и условия рядом; «гарантия трудоустройства» — COPY-L-GUAR-01"
    replacement: "«62 % выпускников 2025 года нашли работу за 6 месяцев по данным опроса 480 человек»"
    source: "38-ФЗ ст. 5 ч. 3 п. 2, ч. 7; x-never-claim-defaults nc-income (B2); B1 (обещание дохода — not_promised)"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 2", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 5 ч. 7", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "После курса — работа в IT и зарплата от 150 000 ₽"
      good: "62 % выпускников 2025 года нашли работу за 6 месяцев по данным опроса 480 человек"

  - id: COPY-L-EDU-02
    title: "Образование: лицензия, если деятельность её требует"
    level: info
    legal_category: [education]
    once: page
    pattern: '%B%(?:обучени\w*|курс\w*|диплом\w*|удостоверени\w*\s+о\s+повышени\w*|профессиональн\w*\s+переподготовк\w*)'
    unless: 'лицензи\w*'
    requires:
      nearby: ['лицензи\w*']
      nearby_scope: page
    message: "Реклама товаров и услуг, для которых нужна лицензия, без неё запрещена: проверьте, нужна ли лицензия на образовательную деятельность, и держите её реквизиты в facts.yaml"
    replacement: "в подвале: «Лицензия на образовательную деятельность № … от …» (если нужна)"
    source: "38-ФЗ ст. 7 п. 7 (с 01.03.2027 изменения 520-ФЗ от 29.12.2025)"
    law:
      - {ref: "38-ФЗ ст. 7 п. 7", edition: "ред. от 04.08.2026", checked: "2026-09-24", in_force: "изменения — с 01.03.2027 (520-ФЗ от 29.12.2025)"}
    examples:
      bad: "Курс профессиональной переподготовки по дизайну"
      good: "Курс профессиональной переподготовки по дизайну, лицензия на образовательную деятельность № [PLACEHOLDER: номер]"
      legal_category: [education]

  # ── 6. Недвижимость, алкоголь ────────────────────────────────────────────────────────────────────────────────────
  - id: COPY-L-RE-01
    title: "Долевое строительство: адрес ЕИСЖС с проектной декларацией и застройщик"
    level: error
    legal_category: [real-estate]
    once: page
    pattern: '%B%(?:новостро\w*|жк%E%|жил(?:ой|ом|ого)\s+комплекс\w*|квартир\w*\s+(?:от\s+застройщика|в\s+(?:строящ|нов)\w*)|долев\w*|дду%E%|старт\s+продаж|сдача\s+(?:дома|жк|объекта|в\s+\d)|котлован\w*)'
    unless: 'наш\.?\s?дом\.?\s?рф|проектн\w*\s+деклараци\w*'
    requires:
      nearby_all: ['наш\.?\s?дом\.?\s?рф|проектн\w*\s+деклараци\w*']
      nearby_scope: page
    message: "Реклама с привлечением средств дольщиков — адрес сайта ЕИСЖС с проектной декларацией и наименование застройщика (или коммерческое обозначение из декларации); до разрешения на строительство — нельзя"
    replacement: "«Проектная декларация — на наш.дом.рф. Застройщик ООО «…»»"
    source: "38-ФЗ ст. 28 ч. 7–8 (ред. 202-ФЗ от 13.07.2020); Пленум ВАС № 58 п. 26 (конкретный источник)"
    law:
      - {ref: "38-ФЗ ст. 28 ч. 7–8", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Квартиры в ЖК у реки — старт продаж"
      good: "Квартиры в строящемся доме, проектная декларация — на наш.дом.рф"
      legal_category: [real-estate]

  - id: COPY-L-RE-02
    title: "Название жилого комплекса латиницей в рекламе"
    level: info
    legal_category: [real-estate]
    pattern: '%B%(?:жк|жил(?:ой|ом|ого)\s+комплекс\w*)\s+[«"]?[a-z]'
    message: "С 01.03.2026 названия объектов капитального строительства, которые застройщик использует в рекламе, — кириллицей (кроме введённых в эксплуатацию до вступления закона)"
    replacement: "«ЖК «Речной»»; сверить норму с юристом"
    source: "168-ФЗ от 24.06.2025 (ст. 1 и 4 — с 01.03.2026) по аннотации ГАРАНТ; изменяемую статью 214-ФЗ не открывал — [не проверено]"
    evidence: "[не проверено]"
    law:
      - {ref: "168-ФЗ от 24.06.2025", edition: "ст. 1 и 4 — с 01.03.2026", checked: "2026-09-24", note: "по аннотации ГАРАНТ; норму 214-ФЗ сверить"}
    examples:
      bad: "ЖК «Riverside» у парка"
      good: "ЖК «Речной» у парка"
      legal_category: [real-estate]

  - id: COPY-L-ALC-01
    title: "Алкоголь: реклама в интернете запрещена"
    level: error
    legal_category: [alcohol]
    forbid: true
    pattern: '%B%(?:акци\w*|скидк\w*|распродаж\w*|хит%E%|хиты%E%|новинк\w*|попробуйте|закажите|купите|лучш\w*|подар\w*|специальн\w*\s+предложени\w*)'
    message: "Реклама алкогольной продукции в интернете не допускается: на сайте производителя или магазина — информация об ассортименте без рекламных приёмов"
    replacement: "карточка: название, объём, крепость, цена; без «хита», «скидки», «попробуйте»"
    source: "38-ФЗ ст. 21 ч. 2 п. 8; ФАС, приказ № 1079/23 (прил. 1 п. 10); ФАС, приказ № 821/23 (разд. 9: сайт — информация об ассортименте)"
    law:
      - {ref: "38-ФЗ ст. 21 ч. 2 п. 8", edition: "ред. от 04.08.2026 (ст. 21 — ред. 272-ФЗ от 26.07.2026)", checked: "2026-09-24"}
    examples:
      bad: "Скидка 20 % на игристое к празднику"
      good: "Игристое брют, 0,75 л, 12 %"
      legal_category: [alcohol]

  - id: COPY-L-ALC-02
    title: "Алкоголь: польза, безвредность, успех, утоление жажды"
    level: error
    legal_category: [alcohol]
    forbid: true
    pattern: '%B%(?:полезн\w*|безвредн\w*|для\s+здоровья|сним\w*\s+стресс\w*|расслабл\w*|утоля\w*\s+жажд\w*|для\s+успех\w*|витамин\w*)'
    message: "Реклама алкоголя не утверждает, что он безвреден или полезен, улучшает состояние, важен для успеха, утоляет жажду"
    replacement: "убрать утверждение"
    source: "38-ФЗ ст. 21 ч. 1 п. 1–4"
    law:
      - {ref: "38-ФЗ ст. 21 ч. 1 п. 1–4", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Лёгкое вино, которое снимает стресс"
      good: "Сухое белое вино, 0,75 л, 12 %"
      legal_category: [alcohol]

  # ── 7. Экологичность, натуральность, органика ───────────────────────────────────────────────────────────────────
  - id: COPY-L-ECO-01
    title: "«Органический»: только сертифицированная органическая продукция"
    level: warning
    claim_class: [eco-natural]
    requires_no_fact: true
    pattern: '%B%(?:органическ\w*|органик\w*|organic%E%)'
    unless: 'сертификат\w*|реестр\w*|органическ\w*\s+(?:загрязн|веществ|соединени|отход|остатк|стекл|химии|кислот|удобрени)\w*'
    requires:
      nearby: ['сертификат\w*', 'реестр\w*']
      fact_fields: [source.document]
    message: "«Органический» обозначает продукцию с подтверждённым соответствием производства и единым знаком; без сертификата и записи в реестре — недостоверная характеристика"
    replacement: "номер сертификата и запись в реестре производителей органической продукции — в facts.yaml; нет — описать способ производства фактами"
    source: "280-ФЗ ст. 5–7 (ред. 31.07.2025); 38-ФЗ ст. 5 ч. 3 п. 2"
    law:
      - {ref: "280-ФЗ ст. 7", edition: "ред. от 31.07.2025", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 2", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Органический кофе из Эфиопии"
      good: "Кофе из Эфиопии, обжарка по средам"

  - id: COPY-L-ECO-02
    title: "«Эко», «натуральный», «без химии», «биоразлагаемый» без конкретики"
    level: warning
    claim_class: [eco-natural]
    requires_no_fact: true
    pattern: '%B%(?:эко(?:логичн\w*|логически\s+чист\w*)?%E%|эко-[а-яёa-z]+|(?<!от )(?<!от\xa0)натуральн\w*(?!\w)(?!\s+(?:(?:или|и)\s+[а-яё]+\s+)?(?:водо[её]м|величин|числ|выражени|размер|масштаб|услови|сред|зуб|единиц|ткан))|без\s+(?:химии|консервант\w*|гмо%E%|красител\w*|парабен\w*|сульфат\w*)|100\s?%\s+натуральн\w*|биоразлага\w*|углеродн\w*[\s-]нейтральн\w*|климатически\s+нейтральн\w*)'
    unless: 'состав\s*:|по\s+(?:составу|данным)|сертификат\w*|декларац\w*|протокол\w*\s+испытани\w*|гост%E%|\d+\s?%\s+(?:ингредиент|компонент|сырь|материал|переработ)\w*'
    requires:
      nearby: ['состав\s*:', 'по\s+(?:составу|данным)', 'сертификат\w*', 'декларац\w*', 'протокол\w*\s+испытани\w*', '\d+\s?%\s+(?:ингредиент|компонент|сырь|материал|переработ)\w*']
      fact_fields: [source.document]
    message: "Экологичность и натуральность — характеристика товара: только с документом и конкретикой (что именно, какая доля); общее требование закона, выданное за отличие, вводит в заблуждение"
    replacement: "«92 % ингредиентов растительного происхождения по составу на упаковке»; для еды «эко», «био», «экологически чистый», «зелёный» — до 01.09.2030 без сертификата, дальше — только органика"
    source: "38-ФЗ ст. 5 ч. 3 п. 2; 280-ФЗ ст. 7 ч. 2 и примечание к ред. 367-ФЗ от 24.07.2023 (до 01.09.2030); ориентир ЕС — Директива 2024/825 (Annex I 4a, 10a)"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 2", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "280-ФЗ ст. 7 ч. 2", edition: "ред. от 31.07.2025", checked: "2026-09-24", in_force: "слова «эко», «био» без сертификата — до 01.09.2030 (367-ФЗ)"}
    examples:
      bad: "Натуральная косметика без химии"
      good: "Крем: 92 % ингредиентов растительного происхождения"

  # ── 8. Рекомендации, опросы, награды ─────────────────────────────────────────────────────────────────────────────
  - id: COPY-L-REV-01
    title: "«9 из 10 рекомендуют», «рекомендуют специалисты» без опроса рядом"
    level: error
    claim_class: [fact-number]
    requires_no_fact: true
    pattern: '%B%(?:\d+\s?%\s+(?:клиентов|покупателей|пользователей|пациентов|учеников|опрошенных|женщин|мужчин|мам|родителей|стоматологов|врачей)\s+(?:рекоменд|довольн|выбира|отмечают|подтвержда|советуют)\w*|\d+\s+из\s+\d+\s+(?:клиентов|покупателей|пользователей|стоматологов|врачей|мам|экспертов|опрошенных)\s+(?:рекоменд|выбира|советуют|довольн)\w*|(?:рекомендуют|советуют|выбирают)\s+(?:большинство|профессионал\w*|эксперт\w*|специалист\w*))'
    unless: 'по\s+(?:данным|опросу|итогам)|опрос\w*\s+\d|n\s?=\s?\d|\d+\s+(?:опрошенных|респондентов|человек)'
    requires:
      nearby: ['по\s+(?:данным|опросу|итогам)', 'опрос\w*\s+\d', 'n\s?=\s?\d', '\d+\s+(?:опрошенных|респондентов|человек)']
      fact_fields: [basis.sample]
    message: "Рекомендации и одобрение людей, результаты опросов — сведения, которые нужно подтвердить: кто опрошен, сколько, когда, кем — рядом"
    replacement: "«По опросу 412 клиентов в августе 2026 года 87 % порекомендовали бы нас друзьям»"
    source: "38-ФЗ ст. 5 ч. 3 п. 10–11"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 10–11", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "9 из 10 стоматологов рекомендуют эту щётку"
      good: "По опросу 412 клиентов в августе 2026 года 87 % порекомендовали бы нас друзьям"

  - id: COPY-L-AWARD-01
    title: "Награды и «о нас пишут» без года, премии и номинации"
    level: warning
    claim_class: [award-press]
    requires_no_fact: true
    pattern: '%B%(?:лауреат\w*|победител\w*|обладател\w*\s+(?:преми|наград|гран-при)\w*|о\s+нас\s+(?:пишут|писали|говорят)|как\s+(?:в\s+)?(?:сми|на\s+тв))'
    unless: '(?:19|20)\d{2}%E%.*(?:номинаци|категори)\w*|(?:номинаци|категори)\w*.*(?:19|20)\d{2}%E%|https?://'
    requires:
      nearby: ['(?:номинаци|категори)\w*', 'https?://']
      fact_fields: [source.date]
    message: "Сведения о наградах и признании — с названием премии, годом и номинацией; «о нас пишут» — со ссылкой на публикацию; победа в одной номинации не делает «№ 1»"
    replacement: "«Лауреат премии «…» 2025 года в номинации «…»»"
    source: "38-ФЗ ст. 5 ч. 3 п. 9; B2 04 (замер: «№ 1» над победой в одной номинации)"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 9", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Лауреат премии «Сделано в России»"
      good: "Лауреат премии «Сделано в России» 2025 года в номинации «Дизайн света»"

  # ── 9. Товарный знак, язык, пометка «Реклама», согласия ─────────────────────────────────────────────────────────
  - id: COPY-L-TM-01
    title: "Знак ® — только у зарегистрированного товарного знака"
    level: info
    pattern: '®|\((?:r)\)(?=\s|$)'
    message: "® и «зарегистрированный товарный знак» — только рядом со знаком, охраняемым в РФ; ложный знак — недостоверные сведения об исключительных правах"
    replacement: "регистрация — фактом (номер свидетельства); нет — без ®; ставить при первом упоминании, не в каждой строке"
    source: "ГК РФ ст. 1485 (ред. 23.07.2025); 38-ФЗ ст. 5 ч. 3 п. 7; Пленум ВАС № 58 п. 31"
    law:
      - {ref: "ГК РФ ст. 1485", edition: "ред. от 23.07.2025", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 5 ч. 3 п. 7", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Лампа Кварц® для чтения"
      good: "Лампа «Кварц» для чтения"

  - id: COPY-L-TM-02
    title: "Знак ™ — в РФ не означает регистрации"
    level: info
    pattern: '™|\((?:tm)\)'
    message: "™ в российском праве знаком охраны не является: не выдавайте им регистрацию"
    replacement: "убрать ™ из русского текста; для США — по праву США"
    source: "ГК РФ ст. 1485 (знаки охраны — «R», «R» в окружности, «товарный знак», «зарегистрированный товарный знак»)"
    law:
      - {ref: "ГК РФ ст. 1485", edition: "ред. от 23.07.2025", checked: "2026-09-24"}
    examples:
      bad: "Метод Отвес™ для ремонта"
      good: "Метод «Отвес» для ремонта"

  - id: COPY-L-LANG-01
    title: "Иностранные слова в русском рекламном тексте без перевода"
    level: warning
    lang: ru
    pattern: '(?<![A-Za-z])(?:sale|black\s+friday|cyber\s+monday|early\s+bird|limited\s+edition|special\s+offer|best\s*seller|new\s+collection|free\s+delivery|premium|luxury|hot\s+price)(?![A-Za-z])'
    unless: '\([^)]*[а-яё][^)]*\)|распродаж\w*|скидк\w*|бесплатн\w*|предзаказ\w*|новинк\w*|ограниченн\w*\s+сери\w*|ч[её]рн\w*\s+пятниц\w*|хит\s+продаж'
    message: "Иностранные слова в рекламе — с идентичным переводом, равнозначным по размещению и оформлению; товарные знаки и фирменные наименования — без перевода; без перевода слово, искажающее смысл, — нарушение"
    replacement: "«Распродажа (sale)» или просто «распродажа»"
    source: "38-ФЗ ст. 5 ч. 5 п. 1, ч. 11; 53-ФЗ ст. 3 ч. 1 п. 10, ч. 2–3 (ред. 22.04.2024); ФАС, приказ № 1079/23 (прил. 2 п. 7); ЗоЗПП ст. 10.1 (вывески, с 01.03.2026)"
    law:
      - {ref: "38-ФЗ ст. 5 ч. 5 п. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "53-ФЗ ст. 3 ч. 2", edition: "ред. от 22.04.2024", checked: "2026-09-24"}
      - {ref: "ФАС, приказ № 1079/23 от 28.12.2023, прил. 2 разд. VI п. 7", checked: "2026-09-24"}
    examples:
      bad: "Только в эти выходные большой sale в нашем магазине"
      good: "Только в эти выходные большая распродажа в нашем магазине"

  - id: COPY-L-AD-01
    title: "Пометка «Реклама» без рекламодателя или ссылки на сведения о нём"
    level: info
    exclude_slot_types: ['nav-*', 'cta-*', 'breadcrumb*', 'tab*', 'filter*', 'case-*']
    pattern: '^\s*реклама[.:]?\s*$|%B%реклама%E%\s*[.:|·]\s*(?!.*(?:ооо|ао|пао|ип%E%|инн|erid|рекламодател|https?://|www\.|\.ru|\.рф))'
    message: "Интернет-реклама содержит пометку «реклама» и указание на рекламодателя и (или) сайт со сведениями о нём; идентификатор (erid) и учёт — механика site"
    replacement: "«Реклама. ООО «…», ИНН …» или «Реклама. Рекламодатель — на сайте …»"
    source: "38-ФЗ ст. 18.1 ч. 16–17 (ред. 479-ФЗ от 26.12.2024)"
    law:
      - {ref: "38-ФЗ ст. 18.1 ч. 16", edition: "ред. 479-ФЗ от 26.12.2024; закон — ред. от 04.08.2026", checked: "2026-09-24"}
    examples:
      bad: "Реклама."
      good: "Реклама. ООО «Пример», ИНН [PLACEHOLDER: ИНН]"

  - id: COPY-L-CONS-01
    title: "Одно согласие на ПДн вместе с рекламной рассылкой, офертой или соглашением"
    level: error
    pattern: '%B%(?:согласен|согласна|соглашаюсь|даю\s+согласие|принимаю)[^.\n]{0,120}?(?:персональн\w*\s+данн\w*|пдн%E%)[^.\n]{0,120}?(?:рассылк\w*|реклам\w*|новост\w*|предложени\w*|оферт\w*|пользовательск\w*\s+соглашени\w*|услови\w*\s+(?:оферты|использования))|%B%(?:согласен|согласна|соглашаюсь|даю\s+согласие|принимаю)[^.\n]{0,120}?(?:рассылк\w*|реклам\w*|оферт\w*|пользовательск\w*\s+соглашени\w*)[^.\n]{0,120}?(?:персональн\w*\s+данн\w*|пдн%E%)'
    message: "Согласие на обработку ПДн оформляется отдельно от иных документов и согласий; согласие на рекламу — своё, по отдельной галочке без предотметки"
    replacement: "две галочки с отдельными текстами: «Согласен на обработку персональных данных для ответа на заявку» и «Хочу получать письма о новых услугах» (необязательная)"
    source: "152-ФЗ ст. 9 ч. 1 (ред. 156-ФЗ от 24.06.2025; с 01.09.2025 — по ux 06/04 §7.3); 38-ФЗ ст. 18 ч. 1; 152-ФЗ ст. 15 ч. 1; Пленум ВАС № 58 п. 15; канон экрана — ux 06/04 §7.3"
    law:
      - {ref: "152-ФЗ ст. 9 ч. 1", edition: "ред. от 26.07.2026 (ч. 1 — ред. 156-ФЗ от 24.06.2025)", checked: "2026-09-24"}
      - {ref: "38-ФЗ ст. 18 ч. 1", edition: "ред. от 04.08.2026", checked: "2026-09-24"}
      - {ref: "152-ФЗ ст. 15 ч. 1", edition: "ред. от 26.07.2026", checked: "2026-09-24"}
    examples:
      bad: "Я согласен на обработку персональных данных и получение рекламной рассылки"
      good: "Я согласен на обработку персональных данных для ответа на заявку"

  - id: COPY-L-CONS-02
    title: "Согласие действием: «Нажимая кнопку, вы соглашаетесь…»"
    level: warning
    pattern: '%B%(?:нажимая|отправляя|оставляя\s+заявку|заполняя\s+форму|продолжая)[^.\n]{0,60}?(?:вы\s+)?(?:соглаша\w*|да[её]те\s+согласие|подтверждаете\s+согласие|принимаете)'
    message: "Согласие через нажатие кнопки отправки не оформлено отдельно и не подтверждает волю получать рекламу; отдельная неотмеченная галочка со своим текстом"
    replacement: "«☐ Согласен на обработку персональных данных для ответа на заявку — политика» отдельной строкой над кнопкой"
    source: "152-ФЗ ст. 9 ч. 1 (ред. 156-ФЗ); 38-ФЗ ст. 18 ч. 1; Пленум ВАС № 58 п. 15; ux 06/04 §7.3"
    law:
      - {ref: "152-ФЗ ст. 9 ч. 1", edition: "ред. от 26.07.2026 (ч. 1 — ред. 156-ФЗ от 24.06.2025)", checked: "2026-09-24"}
      - {ref: "Пленум ВАС РФ № 58 от 08.10.2012 п. 15", edition: "действует", checked: "2026-09-24"}
    examples:
      bad: "Нажимая кнопку, вы соглашаетесь с политикой обработки персональных данных"
      good: "Согласие на обработку персональных данных — отдельной галочкой под формой"

  # ── 10. Вакансии ──────────────────────────────────────────────────────────────────────────────────────────────────
  - id: COPY-L-JOB-01
    title: "Вакансия с требованиями не по деловым качествам: пол, возраст, место жительства, семейное положение"
    level: error
    page_types: [careers-page]
    exclude_slot_types: [testimonial-quote]
    pattern: '%B%(?:требу\w+|ищем|ищут|нужн\w*|приглаша\w+|вакансия|кандидат\w*|соискател\w*)[^.!?\n]{0,80}?(?:%B%(?:мужчин\w*|женщин\w*|девушк\w*|парн(?:я|ей|и|ю|ем)%E%|юнош\w*)|%B%(?:до|от)\s+\d{2}\s+(?:до\s+\d{2}\s+)?лет%E%|%B%в\s+возрасте\s+(?:от|до)\s+\d{2}|%B%(?:с\s+)?(?:прописк\w*|регистраци\w*\s+в\s+[а-яё]+|местн\w+\s+жител\w*)|%B%(?:без\s+детей|бездетн\w*|холост\w*|не\s*замужн\w*|незамужн\w*|семейн\w+\s+положени\w*))'
    message: "В вакансии нельзя требовать пол, возраст, место жительства, семейное положение и другое, не связанное с деловыми качествами работника (исключения — только прямо по федеральному закону)"
    replacement: "требования к делу: опыт, навыки, допуски, график; место работы («объекты — в Нижнем Новгороде»), а не место жительства"
    source: "565-ФЗ «О занятости населения в Российской Федерации» ст. 53 ч. 3 (ред. от 28.11.2025), ответственность — КоАП; требование права сайта — req:LR-RU-28 (../../site/08-legal-trust-a11y/legal-requirements.yaml); тексты вакансий — 04-copy-by-block/03-page-types.md §4.7"
    law:
      - {ref: "565-ФЗ ст. 53 ч. 3", edition: "ред. от 28.11.2025", checked: "2026-09-24", note: "сверка с первоисточником — 04/03 §4.7 [S19]"}
    examples:
      bad: "Требуется девушка до 35 лет с пропиской в Нижнем Новгороде, без детей, готовая к переработкам"
      good: "Ищем плиточника с опытом укладки крупного формата; объекты — в Нижнем Новгороде"

  # ── 11. Профиль ЕС (--jurisdiction eu) и США (--jurisdiction us): кратко ───────────────────────────────────────
  - id: COPY-L-EU-01
    title: "ЕС: объявление о снижении цены без прежней цены (минимальной за 30 дней)"
    level: error
    jurisdiction: [eu]
    claim_class: [price-discount]
    pattern: '(?:[-–—−]\s?\d+\s?%|\b\d+\s?%\s+off\b|\bsave\s+\d+\s?%|\bsale%E%|\bwas\s+[$€£]?\d|\breduced\s+from\b)'
    unless: 'lowest\s+price\s+in\s+the\s+(?:last|previous)\s+30\s+days|prior\s+price|previous\s+price'
    requires:
      nearby: ['lowest\s+price\s+in\s+the\s+(?:last|previous)\s+30\s+days', 'prior\s+price', 'previous\s+price']
      fact_fields: [valid.from]
    message: "Any announcement of a price reduction shall indicate the prior price: the lowest price applied during at least 30 days before the reduction"
    replacement: "«−30 %: now €49, lowest price in the last 30 days €70»"
    source: "Directive 98/6/EC Art. 6a, inserted by Directive (EU) 2019/2161 Art. 2 (Omnibus), applies from 28.05.2022"
    law:
      - {ref: "Directive 98/6/EC Art. 6a (Directive (EU) 2019/2161 Art. 2)", edition: "OJ L 328, 18.12.2019", checked: "2026-09-24"}
    examples:
      bad: "Spring sale: 30% off all lamps"
      good: "Now €49, lowest price in the last 30 days €70"
      jurisdiction: eu

  - id: COPY-L-EU-02
    title: "ЕС: общие экологические заявления без признанной экологической эффективности"
    level: error
    jurisdiction: [eu]
    claim_class: [eco-natural]
    pattern: '\b(?:eco[- ]?friendly|environmentally\s+friendly|climate[- ](?:friendly|neutral|positive)|carbon[- ](?:neutral|friendly|negative|positive)|nature''?s\s+friend|ecological|gentle\s+on\s+the\s+environment|biodegradable|bio[- ]?based|green\s+(?:product|packaging|choice))\b'
    unless: 'eu\s+ecolabel|certified|\d+\s?%\s+(?:recycled|less|lower|of)'
    requires:
      nearby: ['eu\s+ecolabel', 'certified', '\d+\s?%\s+(?:recycled|less|lower|of)']
    message: "From 27.09.2026 generic environmental claims without recognised excellent environmental performance, whole-product claims about one aspect and offsetting-based «climate neutral» claims are banned in the EU"
    replacement: "specific, verifiable claim on the same medium: «Packaging made from 80% recycled cardboard, FSC-certified»"
    source: "Directive 2005/29/EC Annex I points 2a, 4a–4c, 10a, inserted by Directive (EU) 2024/825; transposition by 27.03.2026, apply from 27.09.2026 (Art. 4)"
    law:
      - {ref: "Directive 2005/29/EC Annex I 4a–4c (Directive (EU) 2024/825)", edition: "OJ L, 2024/825", checked: "2026-09-24", in_force: "2026-09-27"}
    examples:
      bad: "Eco-friendly packaging for every order"
      good: "Packaging made from 80% recycled cardboard"
      jurisdiction: eu

  - id: COPY-L-EU-03
    title: "ЕС: «проверенные отзывы» без описания проверки"
    level: warning
    jurisdiction: [eu]
    claim_class: [testimonial-quote, rating]
    pattern: '\b(?:verified|genuine|real)\s+(?:customer\s+)?reviews?\b|\bverified\s+(?:buyers?|purchases?)\b'
    unless: 'how\s+we\s+verify|we\s+check|checked\s+by|order\s+number|only\s+customers\s+who'
    requires:
      nearby: ['how\s+we\s+verify', 'we\s+check', 'order\s+number', 'only\s+customers\s+who']
    message: "Stating that reviews come from real customers without reasonable steps to check it is a banned practice; say how reviews are verified"
    replacement: "«Only customers with an order number can leave a review — how we verify»"
    source: "Directive 2005/29/EC Annex I 23b–23c, Art. 7(6), inserted by Directive (EU) 2019/2161"
    law:
      - {ref: "Directive 2005/29/EC Annex I 23b–23c (Directive (EU) 2019/2161)", edition: "OJ L 328, 18.12.2019", checked: "2026-09-24"}
    examples:
      bad: "Rated 4.9 in verified reviews"
      good: "Rated 4.9: only customers with an order number can leave a review"
      jurisdiction: eu

  - id: COPY-L-US-01
    title: "США: «results not typical» вместо обычного результата"
    level: warning
    jurisdiction: [us]
    claim_class: [testimonial-quote]
    pattern: '\bresults?\s+(?:not\s+typical|may\s+vary)\b|\bindividual\s+results\s+(?:may\s+)?vary\b'
    message: "A disclaimer like «results not typical» does not cure a testimonial that conveys atypical results: state what consumers can generally expect"
    replacement: "«Most clients in our program lose 3–5 lbs in the first month»"
    source: "16 CFR 255.2(b) (FTC Endorsement Guides, 2023); отзывы — 16 CFR Part 465 (2024)"
    law:
      - {ref: "16 CFR 255.2(b)", edition: "eCFR, current", checked: "2026-09-24"}
    examples:
      bad: "Lost 20 lbs in a month! Results not typical."
      good: "Lost 20 lbs in a month; most clients lose 3 to 5 lbs in the first month."
      jurisdiction: us

