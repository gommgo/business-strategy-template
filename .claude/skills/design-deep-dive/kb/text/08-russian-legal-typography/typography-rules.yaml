  - id: typo-en-range-hyphen
    marker_id: COPY-T-27
    level: info
    lang: en
    pattern: '(?<![\d.,:/\-‐‑–—])\d+(?:[.,]\d+)?[-‐‑]\d+(?:[.,]\d+)?(?![\d\-‐‑/.,])|(?<![\d:])\d{1,2}:\d{2}\s?[-‐‑]\s?\d{1,2}:\d{2}'
    unless: '\+\d|\btel\b|phone|call|iso|isbn|sku|model|part\s?no|v\d'
    message: "Number range with a hyphen. Default for this base: en dash without spaces (20–30 days, 9:00–18:00); a house style may choose “to” (GOV.UK, Atlassian) or a hyphen (Mailchimp) — then keep it consistent. After “from” or “between” write “to”/“and”."
    replacement: "“20–30 days”, “from 9 am to 6 pm”"
    examples: {bad: "Delivery in 20-30 days", good: "Delivery in 20–30 days"}
    source: "Microsoft Style Guide, «Em dashes, en dashes, hyphens, and minus signs» (en dash in ranges, no spaces); Butterick, Practical Typography, «Hyphens and dashes» (en dash for ranges; from … to); Mailchimp Content Style Guide (hyphen for ranges); GOV.UK A–Z style guide («500 to 900», not «500-900»); Atlassian Design, Language and grammar («to» in ranges)"
    evidence: "[спорно]"
