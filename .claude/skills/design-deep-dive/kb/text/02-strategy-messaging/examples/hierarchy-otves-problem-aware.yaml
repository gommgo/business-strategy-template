# hierarchy-otves-problem-aware.yaml — иерархия лендинга «Отвес» для трафика из поиска по проблеме (problem-aware)
# Формат: ../message-hierarchy.schema.yaml (hierarchy_version 1)
# Смысл — meaning-otves.yaml; факты — facts-service-renovation.yaml. Парная иерархия под брендовый трафик —
# hierarchy-otves-product-aware.yaml.
# Порядок секций — черновой (site задаёт page-plan); секции — роли section_role словаря site.

hierarchy_version: 1
date: "2026-09-24"
status: draft
id: hierarchy-otves-problem-aware
site: otves-remont-nn
meaning_ref: meaning-otves.yaml
lang: ru
sibling_ids: [hierarchy-otves-product-aware]

page:
  page_type: landing-lead-services
  segment_ref: busy-owners
  awareness: problem-aware
  traffic_sources: [search-problem]
  sophistication_stage: 4
  promise_of_source: "запросы вида «как контролировать ремонт, если некогда ездить на объект», «бригада затягивает ремонт что делать»"
  argument_depth: long
  goal:
    action_ref: request-measurement
    secondary_goal: "Сохранить или переслать домашним пример сметы и договора"

core_message:
  text: "Ремонт срывается, когда за ним некому смотреть: у нас объект от замера до сдачи ведёт один прораб, а срок и смета записаны в договоре с гарантией 3 года."
  hero_approach: problem-story
  value_theme_refs: [val-control-without-visits, val-predictable]
  proof_ids: ["fact:foreman-lapin", "fact:guarantee-3-years"]
  must_not_say:
    - "«смета никогда не меняется» (never_claim nc-no-extra-cost-promise)"
    - "«лучший ремонт в городе», «№ 1» (never_claim nc-best-in-city)"
    - "«фото каждый вечер» как правило для всех — до ответа q-photo-reports"

first_screen:
  what: "ремонт квартир под ключ в Нижнем Новгороде"
  for_whom: "тем, кому некогда ездить на объект и следить за бригадой"
  outcome: "квартира в срок из договора — без поездок «проверить»"
  differentiator: "один прораб на весь объект и договор с гарантией 3 года вместо бригады «на словах»"
  next_step: "вызвать замерщика; замер и смета бесплатно"
  proof_ids: ["fact:estimate-free", "fact:guarantee-3-years"]
  message_match: "запрос про контроль ремонта → заголовок начинается с ситуации «некогда следить за ремонтом», а не с названия студии"

pillars:
  - id: pl-foreman
    message: "Один прораб отвечает за объект и за всех мастеров — вам не нужно их координировать"
    value_theme_refs: [val-control-without-visits]
    layer: differentiation
    proof_status: missing
    proof_ids: ["missing:foreman-per-object", "fact:foreman-lapin"]
    objection_ids: [obj-diy-crew, obj-same-as-others]
    counter: "Частную бригаду координируете вы; здесь один ответственный с именем и опытом"
  - id: pl-visibility
    message: "Ход работ виден без поездок на объект (как именно — подтвердить у заказчика)"
    value_theme_refs: [val-control-without-visits]
    layer: value
    proof_status: missing
    proof_ids: ["missing:photo-report-process", "fact:review-anna-k"]
    objection_ids: [obj-trust]
    counter: "Не «верьте нам», а «смотрите сами» — формат отчёта показать"
  - id: pl-contract
    message: "Срок и смета — в договоре, гарантия на работы 3 года (п. 7.2)"
    value_theme_refs: [val-predictable]
    layer: value
    proof_status: has-proof
    proof_ids: ["fact:guarantee-3-years", "fact:case-two-room-47-days", "missing:estimate-change-policy", "missing:deadline-terms"]
    objection_ids: [obj-budget-grows, obj-delays]
    counter: "Письменные обязательства и пример сданного объекта вместо обещания «в срок и без доплат»"
  - id: pl-track-record
    message: "12 лет в городе: 1 146 квартир и 4,8 из 5 на Яндекс Картах"
    value_theme_refs: [val-proven-locally]
    layer: relevance
    proof_status: has-proof
    proof_ids: ["fact:flats-completed", "fact:rating-yandex-maps", "fact:company-since-2014"]
    objection_ids: [obj-trust]
  - id: pl-honest-price
    message: "Работы — от 9 800 ₽ за м² без материалов; точная сумма — в бесплатной смете до договора"
    value_theme_refs: [val-predictable]
    layer: friction
    proof_status: has-proof
    proof_ids: ["fact:price-from-per-m2", "fact:estimate-free"]
    objection_ids: [obj-price, obj-timing]

sections:
  - order: 1
    section_role: hero
    question: "Можно сделать ремонт, если некогда за ним следить?"
    message: "Можно: объект ведёт один прораб, срок и смета — в договоре; начните с бесплатного замера."
    carries: [core]
    proof_ids: ["fact:estimate-free", "fact:guarantee-3-years"]
    next_step: "Главный призыв «Вызвать замерщика» + признак продолжения (почему ремонты срываются)"
    awareness_shift: {from: problem-aware, to: solution-aware}
  - order: 2
    section_role: problem
    question: "Почему ремонты затягиваются и дорожают?"
    message: "Когда за объектом не смотрит один человек, мастера ждут друг друга, а решения принимаются без вас — отсюда сроки и доплаты."
    objection_ids: [obj-diy-crew]
    next_step: "Переход к решению"
    notes: "Причинное утверждение о ремонтах вообще — без чисел и «статистики»; формулировка от опыта студии (подтвердить у заказчика)."
  - order: 3
    section_role: solution
    question: "Что меняется, если объект ведёт прораб?"
    message: "Один ответственный координирует мастеров и закупку, а вы видите ход работ, не приезжая."
    carries: [pl-foreman, pl-visibility]
    proof_ids: ["missing:foreman-per-object", "fact:foreman-lapin", "missing:photo-report-process"]
    objection_ids: [obj-same-as-others]
    awareness_shift: {from: solution-aware, to: product-aware}
  - order: 4
    section_role: how-it-works
    question: "Как всё происходит и где мои гарантии?"
    message: "Замер и смета бесплатно → договор с этапами, сроком и сметой → работы под прорабом → приёмка этапов → гарантия 3 года."
    carries: [pl-contract]
    proof_ids: ["fact:estimate-free", "fact:guarantee-3-years", "missing:deadline-terms", "missing:payment-stages", "missing:estimate-change-policy"]
    objection_ids: [obj-budget-grows, obj-delays]
  - order: 5
    section_role: case-studies
    question: "Вы правда сдаёте в срок?"
    message: "Двушка 54 м² в Сормове: 47 рабочих дней при 50 по договору."
    carries: [pl-contract]
    proof_ids: ["fact:case-two-room-47-days"]
    objection_ids: [obj-delays]
  - order: 6
    section_role: testimonials
    question: "Что говорят те, кто уже сделал ремонт?"
    message: "Клиент рассказывает о сроке, смете и о том, как видел ход работ."
    carries: [pl-visibility]
    proof_ids: ["fact:review-anna-k"]
    objection_ids: [obj-trust]
  - order: 7
    section_role: proof-stats
    question: "Вы надёжная компания?"
    message: "С 2014 года в Нижнем Новгороде: 1 146 квартир, 4,8 из 5 по 214 оценкам на Яндекс Картах."
    carries: [pl-track-record]
    proof_ids: ["fact:company-since-2014", "fact:flats-completed", "fact:rating-yandex-maps"]
    objection_ids: [obj-trust]
  - order: 8
    section_role: pricing
    question: "Сколько это стоит?"
    message: "Работы — от 9 800 ₽ за м² без материалов; точную сумму покажет бесплатная смета; при договоре до 31 октября — минус 10 % на работы."
    carries: [pl-honest-price]
    proof_ids: ["fact:price-from-per-m2", "fact:estimate-free", "fact:promo-october-10"]
    objection_ids: [obj-price, obj-timing]
  - order: 9
    section_role: faq
    question: "А если у меня только ванная? А соседи?"
    message: "Честно о минимальном объёме, правилах работы в доме и оплате."
    proof_ids: ["missing:min-job-size", "missing:payment-stages"]
    objection_ids: [obj-small-job, obj-neighbours, obj-trust]
  - order: 10
    section_role: final-cta
    question: "Что сделать сейчас?"
    message: "Вызвать замерщика: замер и смета бесплатно и ни к чему не обязывают; пример сметы можно переслать домашним."
    carries: [core]
    proof_ids: ["fact:estimate-free"]
    objection_ids: [obj-decision-maker]

proof_order: ["missing:foreman-per-object", "fact:foreman-lapin", "missing:photo-report-process", "fact:guarantee-3-years", "fact:case-two-room-47-days",
              "fact:review-anna-k", "fact:flats-completed", "fact:rating-yandex-maps", "fact:price-from-per-m2",
              "fact:estimate-free", "fact:promo-october-10"]

not_said:
  - "Рейтинг и число квартир не ставим в первый экран: проблемному трафику сначала механизм, потом цифры"
  - "Скидка — не в hero (одно обещание на первый экран)"
  - "Сравнение с другими студиями по имени"
