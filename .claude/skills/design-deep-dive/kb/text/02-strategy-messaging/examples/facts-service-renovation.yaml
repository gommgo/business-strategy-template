# facts-service-renovation.yaml — пример 2: услуга с лидогенерацией (ремонт квартир под ключ), приоритет 1 заказчика
# Формат: ../facts.schema.yaml (facts_version 1)
#
# ВЫМЫШЛЕННАЯ компания «Отвес» (Нижний Новгород) и синтетические данные: имена, числа, адреса и ссылки — для примера
# формата, не для публикации. Ссылки на площадки — шаблоны вида <id-организации>.
# Что показывает пример: все виды доказательств лидогенерации услуг (число из CRM, рейтинг площадки со снимком,
# отзыв с разрешением и журналом правок, кейс без имени клиента, гарантия по договору, цена «от» со сроком, акция с
# датой окончания, человек команды с согласием, реквизиты в missing как ворота публикации), разрешение «pending»,
# проектный never_claim с lift: with-fact и английскую адаптацию canonical.

facts_version: 1
date: "2026-09-24"
site: otves-remont-nn
lang: ru
jurisdiction: ru
status: draft
example: true
owner: {role: "директор (заказчик)", contact: "почта заказчика из брифа"}
