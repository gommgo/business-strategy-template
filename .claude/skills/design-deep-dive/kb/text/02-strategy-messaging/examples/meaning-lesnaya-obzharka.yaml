  - {id: roast-date-label, what: "есть ли дата обжарки на упаковке"}
  - {id: recipe-card, what: "карточка с рецептом в коробке"}
  - {id: grind-by-method, what: "помол под способ заваривания"}
  - {id: subscription-terms, what: "условия подписки: цена, частота, пауза, отмена"}
  - {id: price-250g, what: "цена банки 250 г"}
  - {id: delivery-terms, what: "срок и цена доставки, города"}
  - {id: trial-offer, what: "пробный объём или возврат"}
