# Словарь компонентов и состояния элемента
#
# Закрытый словарь типов компонентов, из которых собираются экраны приложения, и один набор состояний элемента.
# Файл читают агент скилла — чтобы назвать компонент и понять, что от него ждут, — и утилита покрытия
# `scripts/project/ds_coverage.py` — чтобы сверить экраны проекта, его дизайн-систему (ДС) и этот словарь.
#
# Как работает словарь
# - Экран (screen), блок (block) и каркас (shell) называют компонент узлом `ui:<Тип>`, часть составного
#   компонента — `ui:<Тип>.<Часть>`. <Тип> — ключ раздела `types`, <Часть> — значение из его `parts`.
# - Одна потребность — один тип. Два способа выбрать дату или два вида тоста в одном продукте со временем
#   расходятся и ломают консистентность, поэтому тип по месту не придумывают
#   (ux/10-design-systems-consistency/02-consistency-rules.md §3.1). Потребность, которую не закрывает ни один тип,
#   проект оформляет расширением (раздел `project_extension`).
# - Имя типа — устойчивое имя из каталогов дизайн-систем, а не придуманное
#   (ux/10-design-systems-consistency/01-what-to-take-from-which-design-system.md §3.2, §3.4). Где каталог даёт
#   двусмысленное имя (Toggle, Stepper, Header), выбрано однозначное, а каталожное стоит в `aka`.
# - ДС проекта сопоставляет каждому типу свой компонент и рисует у него состояния элемента из `states.required`
#   типа. Тип, который назван в экранах, а в ДС не создан, — дыра покрытия.
# - Облик — вариант, размер, цвет, отступы, радиусы — в словарь не входит: его решает слой дизайна токенами ДС.
#   Уровень действия (главное, второстепенное, в меню) — смысл, а не облик; его задают экраны по матрице действий
#   (ux/04-components-patterns/10-actions-menus-bulk-shortcuts.md §1.1).
#
# Кто за что отвечает
# - Выбор типа и поведение — ux (`behavior`), вид и числа — ui (`visual`), клавиатура и роли — `keyboard`, тексты
#   компонента — `text`, роль текста каждой текстовой части — раздел `text_roles`. Здесь — тип, назначение, состояния,
#   части и ссылки; нормы живут у владельцев и здесь не пересказываются, чтобы правка нормы оставалась правкой одного
#   места.
# - Состояния экрана (загрузка, пусто, ошибка, нет прав …) — другой словарь:
#   ux/06-feedback-states-motion/01-state-matrix.md §2. У коллекций и плиток ключ `screen_states` ведёт к строке
#   матрицы «компонент × состояние экрана» (06/01 §3.1) — ключу раздела `matrix` производного
#   ux/06-feedback-states-motion/screen-states.yaml; варианты данных такого компонента ДС рисует по ней.
# - Чего в словаре нет и где оно живёт — раздел `outside`.
#
# Ключи типа
#   name, group, purpose — имя, группа (`groups`), потребность одной фразой;
#   behavior, visual — ссылки на нормы ux и ui (пустой список — нормы в базах нет: вид решает слой дизайна,
#   поведение — владелец продукта);
#   keyboard, text — клавиатурный контракт и тексты компонента;
#   states.required — состояния, которые ДС рисует всегда; states.optional — когда продукт использует режим;
#   parts — части составного компонента для `ui:<Тип>.<Часть>`;
#   usage — метки грани «Слот» словаря меток токенов (ui/14-recipes/08-tokens-export.md §Шаг 4);
#   app_css — классы эталонного слоя компонентов ui/14-recipes/examples/app.css;
#   screen_states — строка матрицы состояний экрана для коллекций и плиток (`файл#ключ` YAML матрицы);
#   aka — имена того же компонента в других системах: помогают сопоставить компонент ДС типу, в экранах не пишутся;
#   use_instead — частые подмены: в каком случае нужен другой тип.
#
# Ссылки — путь от kb/ и раздел: `ux/04-components-patterns/06-input-controls.md §4.2`.
#
# Проверка покрытия читает этот файл так:
# 1. Каждый узел `ui:<Тип>` в деревьях экранов — ключ `types` или тип расширения проекта; `ui:<Тип>.<Часть>` —
#    часть из `parts` этого типа. Имена из `aka` в экранах не принимаются: для них проверка подсказывает тип.
# 2. Каждый тип, названный в экранах проекта, сопоставлен компоненту ДС. Один компонент ДС может закрывать
#    несколько типов (баннер и инлайн-сообщение — варианты одного компонента); два компонента ДС на один тип —
#    две реализации одной потребности, это дефект.
# 3. У компонента ДС нарисованы все `states.required` его типа и те `states.optional`, которые продукт объявил в
#    сопоставлении. Комбинации пар состояний, которые есть у типа, рисуются по
#    ui/06-components-visual/07-states-matrix.md §10.
# 4. На поверхности без указателя (`type: mobile`) состояние `hover` не требуется.
# 5. Значения компонента ДС берутся из токенов ДС: компонент, свойство или значение, которые не подтверждены
#    источником ДС, не используются (ux/11-ai-generated-ui/03-tools-landscape.md §2.1).

groups:
  action: Действия
  input: Ввод и выбор
  navigation: Навигация
  overlay: Оверлеи
  feedback: Обратная связь
  data: Данные
  structure: Структура

state_groups:
  base: Исходное
  interaction: Взаимодействие
  choice: Выбор и раскрытие
  availability: Доступность действия
  validation: Проверка значения
  data: Данные и процесс
  drag: Перетаскивание

# Состояния элемента — отклик одного элемента на человека и данные. Набор один для всех типов; тип берёт из него
# свои состояния. Ключи состояния: name, group (`state_groups`), means — что значит, applies — где и с какой
# оговоркой, hook — чем состояние выражено в CSS и ARIA, synonyms — как его называют базы и словарь меток токенов
# (`usage`), behavior и visual — ссылки на нормы ux и ui. По `synonyms` переводится текст базы и сопоставляются
# токены ДС.
element_states:
  rest:
    name: Покой
    group: base
    means: "Исходный вид элемента, с которым сейчас не взаимодействуют."
    hook: "—"
    synonyms: {ux: [default, enabled], ui: [rest, default, enabled], usage: [rest]}
    behavior:
      - ux/06-feedback-states-motion/01-state-matrix.md §7.2
      - ux/04-components-patterns/06-input-controls.md §15.1
    visual:
      - ui/06-components-visual/07-states-matrix.md §1

  hover:
    name: Наведение
    group: interaction
    means: "Указатель над элементом."
    applies: >-
      Только на устройствах с указателем (`any-hover: hover`). На поверхности без указателя состояние не рисуется,
      а действие, которое мышью открывается наведением, там видно всегда.
    hook: ":hover"
    synonyms: {ux: [hover], ui: [hover], usage: [hover]}
    behavior:
      - ux/06-feedback-states-motion/01-state-matrix.md §7.2
      - ux/09-mobile/02-mobile-navigation-and-actions.md §5.7
    visual:
      - ui/06-components-visual/07-states-matrix.md §4.1
      - ui/06-components-visual/07-states-matrix.md §4.5

  focus-visible:
    name: Видимый фокус
    group: interaction
    means: "Элемент получил фокус, и его показывают кольцом фокуса."
    applies: >-
      У каждого фокусируемого элемента. Фокус без видимого кольца (`:focus` после клика по кнопке) своего вида не
      имеет и отдельным состоянием не считается.
    hook: ":focus-visible"
    synonyms: {ux: [focus-visible, focus], ui: [focus-visible, focus], usage: [focus]}
    behavior:
      - ux/08-accessibility/02-keyboard-focus-semantics.md §7
    visual:
      - ui/06-components-visual/07-states-matrix.md §5

  active:
    name: Нажатие
    group: interaction
    means: "Момент нажатия, пока кнопка мыши или палец не отпущены."
    applies: "Включённое положение кнопки-переключателя — это `checked`, а не нажатие."
    hook: ":active"
    synonyms: {ux: [active, pressed], ui: [active, pressed], usage: [active]}
    behavior:
      - ux/06-feedback-states-motion/01-state-matrix.md §7.2
    visual:
      - ui/06-components-visual/07-states-matrix.md §4.1
      - ui/06-components-visual/07-states-matrix.md §9

  selected:
    name: Выбрано
    group: choice
    means: "Устойчивый выбор в наборе: строка, вкладка, пункт, чип, текущий пункт навигации."
    applies: >-
      Заметнее наведения и продублировано вторым признаком — галочкой, весом, полосой. Текущая страница в навигации —
      тоже `selected`.
    hook: "[aria-selected=true], [aria-current]"
    synonyms: {ux: [selected], ui: [selected, current], usage: [selected]}
    behavior:
      - ux/06-feedback-states-motion/01-state-matrix.md §7.2
      - ux/08-accessibility/02-keyboard-focus-semantics.md §7.4
    visual:
      - ui/06-components-visual/07-states-matrix.md §6

  checked:
    name: Отмечено
    group: choice
    means: "Включённое значение двухпозиционного контрола: чекбокса, радиокнопки, переключателя, кнопки-переключателя."
    hook: ":checked, [aria-checked=true], [aria-pressed=true]"
    synonyms: {ux: [checked, selected], ui: [checked, pressed], usage: [selected]}
    behavior:
      - ux/04-components-patterns/06-input-controls.md §4
      - ux/04-components-patterns/06-input-controls.md §15.1
    visual:
      - ui/06-components-visual/07-states-matrix.md §6
      - ui/06-components-visual/02-forms-and-inputs.md §7

  indeterminate:
    name: Частично отмечено
    group: choice
    means: "Отмечена часть группы: чекбокс «выбрать всё» в шапке таблицы, узел дерева."
    applies: "У индикатора прогресса «неопределённый» — вид (объём неизвестен), а не это состояние."
    hook: ":indeterminate, [aria-checked=mixed]"
    synonyms: {ux: [mixed, indeterminate], ui: [indeterminate]}
    behavior:
      - ux/04-components-patterns/06-input-controls.md §4.2
      - ux/04-components-patterns/10-actions-menus-bulk-shortcuts.md §3.2
    visual:
      - ui/06-components-visual/02-forms-and-inputs.md §7.1
      - ui/06-components-visual/glossary.md §4

  expanded:
    name: Раскрыто
    group: choice
    means: "Триггер открыл свой список, меню, панель или раздел."
    applies: "Пока триггер и то, что он открыл, видны вместе, триггер подсвечен: иначе непонятно, чьё это меню."
    hook: "[aria-expanded=true]"
    synonyms: {ux: [открыто], ui: [expanded]}
    behavior:
      - ux/08-accessibility/02-keyboard-focus-semantics.md §8.8
    visual:
      - ui/06-components-visual/07-states-matrix.md §6.3

  disabled:
    name: Недоступно
    group: availability
    means: "Действие сейчас недоступно, и рядом объяснено почему."
    applies: >-
      Недоступное приглушают с причиной, а скрывают только то, чего у роли нет вовсе. Рисуется своими токенами, а не
      прозрачностью всего элемента.
    hook: ":disabled, [aria-disabled=true]"
    synonyms: {ux: [disabled], ui: [disabled], usage: [disabled]}
    behavior:
      - ux/04-components-patterns/10-actions-menus-bulk-shortcuts.md §2.4
      - ux/08-accessibility/02-keyboard-focus-semantics.md §8.10
    visual:
      - ui/06-components-visual/07-states-matrix.md §7

  readonly:
    name: Только чтение
    group: availability
    means: "Значение видно и копируется, но не меняется; элемент фокусируется и читается скринридером."
    applies: "Не путать с `disabled`: поле только для чтения проходит по контрасту."
    hook: "[readonly], [aria-readonly=true]"
    synonyms: {ux: [read-only], ui: [readonly], usage: [readonly]}
    behavior:
      - ux/04-components-patterns/06-input-controls.md §15.1
    visual:
      - ui/06-components-visual/02-forms-and-inputs.md §3.6

  invalid:
    name: Ошибка значения
    group: validation
    means: "Значение не прошло проверку или обязательное не заполнено; нужна реакция человека."
    applies: >-
      Граница, иконка и текст ошибки вместе — цвет не единственный признак. Пока поле в фокусе, фокус важнее красной
      границы. Ошибку загрузки или операции описывает состояние экрана, а не это состояние.
    hook: "[aria-invalid=true], :user-invalid"
    synonyms: {ux: [error], ui: [invalid, error], usage: [invalid]}
    behavior:
      - ux/04-components-patterns/05-forms-and-validation.md §4
      - ux/06-feedback-states-motion/01-state-matrix.md §7.2
    visual:
      - ui/06-components-visual/02-forms-and-inputs.md §3.4
      - ui/06-components-visual/07-states-matrix.md §10

  warning:
    name: Предупреждение
    group: validation
    means: "Значение допустимо, но может привести к проблеме."
    applies: "Не оформляется как ошибка и отличается от обычной подсказки."
    hook: "—"
    synonyms: {ux: [warning], ui: [warning]}
    behavior:
      - ux/06-feedback-states-motion/01-state-matrix.md §7.2
    visual:
      - ui/06-components-visual/02-forms-and-inputs.md §3.1

  valid:
    name: Значение подтверждено
    group: validation
    means: "Проверка прошла, и это стоит показать: имя свободно, пароль достаточно сильный."
    applies: "Только у полей, где успех несёт информацию; если требование одно — заполненность, успех не показывают."
    hook: ":user-valid"
    synonyms: {ux: [успех], ui: [success]}
    behavior:
      - ux/04-components-patterns/05-forms-and-validation.md §4.7
    visual:
      - ui/06-components-visual/02-forms-and-inputs.md §3.1

  loading:
    name: Идёт операция
    group: data
    means: "Элемент запустил операцию и ждёт её завершения."
    applies: "Размер элемента не меняется; повторное нажатие не запускает операцию второй раз."
    hook: "[aria-busy=true]"
    synonyms: {ux: [loading], ui: [loading, busy], usage: [loading]}
    behavior:
      - ux/06-feedback-states-motion/01-state-matrix.md §7.2
      - ux/04-components-patterns/05-forms-and-validation.md §5.3
    visual:
      - ui/06-components-visual/07-states-matrix.md §8

  skeleton:
    name: Значение загружается
    group: data
    means: "Значение элемента ещё не пришло; на его месте скелетон формы значения."
    applies: >-
      Отличается от `loading`: там идёт операция, здесь ждут данные. Загрузку коллекции целиком описывает состояние
      экрана.
    hook: "[aria-busy=true]"
    synonyms: {ux: [skeleton], ui: [skeleton]}
    behavior:
      - ux/06-feedback-states-motion/01-state-matrix.md §7.2
      - ux/06-feedback-states-motion/02-system-status-and-waiting.md §3.2
    visual:
      - ui/06-components-visual/06-data-display-and-misc.md §3

  dragged:
    name: Перетаскивается
    group: drag
    means: "Элемент взят и перемещается."
    applies: "У перетаскивания всегда есть альтернатива кнопками."
    hook: "—"
    synonyms: {ui: [dragged], usage: [dragging]}
    behavior:
      - ux/04-components-patterns/10-actions-menus-bulk-shortcuts.md §5
    visual:
      - ui/06-components-visual/07-states-matrix.md §1
      - ui/06-components-visual/07-states-matrix.md §10

  drop-target:
    name: Место вставки
    group: drag
    means: "Сюда упадёт перетаскиваемый элемент или файл."
    hook: "—"
    synonyms: {ui: [drop target]}
    behavior:
      - ux/04-components-patterns/10-actions-menus-bulk-shortcuts.md §5.2
      - ux/04-components-patterns/06-input-controls.md §10.3
    visual:
      - ui/06-components-visual/glossary.md §4
      - ui/06-components-visual/07-states-matrix.md §10

  visited:
    name: Посещено
    group: choice
    means: "Ссылку в тексте уже открывали."
    applies: "Только у ссылок в содержательном тексте."
    hook: ":visited"
    synonyms: {ui: [visited]}
    behavior: []
    visual:
      - ui/06-components-visual/07-states-matrix.md §1

# Слова, которые похожи на состояние элемента, но им не являются.
not_element_states:
  - {word: focus, instead: "селектор без своего вида; видимый фокус — `focus-visible`"}
  - {word: filled, instead: "заполненное поле выглядит как `rest`"}
  - {word: focus-within, instead: "приём контейнера, например кнопка очистки в поиске, а не состояние"}
  - {word: open, instead: "появление оверлея; у его триггера — `expanded`"}
  - {word: current, instead: "текущий пункт навигации — `selected`"}
  - {word: pressed, instead: "момент нажатия — `active`; включённая кнопка-переключатель — `checked`"}
  - {word: success, instead: "у поля — `valid`; успех операции — состояние экрана"}
  - {word: error, instead: "у значения — `invalid`; ошибка загрузки или операции — состояние экрана"}
  - {word: selected-hover, instead: "комбинация состояний: ui/06-components-visual/07-states-matrix.md §10"}
  - {word: статус шага, instead: "пройденный и будущий шаг — данные шага; текущий — `selected`, шаг с ошибкой — `invalid`"}
  - {word: тон статуса, instead: "успех, предупреждение, опасность у бейджа — данные из словаря статусов продукта"}

types:

  # ── Действия ──────────────────────────────────────────────────────────────────────────────────────────────────

  Button:
    name: Кнопка
    group: action
    purpose: "Запустить действие: сохранить, создать, отправить, перейти к следующему шагу."
    behavior:
      - ux/04-components-patterns/10-actions-menus-bulk-shortcuts.md §1
      - ux/03-layout-placement/03-hierarchy-and-attention.md §4
      - ux/04-components-patterns/05-forms-and-validation.md §5
      - ux/03-layout-placement/04-placement-conventions-and-redundancy.md §4
    visual:
      - ui/06-components-visual/01-buttons-and-actions.md
    keyboard: ux/08-accessibility/02-keyboard-focus-semantics.md §8.2
    text: ux/07-ux-writing/02-microcopy-by-component.md §1
    states:
      required: [rest, hover, focus-visible, active, disabled, loading]
      optional: [checked, expanded]
    usage: [button]
    app_css: [.btn, .btn--default, .btn--primary, .btn--ghost, .btn--danger]
    use_instead:
      - {when: "переход на другой экран или адрес", use: Link, ref: ui/06-components-visual/01-buttons-and-actions.md §2.4}
      - {when: "переключение вида между немногими вариантами", use: SegmentedControl, ref: ux/04-components-patterns/06-input-controls.md §1.3}
      - {when: "несколько равноправных действий в одном месте", use: Menu, ref: ux/03-layout-placement/03-hierarchy-and-attention.md §4.4}

  IconButton:
    name: Иконочная кнопка
    group: action
    purpose: "Частое действие без текста на кнопке — в строке таблицы, панели инструментов, шапке; подпись даёт тултип и доступное имя."
    behavior:
      - ux/04-components-patterns/01-data-tables.md §8.1
      - ux/08-accessibility/02-keyboard-focus-semantics.md §3.8
    visual:
      - ui/06-components-visual/01-buttons-and-actions.md §4
    keyboard: ux/08-accessibility/02-keyboard-focus-semantics.md §8.2
    text: ux/07-ux-writing/02-microcopy-by-component.md §9
    states:
      required: [rest, hover, focus-visible, active, disabled]
