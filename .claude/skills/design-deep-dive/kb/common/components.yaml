# Соответствие для перевода между поверхностями. Проверка покрытия его не использует.
crosswalk:
  bot_widgets:
    button: [Button]
    url: [Link]
    select: [RadioGroup, Select]
    multiselect: [Checkbox, Listbox]
    text-input: [TextInput]
    calendar: [DatePicker]

# Роль текста у текстовых частей компонентов. Ключ — тип или часть в записи `<Тип>.<Часть>`, как узел `ui:` в
# экранах; значение — роли из закрытого списка ролей текста ux (ux/07-ux-writing/06-banned-words-and-patterns.md §7.2)
# вместе с `body` — связным текстом без своей роли. По роли линтер текстов выбирает правила, поэтому роль части не
# угадывают по месту. Роль — что текст сообщает, а не состояние: у поля с ошибкой текст несёт роль `error`, а само
# поле — состояние элемента `invalid`. Где ролей две, первая — имя или главная подпись, вторая — вспомогательный текст;
# `placeholder` — текст пустого поля. Ячейки таблиц и значения полей — данные, а не текст интерфейса: их правят норма
# пустого значения (ux/07-ux-writing/01-principles-voice-and-tone.md §11.5) и форматы, а не словарь запретов.
text_roles:
  Button: [action]
  SplitButton.Item: [action]
  Menu.Item: [action]
  IconButton: [aria, tooltip]
  Link: [link]
  SkipLink: [link]
  Field.Label: [label]
  Field.Hint: [hint]
  Field.Error: [error]
  TextInput: [placeholder]
  Textarea: [placeholder]
  SearchInput: [placeholder]
  Select: [placeholder]
  Select.Option: [label]
  Checkbox: [checkbox-label]
  RadioGroup.Item: [label]
  Chip: [label]
  Switch: [label, setting-description]
  Tabs.Tab: [tab]
  SegmentedControl.Item: [tab]
  Sidebar.Item: [nav]
  BottomNav.Item: [nav]
  Breadcrumbs.Item: [nav]
  Modal.Header: [title]
  Modal.Body: [body]
  Drawer.Header: [title]
  Drawer.Body: [body]
  ConfirmModal.Header: [confirm-title]
  ConfirmModal.Body: [confirm-body]
  Tooltip.Content: [tooltip]
  Toast: [toast]
  Banner: [banner]
  Alert: [inline-message]
  Progress: [status]
  Spinner: [status]
  EmptyState: [empty]
  Table.Header: [column-header]
  Card.Header: [section-title]
  Accordion.Trigger: [section-title]
  Badge: [badge]
  Tag: [badge]
  Image: [alt]
  Avatar: [alt]
  Chart: [alt]

# Тип, которого нет в словаре, проект заводит расширением. Расширение живёт в слое дизайна проекта рядом с
# сопоставлением типов компонентам ДС и действует только в своём проекте.
project_extension:
  fields:
    id: "Имя типа в PascalCase; не совпадает с ключами `types` и их `aka`."
    name: "Человекочитаемое имя."
    purpose: "Потребность, которую не закрывает ни один тип словаря."
    why_not: "Ближайший тип словаря и почему он не подходит."
    behavior: "Нормы поведения: ссылка на базу или решение владельца продукта."
    states: "`required` и `optional` — только из `element_states`."
    parts: "Части составного компонента, если есть."
  rules:
    - "Если подходит тип словаря, берут его: расширение не дублирует потребность (ux/10-design-systems-consistency/02-consistency-rules.md §3.1)."
    - "Состояния — из общего набора; своё состояние элемента проект не заводит."
    - "Тип расширения, который понадобился второму проекту, переносят в словарь."
