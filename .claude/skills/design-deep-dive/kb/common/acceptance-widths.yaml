# Ширины приёмки
#
# На каких ширинах окна смотрят и принимают результат: артборды холста, собранную страницу сайта и экран приложения.
# Файл читают агент скилла и вход холста — чтобы холст рисовал артборды и работу предъявляли на одном наборе ширин, — и
# утилиты проверки макета и страницы, чтобы не держать свой список в коде.
#
# Набор задаёт заказчик: по нему он принимает работу. Поэтому агент не сокращает набор ради скорости прогона и не
# добавляет «ещё одну популярную ширину»; изменить набор может только заказчик.
#
# Ширина приёмки и брейкпоинт — разные величины.
# - Брейкпоинт — ширина окна, на которой меняется раскладка. Его ставят там, где раскладка ломается, и записывают
#   токеном `breakpoint.*` дизайн-системы проекта. Эталон приложения — ui/09-design-tokens/04-reference-token-schema.md
#   §1.3 (640, 1024, 1440); границы вариантов блоков сайта — site/04-blocks/blocks.yaml, соглашение `breakpoints`
#   (40rem и 60rem).
# - Ширина приёмки — ширина, на которой результат смотрят и принимают. Набор один для всех проектов и не зависит от
#   брейкпоинтов конкретной дизайн-системы: в каждый диапазон эталонов ui и site попадает хотя бы одна ширина.
# - Приёмка не заменяет проверку перестроения. Её делают отдельно: на границах брейкпоинтов дизайн-системы ±1 px и на
#   произвольных ширинах внутри диапазонов, включая широкий экран
#   (ux/10-design-systems-consistency/02-consistency-rules.md §4.3).
#
# Артборд — кадр холста одной ширины. Артборды — все ширины приёмки: оригинал макета — холст в claude.ai, на нём
# заказчик смотрит и правит работу на каждой ширине. Горизонтальный вылет на 320, ресайз и зум проверяют на собранной
# странице в репозитории кода; тёмную тему — твиком холста и на сборке.

# CSS px, от широкой к узкой. На каждой ширине — артборд холста и кадр сборки, горизонтальный вылет 0.
widths: [1440, 1280, 1024, 768, 390, 360]

# Артборды холста — все ширины приёмки, как `widths`; у экрана кабинета — ширины его класса (`by_viewport`).
artboards: [1440, 1280, 1024, 768, 390, 360]

# На 320 CSS px проверяют только горизонтальный вылет, на собранной странице: она читается без прокрутки в двух
# измерениях. Это та же проверка, что окно 1280 при зуме 400 % (WCAG 1.4.10). Что считается вылетом и какое содержимое
# (таблицы данных, карты) прокручивается в своём контейнере — ux/08-accessibility/01-wcag22-as-build-rules.md §3.2.
overflow_only: 320

# Тёмная тема проверяется на тех же ширинах, если она есть в дизайн-системе проекта: на холсте — твиком темы, на
# сборке — кадрами в обеих темах.
themes: [light, dark]

# Поле `viewport` потока и экрана в слое screens проекта. Мобильная композиция живёт ниже первого брейкпоинта
# дизайн-системы, поэтому граница класса — брейкпоинт проекта, а не число в этом файле. С эталоном ui (первая граница
# 640): mobile — 390, 360 и вылет на 320; desktop — 1440, 1280, 1024, 768. Артборды экрана — ширины его класса, вылет на
# 320 — на сборке.
by_viewport:
  mobile: "ширины приёмки ниже первого брейкпоинта дизайн-системы и вылет на 320"
  desktop: "ширины приёмки от первого брейкпоинта дизайн-системы"
  any: "все ширины приёмки и вылет на 320"

# Первый экран страницы сайта судят по окну с высотой (ширина × высота); какие это окна и что обязано быть в первом
# экране — политика первого экрана site. Ширины этих окон входят в набор приёмки.
first_screen: site/03-page-structure/03-first-screen-and-mobile.md
