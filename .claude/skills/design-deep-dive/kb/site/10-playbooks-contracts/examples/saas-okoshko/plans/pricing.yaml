  budgets: ../../../../07-seo-geo-performance-analytics/budgets.yaml
page:
  id: pricing
  page_type: pricing-page
  lang: ru
  locale: ru-RU
  jurisdiction:
  - ru
  goal: показать тарифы и условия, чтобы выбрать и начать пробный период
  primary_action: start-trial
  cta_target:
    kind: route
    value: /signup
  awareness: product-aware
  awareness_basis:
    from: assumption
    rule: уровень по главному источнику страницы (site 03/01 §3.1)
  traffic:
  - traffic_source: search-brand
    temperature: hot
    device: mixed
  - traffic_source: internal
    temperature: warm
    device: mixed
  macrostructure: pricing-first
  macrostructure_family: document
  first_screen_policy: offer-cta-header
  budget_profile: pricing-page@L0
  ambition_level: L0
  navigation:
    header: landing-minimal
    archetype: minimal-cta
    anchor_nav: false
    logo_link: /
    breadcrumbs: false
    footer: minimal
  seo:
    indexable: true
    canonical: self
    h1: hero.headline
    structured_data:
    - BreadcrumbList
    - SoftwareApplication
    ssr_required: true
    sitemap: true
  legal:
    pd_consent: not-collected
    privacy_policy: /privacy
    cookie_banner: required
    cookie_mode: opt-in
    analytics_before_consent: false
    withdraw_link: footer
    ad_marking: false
    requisites: footer
    operator_ref: missing:legal-details
    requirements:
    - req:LR-RU-10
    - req:LR-RU-13
    - req:LR-RU-14
    - req:LR-RU-16
    - req:LR-RU-19
    - req:LR-RU-22
    - req:LR-RU-24
    notes: 'регистрация и оплата — в продукте (/signup): согласие и оферта там (site 08); не юридическое заключение'
  analytics:
    systems:
    - yandex-metrica
    goals: []
    load_after_consent: true
sections:
- id: header
  role: header
  question: как начать и как войти
  job: логотип → главная, пробный период, вход
  block: header
  variant: landing-minimal
  next_step: шапка и подвал сайта
  slots:
    text:
    - id: cta-label
      slot: cta-label
      intent: 'cta-label: по иерархии сообщений text'
    media:
    - id: logo
      slot: brand-logo
      media_role: informational
      goal: показать brand-logo
      source: generate
      authenticity: real-or-generated
    action:
    - id: cta
      slot: cta-primary
      action: start-trial
      style: primary
      target:
        kind: anchor
        value: '#lead-form'
      event: event:cta-click
      label: cta-label
    - id: login
      slot: link
      action: log-in
      style: link
      target:
        kind: anchor
        value: '#lead-form'
