      target: product-demo.row
      trigger: pin-scroll
      purpose: signature
      note: окно расписания закреплено, записи появляются по мере прокрутки текста
    composition:
      align: left
      text_media: text-left
      height: scene
    reduce:
      strategy: static-poster
