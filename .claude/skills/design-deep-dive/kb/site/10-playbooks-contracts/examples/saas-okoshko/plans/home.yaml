      strategy: static
      note: кадры интерфейса между абзацами
    budget:
      js_kb_br: 45
      load: after-lcp
- id: case-studies
  role: case-studies
  question: У похожих салонов правда меньше неявок?
  job: Показать результат барбершопа в Казани и рядом — обычный результат по 212 салонам
  block: case-study
  variant: quote-led
  next_step: Сколько стоит (tarify)
  mobile:
  - stack
  slots:
    text:
    - id: title
      slot: case-title
      heading: h2
      intent: 'барбершоп на 4 кресла: неявки с 14 % до 6 % за три месяца'
    - id: summary
      slot: case-summary
      intent: что было и что включили
    - id: result
      slot: case-result
      intent: результат числом с базой и сроком
    - id: quote
      slot: testimonial-quote
    - id: attribution
      slot: testimonial-attribution
    - id: disclaimer
      slot: disclaimer
      intent: 'обычный результат: в среднем у 212 салонов (январь — май 2026)'
    data:
    - id: case
      slot: case-ref
      anatomy: case
      fact: fact:case-noshow-kazan
      binds:
      - title
      - summary
      - result
    - id: testimonial
      slot: testimonial-ref
      anatomy: testimonial
      fact: fact:review-ruslan
      binds:
      - quote
      - attribution
    - id: typical
      slot: metric-ref
      fact: fact:noshow-average
      binds:
      - disclaimer
  notes:
    legal: не обещать «без неявок» (never_claim nc-zero-noshow) и рост выручки (nc-revenue-growth)
    structure: типичный результат рядом с лучшим — text B2 §5.4
  treatment:
    level: L0
    visual_role: support
    motion_level: subtle
- id: pricing
  role: pricing
  anchor: tarify
  question: Сколько стоит и что будет после пробного периода?
  job: Показать три тарифа с ценой в месяц, скидку за год и что SMS — отдельно
