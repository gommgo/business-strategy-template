      alt: row-1-alt
    - id: row-2-media
      slot: screenshot
      anatomy: row.media
      group: row-2
      media_role: informational
      goal: напоминание в Telegram
      source: customer-tbd
      authenticity: real-only
      ratio:
        desktop: '4:5'
        mobile: '9:16'
      loading: lazy
      alt: row-2-alt
    - id: row-3-media
      slot: screenshot
      anatomy: row.media
      group: row-3
      media_role: informational
      goal: экран импорта базы
      source: customer-tbd
      authenticity: real-only
      ratio:
        desktop: '16:10'
        mobile: '4:5'
      loading: lazy
      alt: row-3-alt
    data:
    - id: link
      slot: fact-ref
      fact: fact:self-booking-link
      binds:
      - row-1-body
    - id: reminders
      slot: fact-ref
      fact: fact:reminders
      binds:
      - row-2-title
      - row-2-body
    - id: sms
      slot: price-ref
      fact: fact:sms-price
      binds:
      - row-2-body
    - id: quote
      slot: testimonial-ref
      fact: fact:review-ruslan
      binds:
      - row-2-quote
    - id: import
      slot: price-ref
      fact: fact:import-free
      binds:
      - row-3-title
      - row-3-body
