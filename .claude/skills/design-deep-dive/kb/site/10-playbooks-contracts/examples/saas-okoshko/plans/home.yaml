- Реквизиты (missing:legal-details, blocking) — страница не публикуется до ответа
- Логотипы салонов с согласием (missing:client-logos) — блок logo-wall не ставится
- Интеграции (missing:integrations-list) — секция integrations не ставится до списка
- Состав тарифов по пунктам — одинаковый набор строк у всех тарифов; пункты — из фактов (text)
- Форма регистрации и письмо подтверждения (missing:confirm-link-expiry) — F и text; экран регистрации — ux 05-01
