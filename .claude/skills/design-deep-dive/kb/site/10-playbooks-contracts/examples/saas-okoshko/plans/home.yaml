# ПРИМЕР J v1 · план лендинга SaaS — перевод плана E v0.9 в v1; подача — treatment creative A/02.
page_plan_version: '1'
checked: '2026-09-24'
status: proposed
example: true
site: okoshko-demo
refs:
  brief: ../site-brief.yaml
  facts: ../facts.yaml
  blocks: ../../../../04-blocks/blocks.yaml
  vocabulary: ../../../../02-site-types/vocabulary.yaml
  lead_forms: ../../../../05-conversion-funnels/lead-forms.yaml
  events: ../../../../07-seo-geo-performance-analytics/events.yaml
  legal_requirements: ../../../../08-legal-trust-a11y/legal-requirements.yaml
  head_kit: ../../../../07-seo-geo-performance-analytics/head-kit.yaml
  budgets: ../../../../07-seo-geo-performance-analytics/budgets.yaml
page:
  id: home
  page_type: landing-saas
  template: false
  url: /
  lang: ru
  locale: ru-RU
  jurisdiction:
  - ru
  goal: Регистрации в пробный период 14 дней без карты от владельцев и администраторов салонов на 1–5 мастеров
  primary_action: start-trial
  secondary_actions:
  - message
  cta_target:
    kind: route
    value: /signup
  secondary_goal: Не готов регистрироваться — задать вопрос в поддержку (чат ежедневно 9:00–21:00 МСК)
  awareness: solution-aware
  awareness_basis:
    from: assumption
    main_sources:
    - paid-search
    - search-category
    - paid-social
    - referral
    by_source:
    - traffic_source: paid-search
      awareness: solution-aware
      share: 0.4
    - traffic_source: search-category
      awareness: solution-aware
      share: 0.3
    - traffic_source: paid-social
      awareness: problem-aware
      share: 0.2
    - traffic_source: referral
      awareness: product-aware
      share: 0.1
    rule: Смысла (meaning) у демо нет — уровни по таблице C 02 §4. Порядок под solution-aware (0,7); для problem-aware из соцсетей (0,2)
      — секция проблемы третьей; отдельная страница не нужна (различается один признак)
  traffic:
  - traffic_source: paid-search
    temperature: warm
    share: 0.4
    device: mixed
    promise_of_source: онлайн-запись для барбершопа, 14 дней бесплатно
  - traffic_source: search-category
    temperature: warm
    share: 0.3
    device: mixed
  - traffic_source: paid-social
    temperature: cold
    share: 0.2
    device: mobile
    in_app_browser: true
  - traffic_source: referral
    temperature: warm
    share: 0.1
    device: mobile
  macrostructure: workbench
  macrostructure_family: document
  macrostructure_alternatives:
  - bento-grid
  - stat-led
  first_screen_policy: offer-cta
  first_screen:
    must_show:
    - hero.headline
    - hero.subheadline
    - hero.cta
    - hero.cta-note
    - hero.screenshot
    core_words_max: 40
    message_match:
    - traffic_source: paid-search
      promise: онлайн-запись для барбершопа, 14 дней бесплатно
      match:
      - subject
      - audience
      - offer
      - action
      slots:
      - hero.headline
      - hero.cta-label
      - hero.cta-note
    - traffic_source: paid-social
      promise: 'визуал креатива: мастер и телефон с напоминанием'
      match:
      - visual
      - subject
      slots:
      - hero.visual
    variant_map:
      param: utm_content
      render: server
      default: salon
      variants:
      - id: salon
        when:
        - salon
        - beauty
        slots:
        - hero.headline
      - id: barbershop
        when:
        - barber
        - barbershop
        slots:
        - hero.headline
        - hero.eyebrow
      event_param: hero_variant (параметр события — P)
  length:
    sections_min: 7
    sections_max: 11
    basis: 'C 02 §1.3: SaaS 7–11'
  budget_profile: landing-saas@L1
  ambition_level: L1
  navigation:
    header: landing-minimal
    archetype: minimal-cta
    anchor_nav: false
    logo_link: /
    breadcrumbs: false
    footer: minimal
  seo:
    indexable: true
    h1: hero.headline
    ssr_required: true
    notes: разметка SoftwareApplication и Offer — решение H; цены тарифов — текстом в HTML
    canonical: self
    structured_data:
    - Organization
    - WebSite
    - SoftwareApplication
    sitemap: true
    hreflang: false
  legal:
    pd_consent: not-collected
    privacy_policy: /privacy
    cookie_banner: required
    cookie_mode: opt-in
    analytics_before_consent: false
    withdraw_link: footer
    ad_marking: false
    requisites: footer
    operator_ref: missing:legal-details
    requirements:
    - req:LR-RU-10
    - req:LR-RU-13
    - req:LR-RU-14
    - req:LR-RU-16
    - req:LR-RU-19
    - req:LR-RU-22
    - req:LR-RU-24
    notes: 'регистрация и оплата — в продукте (/signup): согласие и оферта там (I); не юридическое заключение'
  analytics:
    systems:
    - yandex-metrica
    goals:
    - start-trial
    - message
    load_after_consent: true
    notes: trial-start и sign-up-complete — события продукта на /signup (P); на лендинге — cta-click с параметром места
  treatment:
    art_direction_ref: ../../../../../creative/01-creative-direction/examples/art-direction-okoshko.json#/directions/0
    motion_level: expressive
    motion_system:
      thesis: 'Пустые окна расписания заполняются записями: одна закреплённая сцена показывает день салона в продукте.'
      library:
      - css
      - gsap
      - scrolltrigger
      smooth_scroll: false
      page_transitions: none
      entrance_system: hero — без появления (art-direction); в сцене функций — смена состояний интерфейса по прокрутке; остальное без появления
    theme: light
    peaks:
    - product-demo
page_slots:
  text:
  - id: meta-title
    slot: meta-title
    intent: онлайн-запись и напоминания для салонов и барбершопов
  - id: meta-description
    slot: meta-description
    intent: самозапись по ссылке, напоминания в Telegram, 14 дней бесплатно без карты
  - id: og-title
    slot: og-title
  - id: og-description
    slot: og-description
  - id: og-image-alt
    slot: og-image-alt
  media:
  - id: og-image
    slot: og-image
    media_role: informational
    goal: превью ссылки
    source: template
    ratio:
      desktop: 1.91:1
    alt: og-image-alt
  data:
  - id: trial
    slot: price-ref
    fact: fact:trial-14-days
    binds:
    - meta-description
sections:
- id: header
  role: header
  block: header
  variant: landing-minimal
  slots:
    text:
    - id: cta-label
      slot: cta-label
      intent: попробовать бесплатно
    media:
    - id: logo
      slot: brand-logo
      media_role: informational
      source: customer-tbd
    action:
    - id: cta
      slot: cta-primary
      action: start-trial
      target:
        kind: route
        value: /signup
      style: primary
      label: cta-label
      event: event:cta-click
    - id: login
      slot: link
      action: log-in
      target:
        kind: url
        value: адрес входа в продукт
      style: link
      event: event:login-click
  mobile:
  - stack
  notes:
    conversion: «Войти» — служебная ссылка (log-in, micro), не второй призыв
  events:
  - trigger: click
    target: cta
    action: start-trial
    event: event:cta-click
  treatment:
    level: L0
    visual_role: chrome
    motion_level: subtle
- id: hero
  role: hero
  question: Это онлайн-запись для моего салона? Сколько стоит попробовать?
  job: Сказать, что это онлайн-запись с напоминаниями для барбершопов и салонов, показать продукт и дать начать 14 дней без карты
  block: hero-media
  variant: product-frame
  next_step: Сколько салонов уже пользуются (tsifry) или сразу регистрация
  carries:
  - core
  mobile:
  - reframe
  - stack
  slots:
    text:
    - id: eyebrow
      slot: eyebrow
      intent: для барбершопов и салонов
    - id: headline
      slot: headline
      heading: h1
      intent: онлайн-запись и напоминания, чтобы клиенты приходили
      variants: 2
    - id: subheadline
      slot: subheadline
      intent: клиенты записываются сами по ссылке, напоминания уходят в Telegram
    - id: hero-proof
      slot: hero-proof
      intent: 1 380 салонов и барбершопов на 1 сентября 2026
    - id: cta-label
      slot: cta-label
      intent: попробовать 14 дней бесплатно
    - id: cta-secondary-label
      slot: cta-secondary-label
      intent: посмотреть тарифы
    - id: cta-note
      slot: cta-note
      intent: без привязки карты
    - id: alt
      slot: image-alt
      intent: 'экран записи: свободное время мастера'
    media:
    - id: visual
      slot: hero-visual
      media_role: informational
      goal: 'кадр hero: рамка окна или телефона с настоящим экраном записи поверх фона из токенов'
      source: code
      authenticity: code
      ratio:
        desktop: '16:10'
        mobile: '4:5'
      lcp_candidate: false
      loading: eager
      alt: alt
      note: 'фон кодом (ai-media 01/01 §8.1: shader + скриншот слоем); LCP — H1'
    - id: screenshot
      slot: screenshot
      media_role: informational
      goal: экран самозаписи клиента и экран напоминаний
      source: customer-tbd
      authenticity: real-only
      ratio:
        desktop: '16:10'
        mobile: '9:16'
      loading: eager
      alt: alt
      note: факта вида demo нет в демо-наборе (бриф q-screenshots)
    data:
    - id: salons
      slot: metric-ref
      anatomy: proof
      fact: fact:salons-count
      binds:
      - hero-proof
      on_missing: omit-slot
    - id: trial
      slot: price-ref
      fact: fact:trial-14-days
      binds:
      - cta-label
      - cta-note
    - id: link
      slot: fact-ref
      fact: fact:self-booking-link
      binds:
      - subheadline
    - id: reminders
      slot: fact-ref
      fact: fact:reminders
      binds:
      - subheadline
    action:
    - id: cta
      slot: cta-primary
      action: start-trial
      target:
        kind: route
        value: /signup
      style: primary
      label: cta-label
      event: event:cta-click
    - id: cta-secondary
      slot: cta-secondary
      action: view-pricing
      target:
        kind: anchor
        value: '#tarify'
      style: secondary
      label: cta-secondary-label
      event: event:cta-click
  treatment:
    level: L1
    visual_role: accent
    motion_level: none
    background:
      kind: tint
      tone: light
    composition:
      align: left
      text_media: text-left
      bleed: edge
      overlap: true
      height: partial
    display_role: display-l
    reduce:
      strategy: final-state
    mobile:
      strategy: separate-asset
      note: скриншот телефона вместо окна десктопа
  notes:
    seo: H1 — категория словами запроса; вариант по utm_content — на сервере
    a11y: скриншот с alt по задаче; мелкий текст интерфейса не несёт смысл
  events:
  - trigger: view
    target: hero
    event: event:section-view
  - trigger: click
    target: cta
    action: start-trial
    event: event:cta-click
  - trigger: click
    target: cta-secondary
    action: view-pricing
    event: event:cta-click
- id: proof-stats
  role: proof-stats
  question: Этим кто-то пользуется? Сервис надёжный?
  job: Показать масштаб и оценку тремя числами с датой и источником
  block: stat-strip
  variant: row
  next_step: Какую проблему это снимает (problema)
  mobile:
  - stack
  slots:
    text:
    - id: title
      slot: section-title
      heading: h2
      intent: визуально скрытый заголовок «Окошко в цифрах»
    - id: source
      slot: stat-source
      intent: данные биллинга и RuStore на 1 сентября 2026
    - id: stat-1-value
      slot: stat-value
      anatomy: stat.value
      group: stat-1
    - id: stat-1-label
      slot: stat-label
      anatomy: stat.label
      group: stat-1
    - id: stat-2-value
      slot: stat-value
      anatomy: stat.value
      group: stat-2
    - id: stat-2-label
      slot: stat-label
      anatomy: stat.label
      group: stat-2
    - id: stat-3-value
      slot: stat-value
      anatomy: stat.value
      group: stat-3
    - id: stat-3-label
      slot: stat-label
      anatomy: stat.label
      group: stat-3
    data:
    - id: salons
      slot: metric-ref
      anatomy: stat.metric
      group: stat-1
      fact: fact:salons-count
      binds:
      - stat-1-value
      - stat-1-label
      - source
    - id: rating
      slot: metric-ref
      anatomy: stat.metric
      group: stat-2
      fact: fact:rating-rustore
      binds:
      - stat-2-value
      - stat-2-label
      - source
    - id: noshow
      slot: metric-ref
      anatomy: stat.metric
      group: stat-3
      fact: fact:noshow-average
      binds:
      - stat-3-value
      - stat-3-label
      - source
    - id: logos
      slot: client-ref
      fact: missing:client-logos
      on_missing: omit-block
      note: логотипов клиентов с согласием нет — блок logo-wall не ставится
  notes:
    structure: логотипы — только после письменных согласий (missing:client-logos)
    legal: числа — с датой и источником (I)
  treatment:
    level: L0
    visual_role: support
    motion_level: none
    notes: числа — только факты; без счётчиков (почерк генераторов)
- id: problem
  role: problem
  question: Почему клиенты не приходят и зачем мне ещё один сервис?
  job: 'Назвать ситуацию владельца: неявки, вечерний обзвон, запись вручную'
  block: pain-points
  variant: voice-quotes
  next_step: Как «Окошко» это снимает (funktsii)
  mobile:
  - stack
  slots:
    text:
    - id: title
      slot: section-title
      heading: h2
      intent: неявки и обзвон съедают вечер
    - id: pain-1-title
      slot: card-title
      anatomy: pain.title
      group: pain-1
      intent: клиенты забывают о записи
    - id: pain-2-title
      slot: card-title
      anatomy: pain.title
      group: pain-2
      intent: вечером обзваниваешь всех, кто записан на завтра
    - id: pain-3-title
      slot: card-title
      anatomy: pain.title
      group: pain-3
      intent: запись в мессенджере и тетради — путаница
    - id: bridge
      slot: body
      intent: мост к решению одной фразой
    data:
    - id: voice
      slot: testimonial-ref
      fact: fact:review-ruslan
      binds:
      - pain-2-title
      note: ситуация словами клиента (с разрешением)
  notes:
    structure: секция для problem-aware трафика из соцсетей (0,2); без запугивания
  treatment:
    level: L0
    visual_role: calm
    motion_level: none
