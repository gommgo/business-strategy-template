# ПРИМЕР J v1 · план шаблона about (about-page, L1) — planlib.py; факты — демо J.
page_plan_version: '1'
checked: '2026-09-24'
status: draft
example: true
site: stalkon
refs:
  brief: ../site-brief.yaml
  facts: ../facts.yaml
  site_map: ../site-map.yaml
  blocks: ../../../../04-blocks/blocks.yaml
  vocabulary: ../../../../02-site-types/vocabulary.yaml
  lead_forms: ../../../../05-conversion-funnels/lead-forms.yaml
  events: ../../../../07-seo-geo-performance-analytics/events.yaml
  head_kit: ../../../../07-seo-geo-performance-analytics/head-kit.yaml
  budgets: ../../../../07-seo-geo-performance-analytics/budgets.yaml
  legal_requirements: ../../../../08-legal-trust-a11y/legal-requirements.yaml
page:
  id: about
  page_type: about-page
  template: false
  template_id: about
  lang: ru
  locale: ru-RU
  jurisdiction:
  - ru
  goal: 'about: запрос расчёта или переход к нужному разделу'
  primary_action: request-quote
  cta_target:
    kind: route
    value: /zapros-rascheta/
  awareness: product-aware
  awareness_basis:
    from: assumption
    rule: уровень по главному источнику страницы (C 01 §3.1)
  traffic:
  - traffic_source: internal
    temperature: warm
    device: desktop
  macrostructure: long-document
  macrostructure_family: document
  first_screen_policy: offer-cta-header
  budget_profile: about-page@L1
  ambition_level: L1
  navigation:
    header: site
    archetype: two-tier
    logo_link: /
    breadcrumbs: false
    local_nav:
      kind: subpages
    footer: site
  seo:
    indexable: true
    canonical: self
    h1: hero.headline
    structured_data:
    - AboutPage
    - Organization
    ssr_required: true
    sitemap: true
  legal:
    pd_consent: checkbox-and-link
    privacy_policy: /politika-konfidencialnosti/
    cookie_banner: required
    cookie_mode: opt-in
    analytics_before_consent: false
    withdraw_link: footer
    requisites: both
    operator_ref: fact:company-requisites
    requirements:
    - req:LR-RU-05
    - req:LR-RU-10
    - req:LR-RU-13
  analytics:
    systems:
    - yandex-metrica
    goals: []
    load_after_consent: true
sections:
- id: header
  role: header
  question: где я и куда дальше
  job: шапка сайта two-tier из site-map.chrome
  block: header
  variant: site-nav
  next_step: шапка и подвал сайта
  slots:
    text:
    - id: nav-link
      slot: nav-label
      intent: 'nav-label: по иерархии сообщений text'
    - id: cta-label
      slot: cta-label
      intent: 'cta-label: по иерархии сообщений text'
    media:
    - id: logo
      slot: brand-logo
      media_role: informational
      goal: показать brand-logo
      source: generate
      authenticity: real-or-generated
    action:
    - id: cta
      slot: cta-primary
      action: request-quote
      style: primary
      target:
        kind: anchor
        value: '#lead-form'
      event: event:cta-click
      label: cta-label
    - id: phone
      slot: phone-link
      action: call
      style: channel
      target:
        kind: tel
        value: 'tel: номер из facts.yaml'
      event: event:phone-click
- id: hero
  role: hero
  question: кто вы и можно ли вам доверять
  job: заголовок страницы и путь дальше
  block: hero-text
  variant: statement-cta
  next_step: главное действие страницы
  slots:
    text:
    - id: headline
      slot: headline
      heading: h1
      intent: 'headline: по иерархии сообщений text'
- id: about
  role: about
  question: история и масштаб
  job: история завода, мощность
  block: about-story
  variant: short-with-link
  next_step: главное действие страницы
  slots:
    text:
    - id: title
      slot: section-title
      heading: h2
      intent: 'section-title: по иерархии сообщений text'
    - id: body
      slot: body
      intent: 'body: по иерархии сообщений text'
    data:
    - id: company
      slot: fact-ref
      fact: fact:company-requisites
      anatomy: company
      binds:
      - body
- id: team
  role: team
  question: кто отвечает за объект
  job: руководство с согласием
  block: team-grid
  variant: cards
  next_step: главное действие страницы
  slots:
    text:
    - id: title
      slot: section-title
      heading: h2
      intent: 'section-title: по иерархии сообщений text'
    - id: person-1-name
      slot: card-title
      anatomy: person.name
      group: person-1
      heading: h3
      intent: 'card-title: по иерархии сообщений text'
    - id: person-1-role
      slot: card-body
      anatomy: person.role
      group: person-1
      intent: роль, опыт, специализация — из факта
    data:
    - id: person-1-person
      slot: person-ref
      anatomy: person.person
      group: person-1
      fact: fact:person-chief-engineer
      binds:
      - person-1-name
- id: awards-press
  role: awards-press
  question: какие допуски
  job: документы — ссылка на страницу документов
  block: credentials
  variant: list-with-numbers
  next_step: главное действие страницы
  slots:
    text:
    - id: title
      slot: section-title
      heading: h2
      intent: 'section-title: по иерархии сообщений text'
    - id: doc-1-name
      slot: card-title
      anatomy: doc.name
      group: doc-1
      heading: h3
      intent: 'card-title: по иерархии сообщений text'
    - id: doc-1-details
      slot: card-body
      anatomy: doc.details
      group: doc-1
      intent: номер, кем выдан, срок действия
    data:
    - id: doc-1-credential
      slot: credential-ref
      anatomy: doc.credential
      group: doc-1
      fact: fact:certificate-sro
      binds:
      - doc-1-name
- id: final-cta
  role: final-cta
  question: работаете ли с нашим объектом
  job: переход к запросу расчёта
  block: cta-band
  variant: mid
  next_step: главное действие страницы
  slots:
    text:
    - id: title
      slot: section-title
      heading: h2
      intent: 'section-title: по иерархии сообщений text'
    - id: cta-label
      slot: cta-label
      intent: 'cta-label: по иерархии сообщений text'
    action:
    - id: cta
      slot: cta-primary
      action: request-quote
      style: primary
      target:
        kind: anchor
        value: '#lead-form'
      event: event:cta-click
      label: cta-label
- id: footer
  role: footer
  question: кто компания, документы, разделы
  job: 'подвал сайта: группы разделов, реквизиты, правовые ссылки'
  block: footer
  variant: site
  next_step: шапка и подвал сайта
  slots:
    text:
    - id: legal
      slot: footer-legal
      intent: 'footer-legal: по иерархии сообщений text'
    - id: privacy-label
      slot: nav-label
      intent: подписи правовых ссылок
    - id: nav-1-label
      slot: nav-label
      anatomy: nav.label
      group: nav-1
      intent: 'nav-label: по иерархии сообщений text'
    - id: nav-2-label
      slot: nav-label
      anatomy: nav.label
      group: nav-2
      intent: 'nav-label: по иерархии сообщений text'
    - id: nav-3-label
      slot: nav-label
      anatomy: nav.label
      group: nav-3
      intent: 'nav-label: по иерархии сообщений text'
    data:
    - id: company
      slot: fact-ref
      fact: fact:company-requisites
      anatomy: company
      binds:
      - legal
    action:
    - id: privacy
      slot: link
      action: read-more
      style: link
      target:
        kind: anchor
        value: '#lead-form'
    - id: nav-1-link
      slot: link
      anatomy: nav.link
      group: nav-1
      action: read-more
      style: link
      target:
        kind: anchor
        value: '#lead-form'
    - id: nav-2-link
      slot: link
      anatomy: nav.link
      group: nav-2
      action: read-more
      style: link
      target:
        kind: anchor
        value: '#lead-form'
    - id: nav-3-link
      slot: link
      anatomy: nav.link
      group: nav-3
      action: read-more
      style: link
      target:
        kind: anchor
        value: '#lead-form'
