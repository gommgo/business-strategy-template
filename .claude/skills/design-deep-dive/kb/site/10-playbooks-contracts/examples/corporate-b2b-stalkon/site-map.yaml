collections:
- id: directions
  name: Направления
  template: direction
  url_pattern: /napravleniya/{slug}/
  hub_page: directions
  expected_items: 5
  sort: порядок заказчика (по выручке направления)
  fields:
  - id: title
    type: text
    required: true
    slot: headline
  - id: slug
    type: slug
    required: true
    unique: true
  - id: summary
    type: text
    required: true
    slot: subheadline
  - id: scope
    type: rich-text
    required: true
    slot: body
    note: что входит, мощности, допуски — только факты
  - id: price-from
    type: fact-ref
    required: false
    fact_kinds:
    - price
    slot: pricing-price
  - id: steps
    type: reference-list
    required: false
    ref: process-steps
  - id: credentials
    type: fact-ref
    required: false
    fact_kinds:
    - certificate
    - award
  - id: projects
    type: reference-list
    required: false
    ref: projects
  - id: hero-image
    type: media
    required: true
    slot: hero-visual
    note: 'реальное фото производства (ai-media: task по плану ассетов)'
  - id: seo
    type: seo-meta
    required: true
    note: meta-title, meta-description — text
- id: projects
  name: Проекты
  template: project
  url_pattern: /proekty/{slug}/
  hub_page: projects
  expected_items: 24
  sort: дата сдачи, новые первыми
  facets:
  - direction
  - industry
  pagination: pages
  fields:
  - id: title
    type: text
    required: true
    slot: case-title
  - id: slug
    type: slug
    required: true
    unique: true
  - id: client
    type: fact-ref
    required: true
    fact_kinds:
    - client
    note: клиент — только с разрешением; нет разрешения — «объект в отрасли X»
  - id: direction
    type: reference
    required: true
    ref: directions
  - id: industry
    type: enum
    required: true
    values:
    - energetika
    - logistika
    - promyshlennost
    - torgovlya
  - id: task
    type: rich-text
    required: true
    slot: case-summary
  - id: result
    type: fact-ref
    required: true
    fact_kinds:
    - case
    - metric
    slot: case-result
  - id: quote
    type: fact-ref
    required: false
    fact_kinds:
    - testimonial
  - id: year
    type: date
    required: true
  - id: gallery
    type: media
    required: true
  - id: seo
    type: seo-meta
    required: true
- id: news
  name: Новости
  template: news-item
  url_pattern: /o-kompanii/novosti/{slug}/
  hub_page: news
  sort: дата, новые первыми
  pagination: pages
  fields:
  - id: title
    type: text
    required: true
    slot: article-title
  - id: slug
    type: slug
    required: true
    unique: true
  - id: date
    type: date
    required: true
    slot: article-date
  - id: body
    type: rich-text
    required: true
    slot: article-paragraph
    note: Markdown или поля CMS — исходник, наружу HTML (V:Vkn3R6DUJ34 20:33)
  - id: related-projects
    type: reference-list
    required: false
    ref: projects
- id: legal-docs
  name: Юридические документы
  template: legal
  url_pattern: /{slug}/
  fields:
  - id: title
    type: text
    required: true
  - id: slug
    type: slug
    required: true
    unique: true
  - id: body
    type: rich-text
    required: true
    slot: body
  - id: edition-date
    type: date
    required: true
    note: дата редакции документа — site 08
chrome:
  header:
    block: header
    archetype: two-tier
    hallmark_ref: N12 без баннера или N1b — выбор подачи за creative
    items:
    - page: directions
      label_hint: Направления
      presentation: dropdown
      groups:
      - label_hint: Направления
        pages:
        - direction
        from_collection: directions
    - page: projects
      label_hint: Проекты
      presentation: link
    - page: about
      label_hint: О компании
      presentation: dropdown
      groups:
      - label_hint: О компании
        pages:
        - documents
        - news
        - careers
    - page: contacts
      label_hint: Контакты
      presentation: link
    utilities:
      phone: true
      messenger: false
      address_or_city: false
      search: false
      lang_switch: true
      login: false
      cta:
        action: request-quote
        target: request
    sticky: partial
    mobile:
      pattern: full-screen-list
      keep_visible:
      - logo
      - cta
      - phone
    landing_minimal_pages: []
  footer:
    block: footer
    variant: site
    groups:
    - label_hint: Направления
      pages:
      - directions
      - direction
    - label_hint: Компания
      pages:
      - about
      - documents
      - news
      - careers
    - label_hint: Связаться
      pages:
      - contacts
      - request
    legal:
    - privacy
    - consent
    requisites_fact: fact:company-requisites
    contacts: true
    html_sitemap_link: false
    mobile: open-list
  breadcrumbs:
    block: breadcrumbs
    rule: depth-2-plus
    mobile: parent-only
    structured_data: H
  search:
    enabled: false
    why: ≈ 45 индексируемых страниц, 3 коллекции по ≤ 24 записи; меню + подвал + хабы дают ≥ 2 способа (WCAG 2.4.5)
  html_sitemap:
    enabled: false
linking:
  min_inbound_links: 1
  hubs:
  - page: directions
    lists: directions
  - page: projects
    lists: projects
  - page: news
    lists: news
  related_rules:
  - id: direction-projects
    from: direction
    to: projects
    by: reference-field
    field: direction
    max: 4
    block: case-cards
    placement: in-content
  - id: project-direction
    from: project
    to: directions
    by: reference-field
    field: direction
    max: 1
    block: related-links
    placement: after-final-cta
  contextual_links: true
  orphans_allowed:
  - thanks-request
utility_pages:
  not_found: not-found
  thank_you:
  - after: request
    page: thanks-request
  legal_set:
  - privacy
  - consent
build_order:
- step: 1
  template: home
  why: главная задаёт общую шапку, подвал, DESIGN.md и токены; все пункты меню ведут на страницы карты (пока заглушки со статусом planned)
  acceptance:
  - каждая ссылка шапки и подвала ведёт на URL из pages[]
  - шапка и подвал вынесены в общие компоненты
- step: 2
  template: direction
  why: главный вход поискового и рекламного трафика; 2 образца коллекции
- step: 3
  template: request
  why: целевое действие; сразу со страницей «спасибо»
- step: 4
  template: contacts
  why: первое, что ищут B2B-закупщики после направлений
- step: 5
  template: project
  why: доказательство направлений; связь project ↔ direction
- step: 6
  template: projects-hub
  why: хаб с фильтрами по полям direction и industry
- step: 7
  template: directions-hub
  why: хаб направлений после появления их страниц
- step: 8
  template: about
  why: 4 уровня «О компании» (NN/g 2019) с подстраницами
- step: 9
  template: documents
  why: допуски и сертификаты — факты credential
- step: 10
  template: news-item
  why: только при регулярных новостях
- step: 11
  template: news-hub
  why: список новостей — после образца новости
- step: 12
  template: careers
  why: вторичная задача найма
- step: 13
  template: legal
  why: юридический набор (site 08) до публикации любой формы
- step: 14
  template: not-found
  why: 404 с путями на хабы, код 404 (site 07)
- step: 15
  template: utility
  why: «спасибо» проверяется вместе с формой на шаге 3
