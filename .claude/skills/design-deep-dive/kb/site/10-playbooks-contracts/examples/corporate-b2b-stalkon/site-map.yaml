pages:
- id: home
  page_type: home-multipage
  template: home
  url: /
  parent: null
  priority: must
  main_sources:
  - search-brand
  - direct
  - referral
  - offline
- id: directions
  page_type: services-index-page
  template: directions-hub
  url: /napravleniya/
  parent: home
  priority: must
- id: direction
  page_type: service-page
  template: direction
  url: /napravleniya/{slug}/
  parent: directions
  priority: must
  main_sources:
  - search-category
  - paid-search
  action: request-quote
  note: 'образец коллекции directions: 5 направлений'
- id: projects
  page_type: case-list-page
  template: projects-hub
  url: /proekty/
  parent: home
  priority: must
- id: project
  page_type: case-page
  template: project
  url: /proekty/{slug}/
  parent: projects
  priority: must
