  word_separator: '-'
  slug_source: translit
  translit_scheme: одна схема на сайт (Яндекс-транслит)
  trailing_slash: true
  max_depth: 3
  section_prefixes: true
  ids_in_urls: false
  dates_in_urls: false
  file_extensions: false
  keep_existing: true
  redirects:
