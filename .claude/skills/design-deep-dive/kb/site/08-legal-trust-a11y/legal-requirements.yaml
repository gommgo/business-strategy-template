# legal-requirements.yaml — требования закона к элементам сайта: юрисдикция × элемент страницы × норма × дата.
# Владелец — site I (волна 2). НЕ ЮРИДИЧЕСКОЕ ЗАКЛЮЧЕНИЕ: справочник рисков для агента-генератора; спорное помечено
# `label: спорно`; решения, от которых зависят деньги клиента, — к юристу заказчика.
# Разбор и обоснование — 08-legal-trust-a11y/01-law-ru-eu.md (§ указаны в поле `doc`).
# Ссылки из других форматов — `req:<id>` (пространство `req` в 02-site-types/vocabulary.yaml).
# Поля:
#   id           LR-<JUR>-<NN>
#   jurisdiction ru | eu (id словаря B; kz, by, us, other — не покрыты)
#   element      form | consent | cookie-banner | footer | pricing | reviews | ads | policy-page | offer-page | analytics |
#                chat-widget | newsletter | vacancy
#   requirement  что должно быть на странице (действие для генератора)
#   norm         закон, статья, редакция (дата); для разъяснений надзора — в regulator_position
#   source_url   первоисточник (официальный текст или справочная система с датой редакции)
#   regulator_position  позиция надзора или практика (РКН, ФАС, EDPB); null — нет найденной
#   severity     blocker — прямая норма закона с санкцией, генератор не выпускает страницу;
#                serious — позиция надзора или высокий риск, выпуск только с решением заказчика;
#                advice  — практика или неполная проверка
#   label        стандарт | регулятор | спорно | практика | не проверено (метки базы)
#   check        как проверить (DOM | NET | DOC | HUM — ручная/юрист) — вход для K и page_gates.py (P)
#   applies_when условие применения
#   refs         блоки, слоты, правила сестёр (с пространством имён)
#   sanction     размер штрафа юрлицу (КоАП, ред. от 26.07.2026) — ориентир риска
#   checked      дата сверки с источником
version: 1
checked: 2026-09-24
default_jurisdiction: ru          # решение заказчика 11: РФ по умолчанию, ЕС — профиль брифа
disclaimer: "Не юридическое заключение. Редакции законов — на 2026-09-24; перед запуском сайта сверить с юристом."

requirements:

  # ───────────────────────────── РФ: персональные данные (152-ФЗ) ─────────────────────────────
  - id: LR-RU-01
    jurisdiction: ru
    element: consent
    requirement: >-
      Согласие на обработку ПД — отдельный элемент формы (своя галочка и свой текст или ссылка на отдельный документ
      согласия), не внутри оферты, пользовательского соглашения, политики или текста кнопки; согласие на рассылку — своей
      галочкой.
    norm: "152-ФЗ ст. 9 ч. 1, 4-е предложение (введено ст. 5 156-ФЗ от 24.06.2025, в силе с 01.09.2025); закон в ред. от 26.07.2026"
    source_url: "http://www.kremlin.ru/acts/bank/52029 ; https://www.consultant.ru/document/cons_doc_LAW_61801/6c94959bc017ac80140621762d2ac59f6006b08c/"
    regulator_position: "РКН Хабаровск, 30.10.2024: нарушение — нет возможности дать согласие «путём проставления отметки в чекбоксе, расположенном рядом с формой сбора» (https://27.rkn.gov.ru/news/news347783.htm)"
    severity: blocker
    label: стандарт
    check: "DOM: у каждой формы с полями ПД есть input[type=checkbox] согласия ПД, не общий с офертой/рассылкой; текст согласия — отдельный документ или раскрытие"
    applies_when: "форма, квиз, калькулятор с контактом, обратный звонок, запись, чат с контактом — любой сбор ПД"
    refs: [block:lead-form, block:quiz, block:callback-request, block:capture-popup, slot:form-consent, block:legal-text, copy-rule:COPY-L-CONS-01, copy-rule:COPY-L-CONS-02]
    sanction: "КоАП 13.11 ч. 1 — 150–300 тыс. ₽ (обработка вне законных оснований); ч. 1.1 повторно — 300–500 тыс. ₽"
    doc: "01 §1.1–1.2"
    checked: 2026-09-24

  - id: LR-RU-02
    jurisdiction: ru
    element: consent
    requirement: >-
      Галочка согласия не отмечена по умолчанию; согласие даётся активным действием посетителя. Строка «Нажимая кнопку,
      вы соглашаетесь…» без отдельной галочки — не использовать (не «отдельно» и спорно по «однозначности»).
    norm: "152-ФЗ ст. 9 ч. 1 («конкретным, предметным, информированным, сознательным и однозначным»; «оформлено отдельно»), ред. 156-ФЗ; ЗоЗПП ст. 16 п. 3.1 (ред. 69-ФЗ от 07.04.2025) — запрет предотметки платных допуслуг"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_61801/6c94959bc017ac80140621762d2ac59f6006b08c/"
    regulator_position: "прямой позиции РКН о предотметке не найдено; по смыслу «сознательным и однозначным» — [спорно] для строки «нажимая…»"
    severity: blocker
    label: стандарт
    check: "DOM: у checkbox согласия нет атрибута checked в исходном HTML и после загрузки; нет формы, где согласие — только строка у кнопки"
    applies_when: "любая форма со сбором ПД"
    refs: [slot:form-consent, copy-rule:COPY-L-CONS-02, "ux:06-04#8.1"]
    sanction: "КоАП 13.11 ч. 1 — 150–300 тыс. ₽"
    doc: "01 §1.2"
    checked: 2026-09-24

  - id: LR-RU-03
    jurisdiction: ru
    element: consent
    requirement: >-
      Текст согласия называет оператора (наименование, адрес), цель, перечень ПД, действия со ПД, срок и способ отзыва;
      цель — одна на одно согласие («для ответа на заявку»), рассылка — отдельное согласие.
    norm: "152-ФЗ ст. 9 ч. 1 («конкретным, предметным, информированным»); ч. 4 — обязательные реквизиты письменного согласия (где письменная форма требуется законом)"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_61801/6c94959bc017ac80140621762d2ac59f6006b08c/"
    regulator_position: "РКН по Приморскому краю, FAQ: согласие без указания цели и срока — недействительно (https://25.rkn.gov.ru/p17348/p32646/)"
    severity: serious
    label: регулятор
    check: "DOC: документ согласия содержит оператора, цель, перечень ПД, действия, срок, способ отзыва; HUM — юрист"
    applies_when: "любая форма со сбором ПД"
    refs: [block:legal-text, slot:form-consent]
    sanction: "КоАП 13.11 ч. 1 (150–300 тыс. ₽); ч. 2 (300–700 тыс. ₽) — если требовалась письменная форма"
    doc: "01 §1.2"
    checked: 2026-09-24

  - id: LR-RU-04
    jurisdiction: ru
    element: consent
    requirement: >-
      Сайт сохраняет доказательство согласия: версию текста согласия, время, страницу и форму, отметку галочки — вместе с
      заявкой в CRM; без журнала согласие недоказуемо.
    norm: "152-ФЗ ст. 9 ч. 3 (доказывает оператор); ст. 15 ч. 1 (для рассылок — без доказательства согласие считается не полученным)"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_61801/6c94959bc017ac80140621762d2ac59f6006b08c/"
    regulator_position: null
    severity: serious
    label: стандарт
    check: "HUM: в заявке, уходящей в CRM или почту, есть поля consent_version, consent_at, page_url; NET: отправка формы передаёт эти поля"
    applies_when: "любая форма со сбором ПД"
    refs: [block:lead-form, "site:07-04"]
    sanction: "риск ч. 1 13.11 при невозможности доказать согласие"
    doc: "01 §1.2"
    checked: 2026-09-24

  - id: LR-RU-05
    jurisdiction: ru
    element: policy-page
    requirement: >-
      Политика обработки ПД и сведения о реализуемых требованиях к защите опубликованы на сайте; ссылка — у каждой формы
      и в подвале каждой страницы; у документа — дата редакции и оператор.
    norm: "152-ФЗ ст. 18.1 ч. 2 (ред. 266-ФЗ от 14.07.2022; закон в ред. от 26.07.2026)"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_61801/eeeebe22bf738fd65bb66b95cc278911ae2525ee/"
    regulator_position: "РКН Хабаровск 30.10.2024: нарушение — нет возможности ознакомиться с политикой; политика не соответствует требованиям"
    severity: blocker
    label: стандарт
    check: "DOM: ссылка на политику в каждой форме и в подвале; страница политики отвечает 200 и содержит дату редакции и наименование оператора"
    applies_when: "сайт собирает ПД (формы, чат, cookie-аналитика)"
    refs: [block:footer, block:legal-text, slot:footer-legal, page-type:legal-page]
    sanction: "КоАП 13.11 ч. 3 — 30–60 тыс. ₽ (ИП 10–20 тыс.)"
    doc: "01 §1.4"
    checked: 2026-09-24

  - id: LR-RU-06
    jurisdiction: ru
    element: form
    requirement: >-
      Поля формы — минимум для цели: каждое поле объяснимо следующим шагом продаж (question protocol); «на всякий случай»
      не спрашивать (дата рождения, отчество, адрес для звонка).
    norm: "152-ФЗ ст. 5 ч. 5 («не должны быть избыточными по отношению к заявленным целям»)"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_61801/96fbc469f91f57235cc842a85e0516a99f23dc85/"
    regulator_position: null
    severity: serious
    label: стандарт
    check: "HUM: у каждого поля в lead-forms.yaml (F) заполнено why; лишних полей нет"
    applies_when: "любая форма"
    refs: [block:lead-form, block:quiz, "site:05-01", "V:Br5O0hAaqt8 15:24"]
    sanction: "КоАП 13.11 ч. 1 — 150–300 тыс. ₽ (обработка, несовместимая с целями)"
    doc: "01 §1.2"
    checked: 2026-09-24

  - id: LR-RU-07
    jurisdiction: ru
    element: analytics
    requirement: >-
      Данные граждан РФ из форм, чатов и аналитики с ПД сначала записываются в базы данных в РФ: форма не отправляет
      заявки напрямую в зарубежные сервисы (Google Forms/Sheets, Typeform, HubSpot, зарубежные чаты и CRM).
    norm: "152-ФЗ ст. 18 ч. 5 (ред. 23-ФЗ от 28.02.2025): запись, систематизация, накопление, хранение, уточнение, извлечение ПД граждан РФ с использованием баз данных за пределами РФ не допускаются"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_61801/cbf4e15b7c330f9372e876cdf2bc928bad7950ef/"
    regulator_position: null
    severity: blocker
    label: стандарт
    check: "NET: action формы и XHR отправки ведут на российский сервер или сервис с базой в РФ; HUM — где физически CRM"
    applies_when: "сайт собирает ПД посетителей из РФ"
    refs: [block:lead-form, block:chat-widget, "site:07-04"]
    sanction: "КоАП 13.11 ч. 8 — 1–6 млн ₽; ч. 9 повторно — 6–18 млн ₽"
    doc: "01 §1.5"
    checked: 2026-09-24

  - id: LR-RU-08
    jurisdiction: ru
    element: analytics
    requirement: >-
      Передача ПД за рубеж (зарубежная аналитика, пиксели, чат, видеоплеер, шрифты с чужого CDN, CRM) — только после
      уведомления РКН о трансграничной передаче; в страны вне перечня «адекватных» — не раньше 10 рабочих дней после
      уведомления. По умолчанию генератор ставит российскую аналитику (Метрика), шрифты со своего домена, видео — через
      российский хостинг или фасад по нажатию.
    norm: "152-ФЗ ст. 12 ч. 3, 9, 10, 11 (ред. 266-ФЗ от 14.07.2022; ч. 10–11 — ред. 265-ФЗ от 26.07.2026)"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_61801/e4ebbe1780de623c7cf32a59ca82a7bb523a25dd/"
    regulator_position: "РКН считает cookie и данные метрических программ ПД (заявления 2021 — по вторичке; практика Хабаровск 2024) → зарубежная аналитика = трансграничная передача [спорно]"
    severity: serious
    label: спорно
    check: "NET: список сторонних доменов до и после согласия (page_anatomy.py M: third_party, tracking_before_action); HUM — уведомление РКН, если зарубежные сервисы оставлены"
    applies_when: "на странице есть сторонние сервисы с серверами вне РФ (GA4, Meta Pixel, YouTube, Google Fonts, Intercom и т. п.)"
    refs: ["site:07-03", "site:07-04", block:video-showcase, block:chat-widget]
    sanction: "штраф за неуведомление отдельно не назван в 13.11 — риск по ч. 1 (150–300 тыс. ₽) и ограничение передачи [не проверено]"
    doc: "01 §1.5"
    checked: 2026-09-24

  - id: LR-RU-09
    jurisdiction: ru
    element: policy-page
    requirement: >-
      Оператор (заказчик) до запуска формы подал уведомление в РКН о намерении обрабатывать ПД (реестр операторов); агент
      спрашивает об этом в брифе и не выпускает форму без ответа.
    norm: "152-ФЗ ст. 22 ч. 1 (исключения ч. 2 после 01.09.2022 — только неавтоматизированная обработка и спецслучаи)"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_61801/d996966e22e1320c9de1ab82d9f6be12c3d9d765/"
    regulator_position: "РКН ЦФО: уведомление через pd.rkn.gov.ru (бумага, УКЭП или Госуслуги), формы — приказ РКН от 28.10.2022 № 180"
    severity: serious
    label: стандарт
    check: "HUM: номер в реестре операторов pd.rkn.gov.ru (бриф: constraints.legal_note или x-rkn_registry)"
    applies_when: "сайт собирает ПД автоматизированно (любая веб-форма)"
    refs: ["site:01-03"]
    sanction: "КоАП 13.11 ч. 10 — 100–300 тыс. ₽ (введена 420-ФЗ от 30.11.2024)"
    doc: "01 §1.6"
    checked: 2026-09-24

  - id: LR-RU-10
    jurisdiction: ru
    element: cookie-banner
    requirement: >-
      При cookie аналитики и рекламы (Метрика, пиксели, ретаргетинг) — баннер, который сообщает о них и даёт выбор
      «Принять» / «Отклонить» равного вида на первом уровне; счётчики и пиксели запускаются после «Принять». Если
      заказчик выбирает режим «уведомление» — только с его решением в брифе и без формулировки «продолжая пользоваться…».
    norm: "152-ФЗ ст. 9 ч. 1 (согласие сознательное и однозначное); прямой нормы о cookie в законе нет"
    source_url: "https://27.rkn.gov.ru/news/news347783.htm"
    regulator_position: "РКН Хабаровск 30.10.2024: нарушение — «отсутствует информирование посетителей сайта о факте обработки сайтом ПД (файл cookie) с использованием метрических программ «Яндекс.Метрика», Facebook Pixel и механизм получения согласия на их обработку на сайте»"
    severity: serious
    label: спорно
    check: "DOM: баннер есть, кнопки «Принять» и «Отклонить» на первом уровне, сопоставимые площадь и контраст; NET: до выбора нет запросов mc.yandex.ru/watch и пикселей (page_anatomy.py: analytics_before_consent = 0)"
    applies_when: "на сайте есть необязательные cookie (аналитика, реклама, чат с трекингом)"
    refs: [block:cookie-banner, slot:cookie-text, "site:07-04", "ux:06-04#8.2"]
    sanction: "требование РКН об устранении; при признании cookie ПД — КоАП 13.11 ч. 1"
    doc: "01 §1.3"
    checked: 2026-09-24

  - id: LR-RU-11
    jurisdiction: ru
    element: newsletter
    requirement: >-
      Подписка на рассылку (email, SMS, мессенджер) — отдельная неотмеченная галочка или отдельная форма с явным
      предметом «получать рекламу/новости от <компания>»; в каждом письме — отписка.
    norm: "38-ФЗ ст. 18 ч. 1 (ред. от 04.08.2026); 152-ФЗ ст. 15 ч. 1–2; 149-ФЗ ст. 10 ч. 3 (возможность отказа от информации)"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_58968/f892dec1383709792452f18d36e7043306e2be0a/ ; https://www.consultant.ru/document/cons_doc_LAW_61801/5656527e0713bf229a6932ac7084dec50d0ebe1f/"
    regulator_position: "РКН FAQ «Учёт интернет-рекламы»: email- и push-рассылки с предварительным согласием — erid не нужен, это реклама по сетям электросвязи (https://rkn.gov.ru/treatments/chasto-zadavaemye-voprosy/p1575/)"
    severity: blocker
    label: стандарт
    check: "DOM: согласие на рассылку — отдельный checkbox без checked; HUM — шаблон письма с отпиской"
    applies_when: "форма предлагает рассылку, лид-магнит с подпиской, waitlist с новостями"
    refs: [action:subscribe, slot:form-consent, copy-rule:COPY-L-CONS-01]
    sanction: "КоАП 14.3 ч. 1 — 100–500 тыс. ₽ (реклама без согласия)"
    doc: "01 §1.7"
    checked: 2026-09-24

  - id: LR-RU-12
    jurisdiction: ru
    element: reviews
    requirement: >-
      Отзыв с именем, фото, должностью — только с согласием автора на распространение ПД (отдельным от других согласий,
      с выбором перечня данных) и согласием на изображение; отзывы с Яндекс Карт, 2ГИС, соцсетей не копировать с именами —
      показывать виджетом площадки или без ПД со ссылкой на источник.
    norm: "152-ФЗ ст. 10.1 ч. 1, 2, 8, 12 (ред. 519-ФЗ от 30.12.2020); ГК РФ ст. 152.1 п. 1 (ред. 10.06.2026)"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_61801/591acc70f577873c1ee54765eda110b7a0271eaf/"
    regulator_position: null
    severity: blocker
    label: стандарт
    check: "DOC: у факта testimonial в facts.yaml permission.pd_consent = true и image_consent = true при фото; HUM — документ согласия"
    applies_when: "блоки отзывов, кейсов с цитатой, команды, спикеров с фото и именами"
    refs: [block:testimonial-cards, block:testimonial-single, block:hero-quote, block:team-grid, block:review-aggregate, "text:02-strategy-messaging-facts.schema.yaml#permission"]
    sanction: "КоАП 13.11 ч. 1 — 150–300 тыс. ₽; ГК 152.1 п. 3 — удаление по требованию"
    doc: "01 §1.8; 02 §2"
    checked: 2026-09-24

  # ───────────────────────────── РФ: сведения о продавце и владельце сайта ─────────────────────────────
  - id: LR-RU-13
    jurisdiction: ru
    element: footer
    requirement: >-
      На сайте — наименование владельца сайта, место нахождения и адрес, адрес электронной почты для заявлений
      правообладателей (обычно подвал или «Контакты»).
    norm: "149-ФЗ ст. 10 ч. 2 (ред. 364-ФЗ от 24.11.2014; закон в ред. от 26.06.2026)"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_61798/546dcc703c0a1e08647b40a2eeaf9461168c7cb1/"
    regulator_position: null
    severity: blocker
    label: стандарт
    check: "DOM: подвал или страница контактов содержит наименование, адрес и email"
