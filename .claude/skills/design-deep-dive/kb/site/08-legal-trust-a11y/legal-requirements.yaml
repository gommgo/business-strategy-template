  # ───────────────────────────── РФ: обязательные оговорки и образы врачей в рекламе (38-ФЗ) ─────────────────────────────
  - id: LR-RU-25
    jurisdiction: ru
    element: ads
    requirement: >-
      Обязательные предупреждения — заметного размера: медицинские услуги и изделия — предупреждение о противопоказаниях
      и необходимости ознакомиться с инструкцией или получить консультацию специалистов не меньше 5 % площади рекламы;
      БАД — «не является лекарственным средством» не меньше 10 % площади; потребительский кредит (заём, ипотека) —
      «Оценивайте свои финансовые возможности и риски» и «Изучите все условия кредита (займа)» по 5 % площади, при
      ставке — диапазоны полной стоимости кредита (займа) до ставки и шрифтом не меньше. Текст предупреждения — правила
      text, размер и место на странице — вёрстка и подача.
    norm: "38-ФЗ ст. 24 ч. 7; ст. 25 ч. 1.1; ст. 28 ч. 2.1, 3, 3.1 (ред. 479-ФЗ от 26.12.2024); закон в ред. от 04.08.2026"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"
    regulator_position: "Московское УФАС, 2024: реклама БАД без «не является лекарственным средством» — нарушение ст. 25 ч. 1.1; Татарстанское УФАС, РВ-08/516 от 23.01.2026 — предупреждения рекламы кредита (text 08/01 §6)"
    severity: blocker
    label: стандарт
    check: "IMG/HUM: доля площади предупреждения в рекламном блоке — медицина ≥ 5 %, БАД ≥ 10 %, предупреждения кредита ≥ 5 %; ПСК — до ставки и кеглем не меньше; текст — claims_check.py"
    applies_when: "brief.constraints.legal_category ∈ {medical, dietary-supplements}; на странице ставка или условия потребительского кредита, займа, ипотеки"
    refs: [slot:disclaimer, slot:cta-note, copy-rule:COPY-L-MED-01, copy-rule:COPY-L-BAD-01, copy-rule:COPY-L-FIN-02, copy-rule:COPY-L-FIN-03]
    sanction: "КоАП 14.3 ч. 1 — 100–500 тыс. ₽"
    doc: "text 08/01 §6"
    checked: 2026-09-24

  - id: LR-RU-26
    jurisdiction: ru
    element: ads
    requirement: >-
      Образы медицинских работников и рекомендации врачей — только в рекламе медицинских услуг и средств личной
      гигиены; на страницах других товаров и услуг — без фото, видео и цитат людей в образе врача и без лечебных свойств
      («лечит», «избавит от бессонницы»); рекомендация — сведения, требующие подтверждения.
    norm: "38-ФЗ ст. 5 ч. 5 п. 4, 6; ч. 3 п. 10 (закон в ред. от 04.08.2026)"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"
    regulator_position: null
    severity: blocker
    label: стандарт
    check: "IMG/HUM: на странице вне медицинских услуг и средств гигиены нет людей в образе врача (фото, видео, отзыв «врача»); текст — claims_check.py"
    applies_when: "товары и услуги вне медицины (brief.constraints.legal_category ≠ medical), в том числе БАД; средства личной гигиены — исключение"
    refs: [block:hero-media, block:testimonial-cards, block:team-grid, block:founder-note, copy-rule:COPY-L-MED-04, copy-rule:COPY-L-HEALTH-01]
    sanction: "КоАП 14.3 ч. 1 — 100–500 тыс. ₽"
    doc: "text 08/01 §6"
    checked: 2026-09-24

