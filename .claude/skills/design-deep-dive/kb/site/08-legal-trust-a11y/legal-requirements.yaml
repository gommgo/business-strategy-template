    refs: [slot:ad-marking, block:logo-wall, block:promo-offer, copy-rule:COPY-L-AD-01]
    sanction: "КоАП 14.3 ч. 16 — 200–500 тыс. ₽ (без erid); ч. 1 — 100–500 тыс. ₽"
    doc: "01 §3.1–3.2"
    checked: 2026-09-24

  - id: LR-RU-18
    jurisdiction: ru
    element: ads
