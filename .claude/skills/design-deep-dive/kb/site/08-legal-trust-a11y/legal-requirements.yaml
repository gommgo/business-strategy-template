  - id: LR-EU-12
    jurisdiction: eu
    element: pricing
    requirement: >-
      Ложная срочность и дефицит (таймер без реального срока, «осталось 2» без данных) — недобросовестная практика; на
      сайте-не-платформе запрет вытекает из UCPD, а не из DSA art. 25.
    norm: "UCPD 2005/29/EC art. 6–7, Annex I (пункт о ложной срочности — консолидированный текст не открыт); DSA art. 3(i), 19, 25(2)"
    source_url: "https://eur-lex.europa.eu/eli/reg/2022/2065/oj/eng"
