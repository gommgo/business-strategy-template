    applies_when: "профиль eu; акции, таймеры, остатки"
    refs: [block:promo-offer, "ux:06-04#3.6", "site:08-02"]
    sanction: "национальные законы"
    doc: "02 §4"
    checked: 2026-09-24

  - id: LR-EU-13
    jurisdiction: eu
    element: footer
    requirement: >-
      Сведения о поставщике услуг информационного общества: наименование, географический адрес, email, регистрационный
