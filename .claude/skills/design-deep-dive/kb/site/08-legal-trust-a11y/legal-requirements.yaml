      обстоятельства, не связанные с деловыми качествами, в тексте вакансии запрещены.
    norm: "565-ФЗ «О занятости населения в Российской Федерации» ст. 53 ч. 3 (ред. от 28.11.2025)"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_464093/151df305f73e727be3bf36a447c90c7c84f22219/"
    regulator_position: null
    severity: blocker
    label: стандарт
    check: "HUM: текст вакансии без требований к полу, возрасту, месту жительства, семейному положению; утилиты дискриминацию видят только правилом text"
    applies_when: "страница вакансий (page-type:careers-page) и тексты вакансий на других страницах"
    refs: [page-type:careers-page, copy-rule:COPY-L-JOB-01]
    sanction: "КоАП [не проверено — статья и размер не сверены]"
    doc: "text 04/03 §4.7"
    checked: 2026-09-24

  # ───────────────────────────── ЕС (профиль eu) ─────────────────────────────
  - id: LR-EU-01
    jurisdiction: eu
    element: cookie-banner
    requirement: >-
      Необязательные cookie и схожие технологии (аналитика, пиксели, реклама, чат с трекингом, встроенное видео с cookie)
      ставятся только после согласия; без согласия — только строго необходимые.
    norm: "Directive 2002/58/EC (ePrivacy) art. 5(3), консолидированная ред. 19.12.2009 (Directive 2009/136/EC)"
    source_url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02002L0058-20091219"
    regulator_position: "EDPB Cookie Banner Taskforce, 17.01.2023: по умолчанию cookie, требующие согласия, не ставятся до позитивного действия"
    severity: blocker
    label: стандарт
    check: "NET: до выбора нет запросов аналитики и пикселей, нет cookie кроме необходимых (page_anatomy.py: tracking_before_action пусто)"
    applies_when: "профиль eu; любые необязательные cookie"
    refs: [block:cookie-banner, "site:07-03", "site:07-04"]
    sanction: "национальные законы ЕС; CNIL — штрафы до 150 млн € крупным платформам (ux 01/04 §7)"
    doc: "01 §4.1"
    checked: 2026-09-24

  - id: LR-EU-02
    jurisdiction: eu
    element: cookie-banner
    requirement: >-
      «Отклонить» — кнопка на первом уровне рядом с «Принять», сопоставимые вид и контраст; не ссылка в тексте; баннер не
      закрывает содержимое («cookie wall» запрещён).
    norm: "GDPR art. 4(11), art. 7 (условия согласия) через ePrivacy art. 5(3)"
    source_url: "https://www.edpb.europa.eu/system/files/2023-01/edpb_20230118_report_cookie_banner_taskforce_en.pdf"
    regulator_position: "EDPB Taskforce 2023: отсутствие «отклонить» на уровне с «принять» — нарушение по мнению большинства надзоров (type A); ссылка вместо кнопки без визуальной поддержки — невалидно (type C); нечитаемый контраст кнопки отказа — явно вводит в заблуждение (type D/E). EDPB 05/2020 Example 6a — cookie wall: согласие не свободно"
    severity: blocker
    label: регулятор
    check: "DOM: на первом уровне баннера button «Отклонить» с площадью и контрастом ≥ 0,8 от «Принять»; баннер не модальный"
    applies_when: "профиль eu; баннер согласия"
    refs: [block:cookie-banner, "ux:06-04#8.2"]
    sanction: "национальные надзоры"
    doc: "01 §4.1"
    checked: 2026-09-24

  - id: LR-EU-03
    jurisdiction: eu
    element: cookie-banner
    requirement: >-
      Категории cookie во втором уровне не отмечены заранее; прокрутка, продолжение навигации, закрытие баннера — не
      согласие.
    norm: "GDPR recital 32; art. 4(11)"
    source_url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
    regulator_position: "EDPB Taskforce 2023 type B (предотметки невалидны); EDPB Guidelines 05/2020 v1.1, п. 86, Example 16 (прокрутка не является ясным утвердительным действием ни при каких обстоятельствах)"
    severity: blocker
    label: стандарт
    check: "DOM: в настройках cookie все необязательные переключатели выключены; нет текста «продолжая пользоваться»"
    applies_when: "профиль eu"
    refs: [block:cookie-banner, slot:cookie-text]
    sanction: "национальные надзоры"
    doc: "01 §4.1"
    checked: 2026-09-24

  - id: LR-EU-04
    jurisdiction: eu
    element: cookie-banner
    requirement: >-
      Отозвать согласие так же легко, как дать: постоянная ссылка «Настройки cookie» в подвале или маленькая иконка на всех
      страницах; выбор хранится ≤ 12 месяцев, затем спросить снова.
    norm: "GDPR art. 7(3)"
    source_url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
    regulator_position: "EDPB Taskforce 2023 type K: иконка или ссылка в видимом стандартном месте; GOV.UK Cookie banner: хранить выбор 1 год"
    severity: blocker
    label: стандарт
    check: "DOM: в подвале ссылка на настройки cookie, открывающая выбор без перезагрузки"
    applies_when: "профиль eu; баннер согласия"
    refs: [block:footer, block:cookie-banner]
    sanction: "национальные надзоры"
    doc: "01 §4.1"
    checked: 2026-09-24

  - id: LR-EU-05
    jurisdiction: eu
    element: policy-page
    requirement: >-
      Страница cookie со списком используемых cookie, их целей и сроков; «строго необходимые» — только действительно
      необходимые (сессия, выбор cookie, корзина, балансировка, безопасность).
    norm: "ePrivacy art. 5(3) («clear and comprehensive information… about the purposes»); GDPR art. 13"
    source_url: "https://www.edpb.europa.eu/system/files/2023-01/edpb_20230118_report_cookie_banner_taskforce_en.pdf"
    regulator_position: "EDPB Taskforce 2023 type I: владелец сайта ведёт список cookie и доказывает «необходимость»"
    severity: serious
    label: регулятор
    check: "DOC: страница cookie с таблицей (имя, поставщик, цель, срок); сверка со снятыми cookie"
    applies_when: "профиль eu"
    refs: [block:legal-text, page-type:legal-page]
    sanction: null
    doc: "01 §4.1"
    checked: 2026-09-24

  - id: LR-EU-06
    jurisdiction: eu
    element: form
    requirement: >-
      Заявка на расчёт, звонок, демо по просьбе посетителя — основание «шаги до договора по запросу субъекта»: галочка
      согласия на ПД не нужна; нужна информация при сборе (кто, цель, основание, получатели, срок, права, жалоба) — ссылка
      на уведомление о конфиденциальности у формы; рассылка — отдельное согласие.
    norm: "GDPR art. 6(1)(b), art. 13(1)–(2), art. 5(1)(c)"
    source_url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
    regulator_position: null
    severity: serious
    label: стандарт
    check: "DOM: у формы ссылка на privacy notice; галочка — только у рассылки"
    applies_when: "профиль eu; лид-форма"
    refs: [block:lead-form, slot:form-consent]
    sanction: "GDPR art. 83 (до 20 млн € или 4 % оборота — для нарушений art. 5–7, 12–22)"
    doc: "01 §4.2"
    checked: 2026-09-24

  - id: LR-EU-07
    jurisdiction: eu
    element: newsletter
    requirement: >-
      Email-маркетинг — предварительное согласие; исключение «soft opt-in» — своим покупателям о похожих своих товарах с
      отказом при сборе и в каждом письме; отправитель не скрыт, адрес для отказа действует.
    norm: "ePrivacy art. 13(1), (2), (4)"
    source_url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02002L0058-20091219"
    regulator_position: null
    severity: blocker
    label: стандарт
    check: "DOM: отдельная неотмеченная галочка рассылки; HUM — шаблон письма"
    applies_when: "профиль eu; подписка, waitlist с новостями"
    refs: [action:subscribe]
    sanction: "национальные законы"
    doc: "01 §4.2"
    checked: 2026-09-24

  - id: LR-EU-08
    jurisdiction: eu
    element: reviews
    requirement: >-
      Если сайт показывает отзывы — сказать, проверяет ли и как, что их пишут реальные покупатели; не публиковать
      фальшивые и заказные отзывы, не показывать только положительные, скрывая отрицательные.
    norm: "UCPD 2005/29/EC art. 7(6), Annex I points 23b, 23c (введены Directive (EU) 2019/2161, OJ L 328, 18.12.2019)"
    source_url: "https://www.legislation.gov.uk/eudr/2019/2161/pdfs/eudr_20192161_adopted_en.pdf"
    regulator_position: "Omnibus, recital 49: «publishing only positive reviews and deleting the negative ones» — манипуляция"
    severity: blocker
    label: стандарт
    check: "DOM: у блока отзывов строка «Как мы проверяем отзывы» со ссылкой; DOC — факты testimonial"
    applies_when: "профиль eu; отзывы, рейтинги"
    refs: [block:testimonial-cards, block:review-aggregate, copy-rule:COPY-L-EU-03]
    sanction: "UCPD art. 13 в ред. Omnibus — национальные штрафы"
    doc: "02 §3.4"
    checked: 2026-09-24

  - id: LR-EU-09
    jurisdiction: eu
    element: pricing
    requirement: >-
      Объявление о снижении цены показывает прежнюю цену — минимальную за не менее 30 дней до снижения; зачёркнутая цена
      берётся из истории цен (факт с valid.from), не из «рекомендованной».
    norm: "Directive 98/6/EC art. 6a (введена Directive (EU) 2019/2161)"
    source_url: "https://www.legislation.gov.uk/eudr/2019/2161/pdfs/eudr_20192161_adopted_en.pdf"
    regulator_position: null
    severity: blocker
    label: стандарт
    check: "DOC: у слота price-old факт с историей цены за 30 дней"
    applies_when: "профиль eu; акция со скидкой"
    refs: [slot:price-old, block:promo-offer, copy-rule:COPY-L-EU-01]
    sanction: "национальные законы"
    doc: "02 §4"
    checked: 2026-09-24

  - id: LR-EU-10
    jurisdiction: eu
    element: offer-page
    requirement: >-
      Сайт, через который потребитель заключает договор (покупка, бронь, подписка), — e-commerce service по EAA:
      доступность по WCAG 2.1 AA (EN 301 549; ориентир — WCAG 2.2 AA), заявление о доступности; микропредприятия (< 10
      человек и оборот или баланс ≤ 2 млн €) освобождены.
    norm: "Directive (EU) 2019/882 (EAA) art. 3 (определения e-commerce services, microenterprise), art. 4(5), Annex I; применяется с 28.06.2025"
    source_url: "https://eur-lex.europa.eu/eli/dir/2019/882/oj/eng"
    regulator_position: null
    severity: serious
    label: стандарт
    check: "AXE + ручной протокол (03 §7); DOC — заявление о доступности"
    applies_when: "профиль eu; B2C-продажа или бронирование на сайте; не микропредприятие"
    refs: ["site:08-03", "ux:08-04#7.1"]
    sanction: "национальные законы о переносе EAA"
    doc: "01 §4.4; 03 §7"
    checked: 2026-09-24

  - id: LR-EU-11
    jurisdiction: eu
    element: chat-widget
    requirement: >-
      ИИ-чат на сайте сообщает, что посетитель общается с ИИ, — ясно и не позже первой реплики, в доступной форме.
    norm: "Regulation (EU) 2024/1689 (AI Act) art. 50(1), 50(5); применяется с 02.08.2026"
    source_url: "https://artificialintelligenceact.eu/article/50/"
    regulator_position: null
    severity: blocker
    label: стандарт
    check: "DOM: в шапке окна чата или первой реплике — «ИИ-ассистент»"
