# pdp-packshot-scene.yaml — машиночитаемый рецепт; текст — 14-recipes/02-series-product-recipes.md#2; схема — recipe.schema.json
recipe_version: 1
checked_at: '2026-09-25'
id: pdp-packshot-scene
title: 'PDP «пакшот + ИИ-сцена»: настоящий товар композитом'
doc: 14-recipes/02-series-product-recipes.md#2
task_codes:
- IMG-PRODUCT
- IMG-EDIT
- IMG-CUTOUT
slot: product
ladder: image
ai_fit: conditional
legal_row: 7
route:
  source: IMG-PRODUCT
  steps:
  - role: сцена вокруг товара
    model: openai/gpt-image-2.5-sunburst
    params:
      image_resolution: 1K
      aspect_ratio: '4:3'
    images: '[фото товара]'
    price_rub: 4.0
    test: E-10
  - role: сохранность остального
    model: google/gemini-3.1-flash-image-preview
    params:
      image_resolution: 1K
    price_rub: 4.8
    test: E-10
spec:
  must:
  - product.identity, product.locks
  - текст этикетки дословно
  - product.dimensions
  - --opt order=product7
  ancestors:
  - 13-routing-matrix/stand/briefs/S03-product-scene.spec.json
compile: scripts/ai-media/prompt_compile.py jobs <spec> --models <модель> --opt order=product7 --out $DDD_HOME/out/ai-media/<ассет>.jsonl
steps:
- id: protect
  cmd: python3 ../../scripts/ai-media/edit_check.py check orig.png edited.png --mask target.png --protect product_mask.png --match-color --composite --out
    out/
  status: checked
- id: local-shift
  cmd: python3 ../../scripts/ai-media/asset_audit.py audit edited.png --mode edit --orig orig.png --mask target.png --protect product_mask.png --out audit_edit/
  status: checked
- id: ocr-label
  cmd: python3 ../../scripts/ai-media/asset_audit.py ocr scene.png --expect "ЛЕСНАЯ ОБЖАРКА"
  status: checked
- id: shadow
  cmd: 'слой тени RGB = onbg / clean → mix-blend-mode: multiply'
  status: checked
- id: stamp
  cmd: python3 ../../scripts/ai-media/provenance_check.py stamp <производная> <производная> --dst composite --system "<модель> via <канал>"
  status: unchecked
accept:
  thresholds:
  - edit.leak_frac_max
  - edit.global_drift_max
  - edit.protect_ssim_min
  - edit.local_shift_de
  - budget.image.product_kb
delivery:
  formats:
  - avif
  - webp
  budget_kb:
    frame: 150
provenance:
  dst: composite
  visible_label: false
  note: строка 8 ai-media 12/04 (окружение меняет представление о товаре) — спросить, AI MODIFIED
numbers:
  demo_leak: 0.0012
  demo_protect_ssim: 0.968
  demo_protect_de: 0.88
  demo_can_identical_share: 0.961
  live_e10_label_front: 'этикетка сохранена у 4 из 4 моделей, OCR дословно — Sunburst, NB2, Seedream 5 Pro; сбоку дословно — только Sunburst'
  live_e15_edit_leak: 'правка без маски — LEAK в 5 из 6 (3 модели × 2 сцены); Seedream 5 Pro удаление — PASS 0,01; Qwen + маска — вне маски 0, «призрак»'
  live_h07: 'H-07 (окружение правкой вокруг настоящего товара) не запускался'
status:
  local: checked
  generation: checked
sources:
- '[V:5dnNUB27HBQ]'
- '[V:AxV8TR3BdqI]'
- '[V:XLHTLJhzDyQ]'
