    model: google/gemini-3.1-flash-image-preview
    params:
      image_resolution: 2K
    price_rub: 7.2
spec:
  example: 14-recipes/examples/demo-landing/brand/specs/M-06-hero-evening-edit.spec.json
  must:
  - edit.changes[].op
  - цель числом (2700 K)
  - edit.keep без артиклей
  ancestors:
  - ../../scripts/ai-media/tests/fixtures/D02/E1.spec.json
compile: scripts/ai-media/prompt_compile.py jobs <spec> --models <модель> --out $DDD_HOME/out/ai-media/<ассет>.jsonl
steps:
- id: edit-check
  cmd: python3 ../../scripts/ai-media/edit_check.py check m01.png m06.png --out out/ (без маски; edges_iou ≥ 0,9)
  status: checked
- id: page
  cmd: python3 ../../scripts/ai-media/page_accept.py page04.html --out out/ --click "[data-state-toggle]" --contrast ".hero h1"
  status: checked
accept:
  thresholds:
  - edit.edges_iou_min
  - text_zone.edge_density_max
  page_accept:
    modes:
    - desktop
    - mobile
    checks:
    - F83 обоих состояний
    - видео верхнего слоя 0 байт без взаимодействия
