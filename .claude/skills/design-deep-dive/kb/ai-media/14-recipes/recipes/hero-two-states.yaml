recipe_version: 1
checked_at: '2026-09-25'
id: hero-two-states
title: Hero с двумя состояниями и прожектором за курсором
doc: 14-recipes/01-hero-recipes.md#5
task_codes:
- IMG-EDIT
- VID-HERO-LOOP
slot: hero
ladder: image
ai_fit: conditional
legal_row: 5
route:
  source: IMG-EDIT
  steps:
  - role: второе состояние правкой света от мастера
    model: openai/gpt-image-2.5-sunburst
    params:
      image_resolution: 2K
      aspect_ratio: '16:9'
    price_rub: 7.0
    test: M-06
    note: 'M-06 не запускался; правка «другой свет» NB2 2K (7,2 ₽) сгенерирована, сдвиг не мерен'
