# hero-loop.yaml — машиночитаемый рецепт; текст — 14-recipes/01-hero-recipes.md#2; схема — recipe.schema.json
recipe_version: 1
checked_at: '2026-09-25'
id: hero-loop
title: 'Тихая петля hero: FLF [A, A] + fixed_lens → срез дубля → мезонин без потерь → кодирование → постер'
doc: 14-recipes/01-hero-recipes.md#2
task_codes:
- VID-HERO-LOOP
slot: hero
ladder: video
ai_fit: allowed
legal_row: 20
route:
  source: VID-HERO-LOOP
  steps:
  - role: дёшево
    model: bytedance/seedance-1.5-pro
    params:
      resolution: 480p
      duration: '4'
      generate_audio: 'false'
      fixed_lens: 'true'
      aspect_ratio: '16:9'
    images: '[A, A]'
    price_rub: 5.25
    test: I-03
  - role: контроль живости
    model: bytedance/seedance-1.5-pro
    params:
      resolution: 480p
      duration: '4'
      generate_audio: 'false'
    images: '[A]'
    price_rub: 5.25
    test: I-01
  - role: 'не для петли (routing v2: not)'
    model: google/gemini-omni-1.1-flash
    params:
      resolution: 1080p
    price_rub: 48.0
    test: I-15
    note: 'first_frame_url = last_frame_url — URL хранилища; к кадру не возвращается, шов 5,08, звук всегда (I-15)'
  - role: 'не для петли (routing v2: not)'
    model: kling/v3
    params:
      mode: std
      duration: '5'
      sound: 'false'
    images: '[A, A]'
    price_rub: 50.0
    test: I-09
    note: 'шов 2,12, живость 0,42 (I-09); kling/v3 pro 1080p [A,A] — почти стоп-кадр: движение 0,024, шов 6,98 (VM-02)'
  - role: финал 1080p
    model: bytedance/seedance-1.5-pro
    params:
      resolution: 1080p
      duration: '8'
      generate_audio: 'false'
      fixed_lens: 'true'
      aspect_ratio: '16:9'
    images: '[A, A]'
    price_rub: 45.0
    test: MS-05
    note: '+ RIFE-мост 8 кадров — шов 0,41; генерация ≈ 705 с'
spec:
  must:
  - 'motion.loop: first_last_same'
  - motion.background_motion — движение каждого элемента
  - 'motion.camera.move: static'
  ancestors:
  - ../../scripts/ai-media/tests/fixtures/D02/E4.spec.json
compile: scripts/ai-media/prompt_compile.py jobs <spec> --models <модель> --out $DDD_HOME/out/ai-media/<ассет>.jsonl
steps:
- id: scan
  cmd: python3 ../../scripts/ai-media/provenance_check.py scan <выход как скачан> --corners --trust --out prov/
  status: checked
- id: loop
  cmd: python3 ../../scripts/ai-media/video_loop_check.py loop out.mp4 --control control.mp4
  status: checked
- id: trim
  cmd: python3 ../../scripts/ai-media/video_loop_check.py trim out.mp4 loop_mezz.mp4 --auto
  status: checked
- id: rife-bridge
  cmd: python3 ../../scripts/ai-media/loop_rife_bridge.py loop_mezz.mp4 loop_rife.mp4 8 (если seam_ratio_local > 1,5; под heavy.lock
    при free ≥ 3 ГБ; кроссфейд хвоста на крупной форме даёт «фантом» — не применять)
  status: checked
  evidence: ../../scripts/ai-media/loop_rife_bridge.py
- id: crf-sweep
  cmd: motion_keep ≥ 0,75
  status: checked
- id: encode
  cmd: ffmpeg … -vf "setparams=color_primaries=bt709:color_trc=bt709:colorspace=bt709:range=tv,format=yuv420p10le" -c:v libsvtav1 -preset 6 -crf
    <CRF> -map_metadata 0 -movflags use_metadata_tags+faststart (+ H.264)
  status: checked
- id: poster
  cmd: ffmpeg -i hero.av1.mp4 -frames:v 1 poster.png && scripts/ai-media/avif_pick.sh poster.png poster.avif 80
  status: checked
- id: stamp
  cmd: python3 ../../scripts/ai-media/provenance_check.py stamp <производная> <производная> --dst trained --system "<модель> via <канал>"
  status: unchecked
- id: audit-web
  cmd: python3 ../../scripts/ai-media/asset_audit.py audit hero.av1.mp4 --mode video-loop --stage web --master loop_mezz.mp4 --slot hero
  status: checked
accept:
  asset_audit:
    mode: video-loop
    verdict: мезонин — pass; сжатый финал — needs_human из-за пульса допустим
  thresholds:
  - video.seam_local_max
  - video.cut_ratio_max
  - video.motion_vs_control_min
  - video.head_tail_min
  - video.motion_keep_min
  - budget.video.hero_1080_kb
  - budget.video.hero_720_kb
  page_accept:
    modes:
    - desktop
    - mobile
    checks:
    - пауза на 6-й секунде
    - 'reduce: 0 КБ видео'
    - F83 по кадрам 0/25/50/75 %
delivery:
  template: 10-web-integration/pages/02-video-hero.html
  formats:
  - av1 10 бит mp4
  - h264 mp4
  budget_kb:
    desktop_1080p: 1500
    mobile_720p: 600
provenance:
  dst: trained
  visible_label: false
  note: AIGC вендора — флагами ffmpeg одной строкой
numbers:
  live_i03_seam_local: '1,28, живость 0,83 (рябь, 480p 4 с, 5,25 ₽; n = 1)'
  live_large_form_seam_local: '3,29 (4 с) / 3,45 (8 с) без моста; форма «гуляет» до 36,5 px и при fixed_lens'
  live_rife_bridge_seam: '0,69 (4 с) / 0,84 (8 с 720p) / 0,41 (8 с 1080p) без двоения'
  live_crossfade_tail: 'шов 1,46–1,76 по метрике, но «фантом» (двоение формы) — голос заказчика; только для мелкой ряби'
  live_pingpong_seam: '0,66–0,74 без двоения; только ненаправленное движение'
  live_encoded_seam: '0,8 → 2,40 (AV1 CRF 28, 1 011 КБ за 8 с 720p) / 1,76 (H.264 CRF 22, 2 314 КБ)'
status:
  local: checked
  generation: checked
sources:
- '[V:OA4xB5EY02g]'
