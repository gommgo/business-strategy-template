# ---- видео-диалекты: дополняют семейства выше, компилятор сливает их по имени семейства ----
# motion_forbid: sentence — запреты движения предложениями (так пишут вендоры: Seedance «keep it subtitle-free»,
# Omni «Do not do X»); positive — только утвердительно (Runway «Negative phrasing is not supported»).
# timestamps_template / multishot.template — Python format: {t0}, {t1}, {beat}, {n}, {m} (секунды), {words}, {t0_ord}.
video:
  veo:          {motion_forbid: sentence, timestamps_template: "[00:{t0:02.0f}-00:{t1:02.0f}] {beat}", multishot: null}
  omni:         {motion_forbid: sentence, timestamps_template: "[{t0:g}-{t1:g}s] {beat}", multishot: {template: "[{t0:g}-{t1:g}s] {words}", joiner: " "}}
  seedance-1-5: {motion_forbid: sentence, timestamps_template: null, multishot: {template: "Shot {n}: {words}", joiner: " ", cut_word: "Cut to"}}
  seedance-2:   {motion_forbid: sentence, timestamps_template: null, multishot: {template: "Shot {n}: {words}", joiner: " "}}
  seedance-2-5: {motion_forbid: sentence, timestamps_template: "[{t0:g}s-{t1:g}s] {beat}", multishot: {template: "[{t0:g}s-{t1:g}s] Shot {n}: {words}", joiner: " "}}
  wan:          {motion_forbid: sentence, timestamps_template: "[{t0:g}-{t1:g}s] {beat}", multishot: {template: "Shot {n} [{t0:g}–{t1:g} s] {words}", joiner: " ", polza_param: multi_shots}}
  kling:        {motion_forbid: sentence, timestamps_template: "At the {t0_ord} second, {beat}", multishot: {template: "shot {n}, {m:g}, {words};", joiner: " ", max_shots: 6, shot_max_chars: 512, start_frame_only: true,
                 note: "в polza нет параметра multi_shots (у вендора по умолчанию true, у провайдера — вероятно false: sound «Обязательно true при multi_shots=true») — мульти-шот текстом [не проверено]; для одного плана — «one continuous shot»"}}
  minimax-h3:   {motion_forbid: positive, timestamps_template: "At 00:{t0:06.3f}, {beat}", multishot: {template: "[Shot {n}] At 00:{t0:06.3f}, the camera cuts to {words}", joiner: " "},
                 i2va_line: "For the target video, at 0.00 seconds into the target video, <Picture 1> (from [Shot 1]) is fully referenced."}
  grok-video:   {motion_forbid: positive, timestamps_template: null, multishot: null, note: "D2-08 (живой прогон, n = 2): запреты предложениями (--opt forbid_style=sentence: «No zoom. No spin. Do not reposition the subject.») против без запретов — дрейф объекта 8,1 % против 19,1 % ширины; positive против sentence не сравнивались"}
  runway:       {motion_forbid: positive, timestamps_template: "[00:{t0:02.0f}] {beat}", multishot: null}

# ---- каналы вне Media API polza: задания .routerai.json и .genapi.json для mp_client.py ----
channels:
  routerai:
    method: POST
    path: "/api/v1/images"          # синхронно, base64 в data[].b64_json, usage.cost (₽)
    docs: "routerai.ru/docs/guides/overview/multimodal/image-generation"
    catalog: "routerai.ru/api/v1/models (23.09.2026 09:34, supported_parameters)"
    price_source: "ai-media 02/03: таблица цен 23.09.2026 (RouterAI ×1,30 к ЦБ)"
    input_reference: {type: image_url, image_url: {url: "{src}"}}   # src → data URI при отправке (mp_client.py)
    # output_format модели — формат, который она отдаёт, когда его не называет маршрут задачи (routing.yaml); без поля —
    # png. У векторных моделей — svg: другого формата канал у них не принимает (supported_output_formats каталога).
