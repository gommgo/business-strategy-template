# Диалекты промтов по семействам моделей — машиночитаемая часть 05-prompting/01-vendor-prompt-guides.md §13.
# Читает компилятор ../../scripts/ai-media/prompt_compile.py; правила отображения полей — 03-asset-spec-and-dialects.md §9–§10.
# Лимиты и параметры — из каталога polza; остальное — из официальных гайдов вендоров (ссылка source).
# Статусы: documented — так пишет вендор; untested — форма компилятора, генерацией не проверена.
# Запись модели (families.<семейство>.models.<id> и channels.<канал>.models.<id>) — лимиты и особенности входа:
#   max_prompt_chars, max_refs, mask (полярность маски), frames_via (кадры полями *_url), price_rub;
#   min_input_px (необязательно) — меньшая сторона каждой входной картинки (референс, исходник правки, кадр) не меньше
#   этого числа пикселей: компилятор сверяет файлы входа до вызова, картинка меньше — ошибка.
version: "0.4"
checked_at: "2026-09-25"
catalog_snapshot: "$DDD_HOME/cache/ai-media/polza/2026-09-25_1411/api-v1-models.json"   # компилятор берёт последний снимок (как polza.py); закрепить — POLZA_CATALOG=<папка>

defaults:
  description_language: en          # описание — по-английски (01 §12.7)
  text_policy: html_overlay          # текст по умолчанию — HTML-слоем (01 §12.7)
  enhancers: off                     # усилители вендоров выключены для скомпилированных промтов (02 §6.3)
  max_palette_colors: 5              # BFL: 3–5 цветов
  on_over_limit: fail                # промт длиннее лимита не обрезается (02 §9.2)
  service_exclusions: [text, watermark, logo, subtitles, music, dialogue]
  slop_words: [luminous, radiant, vibrant, lush, dynamic, glowing, gorgeous, stunning, breathtaking, mesmerizing,
               masterpiece, 8k, 4k, ultra-detailed, hyperrealistic, hyper-realistic, epic, cinematic, award-winning,
               trending on artstation, best quality, high quality, ultra hd, octane render, unreal engine, beautiful,
               amazing, perfect, professional photo]   # Ideogram magic prompt v1, BFL «Filler hurts», MiniMax «abstract words like cinematic»
  quality_words: [cinematic, 4k, 8k, masterpiece, ultra-detailed, high quality, best quality, hdr, award-winning]   # «слова качества» не работают; для плеча A/B — compile.quality_words
  quality_words_policy: "не добавлять по умолчанию: против — MiniMax («abstract words like cinematic»), Runway, BFL, скиллы sd25-pe и wan3-pe («Do not automatically add quality packs»); за — Seedance 2.0 (гайд и скилл sd2-pe: «4K HD, rich details» + анти-искажения обязательно), в примерах Kling и Vertex; ByteDance противоречит сам себе → [спорно], плечо A/B — compile.quality_words; у семейства — quality_vendor"
  grading_words: [warm]      # Ideogram: «The word "warm"… is BANNED as a grading adjective» — задавать источник света
  comparatives: [darker, lighter, brighter, dimmer, warmer, cooler, bigger, smaller, larger, more, less, softer, harder,
                 sharper, stronger, weaker, higher, lower, redder, greener, bluer]   # правка: целевые значения вместо сравнительных [V:8kM5aDD5gLI 25:38]
  anti_average: "Off-center subject placed on a rule-of-thirds line, gaze turned away from the camera, asymmetric composition with natural imperfections."   # [V:AxV8TR3BdqI 30:46–32:51]; позитивная форма целиком — когда нет частей anti_average_parts
  anti_average_parts:        # взгляд — только если в кадре люди; несовершенства — только у фото; «по центру» + это правило — ошибка спецификации
    base: "Off-center subject placed on a rule-of-thirds line, asymmetric composition"
    people: "gaze turned away from the camera"
    photo: "natural imperfections"
  strict_spelling:
    sentence: "No misspellings, no extra letters, and no warped glyphs."   # [V:XLHTLJhzDyQ 03:05]
    positive: "Every letter is spelled exactly as written, crisp and undistorted."
  reference_roles:           # {ref} — ссылка в синтаксисе семейства; {note} — что взять
    style: "{ref} is the style reference: match its {note}; the subject and scene come from this prompt."
    identity: "{ref} shows the subject; use it only to preserve the subject's identity ({note}) and create a completely new shot."   # [V:I9xdmNZxIfA 08:27]
    subject: "{ref} shows the subject: keep it recognizable ({note})."
    character: "Keep the character from {ref} identical: face, proportions and clothing ({note})."
    product: "{ref} is the product: keep its shape, proportions, materials, label and colors exactly as in the image ({note})."
    composition: "Follow the composition of {ref}: {note}."
    layout: "Strictly follow the layout of {ref}: {note}."
    palette: "Take only the color palette from {ref} ({note})."
    background: "Use {ref} as the background environment ({note})."
    material: "Apply the material and surface finish from {ref} ({note})."
    effect: "Apply the visual effect shown in {ref} ({note}) to the new subject."
    pose: "Take the pose from {ref} ({note})."
    video_motion: "Reference the motion and camera movement in {ref} ({note})."
  reference_group:           # ≥ 2 референса одной роли — одна фраза, а не повтор на каждый (у FLUX.2 повтор выводит промт за 300 слов)
    style: "{refs} are style references from one shoot: match their {note}; do not copy their scenes or composition; the subject and scene come from this prompt."
    identity: "{refs} show the same subject; use them only to preserve the subject's identity ({note}) and create a completely new shot."
    subject: "{refs} show the subject from different angles: keep it recognizable ({note})."
    character: "{refs} show the same character: keep the face, proportions and clothing identical ({note})."
    product: "{refs} show the same product from different angles: keep its shape, proportions, materials, label and colors exactly as in the images ({note})."
    default: "{refs}: {note}."
  motion_forbid:             # запреты движения; sentence — для семейств, где вендоры пишут запреты сами; positive — без отрицаний
    zoom: {sentence: "No zoom.", positive: "The focal length stays fixed."}
    spin: {sentence: "No spin.", positive: "The subject keeps its orientation."}
    reposition_subject: {sentence: "Do not reposition the subject.", positive: "The subject stays in the same place in the frame."}
    camera_move: {sentence: "Do not move the camera.", positive: "The camera remains completely still."}
    cuts: {sentence: "No cuts.", positive: "One continuous shot."}
    shake: {sentence: "No camera shake.", positive: "The image stays perfectly stable."}
    morph: {sentence: "Do not change the shape of the subject.", positive: "The subject keeps its exact shape and proportions."}
    new_objects: {sentence: "Do not add new objects.", positive: "Only the elements already in the frame appear."}
    text: {sentence: "No on-screen text.", positive: "A clean frame without captions."}
    fast_motion: {sentence: "No fast or sudden movement.", positive: "All movement is slow and gentle."}
  tempo_words: {slow: "All movement is slow and gentle.", medium: "Movement is steady and natural.", fast: "Movement is quick and energetic."}
  edit:
    max_changes: 5           # ≤ 5 изменений за вызов, больше — цепочкой [V:H6ZXujE1qBA 15:16]; «одна правка на вызов» (Gamma, VideoSmile) — [спорно]; у Nano Banana 2 десять правок одним вызовом сошлись на одном образце (ab_results, D2-06) — для неё --opt max_changes=10
    keep_position: "Keep its position and size exactly the same."   # формула Jamey [V:2RD3FP5iWJY 36:34]
    closing: "Change nothing else."
    suffix: "Maintain the original composition and subject."         # [V:8kM5aDD5gLI 24:36]

# Формы (format):
#   prose     — связный текст, главное в начале
#   sections  — проза по разделам с метками («Scene: …»)
#   json      — JSON визуальных полей спецификации (без служебных)
#   ir        — «ключ: проза» в snake_case (MiniMax H3)
#   ideogram_json — JSON по схеме подписей Ideogram 4 (вне polza)
# Отрицания (negative.object): positive — только позитивные замены; sentence — допускается «No X.»

families:

  nano-banana:
    class: A                       # thinking-модели Gemini 3 (и Gemini 2.5 Flash Image)
    source: "01 §2"
    models:
      google/gemini-2.5-flash-image:        {max_prompt_chars: 20000, max_refs: 8, price_rub: 2.90}
      google/gemini-3.1-flash-lite-image:   {max_prompt_chars: 20000, max_refs: 10, price_rub: 2.90, note: "не для мульти-референса"}
      google/gemini-3.1-flash-image-preview: {max_prompt_chars: 20000, max_refs: 14, price_rub: {1K: 4.80, 2K: 7.20, 4K: 10.80}}
      google/gemini-3.1-flash-image:        {max_prompt_chars: null, max_refs: null, price_rub: tokens, note: "google-vertex; параметры в каталоге не описаны"}
      google/gemini-3-pro-image-preview:    {max_prompt_chars: 20000, max_refs: 8, price_rub: {1K: 13.5, 2K: 13.5, 4K: 18}}
    format: sections
    alt_formats: [prose, json]
    status: documented             # проза — официальные гайды; разделы — DevRel Google
    order: [operation, subject, environment, composition, text_zone, camera, light, palette, materials, style, mood, text, constraints]
    labels: {subject: "Subject", environment: "Setting", composition: "Composition", camera: "Camera", light: "Lighting", palette: "Colors", style: "Style", text: "Text", constraints: "Constraints"}
    operation_verbs: {generate: "Create", edit: "Using the provided image, change only"}
    negative: {field: null, service: sentence, object: positive}
    language: {description: en, russian_description_ok: true, note: "ru-RU в списке рекомендованных языков Gemini API"}
    references: {syntax: "Image {n}", roles: true, example: "Use Image 1 for the character's pose, Image 2 for the art style"}
    text: {quote: "\"", language_tag: true, font: words, position: required, closing: "No other text."}
    palette: {hex: untested, form: "{name}", shares: words}
    text_zone: {template: "{subject} positioned in the {region} of the frame. The {side_words} of the frame is a vast, empty {surface}, creating significant negative space for text.", status: documented}
    edit: {template: "Using the provided image, change only the {target} to {change}. Keep everything else in the image exactly the same, preserving the original style, lighting, and composition."}
    enhancer: null
    aspect_ratio_param: aspect_ratio

  gpt-image:
    class: A
    source: "01 §4"
    models:
      openai/gpt-image-2.5-sunburst: {max_prompt_chars: 20000, max_refs: 16, price_rub: {1K: 4, 2K: 7, 4K: 11}}
      openai/gpt-image-2.5-flare:    {max_prompt_chars: 20000, max_refs: 16, price_rub: {1K: 4, 2K: 7, 4K: 11}, note: "id с 25.09.2026 (снимок 2026-09-25_1411); параметры и цены — как у прежнего id"}
      gpt-image-2-5-flare:           {max_prompt_chars: 20000, max_refs: 16, price_rub: {1K: 4, 2K: 7, 4K: 11}, note: "id до 25.09.2026 (без префикса openai/); в снимке 2026-09-25_1411 его нет — для новых заданий openai/gpt-image-2.5-flare"}
      openai/gpt-5.4-image-2:        {max_prompt_chars: 20000, max_refs: 16, price_rub: {1K: 4, 2K: 7, 4K: 11}, note: "документация polza — 5 000"}
      openai/gpt-image-1.5:          {max_prompt_chars: null, max_refs: 16, price_rub: {medium: 3, high: 16.5}, note: "закрытие 2026-12-01"}
      openai/gpt-5-image:            {max_prompt_chars: 4000, max_refs: 5, price_rub: 4.50, mask: "black=change, white=keep", enhancer_param: isEnhance}
      openai/gpt-5-image-mini:       {max_prompt_chars: 32000, max_refs: 10, price_rub: tokens}
    format: sections
    alt_formats: [prose, json]
    status: documented             # «labeled sections» для сложного; любая форма допустима
    order: [scene, subject, details, composition, text_zone, camera, light, palette, style, text, constraints]
    labels: {scene: "Scene", subject: "Subject", details: "Details", composition: "Composition", camera: "Camera", light: "Lighting", palette: "Color palette", style: "Style", text: "Text (EXACT, verbatim)", constraints: "Constraints"}
    intended_use_line: true        # «include the intended use (ad, UI mock, infographic)»
    negative: {field: null, service: sentence, object: positive}
    language: {description: en, russian_description_ok: null}
    references: {syntax: "Image {n}", roles: true, example: "Image 1: product photo. Image 2: style reference."}
    text: {quote: "\"", exactly_once: true, spell_unusual: true, closing: "No extra text, no watermarks, no unrelated logos."}
    palette: {hex: untested, form: "{name} ({hex})", shares: words}
    text_zone: {template: "Subject {region}, with clean negative space on the {side} ({percent} of the frame) for a headline.", status: documented}
    edit: {template: "Change only {target} to {change}. Preserve {keep}. Keep all other aspects of the image unchanged."}
    enhancer: null
    aspect_ratio_param: aspect_ratio

  flux2:
    class: B
    source: "01 §5"
    models:
      black-forest-labs/flux.2-pro:  {max_prompt_chars: 5000, max_refs: 8, price_rub: {1K: 5, 2K: 7}}
      black-forest-labs/flux.2-flex: {max_prompt_chars: 5000, max_refs: 8, price_rub: {1K: 14, 2K: 24}}
    format: prose
    alt_formats: [sections, json]
    status: documented             # JSON: «both formats equally well»; скилл BFL: «Flatten for Execution»
    order: [subject, action, style, environment, composition, text_zone, light, camera, palette, materials, mood, text]
    target_words: [30, 80]
    negative: {field: null, service: positive, object: positive, replacements: {text: "clean unmarked surfaces", watermark: "pristine image", logo: "unbranded", people: "empty, deserted", clutter: "organized, minimal"}}
    language: {description: en, russian_description_ok: untested, note: "BFL: родной язык «аутентичнее»; данных по FLUX.2 нет"}
    references: {syntax: "image {n}", roles: true, example: "subject from image 1, style from image 2, background from image 3"}
    text: {quote: "'", front_load: true, max_words: 4, color_hex: true}
    palette: {hex: documented, form: "color {hex} ({name})", shares: words, bind_to_object: true, max_colors: 5}
    text_zone: {template: "{subject} in the {region}; the {side_words} is an empty, uncluttered {surface}, plain and evenly lit.", status: untested}
    edit: {template: "Change the {target} to {change} while keeping {keep} exactly the same."}
    enhancer: {vendor: "API BFL: [pro]/[max] апсемплинг по умолчанию (disable_pup=false), [flex] prompt_upsampling=true", polza: null}
    aspect_ratio_param: aspect_ratio

  seedream:
    class: B
    source: "01 §6.1"
    models:
      bytedance/seedream-4:          {max_prompt_chars: 5000, max_refs: 10, price_rub: 3, seed: true}
      bytedance/seedream-4.5:        {max_prompt_chars: 3000, max_refs: 14, price_rub: 5}
      bytedance/seedream-5-lite:     {max_prompt_chars: 2996, max_refs: 10, price_rub: 4}
      seedream/5-pro-text-to-image:  {max_prompt_chars: null, max_refs: 10, price_rub: {basic: 5, high: 10}}
    format: prose
    alt_formats: [sections]
    status: documented
    order: [purpose, subject, action, environment, composition, text_zone, style, light, palette, text, constraints]
    max_words: 600
    negative: {field: null, service: sentence, object: positive}
    language: {description: en, russian_description_ok: null, note: "гайды — EN/ZH"}
    references: {syntax: "Image {n}", roles: true, example: "replace the character in Image 2 with the character from Image 1, and generate the result in the style of Image 3"}
    text: {quote: "\"", closing: null}
    palette: {hex: untested, form: "{name}", shares: words}
    edit: {template: "{change} to {target}, keeping {keep} unchanged."}
    series: {phrases_in_polza: false, note: "sequential_image_generation в polza нет"}
    enhancer: {vendor: "optimize_prompt_options.mode=standard", polza: null}
    aspect_ratio_param: aspect_ratio

  qwen-image:
    class: B
    source: "01 §7.1–7.2"
    models:
      qwen/image:     {max_prompt_chars: null, max_refs: 1, price_rub: {"16:9": 2.25, "1:1": 3}}
      qwen/image-2:   {max_prompt_chars: 5000, max_refs: 3, price_rub: 4}
      qwen/image-2.1: {max_prompt_chars: 5000, max_refs: 10, price_rub: {1K: 3, 2K: 6}, seed: true, mask: "white=change, black=keep", transparent: true, enhancer_param: enhance_prompt}
    format: prose
    alt_formats: []
    status: documented             # переписчик 2512: «Strictly avoid formal Markdown lists…, numbered items, or headings»
    order: [subject, environment, composition, text_zone, depth_layers, light, materials, palette, style, text, constraints]
    negative: {field: null, service: sentence, object: positive}
    language: {description: en, russian_description_ok: true, note: "LingT2I: 0.78 RU против 0.82 EN; смещение надписей к китайскому"}
    references: {syntax: "Image {n}", roles: true, note: "Порядок — тот, на который ссылается промпт (каталог)"}
    text: {quote: "\"", language_tag: true, closing: "No other text appears in the image.", no_text_sentence: "The image contains no recognizable text."}
    palette: {hex: untested, form: "{name}", shares: words}
    edit: {template: "Replace {target} with {change}. Keep {keep} unchanged.", inpaint: "Perform inpainting on this image. The original caption is: {caption}", outpaint: "Extend the image beyond its boundaries using outpainting. The original caption is: {caption}"}
    enhancer: {vendor: "prompt_extend=true (Model Studio)", polza: {param: enhance_prompt, default: false, use_for: [short_prompt, edit]}}
    aspect_ratio_param: aspect_ratio

  z-image:
    class: B
    source: "01 §7.4"
    models:
      tongyi-mai/z-image: {max_prompt_chars: 1000, max_refs: 0, price_rub: 1.40}
    format: prose
    alt_formats: []
    status: untested               # официального гайда нет; техотчёт: плотные фактические подписи, PE
    order: [subject, environment, composition, text_zone, light, palette, style]
    negative: {field: null, service: positive, object: positive, note: "Turbo: guidance 0 — негатив не работает"}
    language: {description: en, russian_description_ok: false}
    references: null
    text: {quote: "\"", scripts_ok: [Latin], note: "надписи только EN/ZH"}
    palette: {hex: untested, form: "{name}", shares: words}
    enhancer: {vendor: "Prompt Enhancer (выровнен при SFT)", polza: null}
    aspect_ratio_param: aspect_ratio

  grok-image:
    class: unknown
    source: "01 §10"
    models:
      x-ai/grok-imagine-image: {max_prompt_chars: 5000, max_refs: 1, price_rub: 2.50, note: "базовая январская модель, не Image 2.0"}
      grok-imagine-image-2-0/text-to-image: {max_prompt_chars: 8000, max_refs: 5, price_rub: 3.00, note: "Grok Image 2.0 (снимок 17:45): правка по images ≤ 5; aspect_ratio auto — только при правке; 1:1, 2:3, 3:2, 16:9, 9:16"}
    format: prose
    alt_formats: []
    status: untested               # гайда по промтам нет
    order: [subject, environment, composition, text_zone, light, palette, style, text]
    negative: {field: null, service: positive, object: positive}
    language: {description: en}
    references: {syntax: "the provided image", roles: false}
    text: {quote: "\""}
    palette: {hex: untested, form: "{name}", shares: words}
    enhancer: null
    aspect_ratio_param: aspect_ratio

  veo:
    class: A                       # LLM-переписчик
    source: "01 §3"
    video: true
    models:
      google/veo3:      {max_prompt_chars: 60000, max_refs: 2, price_rub: 187.5, api_limit: "1024 токена в Gemini API", doc_limit_polza: 2000}
      google/veo3_fast: {max_prompt_chars: 60000, max_refs: 3, price_rub: 45, api_limit: "1024 токена в Gemini API", doc_limit_polza: 2000}
    safe_max_prompt_chars: 2000    # меньшее из документации polza и каталога
    format: prose
    alt_formats: [sections]
    status: documented
    order: [cinematography, subject, action, environment, style, audio]
    negative: {field: null, service: sentence, object: positive, vertex_field: "negativePrompt (не в polza): существительные без no"}
    language: {description: en, polza_param: {enableTranslation: "true"}}
    references: {first_last: "generationType=FIRST_AND_LAST_FRAMES_2_VIDEO", ingredients: "REFERENCE_2_VIDEO (только veo3_fast, ≤ 3)"}
    timestamps: {supported: true, syntax: "[00:00-00:02] {beat}"}
    camera: {one_move: true, static: "The camera remains static.", vocab: "01 §3.2 (Vertex)", vertex_param: "cameraControl: fixed | pan_* | tilt_* | truck_* | pedestal_* | push_in | pull_out (только с image; в polza нет)"}
    i2v: {motion_only: true, status: "спорно: пример Gemini API пересказывает сцену"}
    audio: {param: null, note: "звук всегда (Gemini API: «Always on»; Vertex generateAudio по умолчанию true — в polza не выставлен); немое видео — при кодировании (-an)"}
    enhancer: {vendor: "LLM-переписчик: у veo-3.0 не отключается; Vertex enhancePrompt по умолчанию true («providing a seed won't guarantee consistent results»)", polza: null}
    quality_vendor: {position: examples, note: "Vertex: «shot on 8K camera», «cinematic film look» в словаре стилей; Veo: «Use descriptive language»"}
    aspect_ratio_param: aspect_ratio

  omni:
    class: A
    source: "01 §3.9"
    video: true
    models:
      gemini-omni-video: {max_prompt_chars: 20000, max_refs: 7, price_rub: {"4s": 35, "6s": 45, "8s": 50, "10s": 60, "4k": 70}, seed: true, note: "preview; снимается 30.09.2026; FLF — только тегами в промте (references.declare)"}
      google/gemini-omni-1.1-flash: {max_prompt_chars: 20000, max_refs: 7, price_rub: {"4s": 48, "6s": 63, "8s": 79, "10s": 95, "4k,4s": 111, "v2v": 126}, seed: true,
                                     frames_via: {first: first_frame_url, last: last_frame_url, last_needs_first: true, exclusive_with: [images, videos, audio_ids, character_ids]},
                                     note: "GA: кадры — полями *_url, не images и не тегами; 360p = 720p = 1080p по цене; локальный файл в поле *_url polza.py загружает в хранилище сам перед отправкой"}
    format: prose
    alt_formats: [sections]
    status: documented
    order: [role_tags, shot_contract, subject, action, environment, camera, style, audio, constraints, role_closing]
    negative: {field: null, service: sentence, object: sentence, note: "«Do not do X» в тексте — по документации"}
    language: {description: en}
    references: {syntax: "<IMAGE_REF_{n}>", first_frame: "<FIRST_FRAME>", last_frame: "<LAST_FRAME>", declare: "[# Sources <FIRST_FRAME>@Image1 <LAST_FRAME>@Image1]", closing_loop: "Use this image as the first frame and the last frame.", status: "теги — только preview gemini-omni-video (через KIE — untested); у GA кадры идут полями frames_via, теги не пишутся"}
    single_shot_phrase: "In a single continuous shot. No scene cuts."
    timestamps: {supported: true, syntax: "[{t0}-{t1}s] {beat}"}
    camera: {one_move: true, static: "The camera stays locked."}
    audio: {param: null, silence: "No dialogue. No music. No extra sound effects."}
