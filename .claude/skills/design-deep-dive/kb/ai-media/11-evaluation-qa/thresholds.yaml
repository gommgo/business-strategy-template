# Пороги автоматической приёмки ассетов — читает ../../scripts/ai-media/asset_audit.py (агент K, волна 3).
# Проверено: 2026-09-23. Каждый порог: value + source (файл базы §, опыт или документ) + status:
#   calibrated  — откалиброван опытом базы на эталоне или замере (число в источнике);
#   position    — позиция базы по опыту на синтетике или по аналогии (без калибровки на выходах моделей);
#   uncalibrated — эвристика K, пересмотреть по фазе 5 (задания K-01…K-06, 99-raw/phase5/K-plan.md).
# Переопределение из паспорта визуала (--dna, блок acceptance) — asset_audit.py audit_paths(); проверка полноты —
# `python3 ../../scripts/ai-media/asset_audit.py thresholds --check`.
schema: asset-audit-thresholds/1
checked_at: "2026-09-23"
thresholds:
  image:
    ratio_tolerance: {value: 0.02, status: position,
      source: "K: отклонение пропорции > 2 % — модель не выдержала aspect_ratio; нестандартные 1928×1072 Kling = 0,4 % (I 09-video-pipeline/03 §6)"}
    hero_master_min_px: {value: 2560, status: calibrated,
      source: "A 01-web-assets-landscape/01-asset-slots-by-page-type.md выжимка п. 4 (мастер hero ≥ 2560 px, полноэкранный — 3840; замер лидеров)"}
    colorfulness_q3: {value: 54.5, status: calibrated,
      source: "A 01-web-assets-landscape/03 §6.1.1 — Q3 фото лидеров (A/04: 51 картинка, 15 сайтов); выше — смотреть глазом, не брак"}
    sat_share_q3: {value: 0.075, status: calibrated, source: "A 01/03 §6.1.1 (A/04), Q3 фото лидеров"}
    hdr_index_q3: {value: 0.35, status: calibrated, source: "A 01/03 §6.1.1 (A/04), Q3 фото лидеров 0,349"}
    clip_hi_q3: {value: 0.14, status: calibrated, source: "A 01/03 §6.1.1 (A/04), Q3 фото лидеров; к рендерам на белом не применять"}
    colorfulness_max_rel: {value: 1.2, status: position,
      source: "F/04 README и 06-art-direction-consistency/04 (судья F-04): colorfulness ≤ эталон бренда × 1,2; паспорт visual-dna acceptance.colorfulness_max_rel"}
    hdr_index_max_delta: {value: 0.1, status: position, source: "F/04 README: hdr_index ≤ эталон + 0,1 (фильтр даёт +0,12…+0,18)"}
    filter_colorfulness_rel: {value: 1.5, status: calibrated,
      source: "F/04 README: «Instagram-фильтр» = colorfulness > +50 % и hdr_index > +0,1 к эталону (синтетический фильтр ×1,9–2,2 на 3 CC0-фото)"}
    warm_b_max: {value: 4.0, status: calibrated,
      source: "A 01/03 §5.2 IMG-M04 и §6.1.1: b* нейтралей > +4 — жёлтый сдвиг; у 9 из 51 фото лидеров это стиль → warn только при нейтральном белом в паспорте"}
    soft_probe_scale: {value: 2, status: uncalibrated,
      source: "08-image-post-processing/02-upscale-edit-outpaint.md §1.2: консервативное увеличение — Lanczos ×2 (копия из половинного размера: гладкий рендер — SSIMULACRA2 86,2, ткань 74,7, органический узор 52,2); проба резкости источника — кадр против своей копии вдвое меньшего размера, граница — encoding.ssimulacra2_hero_min; гладкий сюжет проходит границу без увеличения — только info"}
    purple_share_max: {value: 0.5, status: position, source: "A 01/03 §6.1 IMG-M05: доля пурпура 270–320° > 0,5 без пурпура в бренде (в замере 1 из 83)"}
  composition:
    center_offset_min: {value: 0.08, status: position,
      source: "F/04 composition_metrics.py: |centroid_x − 0,5| < 0,08 — «строго по центру» (IMG-M09); рендер x 0,3/0,5/0,7 → 0,302/0,501/0,693"}
    centroid_x_min: {value: 0.62, status: position, source: "F/04 README, судья F-04: объект в правой трети при зоне текста слева"}
    blobs_max: {value: 3, status: position, source: "F/04 (blobs — пятна значимости) и W2-12 «≤ 3 элемента»; откалибровано на синтетике и 3 фото"}
  text_zone:
    edge_density_max: {value: 0.06, status: calibrated,
      source: "F/02 README: зона под текст — плотность краёв ≤ 0,06 (небо и стены 0,001–0,06; листва и архитектура 0,16–0,52); 06/03 §2"}
    scrim_percentile: {value: 99.9, status: calibrated,
      source: "F/02 (дополнение F2): скрим по p99,9 — буквы читаются 64/64, затем проверка WCAG F83 по худшему пикселю (p100 проходит 64/64)"}
    contrast_min: {value: 4.5, status: calibrated, source: "WCAG 2.x SC 1.4.3 и техника F83 (W3C); F/02"}
    scrim_alpha_warn: {value: 0.55, status: position,
      source: "K по F/02: альфа скрима по p100 — медиана 0,48, p90 0,53; выше 0,55 — «серая коробка», сначала композиция и цвет текста"}
  palette:
    de_ok: {value: 0.05, status: position, source: "F-05 и vlm_to_dna.palette_check: цвет паспорта найден, если ΔE OKLab ≤ 0,05 до палитры, снятой с картинки"}
    min_matched: {value: 3, status: position, source: "F-05 (F-plan): «≥ 3 из 5 hex в ΔE ≤ 0,05»"}
  cutout:
    transparent_frac_min: {value: 0.2, status: position, source: "H 08-image-post-processing/01 §5: альфа есть — transparent_frac > 0,2 для объекта в кадре"}
    halo_px_max: {value: 2.0, status: calibrated, source: "H 08/01 §5 и alpha_check.py halo: ореол ≤ 2 px (H/01, эталон Blender)"}
    margin_min_frac: {value: 0.02, status: position, source: "H 08/01 §7: поле вокруг объекта ≥ 2 % стороны"}
    glass_partial_min: {value: 0.3, status: calibrated, source: "H 08/01 §5: стекло — доля полупрозрачных пикселей тела ≥ 30 % (H/01: нейросети дают 0,92–0,97 непрозрачного)"}
    fiber_partial_min: {value: 0.03, status: position, source: "H 08/01 §5: волокна не «подстрижены» — полупрозрачных ≥ 3 % площади объекта"}
    iou_min_solid: {value: 0.95, status: calibrated, source: "H 08/01 §5: IoU с эталонной альфой ≥ 0,95 для твёрдых объектов (лучшие методы H/01)"}
    iou_min_fibers: {value: 0.85, status: calibrated, source: "H 08/01 §5: IoU ≥ 0,85 для волос и меха"}
    band_mae_x1000_max: {value: 150, status: position, source: "H 08/01 §5: ошибка края ≤ 150 ×10⁻³ (позиция H по лучшим методам H/01)"}
  edit:
    leak_frac_max: {value: 0.02, status: calibrated, source: "H 08/02 §2.2 (edit_check.py 0.2; C1-12): outside_leak_frac ≤ 0,02"}
    leak_de: {value: 5.0, status: calibrated, source: "edit_check.py: изменённым считается пиксель с ΔE00 > 5 (H/03)"}
    global_drift_max: {value: 2.0, status: calibrated, source: "H 08/02 §2.2: общий дрейф цвета ΔE00 ≤ 2 (иначе --match-color; «как модель» 3,33 → 0,9)"}
    target_changed_min: {value: 0.2, status: position, source: "edit_check.py: NO_EDIT, если в цели изменено < 20 % пикселей"}
    edges_iou_min: {value: 0.9, status: position, source: "H 08/02 §2.2 (W6-4): геометрия при правке света/цвета — edges_iou ≥ 0,9"}
    protect_ssim_min: {value: 0.9, status: position, source: "H 08/02 §2.2 (A-3): защищённый товар SSIM ≥ 0,9 и ΔE00 медиана ≤ 5"}
    outpaint_edge_sharpness_min: {value: 0.85, status: calibrated,
      source: "H 08/02 §4.3 (edit_check.py 0.2 outpaint): SSIM центра ≥ 0,9 И ΔE00 ≤ 3 И резкость краёв ≥ 0,85 (размытие 2 px → 0,744)"}
    noedit_changed_min: {value: 0.002, status: uncalibrated, source: "K: безмасочная правка изменила < 0,2 % кадра — правки нет"}
    maskless_changed_max: {value: 0.5, status: uncalibrated, source: "K: изменено > 50 % кадра — перерисовка, а не правка (PaintBench: модели меняют в 50–1400 раз больше нужного, H 08/02 §2.1)"}
    extra_regions_tolerance: {value: 2, status: uncalibrated, source: "K: изменённых областей больше заказанных + 2 — подозрение на утечку"}
    derived_mask_dilate_frac: {value: 0.02, status: uncalibrated,
