    feather_frac: {value: 0.03, status: calibrated, source: "H 08/02 §2.4: растушёвка композита при удалении ≈ 3 % стороны (контур не виден, ΔE p95 2,07)"}
    local_shift_de: {value: 3.0, status: position,
      source: "K/02: после робастной подгонки цвета остаток неизменённых зон — медиана ΔE00 0,7–0,9 (H/03); связная область > 3 — локальный сдвиг (утечка слабее порога 5 edit_check)"}
    local_shift_min_frac: {value: 0.01, status: uncalibrated, source: "K/02: область ≥ 1 % площади «вне цели» (H/03: утечка-угол 13 %, «призраки» удаления 0,8–3 %; мельче — шум и JPEG)"}
  texture:
