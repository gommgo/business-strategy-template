- id: dribbble
  name: Dribbble
  group: portfolio-shots
  url: https://dribbble.com/
  alive: 'жив: 6 запросов и 2 get через сессию заказчика (Brave 153), челленджей нет [проверено: B/06]'
  value: 3
  useful_for:
  - статика-концепты
  - видео-шоты (движение)
  - палитры шота
  - теги
  search:
    url_templates:
    - https://dribbble.com/search?q=<запрос> → /search/<запрос-через-дефис>
    - https://dribbble.com/shots/<id>-<slug>
    - https://dribbble.com/tags/<тег>
    - https://dribbble.com/colors/<hex>
    paging: бесконечная прокрутка, порция ≈ 24–34 шота
  api:
    exists: true
    access: OAuth; только шоты авторизованного пользователя (GET /user/shots, /shots/:id)
    limits: 60/мин, 1 440/сутки
  login:
    needed: нет для выдачи; сессия заказчика — для клиента
    paid: Pro — не нужен
  antibot: 'AWS WAF: curl → 202 challenge; браузер проходит сам'
  robots: не проверен (площадка — решение заказчика)
  terms:
    url: https://dribbble.com/terms
    revision: Updated March 17, 2025
    clauses:
    - 7.1 scraping
    - 7.2 не больше запросов, чем человек в браузере
    - 7.5 нагрузка
    - 7.7 сбор User information, including account names
    - 7.11 доступ средствами, не предоставленными сервисом
    - 7.12 обход ограничений
    - 11 копирование и производные Dribbble Content
    - 'API Terms: «Scraping, copying, saving, or storing our data is strictly prohibited»'
  client:
    mode: search
    since: 2026-09-24 ≈15:00
    adapter: проверен вживую
  rate: 10 с + U(0; 6) с; 60 страниц в сутки
  notes: 'Концепты, не продакшн: выдача «saas landing page» — средний SaaS (градиенты, bento).'
  checked_at: '2026-09-24'
