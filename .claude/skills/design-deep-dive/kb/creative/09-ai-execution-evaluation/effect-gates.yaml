# effect-gates.yaml — ворота эффектов подачи (creative-research) · v0.2
# 09-ai-execution-evaluation · волна 3 · агент K · 2026-09-24; v0.2 — продолжатель K2, 2026-09-25 (поле changes ниже).
# Описание и обоснование — 03-verification-loop-and-gates.md §3; итоги на лаборатории F и странице I/02 — там же §5.
#
# Иерархия (контракт тройки v2 §2): ворота страницы site (../site/07-seo-geo-performance-analytics/page-gates.yaml
# v1.2) ВЫШЕ этих; ворота ассетов (ai-media page_accept.py, blender 09/05 §7.2) страницу не блокируют за чужие байты.
# Здесь — то, что добавляет подача: движение, петли, reduce, фолбэки, вес и цена эффектов. Там, где метрика совпадает с
# воротами site (LCP, TBT, вес страницы, CLS загрузки), наша строка — «зеркало» с серьёзностью D и полем site: владелец —
# site, повторного блокера нет.
#
# Автопроверка: ../../scripts/creative/motion_check.py ЦЕЛЬ --level L0|L1|L2 → results.json → gates.md (правило → найдено → порог → где).
# Поле metric — путь в results.json[<режим>]; modes — режимы motion_check (desk 1440×900 · mob Pixel 7 + CPU×4 · rm reduce ·
# nojs · nogl); op — <=, >=, ==, empty (список пуст), false (ложь); threshold — число, {L0|L1|L2|all: число | {desktop, mobile}};
# threshold_ref — ссылка на число владельца величины: путь в levels[<уровень>] файла 01-creative-direction/ambition-levels.yaml
# (budgets.effects.*, motion_hints.*); «profile.<путь>» — профиль страницы site (../site/07-seo-geo-performance-analytics/
# budgets.yaml через page_gates.py: с --page-type — <тип>@<уровень> с исключениями, иначе уровень), метка <device> — устройство
# режима; «effects.yaml#<id>.<путь>» — запись каталога 06-effects-catalog/effects.yaml. Поле есть, числа нет (null) — N/A,
# порог открыт. scale — множитель к числу ссылки; limits — числа строки, по которым motion_check считает находку (полоса,
# минимум периода, доля окна); levels — к каким уровням строка относится; auto: false — проверка вручную или другим
# инструментом.
# Серьёзность — как у site: B блокер (страница не принимается), S серьёзно (исправить или x-gate-exception {id, why, who, until}
# в page-plan), D желательно. Пороги с меткой [гипотеза] — кандидаты по данным C, E, F, G; калибровка — живая фаза.
version: "0.2"
status: draft
checked_at: "2026-09-25"
owner: "creative-research · 09-ai-execution-evaluation · K (волна 3); v0.2 — продолжатель K2"
tool: "../../scripts/creative/motion_check.py 0.2; статические визуальные проверки — ../../scripts/creative/marketing_audit.py (профиль marketing)"
changes:
  - "0.2 (2026-09-25, K2): + EG-PERF-11 (CLS окна сессии с атрибуцией узлов, зеркало SG-PERF-03), EG-A11Y-24 (переключатель «Меньше» работает — нажатие), EG-A11Y-25 («Полное» в reduce включает движение), EG-A11Y-26 (F83 по буквам автоматом при --f83, B), EG-A11Y-27 (контраст над живым фоном, --contrast, S); EG-A11Y-11 — исключения (JS ≤ 3 КБ br, script[data-motion-toggle]); пороги и id прежних строк не менялись. Ложные S motion_check 0.1 (петля в покое из кадров прокрутки, станции холста, радиогруппа не видна) исправлены в 0.1.2."
  - "0.1 (2026-09-24, K): 50 строк, 42 автоматические."
  - "правки аудита без смены версии (2026-09-25, S1b по X-10): EG-PERF-03 fix — lerp ≥ 0,15 (замер S1: 0,12 даёт 1 094–1 125 мс — провал этих же ворот); ссылка blender — 09-web-runtime/05 (путь 09-perf-access-seo не существует); tool — marketing_audit.py 0.1.1. Пороги, id и серьёзность не менялись."
levels_source: "01-creative-direction/ambition-levels.yaml (budgets.effects — слой подачи по уровню, motion_hints — бюджет внимания); профиль страницы — ../site/07-seo-geo-performance-analytics/budgets.yaml (threshold_ref profile.*, зеркала D)"
site_gates: "../site/07-seo-geo-performance-analytics/page-gates.yaml v1.2 (62 строки; page_gates.py v1.2)"
neighbours:
  ai_media: "../../scripts/ai-media/page_accept.py (копия ai-media J): вес первого экрана, LCP, CLS, TBT, пауза видео на 6-й с, reduce 0 байт видео и < 0,5 % движения, F83 по буквам и кадрам видео"
  blender: "../blender/09-web-runtime/05-performance-a11y-fallbacks.md §7.2 — 11 порогов страницы с 3D (site_probe.py + gate_check): вызовы в кадре ≤ 30/60, reduce 0 вызовов и ≤ 0,05 % движения, DPR ≤ 1,5, первый кадр модели ≤ 5000/2000 мс"
  kimi: "../kimi-research/99-raw/tools/k3_checks.py — приметы K3 (K3-*, --allow), M-H1-LINES, M-OVERFLOW, M-NAV; ACCEPTANCE F2/F3, D1"
severity:
  B: "блокер: страница не принимается, пока не исправлено"
  S: "серьёзно: исправить или записать обоснование в page-plan (x-gate-exception: {id, why, who, until})"
  D: "желательно или зеркало ворот site/соседа: показать, не блокировать"
modes:
  desk: "Chromium 153 headless 1440×900, DPR 1; запись 960×600; load → 5 с → синхровспышка → покой 1 с (6-я секунда) → прокрутка колесом 0,8 экрана на шаг, пауза 1,4 с → петли через 6 с → Tab ×25 → пауза-тест"
  mob: "Pixel 7 (412×839, DPR 2,625, тач, UA HeadlessChrome) + CPU ×4 (CDP); запись 412×839; без Tab"
  rm: "desk + prefers-reduced-motion: reduce; запись всей страницы"
  nojs: "desk без JavaScript; кадр и видимость H1, текста и призыва"
  nogl: "desk с --disable-webgl --disable-webgl2; кадр, H1, ошибки консоли"
exceptions: "как у site: page-plan x-gate-exception: [{id: EG-…, why, who, until}] — S снимается с записью, B — нет"

gates:
  # ------------------------------------------------------------------ PERF — цена движения при прокрутке и LCP
  - id: EG-PERF-01
    name: "Длинные кадры (LoAF ≥ 50 мс) при прокрутке, % окна прокрутки"
    group: perf
    modes: [desk, mob]
    metric: scroll.loaf_pct
    op: "<="
    threshold: {all: {desktop: 2, mobile: 10}}
    severity: S
    spec_override: budget.long_frames_pct_max
    where: scroll.cls_sources
    source: "E 05-motion/03 §3.2 (кандидаты по квартилям C: десктоп медиана 0, Q3 0,5; телефон CPU×4 медиана 3, Q3 10,2); CRV-PF-11"
    label: "[данные: C] [гипотеза: порог]"
    site: "дополняет SG-PERF-04/05 (INP и TBT прокрутку не видят — web.dev)"
    fix: "тяжёлое — вне кадра прокрутки: WebGL и видео по видимости, меньше ScrollTrigger, будить эффект по IntersectionObserver"
  - id: EG-PERF-02
    name: "CLS при прокрутке (фаза прокрутки, без недавнего ввода)"
    group: perf
    modes: [desk, mob]
    metric: scroll.cls
    op: "<="
    threshold: 0.1
    severity: S
    spec_override: budget.cls_scroll_max
    where: scroll.cls_sources
    source: "E 05-motion/03 §3.2; E/02 (pin ScrollTrigger через position: fixed — 1,6–2,0; sticky и pinType: 'transform' — 0)"
    label: "[проверено: 99-raw/experiments/E/02-scroll-scene]"
    site: "дополняет SG-PERF-03 (CLS страницы web-vitals после прокрутки): наш — только фаза прокрутки, указывает на эффект"
    fix: "pinType: 'transform' или position: sticky вместо pin через fixed; размеры медиа до загрузки"
  - id: EG-PERF-03
    name: "Хвост прокрутки после шага колеса (медиана), мс"
    group: perf
    modes: [desk, mob]
    metric: scroll.tail_ms_median
    op: "<="
    threshold: 1000
    severity: S
    source: "E 05-motion/01 и токен motion.marketing.duration.settle-max 1000; E/02 (Lenis 800–1050 мс на шаг); C (живые сайты 0,8–1,4 с)"
    label: "[проверено: E/02] [данные: C]"
    site: "—"
    fix: "Lenis только на L2 и с lerp ≥ 0,15 (токен scroll.lenis-lerp; замер S1 2026-09-25: 0,12 — 1 094–1 125 мс, 0,15 — 896 мс); на L0–L1 — родная прокрутка"
  - id: EG-PERF-04
    name: "Частота кадров rAF при прокрутке"
    group: perf
    modes: [desk, mob]
    levels: [L1, L2]
    metric: scroll.fps
    op: ">="
    threshold_ref: budgets.effects.scroll_fps_min
    severity: D
    source: "A ambition-levels.yaml budgets.effects.scroll_fps_min (30 / 50) — величина слоя подачи; F 03-effects-lab-method: в лаборатории все эффекты дают 60 — не критерий"
    label: "[гипотеза] [проверено: F — не различает]"
    site: "—"
  - id: EG-PERF-05
    name: "TBT до прокрутки (зеркало ворот site)"
    group: perf
    modes: [desk, mob]
    metric: vitals.tbt_ms
    op: "<="
    threshold_ref: profile.outcome.tbt_ms_lab.<device>.goal
    severity: D
    source: "профиль страницы site budgets.yaml outcome.tbt_ms_lab (цель); blender 01/02 §8"
    label: "[документация] + [данные]"
    site: "= SG-PERF-05 (владелец site; у site — S)"
  - id: EG-PERF-06
    name: "LCP в лаборатории без троттлинга сети (зеркало, мс)"
    group: perf
    modes: [desk, mob]
    metric: vitals.lcp_ms
    op: "<="
    threshold_ref: profile.outcome.lcp_ms_lab.<device>.goal
    severity: D
    source: "профиль страницы site budgets.yaml outcome.lcp_ms_lab (цель, мс); сеть не замедляется — методика site (1,6 Мбит/с, RTT 150) строже"
    label: "[гипотеза]"
    site: "= SG-PERF-01/02 (владелец site, методика page_accept --throttle)"
  - id: EG-PERF-07
    name: "H1 первого экрана выпал из LCP (крупнее LCP-элемента, но не он)"
    group: perf
    modes: [desk, mob]
    metric: vitals.h1_lcp_dropped
    op: "false"
    severity: S
    where: vitals.lcp_sel
    source: "E/01: H1 из opacity 0, за маской строк или скрытый скриптом — не кандидат LCP в Chromium 153, LCP уходит на лид в 5× меньше"
    label: "[проверено: 99-raw/experiments/E/01-lcp-reveal]"
    site: "= SG-PERF-06 v1.2 (S) — владелец site"
    fix: "H1 без анимации или только transform ≤ 24 px; split по строкам без overflow: hidden; reduce — видно с первого кадра"
  - id: EG-PERF-08
    name: "LCP-элемент — canvas"
    group: perf
    modes: [desk, mob]
    metric: vitals.lcp_canvas
    op: "false"
    severity: B
    source: "CRV-AL-04; blender 09/05 §7.2 №1; blender 01/04 A/04"
    label: "[проверено] у соседей"
    site: "= SG-PERF-06 (B)"
  - id: EG-PERF-09
    name: "Есть хотя бы одна запись LCP (не всё появляется из opacity: 0)"
    group: perf
    modes: [desk, mob]
    metric: vitals.lcp_entries
    op: ">="
    threshold: 1
    severity: B
    source: "page_accept.py verdict: «нет ни одной записи LCP (всё появляется из opacity 0?)»; E/01"
    label: "[проверено] у ai-media"
    site: "= SG-PERF-06 (B «LCP нет»)"
  - id: EG-PERF-10
    name: "H1 невидим в первом кадре (opacity 0 на DOMContentLoaded)"
    group: perf
    modes: [desk, rm]
    metric: vitals.h1_first_frame_invisible
    op: "false"
    severity: {L0: S, L1: S, L2: D}
    source: "E/01; CRV-AL-09 (LCP-элемент не анимируется из opacity: 0); на L2 — только если LCP-элемент другой (постер) и H1 — не LCP"
    label: "[проверено: E/01]"
    site: "дополняет SG-PERF-06"
  - id: EG-PERF-11
    name: "CLS страницы: наибольшее окно сессии (загрузка + прокрутка), с атрибуцией узлов (зеркало)"
    group: perf
    modes: [desk, mob]
    metric: cls.window_max
    op: "<="
    threshold: 0.1
    severity: D
    where: cls.top_sources
    source: "web.dev CLS (окно сессии: разрыв < 1 с, окно ≤ 5 с); F2/12 cls_sources.py (причины в лаборатории: pin через fixed 0,35–0,99, подпись, вставленная скриптом, подмена латинского подмножества шрифта 0,15); motion_check 0.1.2 — cls.load, cls.scroll, cls.total, cls.top_sources (узел, откуда → куда)"
    label: "[документация] + [проверено: F2/12]"
    site: "= SG-PERF-03 (владелец site); наша добавка — атрибуция: какой эффект сдвигает"
    fix: "размеры медиа и шрифтов до загрузки (preload обоих подмножеств шрифта), вставки скриптом — в зарезервированное место, pin — pinType: 'transform' или sticky"

  # ------------------------------------------------------------------ WEIGHT — вес и цена эффектов
  - id: EG-WEIGHT-01
    name: "JS эффектов и движения (br) до первого взаимодействия"
    group: weight
    modes: [desk, mob]
    metric: net.js_effects_first_kb
    op: "<="
    threshold_ref: budgets.effects.js_presentation_kb_br
    severity: S
    spec_override: budget.js_kb_br_effects_max
    where: net.effects_js
    source: "G 07/02 §5–6 и ворота G (1); A budgets.effects.js_presentation_kb_br (L0 20, L1 100, L2 150/200); G/01 (gsap+ST 39,7 КБ br, «набор Awwwards» 52,4)"
    label: "[проверено: G/01] + [гипотеза: порог]"
    site: "часть SG-WEIGHT-03 (JS первого экрана — все источники)"
    fix: "загрузчик [data-effect] с динамическим импортом за 200 px до экрана (G/03); тяжёлое — только в init() через прокладку"
  - id: EG-WEIGHT-02
    name: "JS и wasm подачи: wasm-рантаймы 2D (dotLottie, Rive) за сессию, КБ"
    group: weight
    modes: [desk, mob]
    metric: net.wasm_presentation_kb
    op: "<="
    threshold_ref: budgets.effects.wasm_presentation_kb_br
    severity: S
    where: net.wasm_presentation
    source: "A budgets.effects.wasm_presentation_kb_br — числа нет (null): порог даст пилот с Lottie или Rive; веса рантаймов — 07-stack-implementation/stack.yaml (dotLottie ≈ 379 КБ br, Rive 272–613); JS их загрузчиков — в EG-WEIGHT-01, wasm и JS 3D — EG-WEIGHT-11"
    label: "[открыто: число — пилот]"
    site: "слой budgets.yaml layers.wasm_first_screen_kb (отдельно от JS первого экрана); с публичного CDN — EG-WEIGHT-10"
  - id: EG-WEIGHT-03
    name: "Число WebGL-контекстов"
    group: weight
    modes: [desk, mob]
    metric: derived.webgl_contexts
    op: "<="
    threshold_ref: budgets.effects.webgl_contexts
    severity: S
    source: "A budgets.effects.webgl_contexts (L0 0, L1 1, L2 1/2)"
    label: "[решение уровня] + [гипотеза]"
    site: "—"
  - id: EG-WEIGHT-04
    name: "Видео первого экрана без действия пользователя, КБ"
    group: weight
    modes: [desk, mob]
    metric: net.video_first_kb
    op: "<="
    threshold_ref: budgets.effects.video_first_screen_kb
    severity: S
    source: "A budgets.effects.video_first_screen_kb (L0 300 — только синемаграф, L1 600/1500 — петля hero, L2 1000/2500 — C: 15 из 49 эффектных страниц > 5 МБ видео до прокрутки)"
    label: "[данные: ai-media 01/02 §4.3] + [гипотеза K для L2]"
    site: "SG-WEIGHT-09 показывает отдельно (D; S — одно видео больше всего первого экрана)"
    fix: "постер + видео 720p на телефоне, preload=metadata, запуск по видимости; сюжетное видео — по клику"
  - id: EG-WEIGHT-05
    name: "Видео за сессию без кликов, МБ"
    group: weight
    modes: [desk, mob]
    levels: [L1, L2]
    metric: net.video_session_mb
    op: "<="
    threshold_ref: budgets.effects.video_autoplay_session_mb
    severity: S
    source: "A budgets.effects.video_autoplay_session_mb (L1 2/5, L2 4/10); ai-media 01/02 §4.3"
    label: "[данные] + [практика]"
    site: "часть SG-WEIGHT-02"
  - id: EG-WEIGHT-06
    name: "Видео за сессию на L0, КБ (только тихий синемаграф)"
    group: weight
    modes: [desk, mob]
    levels: [L0]
    metric: net.video_session_kb
    op: "<="
    threshold_ref: budgets.effects.video_autoplay_kb
    severity: S
    source: "A levels[L0].allowed quiet-loop ≤ 300 КБ; сюжетное видео — по клику"
    label: "[проверено] у ai-media + [гипотеза]"
    site: "—"
  - id: EG-WEIGHT-07
    name: "Шрифты за сессию, КБ (зеркало)"
    group: weight
    modes: [desk, mob]
    metric: net.font_kb
    op: "<="
    threshold_ref: profile.weight.fonts_kb.<device>
    severity: D
    source: "профиль страницы site budgets.yaml weight.fonts_kb (150 / 250 / 300; у article-page — исключение); Web Almanac 2025"
    label: "[данные]"
    site: "= SG-WEIGHT-04 (владелец site)"
  - id: EG-WEIGHT-08
    name: "Первый экран, КБ (зеркало)"
    group: weight
    modes: [desk, mob]
    metric: net.first_kb
    op: "<="
    threshold_ref: profile.weight.first_screen_kb.<device>
    severity: D
    source: "профиль страницы site budgets.yaml weight.first_screen_kb (с --page-type — с исключениями overrides); окно motion_check — load + окно первого экрана budgets.yaml conditions.first_screen"
    label: "[данные] [спорно]"
    site: "= SG-WEIGHT-01 (владелец site, S по профилю)"
  - id: EG-WEIGHT-09
    name: "Сессия без кликов, КБ (зеркало)"
    group: weight
    modes: [desk, mob]
    metric: net.session_kb
    op: "<="
    threshold_ref: profile.weight.session_kb.<device>
    severity: D
    source: "профиль страницы site budgets.yaml weight.session_kb"
    label: "[данные] [гипотеза]"
    site: "= SG-WEIGHT-02 (владелец site)"
  - id: EG-WEIGHT-10
    name: "Код эффектов, wasm и 3D с публичных CDN (jsDelivr, unpkg, cdnjs, esm.sh, Unicorn, Spline)"
    group: weight
    modes: [desk, mob]
    metric: net.cdn
    op: "empty"
    severity: S
    where: net.cdn
    source: "ворота G (3): самохостинг библиотек и wasm (setWasmUrl); CDN — лишнее соединение, приватность и отказ при блокировке домена"
    label: "[практика] G 07/02"
    site: "дополняет SG-WEIGHT-05/06 (сторонние домены и байты) и SG-LEGAL-07"
  - id: EG-WEIGHT-11
    name: "JS и wasm 3D (three, OGL, pixi, Spline, Unicorn, декодеры) за сессию, КБ"
    group: weight
    modes: [desk, mob]
    metric: net.js_3d_session_kb
    op: "<="
    threshold_ref: budgets.effects.js_3d_kb_br
    severity: S
    source: "A budgets.effects.js_3d_kb_br (L0 0, L1 200/300, L2 250/350); blender A/03 (three core 109, R3F + drei + post 345 КБ br); wasm декодеров 3D (Draco, Basis, meshopt) — здесь же"
    label: "[данные] [спорно] у blender"
    site: "SG-WEIGHT-08: доля 3D — ворота blender, не страницы"

  # ------------------------------------------------------------------ A11Y — движение и доступность (WCAG 2.2.2, 2.3.1, 2.3.3)
  - id: EG-A11Y-01
    name: "Первый экран движется на 6-й секунде, а кнопки паузы или переключателя движения нет (WCAG 2.2.2)"
    group: a11y
    modes: [desk, mob]
    metric: derived.moving_6s_without_pause
    op: "false"
    limits: {moving_pct_min: 0.5}   # «движется»: ≥ 0,5 % пикселей за 1 с (канал > 12/255) или играет видео; так же считает page_accept.py
    severity: B
