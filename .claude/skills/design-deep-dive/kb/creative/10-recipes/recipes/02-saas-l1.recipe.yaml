# Рецепт 02 · Лендинг SaaS · L1 — машиночитаемая часть 10-recipes/02-saas-l1.md
recipe_version: "0.1"
id: recipe:saas-l1
title_ru: "Лендинг SaaS, L1 — продукт в движении: интерфейс сам делает работу по прокрутке"
status: verified
checked_at: "2026-09-25"
site_type: saas-marketing-site
page_type: landing-saas
level: L1
level_why: "умолчание лендинга; одна сцена показывает работу продукта"
budget_profile: landing-saas@L1
when: ["продукт можно показать действием за 5–6 шагов", "трафик поиск и соцсети, регистрация пробного периода"]
not_when: ["горячий мобильный трафик на тарифы — L0", "продукт без наглядного действия — L0 + скриншоты"]
inputs:
  site_example: "../site/10-playbooks-contracts/examples/saas-okoshko/plans/home.yaml"
  playbook: "../site/10-playbooks-contracts/02-playbooks-landings.md#4"
  art_direction_example: "01-creative-direction/examples/art-direction-okoshko.json"
  copy_deck_example: "../text/10-templates-recipes/examples/ru-okoshko-saas.yaml"
  treatment_example: "09-ai-execution-evaluation/examples/okoshko-home.treatment.yaml"
  motion_spec_example: "10-recipes/examples/l1-sverka/motion-spec.yaml"
concept:
  thesis: "Движется только сверка: платежи банка встают напротив своих счетов, линии связывают пары, один платёж остаётся красным."
  story: {hero: "бухгалтер малого бизнеса", conflict: "триста строк выписки сверяются руками", resolution: "сервис оставляет одну строку расхождения"}
  signature_move: "sticky-книга сверки 150vh на CSS scroll-driven: пары сходятся по прокрутке"
  directions: ["A «Книга учёта на холодной бумаге» (выбран)", "B «Табло» — тёмный, моно для данных", "C «Канон SaaS» — отклонён (почерк генератора)"]
ledger:
  paper: mid
  display_style: serif
  accent_hue: cool
  macrostructure: workbench
  hero_architecture: stacked-center
  main_technique: "effect:pin-scrub-story"
  motion_signature: {entrances: "fade-up только hero; сцена — sweep строк", tempo: measured, curve: linear-scrub}
  corner_language: soft
moodboard:
  - {role: product, query: "интерфейс сверки, реальные состояния", take: "пусто → в работе → готово", dont_take: "дашборд с графиками ни о чём"}
  - {role: type, ref: "04-visual-language/cyrillic-display-fonts.yaml#literata", take: "антиква для заголовков и сумм", dont_take: "курсивный акцент в H1"}
  - {role: motion, ref: "03-live-sites-measured/sites.csv#linear-home", take: "тихая страница, одна сцена", dont_take: "появление всех секций"}
page_plan:
  macrostructure: workbench
  first_screen_policy: offer-cta
  length: "9 секций (норма 7–11)"
  sections:
    - {id: header, block: "block:header", role: header, level: L0, visual_role: chrome}
    - {id: hero, block: "block:hero-text", role: hero, level: L1, visual_role: accent, effects: ["effect:hero-entrance-once"], copy_slots: [eyebrow, headline, subheadline, cta-label, cta-note], reduce: final-state}
    - {id: product-demo, block: "block:product-showcase", role: product-demo, level: L1, visual_role: peak, effects: ["effect:pin-scrub-story", "effect:svg-line-draw", "effect:counter-up"], assets: [screenshot], reduce: final-state, mobile: "строки 54 px, сцена 130vh"}
    - {id: proof-stats, block: "block:stat-strip", role: proof-stats, level: L0, visual_role: calm, copy_slots: [stat-value, stat-label]}
    - {id: how-it-works, block: "block:steps", role: how-it-works, level: L0, visual_role: support}
    - {id: pricing, block: "block:pricing-cards", role: pricing, level: L0, visual_role: calm}
    - {id: faq, block: "block:faq", role: faq, level: L0, visual_role: calm, effects: ["effect:details-accordion"]}
    - {id: final-cta, block: "block:cta-band", role: final-cta, level: L0, visual_role: calm}
    - {id: footer, block: "block:footer", role: footer, level: L0, visual_role: chrome}
motion:
  thesis: "Движется только сверка по прокрутке; остальная страница стоит."
  primitives: [fade-up, line-draw, number-tick]
  peaks: [product-demo]
  accents: [hero]
  toggle: none
  smooth_scroll: false
  transitions: none
  loops_in_view_max: 0
  motion_spec_example: "10-recipes/examples/l1-sverka/motion-spec.yaml"
stack:
  library: [css]
  js_first_kb_br: 0
  notes: "sticky + view-timeline; счётчик — стопка цифр с animation-range (не @property + counter(): WebKit 26.6 не обновляет); GSAP — только если сцена шире секции или синхронна с WebGL"
  platforms: {tilda: "сцену — T123 (CSS) или Zero On Scroll; проверка на опубликованной", static: "как пример 10-recipes/examples/l1-sverka"}
assets:
  - {slot: screenshot, ladder: text, source: code, note: "HTML-фрагмент интерфейса, без рамки устройства"}
  - {slot: og-image, ladder: image, source: template, task_codes: [IMG-TEXT-CYR], budget_kb: 300}
copy:
  promise: "выписка сходится со счетами сама"
  slots: [eyebrow, headline, subheadline, cta-label, cta-note, stat-value, stat-label, step-title, step-body, pricing-price, faq-q, faq-a]
  deck_example: "../text/10-templates-recipes/examples/ru-okoshko-saas.yaml"
  rules: ["H1 ≤ 36 знаков, ≤ 3 строки", "цифры доверия без счётчика", "демо-данные интерфейса помечены"]
budget:
  js_presentation_kb_br: {mobile: 100, desktop: 100, example: 0}
  first_screen_mb: {mobile: 2.0, desktop: 3.5, example: 0.236}
  session_mb: {mobile: 5, desktop: 10, example: 0.236}
  fonts_kb: {mobile: 250, desktop: 250, example: 229.9}
  source: "ambition-levels.yaml L1; пример — прогон motion_check 0.1.3"
gates:
  tools: ["motion_check.py --level L1 --spec", "marketing_audit.py --level L1"]
  must_pass: [EG-PERF-02, EG-PERF-07, EG-A11Y-06, EG-A11Y-10, EG-A11Y-17, EG-FB-02, EG-WEIGHT-01, EG-WEIGHT-07]
  watch: ["шрифты у предела 250 КБ", "станции sticky-сцены — долей at и кадром"]
  manual: ["WebKit: var() в animation-range — кадры (WebKit 26.6 Playwright — сверено; Safari на устройстве — живая фаза)"]
decisions:
  - {id: d-frame, technique: "cliche:dashboard-in-browser-frame", decision: avoid, why: "интерфейс — живой HTML без рамки устройства"}
  - {id: d-serif, technique: "cliche:cream-serif-terracotta", decision: twist, why: "антиква — язык книги учёта, бумага холодная серая, акцент зелёный"}
  - {id: d-accent-word, technique: "cliche:accent-word-headline", decision: avoid, why: "в H1 нет выделенного слова, цвет — только у статусов"}
  - {id: d-mono, technique: "cliche:mono-captions", decision: avoid, why: "суммы антиквой с табличными цифрами, моно не нужен"}
errors: ["скриншот в рамке браузера", "появление тарифов и FAQ", "ScrollTrigger pin ради одной сцены (42 КБ, CLS 1,6–2,0)", "начальное состояние вне @supports", "счётчик пользователей в hero"]
example:
  path: "10-recipes/examples/l1-sverka/"
  result: "motion_check L1: FAIL 0 (B 0, S 0, D 0) — на 0.1 (N/A 2; моменты 3/3 PASS) и перепрогон на 0.1.3, ворота v0.2, после счётчика стопкой цифр (N/A 5; сверка spec — 9 FAIL станций ложные: цель внутри sticky-слоя, кадрами 1 · 3 · 5 совпало)"
