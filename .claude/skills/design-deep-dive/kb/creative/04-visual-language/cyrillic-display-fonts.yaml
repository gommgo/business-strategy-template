# cyrillic-display-fonts.yaml — display-гарнитуры с кириллицей для маркетинговых страниц: лицензия, оси, качество кириллицы,
# замеренные метрики, роли. creative-research · 04-visual-language · волна 1 · агент D · 2026-09-24.
#
# Как читать. default_or_option: default — открытая (OFL) и годится по экспертизе или замеру (решение заказчика 13: по умолчанию
# открытые); option — платная, по решению заказчика и после покупки веб-лицензии; caution — брать с оговоркой из quality.note;
# avoid — кириллица плохая по экспертизе (использовать нельзя без явного решения арт-директора).
# quality.source: tt:<эпизод> — type.today «Кириллица в Google Fonts» (Струков, Остроменцкий, Рудерман; дата эпизода);
# ui — ../ui/02-typography/01-font-selection.md §3.2 (там же эпизоды tt-neo 19.03.2024 и tt-humanist 27.06.2024);
# none — экспертной рецензии нет, оценка по замеру D/02 и образцу (sheet_chromium.jpg) — [не проверено экспертом].
# metrics (опыт D/02, Chromium 153, вес display из weight_tested): k — средняя ширина знака русского заголовка, em (для формулы
# кегля 01-display-typography.md §2.3); xh — высота строчных, em; lh_floor_lc / lh_floor_caps — минимальный интерлиньяж без
# касания «чернил» (строчные: б й ё ф над р у д щ ц; прописные: Ё Й над Д Ц Щ); tracking_touch — трекинг (em), при котором у–х
# касаются (тест «ухо», пиксельный, 240 px): трекинг display не ниже tracking_touch + 0,005.
# Технические данные (подмножества, оси, версии) — fontsource API (GF), снято 2026-09-24.

version: 1
status: draft
checked_at: "2026-09-24"
owner: "creative-research · 04-visual-language · D (волна 1)"
sources:
  - "type.today: display (04.11.2025), display2 (16.01.2026), geo (11.02.2021), old-style (01.06.2021), transitional (02.11.2021), gfdidones (11.07.2023) — 99-raw/cache/type.today_ru_journal_*"
  - "ui-research 02-typography/01-font-selection.md §2.6–3.4 (tt-neo, tt-humanist, метрики S24)"
  - "fontsource API v1 /fonts?subsets=cyrillic и /variable/<id> — 99-raw/cache/fontsource_fonts.json, 99-raw/experiments/D/02-cyrillic-display-fonts/meta/"
  - "опыт D/02: 99-raw/experiments/D/02-cyrillic-display-fonts/results_table.json, touch_chromium.json"
  - "type.today: Druk, Graphik, Stratos (страницы гарнитур, 2026-09-24); лицензии — type.today/ru/journal/whytheprice, typetype.org/licensing"
schema:
  fields: [id, family, source, license, web_license, default_or_option, class, display_style, axes, weights, italic, cyrillic, quality, metrics, weight_tested, good_for, pair_with, notes]
  cyrillic: "full = cyrillic + cyrillic-ext (украинский, казахский и др.); basic = только cyrillic (русский, белорусский, сербский базово)"
  good_for: "hero | section | stat | quote | footer-wordmark | body (body — только если годится для текста)"

