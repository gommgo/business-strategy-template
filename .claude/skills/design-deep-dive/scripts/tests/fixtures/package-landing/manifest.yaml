# Фикстура package-landing — иллюстрация для самопроверок scripts/project/ready.py и design_audit.py: лендинг promo
# фикстуры input-landing, приведённый к раскладке проекта для структурного аудита. Правки ведут ссылки брифа, смысла,
# иерархий, голоса и плана главной в файлы проекта; главная — план в работе (proposed) без copy deck. Свои файлы —
# страница «спасибо»: утверждённый план, copy deck по слотам этого плана (тексты — черновик агента, assumed; ссылок на
# факты нет — демо-факт в закрытом copy deck сеет package-landing-defects) и каркас плана ассетов (plan_to_assets.py
# build, draft). design_audit check — 0 error; ready build → check — 0. Формат манифеста — докстринг
# fixture_project.py.
example: true
description: >-
  лендинг promo для манифеста готовности и аудита: ссылки файлов — по раскладке проекта, страница «спасибо» с планом и
  copy deck, сошедшимися по слотам
project: otves-remont-nn
extends: [input-landing]
unmarked: [files/site/promo/copy/spasibo.yaml]   # copy deck — в форме, которую читает copydeck.py
layers:
  - drop: [site/promo/copy/home.yaml]
  - files: files
  - replace:
      site/promo/site-brief.yaml:
        - {find: "  facts_ref: ../../../../text/02-strategy-messaging/examples/facts-service-renovation.yaml\n",
           to: "  facts_ref: ../../facts.yaml\n"}
        - {find: "  proof_ref: ../../../../text/02-strategy-messaging/examples/facts-service-renovation.yaml\n",
           to: "  proof_ref: ../../facts.yaml\n"}
      site/promo/meaning.yaml:
        - {find: "proof_ref: \"facts-service-renovation.yaml\"\n", to: "proof_ref: \"../../facts.yaml\"\n"}
      site/promo/hierarchy/home-product-aware.yaml:
        - {find: "meaning_ref: meaning-otves.yaml\n", to: "meaning_ref: ../meaning.yaml\n"}
      site/promo/hierarchy/home-problem-aware.yaml:
        - {find: "meaning_ref: meaning-otves.yaml\n", to: "meaning_ref: ../meaning.yaml\n"}
      voice.yaml:
        - {find: "  meaning_ref: \"../../02-strategy-messaging/examples/meaning-otves.yaml\"\n",
           to: "  meaning_ref: \"site/promo/meaning.yaml\"\n"}
        - {find: "  facts_ref: \"../../02-strategy-messaging/examples/facts-service-renovation.yaml\"\n",
           to: "  facts_ref: \"facts.yaml\"\n"}
      site/promo/plans/home.yaml:
        - {find: "\nstatus: approved\n", to: "\nstatus: proposed\n"}
        - {find: "  facts: ../../../../../text/02-strategy-messaging/examples/facts-service-renovation.yaml\n",
           to: "  facts: ../../../facts.yaml\n"}
        - {find: "  copy_deck: ../copy/home.yaml\n", to: "  treatment: ../../../design/promo/art-direction.json\n"}
