  - {id: q-estimate-changes, q: "Что в договоре о смене сметы: сумма фиксирована или меняется по согласованию? Можно процитировать пункт?", why: "Главный страх клиентов — растущая смета", options: ["фиксирована, кроме допработ по письменному согласию", "меняется при изменении цен материалов", "другое"], default: "О неизменной смете не пишем; пишем только «смета — часть договора»", affects: [objections, positioning.value_themes], priority: 1, asked: true}
  - {id: q-competitors, q: "С кем вас чаще всего сравнивают клиенты и почему выбирают вас (или уходят к ним)?", why: "Без альтернатив отличие не проверить", options: [], default: "Сравниваем с частными бригадами и «ведением ремонта самому», студии не называем", affects: [positioning.alternatives, sophistication], priority: 1, asked: true}
  - {id: q-segments, q: "Кто ваши клиенты чаще: вторичка или новостройки без отделки? Какая площадь типична?", why: "От этого зависит главный сегмент и примеры на странице", options: ["вторичка", "новостройки", "поровну"], default: "Основной — вторичка, 40–80 м²; новостройки — вторичный сегмент", affects: [audience], priority: 2, asked: true}
  - {id: q-payment, q: "Как устроена оплата: предоплата, по этапам, после приёмки?", why: "Снимает страх «возьмут деньги и пропадут»", options: ["по этапам после приёмки", "предоплата 30 %, остальное по этапам", "другое"], default: "Об оплате не пишем до ответа", affects: [risk_reversal, objections], priority: 2, asked: true}
  - {id: q-min-job, q: "С какого объёма работ вы берёте заказ?", why: "Честный ответ на «возьмётесь ли за ванную»", options: ["от квартиры целиком", "от одной комнаты с полной отделкой", "от санузла"], default: "В FAQ: «делаем полный ремонт квартиры; отдельные помещения — уточните при звонке»", affects: [objections, boundaries], priority: 3, asked: true}

