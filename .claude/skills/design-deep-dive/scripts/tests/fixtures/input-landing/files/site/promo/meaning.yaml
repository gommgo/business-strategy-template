# meaning-otves.yaml — пример 1: смысл для лидогенерации услуги (ремонт квартир под ключ), приоритет 1 заказчика
# Формат: ../meaning.schema.yaml (meaning_version 1)
#
# ВЫМЫШЛЕННАЯ студия «Отвес» (Нижний Новгород) — та же, что в ../examples/facts-service-renovation.yaml (B2): факты и
# их id — оттуда. Вход — сообщение заказчика (ai-self).
# Что показывает пример: вывод позиционирования из короткого брифа; basis у каждого утверждения; допущения → вопросы;
# уникальное свойство без документа — needs-proof; возражения с доказательствами из facts.yaml и с missing, которых в
# инвентаре ещё нет (предложения B2 — x-missing-proposals). Иерархии страниц — hierarchy-otves-*.yaml.

meaning_version: 1
date: "2026-09-24"
status: proposed
site: otves-remont-nn

offering_summary:
  text: >-
    Ремонт квартир под ключ в Нижнем Новгороде: замер и смета бесплатно, работы по договору подряда с гарантией 3 года,
    объект от замера до сдачи ведёт один прораб. Цена работ — от 9 800 ₽ за м² без материалов.
  kind: service
  basis: {kind: brief, ref: "сообщение заказчика, 2026-09-24 (experiments/B1/01 §3)"}

audience:
  - id: busy-owners
    name: "Владельцы квартиры, которые не могут стоять над ремонтом"
    primary: true
    role: buyer-user
    characteristics:
      - "работают полный день и не могут ездить на объект"
      - "на время ремонта живут в другом месте (аренда, родители) — каждая неделя задержки стоит денег"
      - "делают ремонт впервые или раз в десять лет и не знают, как его проверять"
      - "готовы платить за предсказуемость, а не за минимальную цену за метр"
    situation: "Когда купили или освободили квартиру и надо сделать полный ремонт за 1,5–3 месяца, а времени следить за бригадой нет"
    trigger: "Страшные истории знакомых о затянутом ремонте; близкий срок переезда; неудачный опыт с частной бригадой"
    knows: >-
      Знает, что нужен ремонт под ключ, и слышал, что бригады срывают сроки и раздувают смету; сравнивает цены за метр;
      «Отвес» знает, если пришёл с Яндекс Карт или по рекомендации.
    jobs:
      - {id: job-renovate-on-time, type: functional, statement: "Когда делаю ремонт, хочу получить квартиру в срок и в сумму из договора, чтобы вовремя переехать и не доплачивать аренду", priority: 1, basis: {kind: fact, ref: "fact:review-anna-k — «на три дня раньше, чем в договоре… Смета не выросла»"}}
      - {id: job-control-remotely, type: functional, statement: "Когда не могу приезжать на объект, хочу видеть, что сделано за день, чтобы не бояться обмана", priority: 1, basis: {kind: brief, ref: "«клиенты хвалят, что видят всё по фото»"}}
      - {id: job-no-conflicts, type: social, statement: "Когда в доме идёт мой ремонт, хочу, чтобы соседи не жаловались, чтобы жить с ними дальше без ссор", priority: 3, basis: {kind: fact, ref: "fact:review-igor-pending (разрешения нет — только как голос клиента)"}}
      - {id: job-peace-of-mind, type: emotional, statement: "Когда отдаю крупные деньги, хочу знать, к кому прийти, если что-то пойдёт не так", priority: 2, basis: {kind: inferred, ref: "гарантия 3 года как козырь заказчика; страхи в потребительских гидах (Т—Ж, 2019)"}}
    pains:
      - {id: pain-budget-grows, text: "Смета растёт по ходу ремонта: «тут непредвиденное», «тут материал подорожал»", severity: high, job_ref: job-renovate-on-time, basis: {kind: fact, ref: "fact:review-anna-k («Смета не выросла ни на рубль» — клиент отмечает как редкость)"}}
      - {id: pain-delays, text: "Срок срывается, а аренда и ипотека идут одновременно", severity: high, job_ref: job-renovate-on-time, basis: {kind: inferred, ref: "характеристика «живут в другом месте»"}}
      - {id: pain-blind, text: "Не видно, что происходит на объекте, пока не приедешь; приезжать некогда", severity: high, job_ref: job-control-remotely, basis: {kind: brief, ref: "«видят всё по фото» — ценят именно это"}}
      - {id: pain-rework, text: "Криво сделали — переделывать за свой счёт или искать, с кого спросить", severity: medium, job_ref: job-peace-of-mind, basis: {kind: inferred, ref: "гарантия как главный довод заказчика"}}
      - {id: pain-neighbours, text: "Грязь в подъезде и шум — жалобы соседей", severity: low, job_ref: job-no-conflicts, basis: {kind: fact, ref: "fact:review-igor-pending (как голос клиента, без публикации)"}}
    gains:
      - {id: gain-move-in-date, text: "Заехать в дату из договора", measure: "дни просрочки против договора (в кейсе — на 3 рабочих дня раньше)", job_ref: job-renovate-on-time, basis: {kind: fact, ref: "fact:case-two-room-47-days"}}
      - {id: gain-known-total, text: "Знать итоговую сумму до начала работ", measure: "разница между сметой в договоре и итогом", job_ref: job-renovate-on-time, basis: {kind: assumption, question_id: q-estimate-changes}}
      - {id: gain-see-progress, text: "Видеть ход работ с телефона, не приезжая", measure: "сколько раз пришлось ехать на объект «проверить»", job_ref: job-control-remotely, basis: {kind: brief, ref: "«видят всё по фото»"}}
      - {id: gain-one-contact, text: "Один человек отвечает за всё — от замера до сдачи", job_ref: job-peace-of-mind, basis: {kind: brief, ref: "«объект ведёт один человек от замера до сдачи»"}}
    current_alternative_ids: [alt-private-crew, alt-self-managed, alt-other-studios]
    basis: {kind: inferred, ref: "бриф: «дешёвые заказы не берём» + козыри «прораб», «видят по фото», «гарантия»"}
  - id: new-build-owners
    name: "Владельцы новостройки без отделки"
    primary: false
    role: buyer-user
    situation: "Когда получили ключи от квартиры без отделки и хотят въехать как можно быстрее"
    jobs:
      - {id: job-first-renovation, type: functional, statement: "Когда получаю ключи от новостройки, хочу ремонт с нуля за один подход, чтобы въехать и не жить в стройке", priority: 1, basis: {kind: assumption, question_id: q-segments}}
    pains:
      - {id: pain-new-build-noise, text: "Весь дом ремонтируется, бригады нарасхват, сроки плывут", severity: medium, basis: {kind: assumption, question_id: q-segments}}
    gains:
      - {id: gain-fast-move, text: "Въехать в свою квартиру в назначенный месяц", basis: {kind: assumption, question_id: q-segments}}
    basis: {kind: assumption, question_id: q-segments}

awareness:
  level: solution-aware
  basis: {kind: inferred, ref: "основной будущий трафик — Директ по запросам «ремонт квартир под ключ нижний новгород» (знает решение, выбирает исполнителя)"}
  confidence: medium
  by_source:
    - {source: paid-search, level: solution-aware, note: "категорийные запросы с городом"}
    - {source: search-problem, level: problem-aware, note: "«как контролировать ремонт, если нет времени», «бригада затянула ремонт» — статьи и SEO-страницы"}
    - {source: maps-local, level: product-aware, note: "увидел карточку и рейтинг на Яндекс Картах"}
    - {source: search-brand, level: product-aware, note: "«Отвес ремонт отзывы» — проверяет перед звонком"}
    - {source: referral, level: product-aware, note: "рекомендация знакомых"}

sophistication:
  stage: 4
  claims_heard:
    - "ремонт под ключ"
    - "гарантия на работы"
    - "в срок и без доплат"
    - "фиксированная смета"
    - "опытные мастера, свой прораб"
    - "бесплатный замер"
  basis: {kind: assumption, question_id: q-competitors}

traffic:
  ref: "/traffic"
  sources:
    - {source: paid-search, temperature: warm, share: 0.5, device: mixed, promise_of_source: "объявление Директа: «Ремонт квартир под ключ в Нижнем Новгороде — смета бесплатно» (черновик, подтвердить)"}
    - {source: maps-local, temperature: hot, share: 0.25, device: mobile, promise_of_source: "карточка организации: рейтинг, фото, «ремонт квартир»"}
    - {source: referral, temperature: hot, share: 0.15, device: mobile}
    - {source: search-problem, temperature: cold, share: 0.1, device: mixed, promise_of_source: "заголовок статьи или SEO-страницы о контроле ремонта"}

positioning:
  alternatives:
    - {id: alt-private-crew, name: "Частная бригада по знакомству или с досок объявлений", kind: hire-someone, why_used: "дешевле за метр, «договоримся на словах»", limits: "нет договора и гарантии, контролировать самому, бригада может исчезнуть", mention_on_page: as-approach, basis: {kind: brief, ref: "«дешёвые заказы не берём» — заказчик теряет эту аудиторию сознательно"}}
    - {id: alt-self-managed, name: "Вести ремонт самому: нанимать мастеров по отдельности, закупать материалы", kind: diy-manual, why_used: "полный контроль, экономия на посреднике", limits: "нужны время и знания; каждый мастер отвечает только за своё", mention_on_page: as-approach, basis: {kind: inferred, ref: "типовой путь при ремонте (Т—Ж, «Как выбрать бригаду…», 2019)"}}
    - {id: alt-other-studios, name: "Другие студии ремонта под ключ в Нижнем Новгороде", kind: competitor-direct, why_used: "те же обещания, иногда дешевле", limits: "неизвестно — вопрос заказчику", mention_on_page: never, basis: {kind: assumption, question_id: q-competitors}}
    - {id: alt-postpone, name: "Отложить или ограничиться косметикой", kind: do-nothing, why_used: "страшно и дорого", limits: "жить в неудобной квартире; ремонт всё равно придётся делать", mention_on_page: never, basis: {kind: inferred, ref: "Dunford: «ничего не делать» — частая альтернатива"}}
  unique_attributes:
    - {id: attr-one-foreman, attribute: "Один прораб ведёт объект от замера до сдачи", versus: [alt-private-crew, alt-self-managed], proof_status: needs-proof, proof_ids: ["missing:foreman-per-object", "fact:foreman-lapin"], basis: {kind: brief, ref: "«объект ведёт один человек от замера до сдачи» — слова заказчика; в facts.yaml есть прораб (fact:foreman-lapin), но не само правило"}}
    - {id: attr-photo-reports, attribute: "Ход работ виден по фото каждый день, не приезжая на объект", versus: [alt-private-crew, alt-self-managed, alt-other-studios], proof_status: needs-proof, proof_ids: ["fact:review-anna-k", "missing:photo-report-process"], basis: {kind: fact, ref: "fact:review-anna-k — один отзыв; правило ли это для всех объектов — вопрос q-photo-reports"}}
    - {id: attr-contract-guarantee, attribute: "Договор подряда с гарантией 3 года на работы (п. 7.2)", versus: [alt-private-crew, alt-self-managed], proof_status: has-proof, proof_ids: ["fact:guarantee-3-years"], basis: {kind: fact, ref: "fact:guarantee-3-years"}}
    - {id: attr-track-record, attribute: "12 лет и 1 146 сданных квартир в одном городе", versus: [alt-private-crew, alt-other-studios], proof_status: has-proof, proof_ids: ["fact:flats-completed", "fact:company-since-2014", "fact:rating-yandex-maps"], basis: {kind: fact, ref: "fact:flats-completed"}}
  value_themes:
    - id: val-control-without-visits
      theme: "Ремонт идёт под присмотром, даже когда вы на работе"
      from_attributes: [attr-one-foreman, attr-photo-reports]
      chain:
        - {attribute_ref: attr-one-foreman, benefit: "один ответственный вместо пяти мастеров", value: "не нужно самому координировать и проверять"}
        - {attribute_ref: attr-photo-reports, benefit: "видно, что сделано за день", value: "не надо ездить на объект, чтобы убедиться"}
      customer_measure: "сколько раз пришлось приехать или звонить «узнать, как дела» (против частной бригады)"
      pain_refs: [pain-blind]
      gain_refs: [gain-see-progress, gain-one-contact]
      proof_ids: ["missing:foreman-per-object", "fact:foreman-lapin", "fact:review-anna-k", "missing:photo-report-process"]
    - id: val-predictable
      theme: "Срок и сумма зафиксированы в договоре, работа — на гарантии 3 года"
      from_attributes: [attr-contract-guarantee, attr-one-foreman]
      chain:
        - {attribute_ref: attr-contract-guarantee, benefit: "письменные обязательства и пункт о гарантии", value: "есть к кому прийти, если что-то отвалится через год"}
      customer_measure: "дни просрочки и рубли сверх сметы (кейс: 47 рабочих дней при 50 по договору)"
      pain_refs: [pain-delays, pain-budget-grows, pain-rework]
      gain_refs: [gain-move-in-date, gain-known-total]
      proof_ids: ["fact:guarantee-3-years", "fact:case-two-room-47-days", "missing:estimate-change-policy"]
    - id: val-proven-locally
      theme: "Проверено тысячей квартир в вашем городе"
      from_attributes: [attr-track-record]
      customer_measure: "рейтинг и число оценок на Яндекс Картах против других студий"
      pain_refs: [pain-rework]
      proof_ids: ["fact:flats-completed", "fact:rating-yandex-maps", "fact:company-since-2014"]
  best_fit:
    segment_ids: [busy-owners]
    characteristics: ["не может бывать на объекте чаще раза в неделю", "платит аренду или ипотеку во время ремонта", "квартира 40–80 м², полный ремонт"]
    why_care: "Для них каждая неделя задержки и каждая поездка «проверить» стоят денег и нервов — присмотр и договор ценнее низкой цены за метр."
  market_category:
    name: "ремонт квартир под ключ в Нижнем Новгороде"
    strategy: head-to-head
    reference_leader: "крупные студии ремонта города и частные бригады с досок объявлений"
    assumptions_true: ["всё делают сами, от черновых работ до чистовой отделки", "есть договор и смета", "есть замер"]
    assumptions_false: ["материалы входят в цену (у «Отвеса» — нет: цена работ без материалов)", "берут любые объёмы, в том числе одну комнату"]
    basis: {kind: inferred, ref: "локальный рынок услуг без явного лидера (Dunford: head-to-head возможен, если чёткого победителя нет); критерии выбора сдвигаем с цены за метр на присмотр и договор"}
  statement:
    template: moore
    internal_only: true
    text: >-
      Для владельцев квартир в Нижнем Новгороде, которым некогда следить за ремонтом и которых не устраивает частная
      бригада «на словах», «Отвес» — ремонт под ключ, при котором объект от замера до сдачи ведёт один прораб, а срок и
      сумма зафиксированы в договоре с гарантией 3 года. В отличие от частной бригады, у нас договор, гарантия и 12 лет в
      городе; в отличие от ведения ремонта самому — один ответственный вместо пяти мастеров.
  only_we_can_say:
    - claim: "1 146 квартир в Нижнем Новгороде с 2014 года"
      proof_ids: ["fact:flats-completed"]
      checked_against: [alt-private-crew, alt-other-studios]

value_proposition:
  core:
    text: "Ремонт под ключ для тех, кому некогда следить: объект ведёт один прораб, срок и смета в договоре, гарантия 3 года — вместо частной бригады «на словах»."
    basis: {kind: inferred, ref: "value_themes val-control-without-visits + val-predictable"}
  pain_relievers:
    - {id: pr-foreman, text: "Прораб — один ответственный за объект и за мастеров", pain_refs: [pain-blind, pain-rework], proof_ids: ["missing:foreman-per-object", "fact:foreman-lapin"]}
    - {id: pr-contract, text: "Договор подряда: этапы, срок, смета; гарантия 3 года", pain_refs: [pain-delays, pain-rework, pain-budget-grows], proof_ids: ["fact:guarantee-3-years", "missing:estimate-change-policy"]}
  gain_creators:
    - {id: gc-photos, text: "Фотоотчёт о сделанном за день", gain_refs: [gain-see-progress], proof_ids: ["missing:photo-report-process"]}
    - {id: gc-free-estimate, text: "Бесплатные замер и смета — сумма известна до договора", gain_refs: [gain-known-total], proof_ids: ["fact:estimate-free"]}
  forces:
    push:
      - {text: "Близкий срок переезда; аренда и ипотека одновременно", basis: {kind: inferred, ref: "характеристики сегмента"}}
      - {text: "Страшные истории о ремонтах у знакомых", basis: {kind: inferred, ref: "Т—Ж, 2019: «Как строительные бригады обманывают заказчиков»"}}
    pull:
      - {text: "Представить, что ремонт идёт, а ты на работе и видишь всё по фото", basis: {kind: brief, ref: "«видят всё по фото»"}}
      - {text: "Заехать в дату из договора", basis: {kind: fact, ref: "fact:case-two-room-47-days"}}
    anxiety:
      - {text: "Смета вырастет по ходу", objection_ids: [obj-budget-grows]}
      - {text: "Возьмут предоплату и затянут", objection_ids: [obj-trust, obj-delays]}
      - {text: "Переплачу за «студию» против частника", objection_ids: [obj-price]}
    habit:
      - {text: "«Найду бригаду по знакомству, как все»", objection_ids: [obj-diy-crew]}
      - {text: "«Сделаю пока косметику, потом разберусь»", objection_ids: [obj-timing]}
  fit_status: hypothesis

offer:
  ref: "/offer"
  summary: "Бесплатный выезд замерщика и смета; при договоре до 31 октября 2026 года — скидка 10 % на работы."
  proof_ids: ["fact:estimate-free", "fact:promo-october-10"]
  risk_reversal_ids: [rr-free-estimate, rr-guarantee]

conversion:
  action_ref: "request-measurement"
  secondary_goal: "Сохранить или отправить домашним пример сметы и договора, чтобы вернуться после обсуждения"

objections:
  - id: obj-price
    text: "Дорого: частники берут меньше за метр"
    type: price
    force: anxiety
    segment_ids: [busy-owners]
    severity: major
    answer: "Цена работ — от 9 800 ₽/м² без материалов, и в неё входят прораб, договор и гарантия 3 года; точную сумму показываем в бесплатной смете до договора."
    proof_ids: ["fact:price-from-per-m2", "fact:estimate-free", "fact:guarantee-3-years"]
    where: [{section_role: pricing, slot_type: pricing-price-note}, {section_role: faq}]
    awareness_stage: product-aware
    status: answered
    basis: {kind: brief, ref: "«дешёвые заказы не берём»"}
  - id: obj-budget-grows
    text: "Смета вырастет по ходу, «всплывут» доплаты"
    type: risk
    force: anxiety
    severity: blocker
    answer: "Смета — часть договора; что меняет сумму и как это согласуется — написать по договору (не обещать «смета никогда не меняется»)."
    proof_ids: ["missing:estimate-change-policy", "fact:review-anna-k"]
    where: [{section_role: how-it-works}, {section_role: guarantee}, {section_role: faq}]
    awareness_stage: solution-aware
    status: needs-proof
    basis: {kind: fact, ref: "fact:review-anna-k; never_claim B2 nc-no-extra-cost-promise"}
  - id: obj-delays
    text: "Затянут срок, а у меня аренда"
    type: time
    force: anxiety
    severity: blocker
    answer: "Срок — в договоре по этапам; пример: двушка 54 м² за 47 рабочих дней при 50 по договору."
    proof_ids: ["fact:case-two-room-47-days", "missing:deadline-terms"]
    where: [{section_role: case-studies}, {section_role: how-it-works}]
    awareness_stage: solution-aware
    status: answered
    basis: {kind: fact, ref: "fact:case-two-room-47-days"}
  - id: obj-trust
    text: "Кто вы такие? Возьмут предоплату и пропадут"
    type: trust
    force: anxiety
    severity: blocker
    answer: "С 2014 года в Нижнем Новгороде, 1 146 квартир, 4,8 из 5 на Яндекс Картах; реквизиты в подвале; оплата поэтапно (подтвердить)."
