# ПРИМЕР v1 · план шаблона direction (service-page, L0); факты — демо.
page_plan_version: '1'
checked: '2026-09-24'
status: approved
example: true
site: stalkon
refs:
  brief: ../site-brief.yaml
  facts: ../facts.yaml
  site_map: ../site-map.yaml
  blocks: ../../../../04-blocks/blocks.yaml
  vocabulary: ../../../../02-site-types/vocabulary.yaml
  lead_forms: ../../../../05-conversion-funnels/lead-forms.yaml
  events: ../../../../07-seo-geo-performance-analytics/events.yaml
  head_kit: ../../../../07-seo-geo-performance-analytics/head-kit.yaml
  budgets: ../../../../07-seo-geo-performance-analytics/budgets.yaml
  legal_requirements: ../../../../08-legal-trust-a11y/legal-requirements.yaml
page:
  id: direction
  page_type: service-page
  template: true
  template_id: direction
  lang: ru
  locale: ru-RU
  jurisdiction:
  - ru
  goal: 'direction: запрос расчёта или переход к нужному разделу'
  primary_action: request-quote
  cta_target:
    kind: route
    value: /zapros-rascheta/
  awareness: solution-aware
  awareness_basis:
    from: assumption
    rule: уровень по главному источнику страницы (C 01 §3.1)
  traffic:
  - traffic_source: search-category
    temperature: warm
    device: desktop
  - traffic_source: paid-search
    temperature: warm
    device: desktop
  macrostructure: long-document
  macrostructure_family: document
  first_screen_policy: offer-cta
  budget_profile: service-page@L0
  ambition_level: L0
  navigation:
    header: site
    archetype: two-tier
    logo_link: /
    breadcrumbs: true
    local_nav:
      kind: siblings
      sticky: false
    footer: site
  seo:
    indexable: true
    canonical: self
    h1: hero.headline
    structured_data:
    - Service
    - BreadcrumbList
    ssr_required: true
    sitemap: true
  legal:
    pd_consent: checkbox-and-link
    privacy_policy: /politika-konfidencialnosti/
    cookie_banner: required
    cookie_mode: opt-in
    analytics_before_consent: false
    withdraw_link: footer
    requisites: both
    operator_ref: fact:company-requisites
    requirements:
    - req:LR-RU-01
    - req:LR-RU-02
    - req:LR-RU-03
    - req:LR-RU-04
    - req:LR-RU-05
    - req:LR-RU-06
    - req:LR-RU-07
    - req:LR-RU-09
    - req:LR-RU-10
    - req:LR-RU-13
  analytics:
    systems:
    - yandex-metrica
    goals:
    - request-quote
    load_after_consent: true
sections:
- id: header
  role: header
  question: где я и куда дальше
  job: шапка сайта two-tier из site-map.chrome
  block: header
  variant: site-nav
  next_step: шапка и подвал сайта
  slots:
    text:
    - id: nav-link
      slot: nav-label
      intent: 'nav-label: по иерархии сообщений text'
    - id: cta-label
      slot: cta-label
      intent: 'cta-label: по иерархии сообщений text'
    media:
    - id: logo
      slot: brand-logo
      media_role: informational
      goal: показать brand-logo
      source: generate
      authenticity: real-or-generated
    action:
    - id: cta
      slot: cta-primary
      action: request-quote
      style: primary
      target:
        kind: anchor
        value: '#lead-form'
      event: event:cta-click
      label: cta-label
    - id: phone
      slot: phone-link
      action: call
      style: channel
      target:
        kind: tel
        value: tel:+79000000002
      event: event:phone-click
- id: breadcrumbs
  role: header
  question: где я в иерархии
  job: путь наверх
  block: breadcrumbs
  variant: full-path
  next_step: шапка и подвал сайта
  slots:
    text:
    - id: current
      slot: nav-label
      intent: 'nav-label: по иерархии сообщений text'
    - id: crumb-1-label
      slot: nav-label
      anatomy: crumb.label
      group: crumb-1
      intent: 'nav-label: по иерархии сообщений text'
    - id: crumb-2-label
      slot: nav-label
      anatomy: crumb.label
      group: crumb-2
      intent: 'nav-label: по иерархии сообщений text'
    action:
    - id: crumb-1-link
      slot: link
      anatomy: crumb.link
      group: crumb-1
      action: read-more
      style: link
      target:
        kind: anchor
        value: '#lead-form'
    - id: crumb-2-link
      slot: link
      anatomy: crumb.link
      group: crumb-2
      action: read-more
      style: link
      target:
        kind: anchor
        value: '#lead-form'
- id: hero
  role: hero
  question: делаете ли вы мой тип объекта
  job: заголовок страницы и путь дальше
  block: hero-text
  variant: statement-cta
  next_step: главное действие страницы
  slots:
    text:
    - id: headline
      slot: headline
      heading: h1
      intent: 'headline: по иерархии сообщений text'
- id: case-studies
  role: case-studies
  question: что похожего построили
  job: проекты направления (related_rules)
  block: case-cards
  variant: grid
  next_step: главное действие страницы
  slots:
    text:
    - id: title
      slot: section-title
      heading: h2
      intent: 'section-title: по иерархии сообщений text'
    - id: case-1-title
      slot: case-title
      anatomy: case.title
      group: case-1
      heading: h3
      intent: 'case-title: по иерархии сообщений text'
    - id: case-1-result
      slot: case-result
      anatomy: case.result
      group: case-1
      intent: 'case-result: по иерархии сообщений text'
    - id: case-2-title
      slot: case-title
      anatomy: case.title
      group: case-2
      heading: h3
      intent: 'case-title: по иерархии сообщений text'
    - id: case-2-result
      slot: case-result
      anatomy: case.result
      group: case-2
      intent: 'case-result: по иерархии сообщений text'
    data:
    - id: case-1-case
      slot: case-ref
      anatomy: case.case
      group: case-1
      fact: fact:case-warehouse
      binds:
      - case-1-title
    - id: case-2-case
      slot: case-ref
      anatomy: case.case
      group: case-2
      fact: fact:case-bridge
      binds:
      - case-1-title
- id: how-it-works
  role: how-it-works
  question: как вы работаете
  job: 'этапы: расчёт, КМД, изготовление, монтаж'
  block: steps
  variant: vertical
  next_step: главное действие страницы
  slots:
    text:
    - id: title
      slot: section-title
      heading: h2
      intent: 'section-title: по иерархии сообщений text'
    - id: step-1-title
      slot: step-title
      anatomy: step.title
      group: step-1
      heading: h3
      intent: 'step-title: по иерархии сообщений text'
    - id: step-1-body
      slot: step-body
      anatomy: step.body
      group: step-1
      intent: что происходит, сколько длится, что получает клиент
    - id: step-2-title
      slot: step-title
      anatomy: step.title
      group: step-2
      heading: h3
      intent: 'step-title: по иерархии сообщений text'
    - id: step-2-body
      slot: step-body
      anatomy: step.body
      group: step-2
      intent: что происходит, сколько длится, что получает клиент
    - id: step-3-title
      slot: step-title
      anatomy: step.title
      group: step-3
      heading: h3
      intent: 'step-title: по иерархии сообщений text'
    - id: step-3-body
      slot: step-body
      anatomy: step.body
      group: step-3
      intent: что происходит, сколько длится, что получает клиент
- id: awards-press
  role: awards-press
  question: есть ли допуски
  job: СРО и сертификаты с номерами
  block: credentials
  variant: list-with-numbers
  next_step: главное действие страницы
  slots:
    text:
    - id: title
      slot: section-title
      heading: h2
      intent: 'section-title: по иерархии сообщений text'
    - id: doc-1-name
      slot: card-title
      anatomy: doc.name
      group: doc-1
      heading: h3
      intent: 'card-title: по иерархии сообщений text'
    - id: doc-1-details
      slot: card-body
      anatomy: doc.details
      group: doc-1
      intent: номер, кем выдан, срок действия
    data:
    - id: doc-1-credential
      slot: credential-ref
      anatomy: doc.credential
      group: doc-1
      fact: fact:certificate-sro
      binds:
      - doc-1-name
- id: lead-form
  role: lead-form
  question: сколько будет стоить
  job: запрос расчёта по объекту
  block: lead-form
  variant: short
  next_step: главное действие страницы
  slots:
    text:
    - id: title
      slot: form-title
      heading: h2
      intent: 'form-title: по иерархии сообщений text'
    - id: lead
      slot: form-lead
      intent: 'form-lead: по иерархии сообщений text'
    - id: cta-label
      slot: cta-label
      intent: 'cta-label: по иерархии сообщений text'
    - id: consent
      slot: form-consent
      intent: 'form-consent: по иерархии сообщений text'
    - id: next-steps
      slot: form-next-steps
      intent: 'form-next-steps: по иерархии сообщений text'
    - id: success
      slot: form-success
      intent: 'form-success: по иерархии сообщений text'
    action:
    - id: form
      slot: form
      action: request-quote
      form:
        ref: lead-forms.yaml#quote-request
        consent: separate-checkbox
        marketing_consent: false
        success: thank-you-page
        thank_you_page: /zapros-rascheta/spasibo/
      event: event:quote-submit
- id: footer
  role: footer
  question: кто компания, документы, разделы
  job: 'подвал сайта: группы разделов, реквизиты, правовые ссылки'
  block: footer
  variant: site
  next_step: шапка и подвал сайта
  slots:
    text:
    - id: legal
      slot: footer-legal
      intent: 'footer-legal: по иерархии сообщений text'
    - id: privacy-label
      slot: nav-label
      intent: подписи правовых ссылок
    - id: nav-1-label
      slot: nav-label
      anatomy: nav.label
      group: nav-1
      intent: 'nav-label: по иерархии сообщений text'
    - id: nav-2-label
      slot: nav-label
      anatomy: nav.label
      group: nav-2
      intent: 'nav-label: по иерархии сообщений text'
    - id: nav-3-label
      slot: nav-label
      anatomy: nav.label
      group: nav-3
      intent: 'nav-label: по иерархии сообщений text'
    data:
    - id: company
      slot: fact-ref
      fact: fact:company-requisites
      anatomy: company
      binds:
      - legal
    action:
    - id: privacy
      slot: link
      action: read-more
      style: link
      target:
        kind: anchor
        value: '#lead-form'
    - id: nav-1-link
      slot: link
      anatomy: nav.link
      group: nav-1
      action: read-more
      style: link
      target:
        kind: anchor
        value: '#lead-form'
    - id: nav-2-link
      slot: link
