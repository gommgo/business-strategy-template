# Фикстура input-site — иллюстрация для самопроверки scripts/project/canvas_input.py и прогонов входа холста
# многостраничника: вымышленная металлоконструкторская компания «Сталькон» (пример site corporate-b2b-stalkon) —
# бриф, карта сайта, 15 планов страниц, факты и бренд примера, план ассетов главной, спецификация движения главной
# creative; голос — пример text (B2B-профиль) как голос демо-продукта. Свои файлы — vision.md и реестр поверхностей
# (поверхность corp, web рода site). Планы утверждены правкой статуса; copy deck у страниц нет — вход wireframe даёт
# предупреждения о текстах. Формат манифеста — докстринг fixture_project.py.
example: true
description: многостраничник corp (web рода site) — бриф, карта сайта, 15 планов, факты, бренд, ассеты и движение главной
project: stalkon
