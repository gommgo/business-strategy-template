# Фикстура package-cabinet — иллюстрация для самопроверок scripts/project/ready.py и design_audit.py: кабинет office
# целиком — экраны фикстуры cabinet, демо-набор и утверждённая часть текстов фикстуры cabinet-demo, ДС фикстуры
# cabinet-ds, свой файл ARTIFACTS.md (тот же, что у input-cabinet) — основа пакета на утверждённых текстах: все строки
# texts.md поверхности office — approved, вход mockup проходит гейт текстов. Ещё одна правка: у бренда снята ссылка
# voice_ref на профиль голоса, которого в проекте нет (voice_ref необязателен по схеме бренда). design_audit check —
# 0 error; ready build → check — 0. Формат манифеста — докстринг fixture_project.py.
example: true
description: кабинет office целиком — экраны, демо-набор, утверждённые тексты, ДС; бренд без ссылки на голос, которого нет
project: otves-office
extends: [cabinet-ds, cabinet-demo]
layers:
  - files: files
  - replace:
      screens/office/texts.md:
        - {find: "| `checked` |\n", to: "| `approved` |\n", count: 45}
      design/brand.yaml:
        - {find: "voice_ref: ../voice.yaml\n", to: ""}
