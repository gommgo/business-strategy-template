<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Текстовое поле</title>
</head>
<body>
<!-- Иллюстрация фикстуры cabinet-ds: образец на каждое состояние; data-state — состояние словаря компонентов. -->
<div class="ds-states" style="padding: 24px; display: grid; gap: 12px;">
  <input class="input" type="text" value="Сормово, ул. Коминтерна" data-state="rest">
  <input class="input" type="text" value="Сормово, ул. Коминтерна" data-state="hover">
  <input class="input" type="text" value="Сормово, ул. Коминтерна" data-state="focus-visible">
  <input class="input" type="text" value="Сормово, ул. Коминтерна" data-state="disabled">
  <input class="input" type="text" value="Сормово, ул. Коминтерна" data-state="readonly">
  <input class="input" type="text" value="Сормово, ул. Коминтерна" data-state="invalid">
</div>
</body>
</html>
