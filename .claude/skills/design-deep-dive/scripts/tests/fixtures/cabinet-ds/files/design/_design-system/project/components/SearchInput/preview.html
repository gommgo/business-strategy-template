<!-- @dsCard group="Ввод и выбор" height=240 subtitle="Покой, наведение, фокус, неактивно" -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поиск</title>
</head>
<body>
<!-- Иллюстрация фикстуры cabinet-ds: образец на каждое состояние; data-state — состояние словаря компонентов. -->
<div class="ds-states" style="padding: 24px; display: grid; gap: 12px;">
  <input class="input input--search" type="search" placeholder="Номер, клиент или адрес" data-state="rest">
  <input class="input input--search" type="search" placeholder="Номер, клиент или адрес" data-state="hover">
  <input class="input input--search" type="search" placeholder="Номер, клиент или адрес" data-state="focus-visible">
  <input class="input input--search" type="search" placeholder="Номер, клиент или адрес" data-state="disabled">
</div>
</body>
</html>
