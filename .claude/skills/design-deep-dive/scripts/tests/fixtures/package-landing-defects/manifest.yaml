    site/promo/plans/spasibo.yaml:
    - find: "      fact: missing:legal-details\n"
      to: "      fact: fact:legal-details\n"
    voice.yaml:
    - find: "    - {surface: marketing-site, voice: brand}\n"
      to: "    - {surface: marketing-site, voice: brand}\n    - {surface: product-ui, voice: product, note: \"кабинет клиента\
        \ — голос продукта\"}\n"
    site/promo/copy/spasibo.yaml:
    - find: |
        # ru-otves-case.yaml — пример copy deck v1.1 (10-templates-recipes, J3, 2026-09-24): страница кейса (case-page) «Отвеса».
