projections:
  tone_of_voice: "На «вы», по-соседски тепло и с цифрами: срок в рабочих днях, пункт договора, имя прораба. Без эмодзи, штампов и шуток о деньгах."
  brand_voice:
    tone: "тепло и по делу, как хороший прораб с хозяином квартиры"
    use: ["двушка", "хозяин квартиры", "рабочие дни", "по договору", "замерщик"]
    avoid: ["любой сложности", "команда профессионалов", "индивидуальный подход", "качественно", "лучший", "ремонт мечты"]
  prompt_brief: >-
    Голос «Отвеса»: хороший прораб говорит с хозяином квартиры. На «вы», о себе — «мы». Каждое обещание — с фактом из
    facts.yaml: срок в рабочих днях, цена «от» и «без материалов», гарантия 3 года по п. 7.2 договора. Людей — по именам
    (Сергей Лапин, Анна К.), отзыв не правим. Разговорные слова клиента можно («двушка», «замерщик»), канцелярит и штампы
    категории нельзя («любой сложности», «команда профессионалов», «качественно»). Сцена — только из факта. Эмодзи нет,
    «!» — не больше одного на страницу и не в заголовке. Не шутим о цене, сроках и гарантии. Нет факта — [PLACEHOLDER].

