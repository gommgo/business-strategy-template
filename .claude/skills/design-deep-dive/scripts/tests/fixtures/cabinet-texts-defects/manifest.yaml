# Фикстура cabinet-texts-defects — иллюстрация для самопроверки copy_lint.py в жанре interface: чистый реестр фикстуры
# cabinet-texts и четыре посеянных дефекта межстрочных проверок ux 07/06 §7.3, по одной находке на дефект (правило и
# тяжесть — в комментарии правки). Других находок на реестре нет.
example: true
description: реестр текстов кабинета с посеянными дефектами — синоним объекта, два имени действия, смешение знака диапазона
project: otves-office
extends: [cabinet-texts]
layers:
  - replace:
      screens/office/texts.md:
        # an-ui-object-alias error: синоним объекта request из aliases object.md («лид»)
        - {find: "| Здесь появятся заявки с сайта и из звонков — первую можно создать",
           to: "| Здесь появятся лиды с сайта и из звонков — первый можно создать"}
        # an-ui-action-synonym error: запрещённый синоним действия complete из banned action.md («завершить»)
        - {find: "отметка замера уйдёт", to: "завершение замера уйдёт"}
        # an-ui-action-name warning: второе имя действия create в потоке — корень не из verb и past («Оформляем»)
        - {find: "| Создаём заявку |", to: "| Оформляем заявку |"}
        # an-ui-formats warning: смешение знака диапазона — «—» в одной строке против «–» в двух
        - {find: "| {date} ночью кабинет будет недоступен — плановые работы |",
           to: "| {date} с {from}—{to} кабинет будет недоступен — плановые работы |"}
