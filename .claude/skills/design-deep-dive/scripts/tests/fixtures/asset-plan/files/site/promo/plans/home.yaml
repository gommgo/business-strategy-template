# ПРИМЕР v1 · план главной (лендинг); подача — treatment creative.
page_plan_version: '1'
checked: '2026-09-24'
status: proposed
example: true
site: otves-remont-nn
refs:
  brief: ../site-brief.yaml
  brief_page: /pages/list/0
  facts: ../../../../../text/02-strategy-messaging/examples/facts-service-renovation.yaml
  meaning: ../site-brief.yaml#/meaning
  hierarchy:
  - ../../../../../text/02-strategy-messaging/examples/hierarchy-otves-product-aware.yaml
  - ../../../../../text/02-strategy-messaging/examples/hierarchy-otves-problem-aware.yaml
  blocks: ../../../../04-blocks/blocks.yaml
  vocabulary: ../../../../02-site-types/vocabulary.yaml
  lead_forms: ../../../../05-conversion-funnels/lead-forms.yaml
  events: ../../../../07-seo-geo-performance-analytics/events.yaml
  legal_requirements: ../../../../08-legal-trust-a11y/legal-requirements.yaml
  head_kit: ../../../../07-seo-geo-performance-analytics/head-kit.yaml
  budgets: ../../../../07-seo-geo-performance-analytics/budgets.yaml
  asset_plan: ../../../design/promo/assets/plans/home.yaml
  copy_deck: 'copy-deck: ждём text (заглушка — ../stubs-sisters.yaml)'
page:
  id: home
  page_type: landing-lead-services
  template: false
  url: /
  lang: ru
  locale: ru-RU
  jurisdiction:
  - ru
  goal: Заявки на бесплатный замер от владельцев квартир 40–80 м² под полный ремонт в Нижнем Новгороде
  primary_action: booking
  secondary_actions:
  - call
  - message
  - download
  cta_target:
    kind: anchor
    value: '#zamer'
  secondary_goal: Сохранить или переслать домашним пример сметы и договора, чтобы вернуться после обсуждения (meaning.conversion.secondary_goal)
  awareness: solution-aware
  awareness_basis:
    from: brief-main-sources
    main_sources:
    - paid-search
    - maps-local
    - referral
    by_source:
    - traffic_source: paid-search
      awareness: solution-aware
      share: 0.5
    - traffic_source: maps-local
      awareness: product-aware
      share: 0.25
    - traffic_source: referral
      awareness: product-aware
      share: 0.15
    rule: 'Порядок — под solution-aware (Директ, доля 0,5). Для product-aware (карты и рекомендации, 0,4) рейтинг площадки — в первом
      экране, кейс и рейтинг — в первой половине. Отдельная страница не нужна: различается один признак из четырёх (C 02 §3.4)'
  traffic:
  - traffic_source: paid-search
    temperature: warm
    share: 0.5
    device: mixed
    promise_of_source: объявление Директа — текст не утверждён (бриф q-direct-ad)
  - traffic_source: maps-local
    temperature: hot
    share: 0.25
    device: mobile
    promise_of_source: 'карточка на Яндекс Картах: рейтинг, фото, «ремонт квартир»'
  - traffic_source: referral
    temperature: hot
    share: 0.15
    device: mobile
  macrostructure: split-studio
  macrostructure_family: document
  macrostructure_alternatives:
  - quiz-funnel
  - stat-led
  first_screen_policy: offer-cta
  first_screen:
    must_show:
    - hero.headline
    - hero.subheadline
    - hero.cta
    - hero.hero-proof
    - header.phone
    core_words_max: 40
    message_match:
    - traffic_source: paid-search
      promise: ремонт квартир под ключ в Нижнем Новгороде, цена за м², замер бесплатно
      match:
      - subject
      - geo
      - price
      - action
      slots:
      - hero.headline
      - hero.subheadline
      - hero.cta-label
    - traffic_source: maps-local
      promise: рейтинг на Яндекс Картах
      match:
      - subject
      - geo
      slots:
      - hero.hero-proof
    variant_map:
      param: utm_term
      render: server
      default: pod-klyuch
      variants:
      - id: pod-klyuch
        when:
        - ремонт квартир под ключ
        - ремонт под ключ
        slots:
        - hero.headline
      - id: tsena
        when:
        - ремонт квартир цена
        - стоимость ремонта квартиры
        slots:
        - hero.headline
        - hero.subheadline
      event_param: hero_variant (параметр события — P)
  length:
    sections_min: 8
    sections_max: 12
    basis: 'C 02 §1.3: ЛУ 8–12; дорогая услуга с высоким риском — к верхнему краю (12 секций без шапки и подвала)'
  budget_profile: landing-lead-services@L1
  ambition_level: L1
  navigation:
    header: landing-minimal
    archetype: minimal-cta
    anchor_nav: false
    logo_link: /
    breadcrumbs: false
    footer: minimal
  seo:
    indexable: true
    h1: hero.headline
    ssr_required: true
    notes: разметка (LocalBusiness, Service) — решение H (head-kit.yaml); Директ ведёт на канонический адрес с utm-метками
    canonical: self
    structured_data:
    - LocalBusiness
    - WebSite
    - Service
    sitemap: true
    hreflang: false
  legal:
    pd_consent: separate-document
    privacy_policy: /privacy
    cookie_banner: required
    cookie_mode: opt-in
    analytics_before_consent: false
    withdraw_link: footer
    ad_marking: false
    requisites: footer
    operator_ref: missing:legal-details
    requirements:
    - req:LR-RU-01
    - req:LR-RU-02
    - req:LR-RU-03
    - req:LR-RU-04
    - req:LR-RU-05
    - req:LR-RU-06
    - req:LR-RU-07
    - req:LR-RU-09
    - req:LR-RU-10
    - req:LR-RU-12
    - req:LR-RU-13
    - req:LR-RU-14
    - req:LR-RU-19
    - req:LR-RU-22
    notes: не юридическое заключение; без missing:legal-details (реквизиты) страница не публикуется; LR-RU-19 — объявления Директа маркируются
      сами
  analytics:
    systems:
    - yandex-metrica
    goals:
    - booking
    - call
    - message
    - download
    load_after_consent: true
    notes: id событий — P (events.yaml); вариант hero — параметр события
  treatment:
    art_direction_ref: ../../../../../creative/01-creative-direction/examples/art-direction-otves.json#/directions/0
    motion_level: expressive
    motion_system:
      thesis: 'Всё движение — вертикаль: линия-отвес опускается по этапам работы от замера до сдачи; остальное неподвижно и точно.'
      library:
      - css
      smooth_scroll: false
      page_transitions: none
      reduce_toggle: false
      entrance_system: 'только первый экран: заголовок и фото прораба один раз ≤ 500 мс; секции ниже без появления'
    theme: light
    peaks:
    - how-it-works
    status: draft
page_slots:
  text:
  - id: meta-title
    slot: meta-title
    intent: ремонт квартир под ключ в Нижнем Новгороде + цена от
  - id: meta-description
    slot: meta-description
    intent: замер и смета бесплатно, гарантия 3 года, рейтинг
  - id: og-title
    slot: og-title
  - id: og-description
    slot: og-description
  - id: og-image-alt
    slot: og-image-alt
  media:
  - id: og-image
    slot: og-image
    media_role: informational
    goal: превью ссылки для мессенджеров (рекомендации)
    source: template
    ratio:
      desktop: 1.91:1
    alt: og-image-alt
  data:
  - id: price
    slot: price-ref
    fact: fact:price-from-per-m2
    binds:
    - meta-title
  - id: guarantee
    slot: fact-ref
    fact: fact:guarantee-3-years
    binds:
    - meta-description
sections:
- id: announcement-bar
  role: header
  block: announcement-bar
  variant: static
  condition: до 2026-10-31 (fact:promo-october-10, valid.until); после даты секция снимается
  slots:
    text:
    - id: text
      slot: announcement
      intent: скидка 10 % на работы при договоре до 31 октября 2026
    action:
    - id: link
      slot: link
      action: view-pricing
      target:
        kind: anchor
        value: '#price'
      style: link
    data:
    - id: fact
      slot: fact-ref
      anatomy: fact
      fact: fact:promo-october-10
      binds:
      - text
      on_missing: omit-block
  mobile:
  - stack
  treatment:
    level: L0
    visual_role: chrome
    motion_level: none
  expires:
    fact: fact:promo-october-10
    then: hide
    note: 'акция до 2026-10-31 (valid.until факта): после — строка снимается'
- id: header
  role: header
  block: header
  variant: landing-minimal
  slots:
    text:
    - id: cta-label
      slot: cta-label
      intent: записаться на замер
    media:
    - id: logo
      slot: brand-logo
      media_role: informational
      source: customer-tbd
      note: 'логотипа нет (бриф q-brand): словесный знак'
    action:
    - id: cta
      slot: cta-primary
      action: booking
      target:
        kind: anchor
        value: '#zamer'
      style: primary
      label: cta-label
      event: event:cta-click
    - id: phone
      slot: phone-link
      action: call
      target:
        kind: tel
        value: tel:+79000000001
      style: channel
      event: event:phone-click
    - id: messenger
      slot: messenger-link
      action: message
      target:
        kind: messenger
        value: messenger:company-max
      style: channel
      event: event:messenger-click
  mobile:
  - stack
  notes:
    conversion: 'ЛУ: телефон и мессенджер — каналы целевого действия, не выходы'
    a11y: липкая ≤ 64 px; кнопка меню не нужна — меню нет
  events:
  - trigger: click
    target: cta
    action: booking
    event: event:cta-click
  - trigger: click
    target: phone
    action: call
    event: event:phone-click
  - trigger: click
    target: messenger
    action: message
    event: event:messenger-click
  treatment:
    level: L0
    visual_role: chrome
    motion_level: subtle
- id: hero
  role: hero
  question: Это ремонт под ключ в моём городе? Сколько стоит и можно ли им доверять?
  job: Сказать, что это ремонт квартир под ключ в Нижнем Новгороде с ценой «от» и бесплатным замером, показать рейтинг и дать записаться
  block: hero-media
  variant: split
  next_step: Состав работ (sostav) или сразу запись на замер (#zamer)
  objections:
  - obj-trust
  carries:
  - core
  mobile:
  - reframe
  - stack
  slots:
    text:
    - id: eyebrow
      slot: eyebrow
      intent: категория и город
    - id: headline
      slot: headline
      heading: h1
      intent: 'ремонт квартир под ключ: срок и смета — в договоре'
      variants: 2
    - id: subheadline
      slot: subheadline
      intent: от 9 800 ₽ за м² без материалов; замер и смета бесплатно
    - id: hero-proof
      slot: hero-proof
      intent: 4,8 из 5 на Яндекс Картах по 214 оценкам (на 1 сентября 2026)
    - id: cta-label
      slot: cta-label
      intent: записаться на бесплатный замер
    - id: cta-secondary-label
      slot: cta-secondary-label
      intent: посмотреть цены
    - id: cta-note
      slot: cta-note
      intent: замер ни к чему не обязывает; решение о договоре — после сметы
    - id: alt
      slot: image-alt
      intent: прораб на объекте — имя и роль
    media:
    - id: visual
      slot: hero-visual
      media_role: informational
      goal: 'прораб Сергей Лапин на объекте: «за ремонт отвечает один человек»'
      source: real
      authenticity: real-only
      task:
      - task:IMG-EDIT
      ratio:
        desktop: '1:1'
        mobile: '4:5'
      text_zone:
        side: none
      lcp_candidate: true
      loading: eager
      alt: alt
      note: фото заказчика assets/team/lapin.jpg (согласие на изображение — в факте); доводка кадра без изменения человека
    data:
    - id: rating
      slot: metric-ref
      anatomy: proof
      fact: fact:rating-yandex-maps
      binds:
      - hero-proof
      on_missing: omit-slot
    - id: price
      slot: price-ref
      fact: fact:price-from-per-m2
      binds:
      - subheadline
    - id: free
      slot: price-ref
      fact: fact:estimate-free
      binds:
      - subheadline
      - cta-note
      - cta-label
    - id: foreman
      slot: person-ref
      fact: fact:foreman-lapin
      binds:
      - visual
      - alt
    action:
    - id: cta
      slot: cta-primary
      action: booking
      target:
        kind: anchor
        value: '#zamer'
      style: primary
      label: cta-label
      event: event:cta-click
    - id: cta-secondary
      slot: cta-secondary
      action: view-pricing
      target:
        kind: anchor
        value: '#price'
      style: secondary
      label: cta-secondary-label
      event: event:cta-click
  treatment:
    level: L1
    visual_role: accent
    motion_level: subtle
    effects:
    - ref: effect:hero-entrance-once
      target: hero.headline
      trigger: load
      purpose: support
    background:
      kind: surface
      tone: light
    composition:
      align: left
      text_media: text-left
      bleed: edge
      height: partial
    display_role: display-l
    reduce:
      strategy: final-state
    mobile:
      strategy: simplified
      note: фото 4:5 под заголовком; вес первого экрана ≤ 1,5 МБ
    refs:
    - ref:example-hero-foreman
  notes:
    seo: H1 — категория и город словами запроса; вариант по utm_term — на сервере
    a11y: текст не поверх фото (split); контраст — creative
    conversion: микродоказательство у кнопки — рейтинг площадки с датой
  events:
  - trigger: view
    target: hero
    event: event:section-view
  - trigger: click
    target: cta
    action: booking
    event: event:cta-click
  - trigger: click
    target: cta-secondary
    action: view-pricing
    event: event:cta-click
- id: offer
  role: offer
  question: Что входит в ремонт под ключ за эти деньги — и что нет?
  job: Перечислить, что входит в работу и что оплачивается отдельно (материалы)
  block: offer-details
  variant: included-vs-not
  next_step: Сколько это будет стоить для моей квартиры (price)
  objections:
  - obj-price
  carries:
  - pl-offer
  mobile:
  - stack
  slots:
    text:
    - id: title
      slot: section-title
      heading: h2
      intent: что входит в ремонт под ключ
    - id: include-1-text
      slot: list-item
      anatomy: include.text
      group: include-1
      intent: выезд замерщика и смета до договора — бесплатно
    - id: include-2-text
      slot: list-item
      anatomy: include.text
      group: include-2
      intent: работы по договору подряда с гарантией 3 года
    - id: include-3-text
      slot: list-item
      anatomy: include.text
      group: include-3
      intent: этапы работ из договора — список даёт заказчик (open_questions)
    - id: exclude-1-text
      slot: list-item
      anatomy: exclude.text
      group: exclude-1
      intent: материалы — оплачиваются отдельно
    data:
    - id: free
      slot: price-ref
      fact: fact:estimate-free
      binds:
      - include-1-text
    - id: guarantee
      slot: fact-ref
      fact: fact:guarantee-3-years
      binds:
      - include-2-text
    - id: price
      slot: price-ref
      fact: fact:price-from-per-m2
      binds:
      - exclude-1-text
  notes:
    structure: 'у ЛУ состав и цена — 2–4-я секция (C/01: цена — медиана 0,31)'
  treatment:
    level: L0
    visual_role: calm
    motion_level: none
- id: pricing
  role: pricing
  anchor: price
  question: Сколько будет стоить моя квартира?
  job: Дать посчитать ориентир по площади и честно сказать, что точная сумма — в бесплатной смете
  block: calculator
  variant: estimate-only
  next_step: Записаться на замер, чтобы получить точную смету (#zamer)
  objections:
  - obj-price
  carries:
  - pl-offer
  mobile:
  - stack
  slots:
    text:
    - id: title
      slot: section-title
      heading: h2
      intent: сколько стоит ремонт под ключ
    - id: lead
      slot: form-lead
      intent: введите площадь — покажем ориентир «от»
    - id: result
      slot: result-summary
      intent: от N ₽ за работы без материалов; скидка 10 % до 31 октября — при договоре
    - id: disclaimer
      slot: disclaimer
      intent: ориентир по цене «от» за м²; точная сумма — в смете после замера
    - id: cta-label
      slot: cta-label
      intent: получить точную смету — записаться на замер
    data:
    - id: price-fact
      slot: price-ref
      anatomy: price-fact
      fact: fact:price-from-per-m2
      binds:
      - result
      - disclaimer
    - id: promo
      slot: price-ref
      fact: fact:promo-october-10
      binds:
      - result
      on_missing: omit-slot
    - id: payment
      slot: price-ref
      fact: missing:payment-stages
      binds:
      - disclaimer
      on_missing: placeholder
      note: как платится — блокирующий пробел (бриф q-payment)
    action:
    - id: params
      slot: form
      action: explore-product
      style: secondary
      form:
        fields_visible_max: 2
        steps: 1
        ref: lead-forms.yaml#calculator-inline
        consent: separate-checkbox
        success: inline
      note: 'поля: площадь м², тип работ — F'
      event: event:calculator-result
    - id: cta
      slot: cta-primary
      action: booking
      target:
        kind: anchor
        value: '#zamer'
      style: primary
      label: cta-label
      event: event:cta-click
  notes:
    a11y: итог — <output> в aria-live=polite
    conversion: расчёт без контакта; контакт — только для точной сметы
  events:
  - trigger: start
    target: params
    action: explore-product
    event: event:form-start
  - trigger: click
    target: cta
    action: booking
    event: event:cta-click
  treatment:
    level: L0
    visual_role: calm
    motion_level: none
    notes: калькулятор — секция конверсии, L0
- id: guarantee
  role: guarantee
  question: Что если после ремонта что-то пойдёт не так?
  job: Показать гарантию 3 года по договору рядом с ценой
  block: guarantee
  variant: near-price
  next_step: Записаться на замер (zamer)
  objections:
  - obj-diy-crew
  carries:
  - pl-contract
  mobile:
  - none
  slots:
    text:
    - id: title
      slot: section-title
      heading: h2
      intent: гарантия 3 года на работы
    - id: text
      slot: guarantee-text
      intent: на что гарантия, срок, где записано (пункт договора)
    data:
    - id: guarantee
      slot: fact-ref
      anatomy: guarantee
      fact: fact:guarantee-3-years
      binds:
      - text
    - id: change
      slot: fact-ref
      fact: missing:estimate-change-policy
      binds:
      - text
      on_missing: rewrite-without
      note: не обещать «смета не меняется» (never_claim)
  treatment:
    level: L0
    visual_role: support
    motion_level: subtle
    background:
      kind: inverse
      tone: dark
      text_contrast: aa
- id: lead-form
  role: lead-form
  anchor: zamer
  question: Как записаться на замер и что будет дальше?
  job: 'Принять заявку на бесплатный замер: имя, телефон, удобное время, согласие'
  block: lead-form
  variant: short
  next_step: Страница «спасибо» с тем, когда перезвонит прораб; или дальше читать, как идёт ремонт
  objections:
  - obj-trust
  carries:
  - pl-offer
  mobile:
  - stack
  slots:
    text:
    - id: title
      slot: form-title
      heading: h2
      intent: записаться на бесплатный замер
    - id: lead
      slot: form-lead
      intent: замер и смета бесплатно, ни к чему не обязывают
    - id: cta-label
      slot: cta-label
      intent: записаться на замер
    - id: consent
      slot: form-consent
      intent: отдельное согласие на обработку ПД для ответа на заявку (I)
    - id: next-steps
      slot: form-next-steps
      intent: прораб перезвонит и договорится о дне замера — срок ответа не подтверждён
    - id: success
      slot: form-success
    data:
    - id: free
      slot: price-ref
      anatomy: proof
      fact: fact:estimate-free
      binds:
      - lead
    action:
    - id: form
      slot: form
      action: booking
      target:
        kind: route
        value: /spasibo
      style: primary
      label: cta-label
      form:
        fields_visible_max: 3
        steps: 1
        consent: separate-checkbox
        success: thank-you-page
        thank_you_page: /spasibo
        ref: lead-forms.yaml#booking
        marketing_consent: false
      event: event:booking-complete
    - id: phone
      slot: phone-link
      action: call
      target:
        kind: tel
        value: tel:+79000000001
      style: channel
      event: event:phone-click
    - id: messenger
      slot: messenger-link
      action: message
      target:
        kind: messenger
        value: messenger:company-max
      style: channel
