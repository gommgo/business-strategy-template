open_questions:
- Реквизиты для подвала (missing:legal-details, blocking) — без них не публикуем (бриф q-legal-details)
- Порядок оплаты (missing:payment-stages, blocking) — в расчёте и FAQ заглушка (бриф q-payment)
- Состав работ под ключ списком — нет в facts.yaml; запросить через анкету text (proof-intake)
- Файл примера сметы и договора для второй цели — есть ли и можно ли публиковать
- Срок ответа на заявку (бриф q-response-time) — строка next-steps без срока до ответа
- Фото объектов «до/после» (missing:before-after-photos) — кейс без фото до ответа
- Текст объявлений Директа (бриф q-direct-ad) — варианты variant_map сверить с объявлениями
- Наборы полей формы и калькулятора — F (lead-forms.yaml); id событий — P (events.yaml); разметка — H; согласие и баннер — I
- 'q-zamer-slots: нет расписания замерщика → набор consultation-request вместо booking (lead-forms.yaml)'
