<!-- @dsCard group="Действия" height=320 subtitle="Покой, наведение, фокус, нажатие, неактивно, загрузка" -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кнопка</title>
</head>
<body>
<!-- Иллюстрация фикстуры cabinet-ds: образец на каждое состояние; data-state — состояние словаря компонентов. -->
<div class="ds-states" style="padding: 24px; display: grid; gap: 12px;">
  <button class="btn btn-primary" type="button" data-state="rest">Назначить замер</button>
  <button class="btn btn-primary" type="button" data-state="hover">Назначить замер</button>
  <button class="btn btn-primary" type="button" data-state="focus-visible">Назначить замер</button>
  <button class="btn btn-primary" type="button" data-state="active">Назначить замер</button>
  <button class="btn btn-primary" type="button" data-state="disabled">Назначить замер</button>
  <button class="btn btn-primary" type="button" data-state="loading">Назначить замер</button>
</div>
</body>
</html>
