<!-- @dsCard group="Ввод и выбор" height=200 subtitle="Покой, неактивно, ошибка" -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поле формы</title>
</head>
<body>
<!-- Иллюстрация фикстуры cabinet-ds: образец на каждое состояние; data-state — состояние словаря компонентов. -->
<div class="ds-states" style="padding: 24px; display: grid; gap: 12px;">
  <div class="field" data-state="rest"><label>Телефон</label><input class="input" type="tel"><span class="hint">Позвоним один раз, чтобы договориться о замере</span></div>
  <div class="field" data-state="disabled"><label>Телефон</label><input class="input" type="tel"><span class="hint">Позвоним один раз, чтобы договориться о замере</span></div>
  <div class="field" data-state="invalid"><label>Телефон</label><input class="input" type="tel"><span class="hint">Позвоним один раз, чтобы договориться о замере</span></div>
</div>
</body>
</html>
