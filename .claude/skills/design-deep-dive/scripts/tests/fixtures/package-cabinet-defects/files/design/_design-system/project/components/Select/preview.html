<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Выпадающий список</title>
</head>
<body>
<!-- Иллюстрация фикстуры cabinet-ds: образец на каждое состояние; data-state — состояние словаря компонентов. -->
<div class="ds-states" style="padding: 24px; display: grid; gap: 12px;">
  <select class="input" data-state="rest"><option>Замерщик не назначен</option></select>
  <select class="input" data-state="hover"><option>Замерщик не назначен</option></select>
  <select class="input" data-state="focus-visible"><option>Замерщик не назначен</option></select>
  <select class="input" data-state="disabled"><option>Замерщик не назначен</option></select>
  <select class="input" data-state="invalid"><option>Замерщик не назначен</option></select>
  <select class="input" data-state="expanded"><option>Замерщик не назначен</option></select>
</div>
</body>
</html>
