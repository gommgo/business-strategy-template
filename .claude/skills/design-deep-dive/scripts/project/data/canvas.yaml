# Параметры входа холста (scripts/project/canvas_input.py) — данные, которые читает только код.
# Формат файла слота на холсте: вектор, затем растр и видео, которые открывает любой браузер заказчика; AVIF и WebM —
# форматы публикации, на холст идут, когда другого формата у варианта нет. Порядок — от первого к последнему: у
# варианта слота берутся файлы первого формата из списка, какой у варианта есть; формат вне списка — после всех.
format_order: [svg, webp, png, jpg, jpeg, avif, gif, mp4, webm]
