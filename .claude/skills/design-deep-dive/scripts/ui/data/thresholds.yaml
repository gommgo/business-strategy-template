# Пороги проверок экрана и страницы, общие для нескольких утилит
#
# Число нормы живёт у её владельца в базе (адрес — у каждой величины). Здесь — машинная копия для утилит, которым
# нужна одна и та же величина: ui_audit.py, measure_ui.py, скрипт маркеров ui/11-styles-trends/04-anti-slop-ui.md §3
# (получает пороги параметром) и scripts/claude-design/mockup_checks.py. Так утилиты не держат свои числа, а правка
# нормы — правка владельца и этой строки. Шкалы и значения (отступы, кегли, цвета, длительности) сюда не входят: их
# дают токены ДС проекта, без ДС — эталонные токены ui (ui/14-recipes/examples/tokens.css).

# Кеглей на экране или странице при одной ширине — 6–8, из них три несущих; больше девяти — примета «шкала без ролей»
# (ui/02-typography/02-type-scale.md §4.5; примета font-size-count реестра common/tells.yaml).
font_sizes:
  norm: [6, 8]
  tell_above: 9

# Высота шапки как примета — порог своей поверхности: шапка выше порога — примета header-height.
header_height:
  # Страница сайта: липкая шапка (site/03-page-structure/03-first-screen-and-mobile.md §4.2). Телефон — окно уже
  # первого брейкпоинта ДС.
  page:
    phone: 64
    desktop: 80
  # Экран приложения: высота по пресету (ui/CONTRADICTIONS.md §[C3]; строка «Шапка» ui/14-recipes/11-presets.md).
  # Пресет ui_audit admin — A, consumer — B.
  app:
    A: 48
    B: 64
    C: 56
    D: 40
