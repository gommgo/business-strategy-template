# Данные приёмки правки (scripts/maint/accept.py): где ссылки md не сверяются и какие следы в строках кода идут
# «на разбор». Новое исключение или образец — строка данных, а не код.

# Маски md (синтаксис — как у ключа --mask, от корня репозитория), в которых ссылки и следы не сверяются.
links_skip:
  - '*/scripts/tests/fixtures/*'         # файлы демо-проектов: их пути живут в фикстуре, собранной во временную папку
  - '*/99-raw/*'                         # материал к разбору: местом нормы не бывает

# Следы в строках `.py`. Совпадение образца forward-only из `traces.tsv` в новой или изменённой строке — находка.
# Образцы «на разбор» приёмку не роняют: у них в коде есть законные места, решает принимающий правку.
# Свои образцы «на разбор»: label — имя образца в выводе, pattern — регулярное выражение Python (ищется в строке кода),
# example — строка, которую шаблон находит (по ней самопроверка утилиты сверяет шаблон).
trace_review:
  - label: модель другого вендора        # законна у генерации картинок и видео; умолчанием оценки не бывает
    pattern: '(?i)gemini|qwen|\bgpt-|claude-3|llama|mistral'
    example: gpt-4o
  - label: дата ISO                      # законна в имени снимка данных и в примере
    pattern: '\b20\d\d-\d\d-\d\d\b'
    example: '2030-01-31'

# Имена образцов forward-only из `traces.tsv`, которые в коде идут «на разбор», а не находкой.
trace_review_forward_only:
  - сравнение с прошлым                  # сообщение о состоянии данных («снимок до запуска остаётся последним») — не история
  - дата                                 # дата в данных самопроверки и в примере текста
