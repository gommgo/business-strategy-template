# brand.yaml — бренд продукта после чистки
#
# Где лежит: docs/projects/<slug>/design/brand.yaml — один на продукт. Его читают бриф сайта и бриф на вид кабинета
# (brand.ref), дизайн-система и вход холста. Поля — поля бренда брифа сайта (схема site-brief, объект brand) без
# выражения бренда: выражение своё у каждого мира и остаётся в брифе сайта (brand.expression); голос — ссылкой на
# профиль голоса продукта.
#
# Факты бренда — логотип, фирменные цвета и шрифты, брендбук — материалы заказчика (CLAUDE.md §3). Агент их чистит, но не
# придумывает: сводит цвета к ролям, считает контраст, убирает шум извлечения, проверяет кириллицу и лицензию шрифтов
# (cd 06/02 §3). Источники по надёжности: брендбук, SVG-логотип и шрифты заказчика; замер сайта бренда (measure_ui.py);
# извлечение внешним сервисом — только черновик. В клиентском режиме черновик фактов бренда пишет клиент.
# Нет бренда — status: none, остальные поля пустые; облик тогда задают направления или карточки стиля.

name: <имя бренда>
status: none                          # none — бренда нет; draft — собран, заказчик не подтвердил; verified — подтвердил
approval: {by: <роль>, date: <дата>}  # кто подтвердил факты бренда; обязательно при verified
guidelines_ref: <путь>                # брендбук: строка docs/business/material.md или файл в design/_assets/brand/

logo:
  files:                              # только SVG; файлы — design/_assets/brand/, строки — манифест design/_assets/
    primary: <файл>
    on_dark: <файл>                   # версия для тёмного фона
  never: []                           # «никогда»: перерисовывать, перекрашивать, растягивать, добавлять эффекты,
                                      # ставить на пёстрое фото без подложки — и правила брендбука

colors:
  roles:                              # фирменные цвета, сведённые к ролям (cd 06/02 §2); цвет без роли в систему не идёт
    <роль>: "<значение>"              # background · surface · text · muted · border · accent · accent_hover ·
                                      # on_accent · focus
  avoid: []                           # оттенки, которые запрещает бренд (брендбук или слово заказчика), с причиной

fonts:
  families:
    - role: <роль>                    # heading · body · accent
      family: <семейство>
      cyrillic: false                 # true — кириллица есть и проверена отрисовкой
      license: <лицензия>             # веб-лицензия; файлы — design/_assets/fonts/ вместе с лицензией
      replaces: {family: <фирменный шрифт>, why: <причина>}   # только при замене: у фирменного шрифта нет
                                                              # веб-лицензии или кириллицы

voice_ref: ../voice.yaml              # голос бренда — профиль голоса продукта (docs/projects/<slug>/voice.yaml)

sources: []                           # откуда факты: строки docs/business/material.md, замер measure_ui.py (адрес и дата),
                                      # слово заказчика (сообщение и дата)
