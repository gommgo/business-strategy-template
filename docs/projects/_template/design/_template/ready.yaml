# ready.yaml — готовность поверхности к сборке для репозитория кода
#
# Где лежит: docs/projects/<slug>/design/<surface>/ready.yaml — по файлу на поверхность с маршрутом дизайна (web,
# admin, desktop, embed). Файл производный: его собирает ready build <slug> <surface> (scripts/project/ready.py скилла
# design-deep-dive) на этапе package из закрытых файлов стратегии, руками он не правится, коммитится вместе с
# источниками; свежесть сверяет ready check, его зовёт /design-audit. Когда окружения нет, этап собирает манифест по
# этой форме и сверяет статусы и отпечатки с файлами.
#
# Репозиторий кода берёт закрытые файлы стратегии снимком с локом отпечатков: состав снимка (sources этого манифеста,
# файлы принятых строк манифестов ассетов, каталоги базы, сам манифест) и правило отпечатков —
# docs/projects/_template/design/README.md, «Пакет для кода». Манифест отвечает на два вопроса: что из поверхности
# готово к сборке и что проверить после сборки. Код собирает только единицы с ready: true; пункты after_build и ворота
# скорости проверяет у себя утилитами этого скилла из соседнего чекаута стратегии.
#
# Единица готова, когда закрыта её композиция (план approved, экран stable), тексты approved, факты публикуемы или
# пробел назван, макет принят с совпавшим отпечатком одобрения (или пропущен решением заказчика). ДС не утверждена,
# покрытие ДС типов своего экрана не полное, FSD-карта кабинета не stable — строки open единицы «решение заказчика: …»:
# готовность они не держат, решает заказчик; FSD-карту код читает сам.

surface: <surface>                    # slug поверхности из surface.md
type: <type>                          # из surface.md: web · admin · desktop · embed
web_kind: <род>                       # из surface.md: landing · site · app — у web; у admin, desktop, embed — "—"
consumer: <репозиторий кода>          # <org>/site — landing, site; <org>/frontend — app, admin, desktop, embed
status: not-ready                     # ready — готовы все единицы · partial — часть · not-ready — ни одной

sources:                              # что читает код: путь от папки проекта, статус по схеме или форме, отпечаток
  - {path: <путь>, status: <статус>, sha256: <отпечаток>}
  # сайт — бриф, карта (род site), планы, copy deck, факты, голос, токены, проза и карта решений ДС (статус ДС —
  # system.yaml), бренд, арт-дирекция, спецификации движения, лабораторные страницы принятых приёмов (motion/lab/<id>/ —
  # путь папки с «/», статус прототипа, отпечаток папки), ассеты с манифестами, исходники холста с артбордами
  # (статичные копии — если есть), REVIEW.md; кабинет — экраны и map.md, texts.md, FSD-карта, ДС с покрытием, бриф на
  # вид, паспорт визуала, ассеты, исходники холста с артбордами, REVIEW.md

units:                                # страницы (сайт) или экраны (кабинет)
  - id: <page-id или screen-slug>
    ready: false                      # true — единица готова по правилу выше
    composition: <статус>             # сайт — статус плана; кабинет — статус экрана
    texts: <статус>                   # copy deck страницы или строки texts.md экрана
    mockup: <вердикт>                 # вердикт review/REVIEW.md с одобрением, отпечаток которого (артборды и источники
                                      # единицы) совпал с текущим: accepted · accepted_with_notes · blocked · none;
                                      # skipped — макет пропущен решением заказчика, записанным в _phase-jump.md
                                      # поверхности
    budget_profile: <page_type>@L<n>  # сайт — профиль бюджета плана; кабинет — "—"
    gate_exceptions: []               # id ворот из x-gate-exception плана — осознанные превышения с причиной
    after_build: []                   # пункты ACCEPTANCE места «после сборки»: у сайта — SEO, счётчики, отправка
                                      # форм, события; у кабинета — динамика состояний
    open: []                          # открытые заглушки [PLACEHOLDER], демо-факты и демо-кадры x-demo плана ассетов
                                      # («демо-кадр: <слот>»); затем «решение заказчика: …» — ДС не утверждена,
                                      # покрытие ДС типов экрана, FSD-карта не stable

perf: plans                           # сайт — профили budgets.yaml из планов (budget_profile единиц);
                                      # кабинет — {field: p75, rum: true, lab: [AC-PRF-04, AC-PRF-05, AC-PRF-06]}:
                                      # лабораторных порогов для экранов в базе нет (ux 12/03 §9)

frontend_design:                      # бриф скиллу frontend-design в репозитории кода; облик — только токены и проза ДС
  surface: <род или тип>              # landing · site · app · admin · desktop · embed
  ambition: <уровень>                 # сайт — L0 · L1 · L2 из брифа; кабинет — "—": рабочие экраны вне уровней амбиций
  motion_cap: <потолок>               # сайт — ambition.motion_cap брифа; кабинет — "—"
  app_screens: "—"                    # кабинет — поправки ui/CONTRADICTIONS.md §[C25]: фон сплошной, градиент
                                      # только в названных местах, без оркестрованной загрузки, гарнитура
                                      # с проверенной кириллицей

blockers: []                          # что держит единицы не готовыми — строкой на причину: композиция, тексты,
                                      # факты, макет не принят или его одобрение снято; единиц нет — строка поверхности
