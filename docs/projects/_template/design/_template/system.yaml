# system.yaml — решения дизайн-системы, которые не токены
#
# Где лежит: docs/projects/<slug>/design/system.yaml — один на продукт. Дизайн-система (ДС) продукта — три файла
# репозитория: токены DTCG (design/system.tokens.json) держат значения, проза (design/DESIGN.md) объясняет систему
# словами, этот файл — карту решений: какой компонент ДС закрывает каждый тип словаря, расширения словаря проекта,
# стиль для каждой роли текста, конвенции продукта, эталонные экраны и статус всей ДС. Артефакт Design System
# собирается из трёх файлов в одну сторону.
#
# Кто пишет: этап design-system — конвенции, стили ролей текста, компоненты ожидаемых типов; этап ds-components
# кабинета — components и extensions по типам стабильных экранов; приёмка макета кабинета (acceptance) — starter.
# Облик предлагает агент «допущением», выбирает и утверждает владелец продукта (CLAUDE.md §3).
# Словарь типов, состояний элемента и ролей текста частей — kb/common/components.yaml (путь от папки скилла
# design-deep-dive): обязательные состояния типа сюда не копируются, они читаются из словаря.

system_version: 1
status: draft                         # вся ДС: draft · proposed · approved («Keep» заказчика до экранов)
approval: {by: <роль>, date: <дата>}  # кто и когда сказал «Keep»; обязательно при approved

components:                           # тип словаря → компонент ДС → используемые необязательные состояния
  <Тип>: {component: <компонент ДС>, optional_states: [], note: <когда какой вариант>}
  # Один компонент ДС законно закрывает несколько типов (баннер и инлайн-сообщение — варианты одного компонента);
  # два компонента на один тип — дефект. optional_states — из states.optional типа, которые продукт использует;
  # у коллекций и плиток ДС рисует варианты данных по screen_states типа; на type: mobile hover не требуется.
  # Ключи — каждый тип, названный в стабильных экранах (ui:<Тип>); у сайта — типы слотов действия и форм планов
  # (components.yaml, outside: Button, Link, Field, TextInput, Checkbox, Select).

extensions:                           # расширения словаря проекта: тип, которого в словаре нет
  - id: <ИмяТипа>                     # PascalCase; не совпадает с ключами types словаря и их aka
    name: <имя>
    purpose: <потребность>            # которую не закрывает ни один тип словаря
    why_not: <ближайший тип словаря и почему он не подходит>
    behavior: <нормы поведения — адрес базы или решение владельца продукта>
    states: {required: [], optional: []}   # только из element_states словаря; своего состояния проект не заводит
    parts: []                         # части составного компонента, если есть
    keyboard: <клавиатурный контракт>  # клавиши, порядок фокуса, роль ARIA; без него тип не принимается
    text_roles: {}                    # роль текста каждой текстовой части: {<ИмяТипа>.<Часть>: [<роль>]}
  # Узел ui: экрана может называть id расширения; расширение действует только в своём проекте. Тип, который понадобился
  # второму проекту, — кандидат в словарь шаблона.

text_styles:                          # роль текста → стиль текста ДС
  <роль>: type.<стиль>                # роли — закрытый список ux 07/06 §7.2 и body; стили — токены type.*
  # Стиль заголовка секции сайта задаёт подача секции (treatment.display_role) ролями marketing-tokens.json —
  # в эту таблицу он не входит.

conventions:                          # одно решение на продукт — для сайта, кабинета и писем
  range_sign: "–"                     # знак диапазона: «–» по умолчанию, «—» — вариант (text 08/02 §1.3)
  thousands_space: "U+00A0"           # пробел в разрядах (ux 07/03 §6.6); U+202F — только решением ДС с проверкой глифа
  empty_state: {align: center}        # выравнивание пустого состояния: center — по умолчанию, start — вариант
                                      # (ui 06/06 §4); что показать и почему пусто — решают экраны
  icons: {set: <набор>, style: line, sizes: [], stroke: <толщина>}   # набор иконок (ui 07/01); файлы —
                                      # design/_assets/icons/; style: line — контурный набор, толщина — stroke;
                                      # fill — набор с заливкой, stroke не задаётся
  status_colors: {<object>.<status>: <роль цвета>}      # статус объекта (object.md) → роль цвета токенов
  object_markers: {<object>: {icon: <иконка>, color: <роль цвета>}}   # маркеры объектов в интерфейсе

# Эталонные экраны кабинета — первые принятые экраны макета (одобрение — REVIEW.md поверхности); они идут в раздел
# «Примеры» контракта генерации экранов.
starter:
  - {surface: <surface>, screen: <screen-slug>}
