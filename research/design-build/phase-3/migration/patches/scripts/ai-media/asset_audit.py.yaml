dest: .claude/skills/design-deep-dive/scripts/ai-media/asset_audit.py
edits:
- code: root
  find:
  - ROOT = Path(__file__).resolve().parents[2]
  - TOOLS = ROOT / "99-raw" / "tools"
  - EXP = ROOT / "99-raw" / "experiments"
  - LOCKS = TOOLS / ".locks"
  replace:
  - 'sys.path.insert(0, str(Path(__file__).resolve().parent.parent / "lib"))  # перенос: scripts/lib'
  - 'import kbpaths  # noqa: E402'
  - ROOT = kbpaths.kb("ai-media")
  - TOOLS = kbpaths.scripts("ai-media")
  - EXP = ROOT / "99-raw" / "experiments"
  - 'LOCKS = Path(kbpaths.lock_path("heavy", "ai-media")).parent  # перенос: $DDD_HOME/locks/ai-media/{heavy,browser,blender}.lock'
- code: venv
  find:
  - VENV_K = TOOLS / "venv-K" / "bin" / "python"
  - VENV_G = TOOLS / "venv-G" / "bin" / "python"
  replace:
  - 'VENV_K = Path(kbpaths.python())  # перенос: venv-K (rapidocr) → Python окружения скилла'
  - 'VENV_G = Path(kbpaths.python())  # перенос: venv-G (cairosvg, svgelements)'
- code: model
  find: OCR_MODELS = TOOLS / "models" / "ocr"
  replace: OCR_MODELS = kbpaths.models("ocr")
- code: imp
  find:
  - A04 = EXP / "A" / "04-image-marker-metrics"
  - F02 = EXP / "F" / "02-text-zone"
  - F04 = EXP / "F" / "04-slop-metrics"
  - F05 = EXP / "F" / "05-color"
  - F06 = EXP / "F" / "06-series-metrics"
  - G_EXP = EXP / "G"
  replace: 'A04 = F02 = F04 = F05 = F06 = G_EXP = TOOLS  # перенос: модули опытов (Р54) — scripts/ai-media'
- code: data
  find: LUCIDE_REF = G_EXP / "01-llm-svg-icons" / "lucide-ref"
  replace: LUCIDE_REF = kbpaths.data("ai-media", "lucide-ref")
- code: bin
  find:
  - EXIFTOOL = TOOLS / "bin" / "exiftool" / "exiftool"
  - C2PATOOL = TOOLS / "bin" / "c2patool" / "c2patool"
  replace:
  - EXIFTOOL = Path(kbpaths.which("exiftool"))
  - C2PATOOL = Path(kbpaths.which("c2patool"))
- code: bin
  find: TOOLS / "bin" / "libjxl" / "tools" / "ssimulacra2"
  replace: kbpaths.bin_dir("libjxl", "tools", "ssimulacra2")
- code: bin
  find: TOOLS / "bin/
  replace: kbpaths.bin_dir() / "
  count: 3
- code: out
  find: Path(a.out or (ROOT / "99-raw/experiments/_audit" / dt.date.today().isoformat()))
  replace: Path(a.out or (kbpaths.out("ai-media", "audit") / dt.date.today().isoformat()))
- code: cache
  find: snaps = sorted((ROOT / "99-raw/cache/polza").glob("20*/api-v1-models.json"))
  replace: snaps = sorted(kbpaths.cache("ai-media", "polza").glob("20*/api-v1-models.json"))
