# Правила переноса содержимого базы в шаблон — фаза 3, агент A (26.09.2026).
# Источник правды раскладки — ../SKILL-MAP.md; решения — ../../DECISIONS.md (Р-номер = строка). Формат — SPEC.md §2.
# Два упорядоченных набора: rules (всё в *-research/ и калибровка) и journal (всё в _skill-build/); в каждом первое
# совпадение решает. Шаблоны match — glob от корня app-design: ** — любое число сегментов, * и ? — внутри сегмента,
# {a,b} — варианты. class — условие на класс inventory.py; when: symlink — только симлинки.
# action: take — копировать в dest; skip — не переносить; handoff — исполняемый код, место решает tools-map.tsv
# (агент B); alias — побайтный дубль взятого файла: не копируется, ссылки на него ведут к канону (alias_of);
# none — не содержимое скилла (файлы журнала вне калибровки).
# dest — от корня шаблона: {skill}, {journal}, {base} (имя базы без -research), {path} (путь внутри базы),
# {rest} (путь после буквального префикса match), {name}. По умолчанию: rules — {skill}/kb/{base}/{path};
# journal — {journal}/{rest}. why — Р-номер, раздел SKILL-MAP или SYNTHESIS; без решения — open + блок open
# (recommend — рекомендация агента A, она же текущее action; цена — scan-open.tsv и SPEC.md «На решение»).
version: 1
roots:
  source: /home/mm/Документы/app-design
  template: /home/mm/git/stit-core/business-strategy-template
  skill: .claude/skills/design-deep-dive
  journal: research/design-build
bases:
  ux-research: ux
  ui-research: ui
  site-research: site
  text-research: text
  creative-research: creative
  ai-media-research: ai-media
  blender-research: blender
  claude-design-research: claude-design
inventory:                       # классы — _skill-build/tools/inventory.py (classify), тот же код считает ссылки
  code: _skill-build/tools/inventory.py
  take_by_default: [prose, data, code, root-doc]        # SKILL-MAP §2.1
  skip_by_default: [asset, bundle, junk, service, forbidden, other]
  handoff_by_default: [tool]                            # 99-raw/tools — агент B
  service_dirs: [90-sources, 91-videos, 99-raw]
  junk:                          # копия множеств inventory.py для читателя; действует код inventory.py
    dirs: [__pycache__, node_modules, .venv, venv, venv-*, site-packages, .cache, .pytest_cache, .mypy_cache, dist, .git,
           .next, .astro]
    ext: [.pyc, .pyo, .log, .map, .tmp, .swp, .lock]
    names: [.DS_Store, package-lock.json, pnpm-lock.yaml, yarn.lock, Thumbs.db]
  forbidden: [claude-design-research/99-raw/cache/**]
  instruction_files: [CLAUDE.md, CLAUDE.local.md, AGENTS.md, SKILL.md, GEMINI.md, .mcp.json, .claude/, .git/]
purposes:
  kb: тематика и корневые документы базы 1:1 — kb/<база>/<тот же путь>
  raw-norm: отобранное некодовое из 99-raw с нормами «к разбору» — kb/<база>/99-raw/<старый путь>
  build-input: входы сверки баз (handoff) — kb/<база>/99-raw/<старый путь>
  ref-code: эталонный код из 99-raw (исходники рецептов, сцены) — kb/<база>/99-raw/<старый путь>
  asset-min: минимальные ассеты эталонов (Р41, Р57 вариант А) — на своих местах в kb
  code-data: файлы, которые читает только код — scripts/<база>/data/
  calibration: калибровочный набор — assets/calibration/
  journal: журнал сборки — research/design-build/

rules:
  # ---------------------------------------------------------------- страховка: то, что не едет никогда
  - id: g-forbidden
    match: "claude-design-research/99-raw/cache/**"
    action: skip
    why: SYNTHESIS §3.4; Р97
    note: закрытые тексты Anthropic, снимки промта Claude Design, клон Open Design
  - id: g-symlink
    match: "**"
    when: symlink
    action: skip
    why: SKILL-MAP §5
    note: симлинки не переносятся (их цели — вне базы или дубли); inventory.py их тоже пропускает
  - id: g-instructions
    match: ["**/{CLAUDE.md,CLAUDE.local.md,AGENTS.md,SKILL.md,GEMINI.md,.mcp.json}", "**/.claude/**", "**/.git/**"]
    action: skip
    why: Р97; SKILL-MAP §5
    note: файлы, которые Claude Code грузит как инструкции; вне 99-raw/cache такие есть в 99-raw/experiments site и text

  # ---------------------------------------------------------------- исключения из «без ассетов» (до страховки от мусора)
  - id: cr-asset-fonts
    match: "creative-research/10-recipes/examples/_shared/fonts/**"
    action: take
    purpose: asset-min
    why: Р41
    note: 10 woff2 (OFL) + 5 LICENSE
  - id: cr-asset-img
    match: "creative-research/10-recipes/examples/l2-zveno/img/*.webp"
    action: take
    purpose: asset-min
    why: Р41
    note: 7 своих рендеров L2; img/render.log — мусор (g-junk)
  - id: cr-asset-bundle
    match: "creative-research/10-recipes/examples/l2-zveno/js/three-scene.js"
    action: take
    purpose: asset-min
    why: Р41
    note: бандл сцены L2 (класс bundle); исходник — cr-scene-src
  - id: bl-asset-hero
    match: ["blender-research/12-recipes/examples/01-hero-product/{case.glb,poster.avif,poster.webp}",
            "blender-research/12-recipes/examples/01-hero-product/dist/**"]
    action: take
    purpose: asset-min
    why: Р57 (вариант А); SKILL-MAP §2.5
    note: «постер → 3D после LCP» живым; dist/ — класс junk, берётся исключением

  # ---------------------------------------------------------------- мусор
  - id: g-junk
    match: "**"
    class: [junk]
    action: skip
    why: SYNTHESIS §3.4 (мусор)
  - id: bl-junk-chunk
    match: "blender-research/15-showcase/zveno/c-hybrid/js/chunks/chunk-2RVMEKYY.js"
    action: skip
    why: SYNTHESIS §3.4 (мусор)
